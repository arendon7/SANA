services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agroway_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: agroway_ci
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agroway_ci"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
