name: SANA Demo Data Room Review Workspace V115

on:
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-entry.js'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-dataroom-review-workspace*.mjs'
      - '.github/workflows/sana-demo-dataroom-review-workspace-v115.yml'

permissions:
  contents: read

jobs:
  review-workspace-v115-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve V87–V115 workspace contracts
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          for v in $(seq 88 115); do node scripts/validate-sana-dataroom-review-workspace-v${v}.mjs; done
      - name: Assert V115 shell, technical return semantics and read-only boundary
        run: |
          grep -F "const CACHE='sana-v3-demo-shell-v115';" apps/control-web/public/sana-v3-sw.js
          grep -F 'SOURCE_INTEGRITY_RETURN ≠ REVIEW_STATE_CHANGE' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'RETURN_TARGET ≠ SOURCE_VERIFICATION' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'INTEGRITY_RETURN ≠ REMEDIATION' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'data-review-source-integrity-return' apps/control-web/public/sana-v3-dataroom-entry.js
          ! grep -Eq 'rwIntegrityReturn|rwSourceReturn|localStorage\.(setItem|removeItem|clear)|sessionStorage' apps/control-web/public/sana-v3-dataroom-entry.js
