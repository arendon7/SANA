name: TEMP SANA Capture Sync V150 Assembly

on:
  push:
    branches: [demo/sana-capture-sync-v150]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-capture-sync-v150
      - name: Assemble v150 shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v150';" not in s:
              old="const CACHE='sana-v3-demo-shell-v149';"
              new="if(false){\nconst CACHE='sana-v3-demo-shell-v149';\n}\nconst CACHE='sana-v3-demo-shell-v150';"
              assert s.count(old)==1, 'expected exactly one active v149 marker'
              s=s.replace(old,new,1)
          asset="'/sana-v3-capture-sync-references.js',"
          if asset not in s:
              anchor="'/sana-v3-capture-sync-ledger.js',"
              assert s.count(anchor)==1, 'capture sync ledger asset anchor missing/duplicated'
              s=s.replace(anchor,anchor+asset,1)
          comment='// v150 validates Capture Sync record/ACK/conflict-candidate reference coherence against Data Trust without server/source verification, automatic resolution or canonical authority.'
          if comment not in s:
              anchor='const SHELL=['
              assert s.count(anchor)==1, 'SHELL anchor missing/duplicated'
              s=s.replace(anchor,comment+'\n'+anchor,1)
          p.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v150';$" apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v149';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -o "/sana-v3-capture-sync-references.js" apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1
          grep -Fq '// v150 validates Capture Sync record/ACK/conflict-candidate reference coherence' apps/control-web/public/sana-v3-sw.js
      - name: Commit assembly if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble capture sync shell v150'
          git push origin HEAD:demo/sana-capture-sync-v150
