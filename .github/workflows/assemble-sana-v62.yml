name: Assemble SANA v62 Capital Governance History

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-capital-governance.js'
      - 'apps/control-web/public/sana-v3-dataroom-capital-governance-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-capital-governance-gaps.js'
      - 'scripts/validate-sana-capital-governance-history.mjs'
      - '.github/workflows/sana-demo-capital-governance-history.yml'
      - '.github/workflows/assemble-sana-v62.yml'

permissions:
  contents: write

jobs:
  assemble-v62:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-functional-auth-v1
          fetch-depth: 0
      - name: Assemble HTML and service worker deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          hp=Path('apps/control-web/public/sana-v3.html'); sp=Path('apps/control-web/public/sana-v3-sw.js')
          html=hp.read_text(); sw=sp.read_text()
          repl=[
            ('<script src="/sana-v3-report-snapshot-commercial.js"></script><script src="/sana-v3-cycle-closure.js"></script>',
             '<script src="/sana-v3-report-snapshot-commercial.js"></script><script src="/sana-v3-report-snapshot-capital-governance.js"></script><script src="/sana-v3-cycle-closure.js"></script>'),
            ('<script src="/sana-v3-due-diligence-commercial-gaps.js"></script><script src="/sana-v3-due-diligence-remediation.js"></script>',
             '<script src="/sana-v3-due-diligence-commercial-gaps.js"></script><script src="/sana-v3-due-diligence-capital-governance-gaps.js"></script><script src="/sana-v3-due-diligence-remediation.js"></script>'),
            ('<script src="/sana-v3-dataroom-commercial-history.js"></script><script src="/sana-v3-dataroom-entry.js"></script>',
             '<script src="/sana-v3-dataroom-commercial-history.js"></script><script src="/sana-v3-dataroom-capital-governance-history.js"></script><script src="/sana-v3-dataroom-entry.js"></script>')]
          for old,new in repl:
              if html.count(old)!=1: raise SystemExit(f'HTML anchor count {html.count(old)}: {old}')
              html=html.replace(old,new,1)
          old="const CACHE='sana-v3-demo-shell-v61';"
          new="if(false){\nconst CACHE='sana-v3-demo-shell-v61';\n}\nconst CACHE='sana-v3-demo-shell-v62';"
          if sw.count(old)!=1: raise SystemExit(f'SW v61 anchor count {sw.count(old)}')
          sw=sw.replace(old,new,1)
          srep=[
            ("'/sana-v3-report-snapshot-commercial.js','/sana-v3-cycle-closure.js'","'/sana-v3-report-snapshot-commercial.js','/sana-v3-report-snapshot-capital-governance.js','/sana-v3-cycle-closure.js'"),
            ("'/sana-v3-due-diligence-commercial-gaps.js','/sana-v3-due-diligence-remediation.js'","'/sana-v3-due-diligence-commercial-gaps.js','/sana-v3-due-diligence-capital-governance-gaps.js','/sana-v3-due-diligence-remediation.js'"),
            ("'/sana-v3-dataroom-commercial-history.js','/sana-v3-dataroom-entry.js'","'/sana-v3-dataroom-commercial-history.js','/sana-v3-dataroom-capital-governance-history.js','/sana-v3-dataroom-entry.js'")]
          for old,new in srep:
              if sw.count(old)!=1: raise SystemExit(f'SW anchor count {sw.count(old)}: {old}')
              sw=sw.replace(old,new,1)
          hp.write_text(html); sp.write_text(sw)
          PY
          grep -q '/sana-v3-report-snapshot-commercial.js.*sana-v3-report-snapshot-capital-governance.js.*sana-v3-cycle-closure.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-due-diligence-commercial-gaps.js.*sana-v3-due-diligence-capital-governance-gaps.js.*sana-v3-due-diligence-remediation.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-dataroom-commercial-history.js.*sana-v3-dataroom-capital-governance-history.js.*sana-v3-dataroom-entry.js' apps/control-web/public/sana-v3.html
          grep -q "^const CACHE='sana-v3-demo-shell-v62';" apps/control-web/public/sana-v3-sw.js
      - name: Commit assembled v62
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3.html apps/control-web/public/sana-v3-sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'build(demo): assemble capital governance history shell v62'
          git push origin HEAD:demo/sana-functional-auth-v1
