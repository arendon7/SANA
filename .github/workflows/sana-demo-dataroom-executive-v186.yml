name: SANA Demo Data Room Executive V186

on:
  push:
    branches: [demo/sana-dataroom-executive-v186]
  pull_request:

permissions:
  contents: read

jobs:
  validate-v186:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax executive worklist
        run: node --check apps/control-web/public/sana-v3-dataroom-executive-v186.js
      - name: V170 regression
        run: node scripts/validate-sana-dataroom-executive-v170.mjs
      - name: V171 regression
        run: node scripts/validate-sana-dataroom-executive-v171.mjs
      - name: V172 regression
        run: node scripts/validate-sana-dataroom-executive-v172.mjs
      - name: V173 regression
        run: node scripts/validate-sana-dataroom-executive-v173.mjs
      - name: V174 regression
        run: node scripts/validate-sana-dataroom-executive-v174.mjs
      - name: V175 regression
        run: node scripts/validate-sana-dataroom-executive-v175.mjs
      - name: V176 regression
        run: node scripts/validate-sana-dataroom-executive-v176.mjs
      - name: V177 regression
        run: node scripts/validate-sana-dataroom-executive-v177.mjs
      - name: V178 regression
        run: node scripts/validate-sana-dataroom-executive-v178.mjs
      - name: V179 regression
        run: node scripts/validate-sana-dataroom-executive-v179.mjs
      - name: V180 regression
        run: node scripts/validate-sana-dataroom-executive-v180.mjs
      - name: V181 regression
        run: node scripts/validate-sana-dataroom-executive-v181.mjs
      - name: V182 regression
        run: node scripts/validate-sana-dataroom-executive-v182.mjs
      - name: V183 regression
        run: node scripts/validate-sana-dataroom-executive-v183.mjs
      - name: V184 regression
        run: node scripts/validate-sana-dataroom-executive-v184.mjs
      - name: V185 regression
        run: node scripts/validate-sana-dataroom-executive-v185.mjs
      - name: V186 worklist adversarial validation
        run: node scripts/validate-sana-dataroom-executive-v186.mjs
      - name: V186 read-only surface
        shell: bash
        run: |
          set -euo pipefail
          file=apps/control-web/public/sana-v3-dataroom-executive-v186.html
          test -f "$file"
          grep -Fq 'Claim Exception Review Worklist' "$file"
          grep -Fq 'WORKLIST ENTRY ≠ PRIORITY ≠ SEVERITY ≠ URGENCY' "$file"
          grep -Fq 'DISPLAY ORDER ≠ REVIEW PRIORITY' "$file"
          grep -Fq 'CONTROLLED CONTEXT ≠ RECOMMENDED ACTION' "$file"
          grep -Fq 'NO SLA' "$file"
          grep -Fq 'NO ASSIGNMENT' "$file"
          grep -Fq 'NO SCORE' "$file"
          ! grep -Fqi '<form' "$file"
          ! grep -Fq 'fetch(' "$file"
          ! grep -Fq 'XMLHttpRequest' "$file"
          ! grep -Fq 'localStorage.setItem' "$file"
          ! grep -Fq 'sessionStorage.setItem' "$file"
      - name: Preserve V186 worklist and authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          js=apps/control-web/public/sana-v3-dataroom-executive-v186.js
          grep -Fq 'SANA_DATAROOM_EXECUTIVE_CLAIM_EXCEPTION_REVIEW_WORKLIST_V1' "$js"
          grep -Fq "PARENT_SHA='dc9550b9885baf575597f5536722ff830f32b0f4'" "$js"
          grep -Fq 'oneEntryPerClaimFlag:true' "$js"
          grep -Fq 'displayOrderingOnly:true' "$js"
          grep -Fq 'priorityInference:false' "$js"
          grep -Fq 'severityInference:false' "$js"
          grep -Fq 'urgencyInference:false' "$js"
          grep -Fq 'assignmentInference:false' "$js"
          grep -Fq 'schedulingInference:false' "$js"
          grep -Fq 'recommendationInference:false' "$js"
          grep -Fq 'scoring:false' "$js"
          grep -Fq 'worklistPriorityAuthority:false' "$js"
          grep -Fq 'assignmentAuthority:false' "$js"
          grep -Fq 'schedulingAuthority:false' "$js"
          grep -Fq 'deadlineAuthority:false' "$js"
          grep -Fq 'remediationAuthority:false' "$js"
          grep -Fq 'recommendationAuthority:false' "$js"
          grep -Fq 'dueDiligenceApprovalAuthority:false' "$js"
          grep -Fq 'eligibilityAuthority:false' "$js"
          grep -Fq 'financingApprovalAuthority:false' "$js"
          grep -Fq 'decisionAuthority:false' "$js"
          ! grep -Eiq 'priority[[:space:]]*:|severity[[:space:]]*:|urgency[[:space:]]*:|sla[[:space:]]*:|dueAt[[:space:]]*:|assignee[[:space:]]*:|recommendedAction[[:space:]]*:|riskScore[[:space:]]*:|creditScore[[:space:]]*:|investmentScore[[:space:]]*:|projectScore[[:space:]]*:|overallScore[[:space:]]*:|canonicalMutationAvailable[[:space:]]*:[[:space:]]*true|financialMutationAvailable[[:space:]]*:[[:space:]]*true|worklistPriorityAuthority[[:space:]]*:[[:space:]]*true|assignmentAuthority[[:space:]]*:[[:space:]]*true|schedulingAuthority[[:space:]]*:[[:space:]]*true|deadlineAuthority[[:space:]]*:[[:space:]]*true|remediationAuthority[[:space:]]*:[[:space:]]*true|recommendationAuthority[[:space:]]*:[[:space:]]*true|dueDiligenceApprovalAuthority[[:space:]]*:[[:space:]]*true|eligibilityAuthority[[:space:]]*:[[:space:]]*true|financingApprovalAuthority[[:space:]]*:[[:space:]]*true|decisionAuthority[[:space:]]*:[[:space:]]*true' "$js"