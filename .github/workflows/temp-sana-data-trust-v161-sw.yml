name: TEMP SANA Data Trust V161 SW

on:
  push:
    branches: [demo/sana-data-trust-v161]

permissions:
  contents: write

jobs:
  assemble-sw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-data-trust-v161
      - name: Patch v161 shell only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v161';" not in s:
              old="const CACHE='sana-v3-demo-shell-v160';"
              assert s.count(old)==1, 'expected one active v160 marker'
              s=s.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v160';\n}\nconst CACHE='sana-v3-demo-shell-v161';",1)
          anchor="'/sana-v3-data-trust-references.js',"
          assets="'/sana-v3-data-trust-references.js','/sana-v3-report-snapshot-data-trust-references.js','/sana-v3-cycle-data-trust-references.js','/sana-v3-due-diligence-data-trust-reference-gaps.js','/sana-v3-dataroom-data-trust-references.js',"
          if '/sana-v3-report-snapshot-data-trust-references.js' not in s:
              assert s.count(anchor)==1, 'data trust references anchor missing or duplicated'
              s=s.replace(anchor,assets,1)
          comment='// v161 propagates content-minimized Data Trust reference provenance through Snapshot, Cycle, Due Diligence and Data Room without live fallback, weighting, source/measurement verification, credit, eligibility or investment authority.'
          if comment not in s:
              a='// v160 validates Data Trust ACK/conflict-candidate coherence against Capture/Sync without server/source/hardware/measurement, credit, eligibility or investment authority.'
              assert s.count(a)==1, 'v160 comment anchor missing or duplicated'
              s=s.replace(a,a+'\n'+comment,1)
          p.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v161';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v160';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          for a in /sana-v3-report-snapshot-data-trust-references.js /sana-v3-cycle-data-trust-references.js /sana-v3-due-diligence-data-trust-reference-gaps.js /sana-v3-dataroom-data-trust-references.js; do test "$(grep -o "$a" apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1; done
      - name: Commit SW if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble data trust reference shell v161'
          git push origin HEAD:demo/sana-data-trust-v161
