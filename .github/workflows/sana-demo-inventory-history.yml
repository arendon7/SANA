name: SANA Demo Inventory History

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-inventory.js'
      - 'apps/control-web/public/sana-v3-dataroom-inventory-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-inventory-gaps.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-inventory-snapshot.mjs'
      - 'scripts/validate-sana-inventory-gaps.mjs'
      - '.github/workflows/sana-demo-inventory-history.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-inventory.js'
      - 'apps/control-web/public/sana-v3-dataroom-inventory-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-inventory-gaps.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-inventory-snapshot.mjs'
      - 'scripts/validate-sana-inventory-gaps.mjs'
      - '.github/workflows/sana-demo-inventory-history.yml'

permissions:
  contents: read

jobs:
  inventory-history-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and semantic contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-report-snapshot-inventory.js
          node --check apps/control-web/public/sana-v3-dataroom-inventory-history.js
          node --check apps/control-web/public/sana-v3-due-diligence-inventory-gaps.js
          node scripts/validate-sana-inventory-snapshot.mjs
          node scripts/validate-sana-inventory-gaps.mjs
      - name: Validate snapshot-only history boundary
        shell: bash
        run: |
          set -euo pipefail
          snap='apps/control-web/public/sana-v3-report-snapshot-inventory.js'; hist='apps/control-web/public/sana-v3-dataroom-inventory-history.js'
          grep -q '__SANA_REPORT_SNAPSHOT_INVENTORY__' "$snap"
          grep -q 'NO_REQUEST_TO_ORDER_OR_RECEIPT_INFERENCE' "$snap"
          grep -q 'NO_RECEIPT_TO_INVOICE_OR_PAYMENT_INFERENCE' "$snap"
          grep -q '__SANA_DATAROOM_INVENTORY_HISTORY__' "$hist"
          grep -q 'NO_LIVE_FALLBACK' "$hist"
          grep -q 'CHANGE ≠ IMPROVEMENT' "$hist"
          ! grep -q '__SANA_INVENTORY_LEDGER__' "$hist"
          ! grep -q 'storage\.' "$hist"
      - name: Validate documentary gaps only
        shell: bash
        run: |
          set -euo pipefail
          gaps='apps/control-web/public/sana-v3-due-diligence-inventory-gaps.js'
          grep -q '__SANA_DD_INVENTORY_GAPS__' "$gaps"
          grep -q 'LOW_STOCK_OR_PENDING_REQUEST ≠ GAP' "$gaps"
          grep -q 'negative-roll-forward' "$gaps"
          grep -q 'over-reserved' "$gaps"
          ! grep -q '__SANA_INVENTORY_LEDGER__' "$gaps"
          ! grep -q 'storage\.' "$gaps"
      - name: Validate assembly and active v48 shell
        shell: bash
        run: |
          set -euo pipefail
          html='apps/control-web/public/sana-v3.html'; sw='apps/control-web/public/sana-v3-sw.js'
          grep -q '/sana-v3-report-snapshot-harvest.js.*sana-v3-report-snapshot-inventory.js.*sana-v3-cycle-closure.js' "$html"
          grep -q '/sana-v3-due-diligence-harvest-gaps.js.*sana-v3-due-diligence-inventory-gaps.js.*sana-v3-due-diligence-remediation.js.*sana-v3-dd-next-cut.js' "$html"
          grep -q '/sana-v3-dataroom-harvest-history.js.*sana-v3-dataroom-inventory-history.js.*sana-v3-dataroom-entry.js' "$html"
          grep -q "'/sana-v3-report-snapshot-inventory.js'" "$sw"
          grep -q "'/sana-v3-due-diligence-inventory-gaps.js'" "$sw"
          grep -q "'/sana-v3-dataroom-inventory-history.js'" "$sw"
          grep -q "^const CACHE='sana-v3-demo-shell-v48';" "$sw"
      - name: Assert no procurement, payment, credit or investment authority
        shell: bash
        run: |
          set -euo pipefail
          files='apps/control-web/public/sana-v3-report-snapshot-inventory.js apps/control-web/public/sana-v3-dataroom-inventory-history.js apps/control-web/public/sana-v3-due-diligence-inventory-gaps.js'
          ! grep -Eiq 'purchaseOrderCreated[[:space:]]*=[[:space:]]*true|paymentExecuted[[:space:]]*=[[:space:]]*true|invoiceIssued[[:space:]]*=[[:space:]]*true|creditApproved|investmentApproved|eligibilityApproved|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|canonicalMutated[[:space:]]*=[[:space:]]*true' $files
          ! grep -Eiq 'fetch\(' $files
