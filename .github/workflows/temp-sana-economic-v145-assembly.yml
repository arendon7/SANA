name: TEMP SANA Economic V145 Assembly

on:
  push:
    branches: [demo/sana-economic-v145]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-economic-v145
      - name: Assemble v145 shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v145';" not in s:
              old="const CACHE='sana-v3-demo-shell-v144';"
              new="if(false){\nconst CACHE='sana-v3-demo-shell-v144';\n}\nconst CACHE='sana-v3-demo-shell-v145';"
              assert s.count(old)==1, 'expected exactly one active v144 marker'
              s=s.replace(old,new,1)
          anchor="'/sana-v3-economics-ledger.js',"
          assets="'/sana-v3-economics-ledger.js','/sana-v3-economic-references.js',"
          if '/sana-v3-economic-references.js' not in s:
              assert s.count(anchor)==1, 'economic ledger asset anchor missing/duplicated'
              s=s.replace(anchor,assets,1)
          comment='// v145 validates internal Economic Reconciliation references without accounting, invoice, payment, sale, cash, credit or investment authority.'
          if comment not in s:
              anchor_comment='// v144 propagates Source Evidence reference integrity through content-minimized Snapshot, Data Room, Cycle and Due Diligence without live fallback, weighting, procurement or financial inference.'
              assert s.count(anchor_comment)==1, 'v144 comment anchor missing/duplicated'
              s=s.replace(anchor_comment,anchor_comment+'\n'+comment,1)
          p.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v145';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v144';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          test "$(grep -o '/sana-v3-economic-references.js' apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1
      - name: Commit assembly if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble economic shell v145'
          git push origin HEAD:demo/sana-economic-v145
