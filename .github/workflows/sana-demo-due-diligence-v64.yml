name: SANA Demo Due Diligence V64

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-capital-review.js'
      - 'apps/control-web/public/sana-v3-dataroom-capital-review-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-capital-review-gaps.js'
      - 'scripts/validate-sana-capital-review-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - '.github/workflows/sana-demo-due-diligence-v64.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-capital-review.js'
      - 'apps/control-web/public/sana-v3-dataroom-capital-review-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-capital-review-gaps.js'
      - 'scripts/validate-sana-capital-review-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'

jobs:
  composed-dd-v64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate human review historical semantics
        run: node scripts/validate-sana-capital-review-history.mjs
      - name: Validate DD order before remediation when assembled
        run: |
          html='apps/control-web/public/sana-v3.html'
          if grep -q '/sana-v3-due-diligence-capital-review-gaps.js' "$html"; then
            grep -q '/sana-v3-due-diligence-capital-governance-gaps.js.*sana-v3-due-diligence-capital-review-gaps.js.*sana-v3-due-diligence-remediation.js' "$html"
          else
            echo 'v64 staged before assembly; strict order will run on HTML/SW assembly commit.'
          fi
      - name: Validate snapshot and Data Room order when assembled
        run: |
          html='apps/control-web/public/sana-v3.html'
          if grep -q '/sana-v3-report-snapshot-capital-review.js' "$html"; then
            grep -q '/sana-v3-report-snapshot-capital-governance.js.*sana-v3-report-snapshot-capital-review.js.*sana-v3-cycle-closure.js' "$html"
            grep -q '/sana-v3-dataroom-capital-governance-history.js.*sana-v3-dataroom-capital-review-history.js.*sana-v3-dataroom-entry.js' "$html"
            grep -q "^const CACHE='sana-v3-demo-shell-v64';" apps/control-web/public/sana-v3-sw.js
          else
            echo 'v64 staged before assembly; strict shell validation deferred to assembly commit.'
          fi
      - name: Validate non-decisional boundaries
        run: |
          grep -q 'REVIEWER_REF_ONLY' apps/control-web/public/sana-v3-report-snapshot-capital-review.js
          grep -q 'REVIEW_CHANGE ≠ IMPROVEMENT ≠ APPROVAL' apps/control-web/public/sana-v3-dataroom-capital-review-history.js
          grep -q 'NO_REVIEW ≠ GAP' apps/control-web/public/sana-v3-due-diligence-capital-review-gaps.js
          grep -q 'HUMAN_DECISION_REFERENCE ≠ GAP' apps/control-web/public/sana-v3-due-diligence-capital-review-gaps.js
          ! grep -Eq 'productionExecutionAvailable\s*=\s*true|productionActivationAllowed\s*=\s*true|canonicalMutated\s*=\s*true' apps/control-web/public/sana-v3-report-snapshot-capital-review.js apps/control-web/public/sana-v3-dataroom-capital-review-history.js apps/control-web/public/sana-v3-due-diligence-capital-review-gaps.js
