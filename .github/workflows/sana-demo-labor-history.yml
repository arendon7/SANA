name: SANA Demo Labor History

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-labor.js'
      - 'apps/control-web/public/sana-v3-dataroom-labor-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-labor-gaps.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-labor-snapshot.mjs'
      - 'scripts/validate-sana-labor-gaps.mjs'
      - '.github/workflows/sana-demo-labor-history.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-labor.js'
      - 'apps/control-web/public/sana-v3-dataroom-labor-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-labor-gaps.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-labor-snapshot.mjs'
      - 'scripts/validate-sana-labor-gaps.mjs'
      - '.github/workflows/sana-demo-labor-history.yml'

permissions:
  contents: read

jobs:
  labor-history-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and semantic contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-report-snapshot-labor.js
          node --check apps/control-web/public/sana-v3-dataroom-labor-history.js
          node --check apps/control-web/public/sana-v3-due-diligence-labor-gaps.js
          node scripts/validate-sana-labor-snapshot.mjs
          node scripts/validate-sana-labor-gaps.mjs
      - name: Validate privacy-minimized snapshot and history
        shell: bash
        run: |
          set -euo pipefail
          snap='apps/control-web/public/sana-v3-report-snapshot-labor.js'; hist='apps/control-web/public/sana-v3-dataroom-labor-history.js'
          grep -q '__SANA_REPORT_SNAPSHOT_LABOR__' "$snap"
          grep -q 'SNAPSHOT_LABOR_PRIVACY_MINIMIZED' "$snap"
          grep -q 'NO_IDENTITY_FIELDS' "$snap"
          grep -q 'NO_HR_SCORING' "$snap"
          grep -q '__SANA_DATAROOM_LABOR_HISTORY__' "$hist"
          grep -q 'NO_LIVE_FALLBACK' "$hist"
          grep -q 'CHANGE ≠ IMPROVEMENT' "$hist"
          grep -q 'PERFORMANCE_RATING' "$hist"
          ! grep -q '__SANA_LABOR_LEDGER__' "$hist"
          ! grep -q 'storage\.' "$hist"
      - name: Validate documentary and privacy gaps only
        shell: bash
        run: |
          set -euo pipefail
          gaps='apps/control-web/public/sana-v3-due-diligence-labor-gaps.js'
          grep -q '__SANA_DD_LABOR_GAPS__' "$gaps"
          grep -q 'labor:privacy-leak' "$gaps"
          grep -q 'NO_ATTENDANCE_OR_PAYMENT ≠ GAP' "$gaps"
          grep -q 'NO_HR_SCORING_OR_CREDIT_INFERENCE' "$gaps"
          ! grep -q '__SANA_LABOR_LEDGER__' "$gaps"
          ! grep -q 'storage\.' "$gaps"
      - name: Validate assembly and active v50 shell
        shell: bash
        run: |
          set -euo pipefail
          html='apps/control-web/public/sana-v3.html'; sw='apps/control-web/public/sana-v3-sw.js'
          grep -q '/sana-v3-report-snapshot-inventory.js.*sana-v3-report-snapshot-labor.js.*sana-v3-cycle-closure.js' "$html"
          grep -q '/sana-v3-due-diligence-inventory-gaps.js.*sana-v3-due-diligence-labor-gaps.js.*sana-v3-due-diligence-remediation.js.*sana-v3-dd-next-cut.js' "$html"
          grep -q '/sana-v3-dataroom-inventory-history.js.*sana-v3-dataroom-labor-history.js.*sana-v3-dataroom-entry.js' "$html"
          grep -q "'/sana-v3-report-snapshot-labor.js'" "$sw"
          grep -q "'/sana-v3-due-diligence-labor-gaps.js'" "$sw"
          grep -q "'/sana-v3-dataroom-labor-history.js'" "$sw"
          grep -q "^const CACHE='sana-v3-demo-shell-v50';" "$sw"
      - name: Assert no HR scoring, payroll, production or investment authority
        shell: bash
        run: |
          set -euo pipefail
          files='apps/control-web/public/sana-v3-report-snapshot-labor.js apps/control-web/public/sana-v3-dataroom-labor-history.js apps/control-web/public/sana-v3-due-diligence-labor-gaps.js'
          ! grep -Eiq 'productionExecutionAvailable[[:space:]]*=[[:space:]]*true|canonicalMutated[[:space:]]*=[[:space:]]*true|paymentExecuted[[:space:]]*=[[:space:]]*true|creditApproved|investmentApproved|eligibilityApproved' $files
          ! grep -Eiq 'fetch\(' $files
