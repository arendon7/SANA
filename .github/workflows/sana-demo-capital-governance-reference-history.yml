name: SANA Demo Capital Governance Reference History

on:
  push:
    branches: [demo/sana-capital-v151]
  pull_request:

permissions:
  contents: read

jobs:
  capital-governance-reference-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Capital Governance Reference History V151 core
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            apps/control-web/public/sana-v3-report-snapshot-capital-governance-references.js \
            apps/control-web/public/sana-v3-dataroom-capital-governance-references.js \
            apps/control-web/public/sana-v3-cycle-capital-governance-references.js \
            apps/control-web/public/sana-v3-due-diligence-capital-governance-reference-gaps.js; do node --check "$f"; done
          node scripts/validate-sana-capital-governance-reference-provenance.mjs
          grep -Fq 'ADDITIVE_V151 · CAPITAL_GOVERNANCE_REFERENCE_PROVENANCE' apps/control-web/public/sana-v3-report-snapshot-capital-governance-references.js
          grep -Fq 'CONTENT_MINIMIZED' apps/control-web/public/sana-v3-report-snapshot-capital-governance-references.js
          grep -Fq 'NO_NONCANONICAL_VALUES' apps/control-web/public/sana-v3-report-snapshot-capital-governance-references.js
          grep -Fq 'COUNT_AND_KIND_ONLY · VALUE_NOT_EXPOSED' apps/control-web/public/sana-v3-report-snapshot-capital-governance-references.js
          grep -Fq 'ROW_LEVEL_STRUCTURAL_DIFF' apps/control-web/public/sana-v3-dataroom-capital-governance-references.js
          grep -Fq 'REFERENCE_CHANGE ≠ CAPITAL_FACT_CHANGE' apps/control-web/public/sana-v3-dataroom-capital-governance-references.js
          grep -Fq 'NON_WEIGHTED' apps/control-web/public/sana-v3-cycle-capital-governance-references.js
          grep -Fq 'SOURCE CASE LOT DEFINES CYCLE MEMBERSHIP' apps/control-web/public/sana-v3-cycle-capital-governance-references.js
          grep -Fq 'NOT_CAPTURED_OR_LEGACY ≠ GAP' apps/control-web/public/sana-v3-due-diligence-capital-governance-reference-gaps.js
          grep -Fq 'DECLARED_NON_CANONICAL_REFERENCE ≠ GAP' apps/control-web/public/sana-v3-due-diligence-capital-governance-reference-gaps.js
          ! grep -Eq '__SANA_CAPITAL_GOVERNANCE__|storage\?\.records|localStorage' apps/control-web/public/sana-v3-dataroom-capital-governance-references.js apps/control-web/public/sana-v3-cycle-capital-governance-references.js apps/control-web/public/sana-v3-due-diligence-capital-governance-reference-gaps.js
          ! grep -Eiq 'canonicalMutated[[:space:]]*=[[:space:]]*true|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|verifiedIdentity[[:space:]]*=[[:space:]]*true|verifiedTermSheets[[:space:]]*=[[:space:]]*[1-9]|verifiedCommitments[[:space:]]*=[[:space:]]*[1-9]|legalClosingsVerified[[:space:]]*=[[:space:]]*[1-9]|fundingExecuted[[:space:]]*=[[:space:]]*[1-9]|custodyAmount[[:space:]]*=[[:space:]]*[1-9]|creditApproved|eligibilityApproved|investmentApproved|investmentRecommendation[[:space:]]*=[[:space:]]*true' apps/control-web/public/sana-v3-*capital-governance-reference*.js
      - name: Validate V150 and V3 compatibility before assembly
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-sana-capital-governance-references.mjs
          shopt -s nullglob
          files=(apps/control-web/public/sana-v3*.js)
          test ${#files[@]} -gt 0
          for file in "${files[@]}"; do node --check "$file"; done
          node -e "JSON.parse(require('fs').readFileSync('apps/control-web/public/sana-v3-manifest.webmanifest','utf8'))"
          node scripts/validate-sana-demo-auth.mjs
          grep -q 'productionExecutionAvailable=false' apps/control-web/public/sana-v3-core.js
          grep -q 'canonicalMutated=false' apps/control-web/public/sana-v3-core.js
          grep -q 'D10=PENDING' apps/control-web/public/sana-v3-core.js
