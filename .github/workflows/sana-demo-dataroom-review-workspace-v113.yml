name: SANA Demo Data Room Review Workspace V113

on:
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-entry.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-dataroom-review-workspace*.mjs'
      - '.github/workflows/sana-demo-dataroom-review-workspace-v113.yml'

permissions:
  contents: read

jobs:
  review-workspace-v113-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve V87–V113 workspace contracts
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          for v in $(seq 88 113); do node scripts/validate-sana-dataroom-review-workspace-v${v}.mjs; done
      - name: Assert V113 shell, empty guidance semantics and read-only boundary
        run: |
          grep -F "const CACHE='sana-v3-demo-shell-v113';" apps/control-web/public/sana-v3-sw.js
          grep -F 'SOURCE_GUIDANCE ≠ SOURCE_REMEDIATION' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'GUIDANCE_LINK ≠ SOURCE_VERIFICATION' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'PROJECTION_PREREQUISITE ≠ REVIEW_REQUIREMENT' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'SOURCE_NAVIGATION ≠ REVIEW_PRIORITY' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'data-review-source-integrity' apps/control-web/public/sana-v3-dataroom-entry.js
          ! grep -Eq 'rwGuidance|rwSourceIntegrity|localStorage\.(setItem|removeItem|clear)|sessionStorage|openModal\(' apps/control-web/public/sana-v3-dataroom-entry.js
