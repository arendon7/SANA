name: Assemble SANA v120 Review Workspace Structural Index

on:
  push:
    branches:
      - 'demo/sana-v120-review-workspace-structural-index'
    paths:
      - 'scripts/apply-v120-structural-diagnostics-index.py'
      - 'scripts/validate-sana-dataroom-review-workspace-v120.mjs'
      - '.github/workflows/sana-demo-dataroom-review-workspace-v120.yml'
      - '.github/workflows/assemble-sana-v120-review-workspace-structural-index.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-v120-review-workspace-structural-index
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply, assemble and validate V120
        run: |
          python scripts/apply-v120-structural-diagnostics-index.py
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          active="const CACHE='sana-v3-demo-shell-v120';"
          if active not in s:
              old="const CACHE='sana-v3-demo-shell-v119';"
              if old not in s: raise SystemExit('active shell v119 not found')
              s=s.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v119';\n}\nconst CACHE='sana-v3-demo-shell-v120';",1)
              p.write_text(s)
          PY
          node scripts/validate-sana-dataroom-review-workspace.mjs
          for v in $(seq 88 120); do node scripts/validate-sana-dataroom-review-workspace-v${v}.mjs; done
      - name: Commit assembled V120
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/control-web/public/sana-v3-dataroom-entry.js apps/control-web/public/sana-v3-review-workspace.css apps/control-web/public/sana-v3-sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'demo: assemble review workspace structural index v120'
          git push origin HEAD:demo/sana-v120-review-workspace-structural-index
