name: AGROWAY CONTROL v0.22 alpha8
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/control-web/**"
      - "config/product/control-alpha8-recovery.json"
      - "config/product/control-operational-acceptance.json"
      - "config/product/control-review-bundle.json"
      - "scripts/validate-control-reintegration.mjs"
      - "scripts/validate-control-operational-acceptance.mjs"
      - "scripts/control-reintegration-http-browser-qa.py"
      - ".github/workflows/agroway-v022-control-alpha8.yml"
concurrency:
  group: agroway-control-v022-alpha8-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  recovered-home-project-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax-check alpha8 integration
        run: |
          node --check apps/control-web/server.mjs
          node --check apps/control-web/public/home.js
          node --check apps/control-web/public/home-integration.js
          node --check apps/control-web/public/project-original.js
          node --check apps/control-web/public/project-integration.js
          node --check apps/control-web/public/service-worker.js
          node --check scripts/validate-control-reintegration.mjs
          node --check scripts/validate-control-operational-acceptance.mjs
          python -m py_compile scripts/control-reintegration-http-browser-qa.py
      - name: Pinned TypeScript strict
        run: npx -y -p typescript@5.8.3 tsc -p tsconfig.json --noEmit
      - name: Alpha3-alpha7 decision-flow regression
        run: |
          node scripts/validate-control-exception-resolution.mjs
          node scripts/validate-control-evidence-ledger.mjs
          node scripts/validate-control-human-approval.mjs
          node scripts/validate-control-submission-handoff.mjs
          node scripts/validate-control-unified-flow.mjs
      - name: Alpha8 exact-source provenance + reintegration guardrails
        run: node scripts/validate-control-reintegration.mjs
      - name: Full CONTROL operational acceptance truth gate
        run: node scripts/validate-control-operational-acceptance.mjs
      - name: Install pinned Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native Chromium Home + Project reintegration over real CONTROL HTTP
        run: python scripts/control-reintegration-http-browser-qa.py
      - name: Build deterministic CONTROL review bundle
        run: node scripts/build-control-review-bundle.mjs
      - name: Smoke-test recovered Home + Project in current bundle
        run: |
          PORT=4276 node dist/control-review-bundle/server.mjs > /tmp/control-alpha8-bundle.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4276/control >/dev/null && break || sleep .25; done
          for route in /control /control/projects/inv-yar-001 /control/exceptions /control/evidence /control/approvals /control/handoff; do curl -fsS "http://127.0.0.1:4276$route" >/dev/null; done
          node -e "const m=require('./dist/control-review-bundle/REVIEW_MANIFEST.json');const a=require('./dist/control-review-bundle/config/product/control-operational-acceptance.json');const root=a.capabilities.find(x=>x.id==='DIRECT_MONOREPO_ROOT_LOCK');const expected=root?.status==='PASS_REPO_HARDENING'?4:5;if(!['0.22.0-alpha8','0.22.0-alpha9','0.22.0-alpha10','0.22.0-alpha11','0.22.0-alpha12','0.22.0-alpha13'].includes(m.version)||m.routes.length<6||a.productionReady!==false||a.productionBlockers.length!==expected)process.exit(1);console.log('PASS_CONTROL_ALPHA8_SUCCESSOR_REGRESSION',m.version,m.fileCount,m.aggregateSha256,a.productionBlockers.length,root?.status)"
      - name: Trust boundary
        run: |
          echo 'PASS_CONTROL_ALPHA8_RECOVERED_HOME_PROJECT'
          echo 'PR9 exact blobs remain immutable provenance; successor CONTROL layers may advance around them without changing recovery truth.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agroway-control-v022-alpha8-reintegration-evidence
          path: docs/product/evidence/reintegrated-control
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: agroway-control-v022-alpha8-review-bundle
          path: dist/control-review-bundle
          if-no-files-found: error
          retention-days: 14
