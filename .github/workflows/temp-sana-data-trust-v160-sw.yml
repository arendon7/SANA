name: TEMP SANA Data Trust V160 SW

on:
  push:
    branches: [demo/sana-data-trust-v160]

permissions:
  contents: write

jobs:
  assemble-sw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-data-trust-v160
      - name: Patch v160 shell only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v160';" not in s:
              old="const CACHE='sana-v3-demo-shell-v159';"
              assert s.count(old)==1, 'expected one active v159 marker'
              s=s.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v159';\n}\nconst CACHE='sana-v3-demo-shell-v160';",1)
          asset="'/sana-v3-data-trust-references.js'"
          if asset not in s:
              anchor="'/sana-v3-data-trust.js',"
              assert s.count(anchor)==1, 'data trust anchor missing or duplicated'
              s=s.replace(anchor,anchor+asset+',',1)
          comment='// v160 validates Data Trust ACK/conflict-candidate coherence against Capture/Sync without server/source/hardware/measurement, credit, eligibility or investment authority.'
          if comment not in s:
              anchor='// v159 propagates Impact Source Registry reference integrity through content-minimized Snapshot, Cycle, Due Diligence and Data Room without live fallback, weighting, verification, certification, credit or investment authority.'
              assert s.count(anchor)==1, 'v159 comment anchor missing or duplicated'
              s=s.replace(anchor,anchor+'\n'+comment,1)
          p.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v160';$" apps/control-web/public/sana-v3-sw.js
          grep -Fq $'if(false){\nconst CACHE='"'"'sana-v3-demo-shell-v159'"'"';\n}' apps/control-web/public/sana-v3-sw.js
          test "$(grep -o '/sana-v3-data-trust-references.js' apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1
      - name: Commit SW if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble data trust shell v160'
          git push origin HEAD:demo/sana-data-trust-v160
