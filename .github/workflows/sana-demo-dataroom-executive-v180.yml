name: SANA Demo Data Room Executive V180

on:
  push:
    branches: [demo/sana-dataroom-executive-v180]
  pull_request:

permissions:
  contents: read

jobs:
  validate-v180:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax source contract
        run: node --check apps/control-web/public/sana-v3-dataroom-claim-current-remediation-round-v180.js
      - name: Syntax executive adapter
        run: node --check apps/control-web/public/sana-v3-dataroom-executive-v180.js
      - name: V170 regression
        run: node scripts/validate-sana-dataroom-executive-v170.mjs
      - name: V171 regression
        run: node scripts/validate-sana-dataroom-executive-v171.mjs
      - name: V172 regression
        run: node scripts/validate-sana-dataroom-executive-v172.mjs
      - name: V173 regression
        run: node scripts/validate-sana-dataroom-executive-v173.mjs
      - name: V174 regression
        run: node scripts/validate-sana-dataroom-executive-v174.mjs
      - name: V175 regression
        run: node scripts/validate-sana-dataroom-executive-v175.mjs
      - name: V176 regression
        run: node scripts/validate-sana-dataroom-executive-v176.mjs
      - name: V177 regression
        run: node scripts/validate-sana-dataroom-executive-v177.mjs
      - name: V178 regression
        run: node scripts/validate-sana-dataroom-executive-v178.mjs
      - name: V179 regression
        run: node scripts/validate-sana-dataroom-executive-v179.mjs
      - name: V180 current round pointer adversarial validation
        run: node scripts/validate-sana-dataroom-executive-v180.mjs
      - name: V180 read-only surface
        shell: bash
        run: |
          set -euo pipefail
          file=apps/control-web/public/sana-v3-dataroom-executive-v180.html
          test -f "$file"
          grep -Fq 'Current remediation round pointer' "$file"
          grep -Fq 'referencia actual' "$file"
          grep -Fq 'CURRENT ROUND REFERENCE ONLY ≠ CURRENT ROUND AUTHORITY ≠ LATEST ROUND' "$file"
          grep -Fq 'currentRoundAuthority=false' "$file"
          grep -Fq 'latestRoundInference=false' "$file"
          grep -Fq 'chronologyInference=false' "$file"
          ! grep -Fqi '<form' "$file"
          ! grep -Fq 'fetch(' "$file"
          ! grep -Fq 'XMLHttpRequest' "$file"
          ! grep -Fq 'localStorage.setItem' "$file"
          ! grep -Fq 'sessionStorage.setItem' "$file"
      - name: Preserve V180 source-contract boundary
        shell: bash
        run: |
          set -euo pipefail
          source_file=apps/control-web/public/sana-v3-dataroom-claim-current-remediation-round-v180.js
          grep -Fq 'SANA_DATAROOM_CLAIM_CURRENT_REMEDIATION_ROUND_POINTER_V1' "$source_file"
          grep -Fq 'CURRENT_ROUND_REFERENCE_ONLY' "$source_file"
          grep -Fq 'CURRENT_ROUND_REF_REQUIRED' "$source_file"
          grep -Fq 'CURRENT_ROUND_POINTER_STATE_NOT_ALLOWED' "$source_file"
          grep -Fq 'DUPLICATE_POINTER_REF' "$source_file"
          grep -Fq 'MULTIPLE_CURRENT_POINTERS_FOR_CLAIM' "$source_file"
          grep -Fq 'ONE_ACCEPTED_POINTER_PER_CLAIM_ENVELOPE' "$source_file"
          grep -Fq 'currentRoundAuthority:false' "$source_file"
          grep -Fq 'latestRoundAuthority:false' "$source_file"
          grep -Fq 'chronologyAuthority:false' "$source_file"
          ! grep -Fq 'fetch(' "$source_file"
          ! grep -Fq 'XMLHttpRequest' "$source_file"
          ! grep -Fq 'localStorage.setItem' "$source_file"
          ! grep -Fq 'sessionStorage.setItem' "$source_file"
      - name: Preserve V180 exact-pointer and authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          js=apps/control-web/public/sana-v3-dataroom-executive-v180.js
          grep -Fq 'CLAIM_CURRENT_REMEDIATION_ROUND_POINTER_EXACT_V1' "$js"
          grep -Fq 'EXACTLY_ONE_POINTER_CANDIDATE_PER_CLAIM' "$js"
          grep -Fq 'EXACT_V179_ROUND_REF' "$js"
          grep -Fq 'NO_TIMESTAMP_SOURCE_ORDER_OR_REF_ORDER_INFERENCE' "$js"
          grep -Fq 'CURRENT_ROUND_REFERENCE_ONLY ≠ CURRENT_ROUND_AUTHORITY ≠ LATEST_ROUND' "$js"
          grep -Fq 'currentRoundAuthority:false' "$js"
          grep -Fq 'latestRoundAuthority:false' "$js"
          grep -Fq 'chronologyAuthority:false' "$js"
          grep -Fq 'claimTruthAuthority:false' "$js"
          grep -Fq 'evidenceAcceptanceAuthority:false' "$js"
          grep -Fq 'evidentiarySufficiencyAuthority:false' "$js"
          grep -Fq 'findingResolutionAuthority:false' "$js"
          grep -Fq 'dueDiligenceApprovalAuthority:false' "$js"
          grep -Fq 'eligibilityAuthority:false' "$js"
          grep -Fq 'financingApprovalAuthority:false' "$js"
          grep -Fq 'decisionAuthority:false' "$js"
          ! grep -Eiq 'canonicalMutationAvailable[[:space:]]*:[[:space:]]*true|financialMutationAvailable[[:space:]]*:[[:space:]]*true|currentRoundAuthority[[:space:]]*:[[:space:]]*true|latestRoundAuthority[[:space:]]*:[[:space:]]*true|chronologyAuthority[[:space:]]*:[[:space:]]*true|claimTruthAuthority[[:space:]]*:[[:space:]]*true|evidenceAcceptanceAuthority[[:space:]]*:[[:space:]]*true|evidentiarySufficiencyAuthority[[:space:]]*:[[:space:]]*true|findingResolutionAuthority[[:space:]]*:[[:space:]]*true|dueDiligenceApprovalAuthority[[:space:]]*:[[:space:]]*true|eligibilityAuthority[[:space:]]*:[[:space:]]*true|financingApprovalAuthority[[:space:]]*:[[:space:]]*true|decisionAuthority[[:space:]]*:[[:space:]]*true|riskScore[[:space:]]*:|creditScore[[:space:]]*:|investmentScore[[:space:]]*:|projectScore[[:space:]]*:|overallScore[[:space:]]*:' "$js"