name: Assemble SANA v54 Capture Sync

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-capture-sync-ledger.js'
      - 'apps/control-web/public/sana-v3-cycle-capture-sync-provenance.js'
      - 'apps/control-web/public/sana-v3-capture-sync-runtime-bridge.js'
      - 'apps/control-web/public/sana-v3-report-snapshot-capture-sync.js'
      - 'apps/control-web/public/sana-v3-dataroom-capture-sync-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-capture-sync-gaps.js'
      - 'scripts/validate-sana-capture-sync-ledger.mjs'
      - 'scripts/validate-sana-capture-sync-history.mjs'
      - '.github/workflows/sana-demo-capture-sync-ledger.yml'
      - '.github/workflows/sana-demo-capture-sync-history.yml'
      - '.github/workflows/sana-demo-due-diligence-v54.yml'
      - '.github/workflows/assemble-sana-v54.yml'

permissions:
  contents: write

jobs:
  assemble-v54:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-functional-auth-v1
          fetch-depth: 0
      - name: Assemble HTML and service worker deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          html_path=Path('apps/control-web/public/sana-v3.html')
          sw_path=Path('apps/control-web/public/sana-v3-sw.js')
          html=html_path.read_text(); sw=sw_path.read_text()

          html_replacements=[
            ('<script src="/sana-v3-data-trust.js"></script><script src="/sana-v3-harvest-ledger.js"></script>',
             '<script src="/sana-v3-data-trust.js"></script><script src="/sana-v3-capture-sync-ledger.js"></script><script src="/sana-v3-harvest-ledger.js"></script>'),
            ('<script src="/sana-v3-cycle-forecast-provenance.js"></script><script src="/sana-v3-cycle-labor-provenance.js"></script>',
             '<script src="/sana-v3-cycle-forecast-provenance.js"></script><script src="/sana-v3-cycle-capture-sync-provenance.js"></script><script src="/sana-v3-cycle-labor-provenance.js"></script>'),
            ('<script src="/sana-v3-report-snapshot-forecast.js"></script><script src="/sana-v3-cycle-closure.js"></script>',
             '<script src="/sana-v3-report-snapshot-forecast.js"></script><script src="/sana-v3-report-snapshot-capture-sync.js"></script><script src="/sana-v3-cycle-closure.js"></script>'),
            ('<script src="/sana-v3-due-diligence-forecast-gaps.js"></script><script src="/sana-v3-due-diligence-remediation.js"></script>',
             '<script src="/sana-v3-due-diligence-forecast-gaps.js"></script><script src="/sana-v3-due-diligence-capture-sync-gaps.js"></script><script src="/sana-v3-due-diligence-remediation.js"></script>'),
            ('<script src="/sana-v3-dataroom-forecast-history.js"></script><script src="/sana-v3-dataroom-entry.js"></script>',
             '<script src="/sana-v3-dataroom-forecast-history.js"></script><script src="/sana-v3-dataroom-capture-sync-history.js"></script><script src="/sana-v3-dataroom-entry.js"></script>'),
            ('<script src="/sana-v3-runtime.js"></script><script src="/sana-v3-access.js"></script>',
             '<script src="/sana-v3-runtime.js"></script><script src="/sana-v3-capture-sync-runtime-bridge.js"></script><script src="/sana-v3-access.js"></script>')
          ]
          for old,new in html_replacements:
              if html.count(old)!=1: raise SystemExit(f'HTML anchor count {html.count(old)} for {old[:80]!r}')
              html=html.replace(old,new,1)

          old_cache="const CACHE='sana-v3-demo-shell-v52';"
          new_cache="if(false){\nconst CACHE='sana-v3-demo-shell-v52';\n}\nif(false){\nconst CACHE='sana-v3-demo-shell-v53';\n}\nconst CACHE='sana-v3-demo-shell-v54';"
          if sw.count(old_cache)!=1: raise SystemExit(f'SW active v52 anchor count: {sw.count(old_cache)}')
          sw=sw.replace(old_cache,new_cache,1)
          sw_replacements=[
            ("'/sana-v3-data-trust.js','/sana-v3-harvest-ledger.js'","'/sana-v3-data-trust.js','/sana-v3-capture-sync-ledger.js','/sana-v3-harvest-ledger.js'"),
            ("'/sana-v3-cycle-forecast-provenance.js','/sana-v3-cycle-labor-provenance.js'","'/sana-v3-cycle-forecast-provenance.js','/sana-v3-cycle-capture-sync-provenance.js','/sana-v3-cycle-labor-provenance.js'"),
            ("'/sana-v3-report-snapshot-forecast.js','/sana-v3-cycle-closure.js'","'/sana-v3-report-snapshot-forecast.js','/sana-v3-report-snapshot-capture-sync.js','/sana-v3-cycle-closure.js'"),
            ("'/sana-v3-due-diligence-forecast-gaps.js','/sana-v3-due-diligence-remediation.js'","'/sana-v3-due-diligence-forecast-gaps.js','/sana-v3-due-diligence-capture-sync-gaps.js','/sana-v3-due-diligence-remediation.js'"),
            ("'/sana-v3-dataroom-forecast-history.js','/sana-v3-dataroom-entry.js'","'/sana-v3-dataroom-forecast-history.js','/sana-v3-dataroom-capture-sync-history.js','/sana-v3-dataroom-entry.js'"),
            ("'/sana-v3-runtime.js','/sana-v3-access.js'","'/sana-v3-runtime.js','/sana-v3-capture-sync-runtime-bridge.js','/sana-v3-access.js'")
          ]
          for old,new in sw_replacements:
              if sw.count(old)!=1: raise SystemExit(f'SW anchor count {sw.count(old)} for {old}')
              sw=sw.replace(old,new,1)
          html_path.write_text(html); sw_path.write_text(sw)
          PY
          grep -q '/sana-v3-data-trust.js.*sana-v3-capture-sync-ledger.js.*sana-v3-harvest-ledger.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-runtime.js.*sana-v3-capture-sync-runtime-bridge.js.*sana-v3-access.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-report-snapshot-forecast.js.*sana-v3-report-snapshot-capture-sync.js.*sana-v3-cycle-closure.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-due-diligence-forecast-gaps.js.*sana-v3-due-diligence-capture-sync-gaps.js.*sana-v3-due-diligence-remediation.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-dataroom-forecast-history.js.*sana-v3-dataroom-capture-sync-history.js.*sana-v3-dataroom-entry.js' apps/control-web/public/sana-v3.html
          grep -q "^const CACHE='sana-v3-demo-shell-v54';" apps/control-web/public/sana-v3-sw.js
      - name: Commit assembled v54
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3.html apps/control-web/public/sana-v3-sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'build(demo): assemble capture sync shell v54'
          git push origin HEAD:demo/sana-functional-auth-v1
