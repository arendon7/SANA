name: TEMP Assemble Labor V142 Shell

on:
  push:
    branches: [demo/sana-labor-v142]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-labor-v142
          fetch-depth: 1
      - name: Patch shell from certified v141
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          old="""if(false){
          const CACHE='sana-v3-demo-shell-v140';
          }
          const CACHE='sana-v3-demo-shell-v141';"""
          new="""if(false){
          const CACHE='sana-v3-demo-shell-v140';
          }
          if(false){
          const CACHE='sana-v3-demo-shell-v141';
          }
          const CACHE='sana-v3-demo-shell-v142';"""
          assert old in s, 'active v141 marker not found'
          s=s.replace(old,new,1)
          old_assets="'/sana-v3-labor-ledger.js','/sana-v3-labor-references.js','/sana-v3-report-snapshot-circularity.js'"
          new_assets="'/sana-v3-labor-ledger.js','/sana-v3-labor-references.js','/sana-v3-report-snapshot-labor-references.js','/sana-v3-cycle-labor-references.js','/sana-v3-due-diligence-labor-reference-gaps.js','/sana-v3-dataroom-labor-references.js','/sana-v3-report-snapshot-circularity.js'"
          assert old_assets in s, 'labor history insertion point not found'
          s=s.replace(old_assets,new_assets,1)
          old_comment='// v141 validates Labor activity/evidence/support/cost-basis references without identity verification, HR scoring, payroll or payment authority.'
          new_comment=old_comment+'\n// v142 propagates Labor reference integrity through privacy-minimized Snapshot, Data Room, Cycle and Due Diligence without live fallback, weighting, HR scoring or payroll inference.'
          assert old_comment in s
          assert 'v142 propagates Labor reference integrity' not in s
          s=s.replace(old_comment,new_comment,1)
          assets=['/sana-v3-report-snapshot-labor-references.js','/sana-v3-cycle-labor-references.js','/sana-v3-due-diligence-labor-reference-gaps.js','/sana-v3-dataroom-labor-references.js']
          assert s.count("const CACHE='sana-v3-demo-shell-v142';")==1
          for a in assets: assert s.count(a)==1, a
          p.write_text(s)
          PY
          git diff --check
          git diff -- apps/control-web/public/sana-v3-sw.js
      - name: Commit shell bump
        run: |
          if git diff --quiet -- apps/control-web/public/sana-v3-sw.js; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble labor reference provenance v142 shell'
          git push origin HEAD:demo/sana-labor-v142
