name: SANA Demo Data Room Review Workspace V121

on:
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-entry.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-dataroom-review-workspace*.mjs'
      - '.github/workflows/sana-demo-dataroom-review-workspace-v121.yml'

permissions:
  contents: read

jobs:
  review-workspace-v121-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve V87–V121 workspace contracts
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          for v in $(seq 88 121); do node scripts/validate-sana-dataroom-review-workspace-v${v}.mjs; done
      - name: Assert V121 shell, issue glossary and read-only boundary
        run: |
          grep -F "const CACHE='sana-v3-demo-shell-v121';" apps/control-web/public/sana-v3-sw.js
          grep -F 'ISSUE_DESCRIPTION ≠ SEVERITY' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'STRUCTURAL_CODE ≠ DOCUMENT_FINDING' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'GLOSSARY_MEANING ≠ REMEDIATION_INSTRUCTION' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'data-review-structural-issue-glossary' apps/control-web/public/sana-v3-dataroom-entry.js
          ! grep -Eq 'rwStructuralGlossary|rwIssueGlossary|data-review-structural-issue-glossary-state|localStorage\.(setItem|removeItem|clear)|sessionStorage' apps/control-web/public/sana-v3-dataroom-entry.js
