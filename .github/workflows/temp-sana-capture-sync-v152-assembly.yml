name: TEMP SANA Capture Sync V152 Assembly

on:
  pull_request:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-capture-sync-v152
      - name: Assemble Capture Sync shell v152
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v152';" not in s:
              old="const CACHE='sana-v3-demo-shell-v151';"
              new="if(false){\nconst CACHE='sana-v3-demo-shell-v151';\n}\nconst CACHE='sana-v3-demo-shell-v152';"
              assert s.count(old)==1, 'expected exactly one active v151 marker'
              s=s.replace(old,new,1)
          anchor="'/sana-v3-data-trust.js','/sana-v3-capture-sync-ledger.js','/sana-v3-harvest-ledger.js',"
          assets="'/sana-v3-data-trust.js','/sana-v3-capture-sync-ledger.js','/sana-v3-capture-sync-references.js','/sana-v3-harvest-ledger.js',"
          if '/sana-v3-capture-sync-references.js' not in s:
              assert s.count(anchor)==1, 'Capture Sync asset anchor missing/duplicated'
              s=s.replace(anchor,assets,1)
          comment='// v152 validates Capture Sync record, ACK and conflict-candidate reference coherence without server/source verification, canonical write, agronomic, credit, eligibility or investment authority.'
          if comment not in s:
              anchor_comment='// v151 propagates minimized Capital Governance reference integrity through Snapshot, Cycle, DD and Data Room without live fallback, retrofill, weighting, credit or investment authority.'
              assert s.count(anchor_comment)==1, 'v151 comment anchor missing/duplicated'
              s=s.replace(anchor_comment,anchor_comment+'\n'+comment,1)
          p.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v152';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v151';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          test "$(grep -o '/sana-v3-capture-sync-references.js' apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1
          test ! -e apps/control-web/public/sana-v3-report-snapshot-capture-sync-references.js
          test ! -e apps/control-web/public/sana-v3-cycle-capture-sync-references.js
          test ! -e apps/control-web/public/sana-v3-due-diligence-capture-sync-reference-gaps.js
          test ! -e apps/control-web/public/sana-v3-dataroom-capture-sync-references.js
      - name: Commit assembly if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble capture sync shell v152'
          git push origin HEAD:demo/sana-capture-sync-v152
