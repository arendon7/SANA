name: SANA Demo Circularity References V154

on:
  pull_request:
  push:
    branches: [demo/sana-circularity-v154]

permissions:
  contents: write

jobs:
  circularity-references-v154:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Circularity References V154 final
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-circularity-ledger.js
          node --check apps/control-web/public/sana-v3-circularity-references.js
          node --check apps/control-web/public/sana-v3-cycle-circularity-provenance.js
          node --check apps/control-web/public/sana-v3-sw.js
          node scripts/validate-sana-circularity-ledger.mjs
          node scripts/validate-sana-cycle-circularity.mjs
          node scripts/validate-sana-circularity-references-v154.mjs
          node scripts/validate-sana-reference-hardening-v149.mjs
          node scripts/validate-sana-reference-history-migration-v149.mjs
          grep -Fq 'LEGACY_REFERENCE_NOT_CAPTURED' apps/control-web/public/sana-v3-circularity-references.js
          grep -Fq 'CAPTURED_V154' apps/control-web/public/sana-v3-circularity-references.js
          grep -Fq 'CIRCULARITY_SUPPORT_REF' apps/control-web/public/sana-v3-circularity-references.js
          grep -Fq 'CROSS_CASE_REFERENCE' apps/control-web/public/sana-v3-circularity-references.js
          grep -Fq 'CROSS_SCOPE_REFERENCE' apps/control-web/public/sana-v3-circularity-references.js
          grep -Fq 'FORWARD_REFERENCE' apps/control-web/public/sana-v3-circularity-references.js
          grep -Fq 'DECLARED_NON_CANONICAL_REFERENCE' apps/control-web/public/sana-v3-circularity-references.js
          grep -Fq 'SUPPORT_REFERENCE ≠ EVIDENCE_VERIFIED' apps/control-web/public/sana-v3-circularity-references.js
          grep -Fq 'RECEIVER_REFERENCE_DECLARED ≠ RECEIVER_IDENTITY_VERIFIED' apps/control-web/public/sana-v3-circularity-references.js
          grep -Fq 'EXTERNAL_HANDOFF ≠ VERIFIED_DISPOSITION' apps/control-web/public/sana-v3-circularity-references.js
          grep -Fq 'REFERENCE ≠ CIRCULARITY_RATE ≠ ENVIRONMENTAL_IMPACT ≠ REGULATORY_CLASSIFICATION ≠ CREDIT_RISK ≠ ELIGIBILITY ≠ INVESTMENT_SIGNAL' apps/control-web/public/sana-v3-circularity-references.js
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('apps/control-web/public/sana-v3-cycle-circularity-provenance.js','utf8');
          const sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');
          if(!loader.includes("const VERSION='V154',SRC='/sana-v3-circularity-references.js'"))throw new Error('V154 loader contract missing');
          if(!loader.includes('__SANA_CIRCULARITY_REFERENCES_LOADER__'))throw new Error('V154 loader state missing');
          if(!loader.includes("__SANA_CIRCULARITY_LEDGER__?.schema==='SANA_CIRCULARITY_LEDGER_V1'"))throw new Error('Circularity dependency guard missing');
          const active=(sw.match(/^const CACHE='sana-v3-demo-shell-v154';$/gm)||[]).length===1;
          const historical=sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v154';\n}");
          if(!active&&!historical)throw new Error('v154 cache marker must remain active or historical');
          if(!sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v153';\n}"))throw new Error('v153 historical marker missing');
          if((sw.split('/sana-v3-circularity-references.js').length-1)!==1)throw new Error('V154 SW asset count invalid');
          if(!sw.includes('// v154 validates explicit Circularity EVIDENCE.supports references'))throw new Error('v154 provenance marker missing');
          NODE
          ! grep -Eiq 'fetch\(|XMLHttpRequest|WebSocket|canonicalMutated[[:space:]]*[:=][[:space:]]*true|productionExecutionAvailable[[:space:]]*[:=][[:space:]]*true|verifiedDisposition[[:space:]]*[:=][[:space:]]*true|certifiedRecovery[[:space:]]*[:=][[:space:]]*true|environmentalImpactVerified[[:space:]]*[:=][[:space:]]*true|regulatoryClassificationVerified[[:space:]]*[:=][[:space:]]*true|creditApproved|eligibilityApproved|investmentApproved' apps/control-web/public/sana-v3-circularity-references.js apps/control-web/public/sana-v3-cycle-circularity-provenance.js

  assemble-v155:
    needs: circularity-references-v154
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-circularity-v155
      - name: Assemble v155 service worker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v155';" not in s:
              old="const CACHE='sana-v3-demo-shell-v154';"
              assert s.count(old)==1, 'expected exactly one active v154 marker'
              s=s.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v154';\n}\nconst CACHE='sana-v3-demo-shell-v155';",1)
          anchor="'/sana-v3-circularity-references.js',"
          assets="'/sana-v3-circularity-references.js','/sana-v3-report-snapshot-circularity-references.js','/sana-v3-cycle-circularity-references.js','/sana-v3-due-diligence-circularity-reference-gaps.js','/sana-v3-dataroom-circularity-references.js',"
          if '/sana-v3-report-snapshot-circularity-references.js' not in s:
              assert s.count(anchor)==1, 'circularity reference asset anchor missing/duplicated'
              s=s.replace(anchor,assets,1)
          comment='// v155 propagates minimized Circularity reference integrity through Snapshot, Cycle, DD and Data Room without live fallback, retrofill, weighting, environmental, regulatory, credit or investment authority.'
          if comment not in s:
              anchor_comment='// v154 validates explicit Circularity EVIDENCE.supports references without evidence, receiver, recovery, disposition, impact, regulatory, credit or investment authority.'
              assert s.count(anchor_comment)==1, 'v154 comment anchor missing/duplicated'
              s=s.replace(anchor_comment,anchor_comment+'\n'+comment,1)
          p.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v155';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v154';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          for a in /sana-v3-report-snapshot-circularity-references.js /sana-v3-cycle-circularity-references.js /sana-v3-due-diligence-circularity-reference-gaps.js /sana-v3-dataroom-circularity-references.js; do test "$(grep -o "$a" apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1; done
      - name: Commit assembly if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble circularity shell v155'
          git push origin HEAD:demo/sana-circularity-v155
