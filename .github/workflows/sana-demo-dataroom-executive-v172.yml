name: SANA Demo Data Room Executive V172

on:
  push:
    branches: [demo/sana-dataroom-executive-v172]
  pull_request:

permissions:
  contents: read

jobs:
  validate-v172:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check apps/control-web/public/sana-v3-dataroom-executive-v172.js
      - name: V170 regression
        run: node scripts/validate-sana-dataroom-executive-v170.mjs
      - name: V171 regression
        run: node scripts/validate-sana-dataroom-executive-v171.mjs
      - name: V172 evidence locator
        run: node scripts/validate-sana-dataroom-executive-v172.mjs
      - name: V172 read-only surface
        shell: bash
        run: |
          set -euo pipefail
          file=apps/control-web/public/sana-v3-dataroom-executive-v172.html
          test -f "$file"
          grep -Fq 'Evidence drill-down' "$file"
          grep -Fq 'LOCATOR ≠ EVIDENCE VERIFICATION' "$file"
          ! grep -Fqi '<form' "$file"
          ! grep -Fq 'fetch(' "$file"
          ! grep -Fq 'XMLHttpRequest' "$file"
          ! grep -Fq 'localStorage.setItem' "$file"
          ! grep -Fq 'sessionStorage.setItem' "$file"
      - name: Preserve locator and financial boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'verificationAuthority:false' apps/control-web/public/sana-v3-dataroom-executive-v172.js
          grep -Fq 'financialMutationAvailable:false' apps/control-web/public/sana-v3-dataroom-executive-v172.js
          grep -Fq "aiAuthority:'ADVISORY_ONLY'" apps/control-web/public/sana-v3-dataroom-executive-v172.js
          grep -Fq 'V171_FACTORY_REQUIRED' apps/control-web/public/sana-v3-dataroom-executive-v172.js
          ! grep -Eiq 'canonicalMutationAvailable[[:space:]]*:[[:space:]]*true|financialMutationAvailable[[:space:]]*:[[:space:]]*true|verificationAuthority[[:space:]]*:[[:space:]]*true|riskScore[[:space:]]*:|investmentScore[[:space:]]*:|overallScore[[:space:]]*:' apps/control-web/public/sana-v3-dataroom-executive-v172.js
