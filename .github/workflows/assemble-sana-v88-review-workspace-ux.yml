name: Assemble SANA v88 Review Workspace UX
on:
  push:
    branches: [demo/sana-v88-review-workspace-ux]
    paths: ['apps/control-web/public/sana-v3-dataroom-review-workspace.js','apps/control-web/public/sana-v3-review-workspace.css','.github/workflows/assemble-sana-v88-review-workspace-ux.yml']
permissions: {contents: write}
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: demo/sana-v88-review-workspace-ux}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/validate-sana-dataroom-review-workspace.mjs
      - run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('apps/control-web/public/sana-v3.html');s=h.read_text();css='<link rel="stylesheet" href="/sana-v3-review-workspace.css">'
          if css not in s:
            anchor='<link rel="stylesheet" href="/sana-v3-territory-360.css">';assert anchor in s;s=s.replace(anchor,anchor+css,1);h.write_text(s)
          p=Path('apps/control-web/public/sana-v3-sw.js');s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v88';" not in s:
            old="const CACHE='sana-v3-demo-shell-v87';";assert old in s;s=s.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v87';\n}\nconst CACHE='sana-v3-demo-shell-v88';",1)
          if "'/sana-v3-review-workspace.css'" not in s:
            anchor="'/sana-v3-territory-360.css',";assert anchor in s;s=s.replace(anchor,anchor+"'/sana-v3-review-workspace.css',",1)
          p.write_text(s)
          PY
          node scripts/validate-sana-dataroom-review-workspace-v88.mjs
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3.html apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble Data Room review workspace UX v88'
          git push origin HEAD:demo/sana-v88-review-workspace-ux
