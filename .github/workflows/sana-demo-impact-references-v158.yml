name: SANA Demo Impact References V158

on:
  push:
    branches: [demo/sana-impact-v158]
  pull_request:

permissions:
  contents: read

jobs:
  impact-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Impact Source References V158
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-impact-references.js
          node scripts/validate-sana-impact-references-v158.mjs
          grep -Fq "const VERSION='V158'" apps/control-web/public/sana-v3-impact-references.js
          grep -Fq 'LEGACY_REFERENCE_NOT_CAPTURED' apps/control-web/public/sana-v3-impact-references.js
          grep -Fq 'DECLARED_NON_CANONICAL_REFERENCE' apps/control-web/public/sana-v3-impact-references.js
          grep -Fq 'HUMAN_DECLARED_SOURCE_REGISTRY_REFERENCE' apps/control-web/public/sana-v3-impact-references.js
          grep -Fq 'CROSS_SCOPE_REFERENCE' apps/control-web/public/sana-v3-impact-references.js
          grep -Fq 'FORWARD_REFERENCE' apps/control-web/public/sana-v3-impact-references.js
          grep -Fq 'PROVENANCE_LABEL ≠ SOURCE_REGISTRY_REFERENCE' apps/control-web/public/sana-v3-impact-references.js
          grep -Fq 'SOURCE_REGISTRY_REFERENCE ≠ EXTERNAL_VERIFICATION' apps/control-web/public/sana-v3-impact-references.js
          grep -Fq 'REFERENCE ≠ CERTIFICATION ≠ IMPACT_VERIFICATION ≠ CREDIT_RISK ≠ ELIGIBILITY ≠ INVESTMENT_SIGNAL' apps/control-web/public/sana-v3-impact-references.js
          ! grep -Eiq 'canonicalMutated[[:space:]]*=[[:space:]]*true|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|impactVerified[[:space:]]*=[[:space:]]*true|certified[[:space:]]*=[[:space:]]*true|creditApproved|eligibilityApproved|investmentApproved|investmentRecommendation' apps/control-web/public/sana-v3-impact-references.js
