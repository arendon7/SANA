name: SANA Demo Due Diligence V52

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-due-diligence-forecast-gaps.js'
      - 'apps/control-web/public/sana-v3-dataroom-forecast-history.js'
      - 'apps/control-web/public/sana-v3-report-snapshot-forecast.js'
      - 'apps/control-web/public/sana-v3-due-diligence-remediation.js'
      - 'apps/control-web/public/sana-v3-dd-next-cut.js'
      - 'apps/control-web/public/sana-v3-dataroom-entry.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'scripts/validate-sana-forecast-history.mjs'
      - '.github/workflows/sana-demo-due-diligence-v52.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-due-diligence-forecast-gaps.js'
      - 'apps/control-web/public/sana-v3-dataroom-forecast-history.js'
      - 'apps/control-web/public/sana-v3-report-snapshot-forecast.js'
      - 'apps/control-web/public/sana-v3-due-diligence-remediation.js'
      - 'apps/control-web/public/sana-v3-dd-next-cut.js'
      - 'apps/control-web/public/sana-v3-dataroom-entry.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'scripts/validate-sana-forecast-history.mjs'
      - '.github/workflows/sana-demo-due-diligence-v52.yml'

permissions:
  contents: read

jobs:
  composed-dd-v52:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate forecast historical semantics
        run: node scripts/validate-sana-forecast-history.mjs
      - name: Validate Forecast is composed before remediation
        shell: bash
        run: |
          set -euo pipefail
          html='apps/control-web/public/sana-v3.html'
          grep -q '/sana-v3-due-diligence-labor-gaps.js.*sana-v3-due-diligence-forecast-gaps.js.*sana-v3-due-diligence-remediation.js.*sana-v3-dd-next-cut.js' "$html"
          grep -q '/sana-v3-dataroom-labor-history.js.*sana-v3-dataroom-forecast-history.js.*sana-v3-dataroom-entry.js' "$html"
      - name: Validate no live fallback or procurement/investment inference
        shell: bash
        run: |
          set -euo pipefail
          hist='apps/control-web/public/sana-v3-dataroom-forecast-history.js'; gaps='apps/control-web/public/sana-v3-due-diligence-forecast-gaps.js'
          ! grep -q '__SANA_FORECAST_LEDGER__' "$hist"
          ! grep -q '__SANA_INVENTORY_LEDGER__' "$hist"
          grep -q 'FORECAST_GAP_OR_PENDING_REVIEW ≠ GAP' "$gaps"
          grep -q 'MISSING_PURCHASE_ORDER ≠ GAP' "$gaps"
          ! grep -Eiq 'creditScore|investmentScore|investmentRecommendation[[:space:]]*=[[:space:]]*true|autoPurchase|autoReplenish' "$hist" "$gaps"
