name: SANA Demo Forecast References

on:
  push:
    branches: [demo/sana-forecast-v139]
  pull_request:

permissions:
  contents: read

jobs:
  forecast-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Forecast References V139
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-forecast-references.js
          node scripts/validate-sana-forecast-references.mjs
          ! grep -Eiq 'canonicalMutated[[:space:]]*=[[:space:]]*true|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|automaticProcurement|purchaseOrderCreated|paymentExecuted|creditApproved|investmentApproved' apps/control-web/public/sana-v3-forecast-references.js
