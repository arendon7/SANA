name: SANA Demo Data Room Executive V173

on:
  push:
    branches: [demo/sana-dataroom-executive-v173]
  pull_request:

permissions:
  contents: read

jobs:
  validate-v173:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check apps/control-web/public/sana-v3-dataroom-executive-v173.js
      - name: V170 regression
        run: node scripts/validate-sana-dataroom-executive-v170.mjs
      - name: V171 regression
        run: node scripts/validate-sana-dataroom-executive-v171.mjs
      - name: V172 regression
        run: node scripts/validate-sana-dataroom-executive-v172.mjs
      - name: V173 claim matrix
        run: node scripts/validate-sana-dataroom-executive-v173.mjs
      - name: V173 read-only surface
        shell: bash
        run: |
          set -euo pipefail
          file=apps/control-web/public/sana-v3-dataroom-executive-v173.html
          test -f "$file"
          grep -Fq 'Claim-to-reference' "$file"
          grep -Fq 'CLAIM STATEMENT ≠ VERIFIED FACT' "$file"
          ! grep -Fqi '<form' "$file"
          ! grep -Fq 'fetch(' "$file"
          ! grep -Fq 'XMLHttpRequest' "$file"
          ! grep -Fq 'localStorage.setItem' "$file"
          ! grep -Fq 'sessionStorage.setItem' "$file"
      - name: Preserve claim authority boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'truthVerificationAuthority:false' apps/control-web/public/sana-v3-dataroom-executive-v173.js
          grep -Fq 'sufficiencyAuthority:false' apps/control-web/public/sana-v3-dataroom-executive-v173.js
          grep -Fq 'decisionAuthority:false' apps/control-web/public/sana-v3-dataroom-executive-v173.js
          grep -Fq 'NO_LLM_CLAIM_GENERATION' apps/control-web/public/sana-v3-dataroom-executive-v173.js
          ! grep -Eiq 'canonicalMutationAvailable[[:space:]]*:[[:space:]]*true|financialMutationAvailable[[:space:]]*:[[:space:]]*true|truthVerificationAuthority[[:space:]]*:[[:space:]]*true|sufficiencyAuthority[[:space:]]*:[[:space:]]*true|decisionAuthority[[:space:]]*:[[:space:]]*true|riskScore[[:space:]]*:|investmentScore[[:space:]]*:|overallScore[[:space:]]*:' apps/control-web/public/sana-v3-dataroom-executive-v173.js
