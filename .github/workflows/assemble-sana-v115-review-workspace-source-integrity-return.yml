name: Assemble SANA v115 Review Workspace Source Integrity Return

on:
  push:
    branches:
      - 'demo/sana-v115-review-workspace-source-integrity-return'
    paths:
      - 'scripts/apply-v115-review-source-integrity-return.py'
      - 'scripts/validate-sana-dataroom-review-workspace-v115.mjs'
      - '.github/workflows/sana-demo-dataroom-review-workspace-v115.yml'
      - '.github/workflows/assemble-sana-v115-review-workspace-source-integrity-return.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-v115-review-workspace-source-integrity-return
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply, assemble and validate V115
        run: |
          python scripts/apply-v115-review-source-integrity-return.py
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          active="const CACHE='sana-v3-demo-shell-v115';"
          if active not in s:
              old="const CACHE='sana-v3-demo-shell-v114';"
              if old not in s: raise SystemExit('active shell v114 not found')
              s=s.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v114';\n}\nconst CACHE='sana-v3-demo-shell-v115';",1)
              p.write_text(s)
          PY
          node scripts/validate-sana-dataroom-review-workspace.mjs
          for v in $(seq 88 115); do node scripts/validate-sana-dataroom-review-workspace-v${v}.mjs; done
      - name: Commit assembled V115
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/control-web/public/sana-v3-dataroom-entry.js apps/control-web/public/sana-v3-sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'demo: assemble review workspace source integrity return v115'
          git push origin HEAD:demo/sana-v115-review-workspace-source-integrity-return
