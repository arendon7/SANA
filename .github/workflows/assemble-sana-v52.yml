name: Assemble SANA v52 Forecast History

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-forecast.js'
      - 'apps/control-web/public/sana-v3-dataroom-forecast-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-forecast-gaps.js'
      - 'scripts/validate-sana-forecast-history.mjs'
      - '.github/workflows/sana-demo-forecast-history.yml'
      - '.github/workflows/sana-demo-due-diligence-v52.yml'
      - '.github/workflows/assemble-sana-v52.yml'

permissions:
  contents: write

jobs:
  assemble-v52:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-functional-auth-v1
          fetch-depth: 0
      - name: Assemble HTML and service worker deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          html_path=Path('apps/control-web/public/sana-v3.html')
          sw_path=Path('apps/control-web/public/sana-v3-sw.js')
          html=html_path.read_text()
          sw=sw_path.read_text()

          html_replacements=[
            ('<script src="/sana-v3-report-snapshot-labor.js"></script><script src="/sana-v3-cycle-closure.js"></script>',
             '<script src="/sana-v3-report-snapshot-labor.js"></script><script src="/sana-v3-report-snapshot-forecast.js"></script><script src="/sana-v3-cycle-closure.js"></script>'),
            ('<script src="/sana-v3-due-diligence-labor-gaps.js"></script><script src="/sana-v3-due-diligence-remediation.js"></script>',
             '<script src="/sana-v3-due-diligence-labor-gaps.js"></script><script src="/sana-v3-due-diligence-forecast-gaps.js"></script><script src="/sana-v3-due-diligence-remediation.js"></script>'),
            ('<script src="/sana-v3-dataroom-labor-history.js"></script><script src="/sana-v3-dataroom-entry.js"></script>',
             '<script src="/sana-v3-dataroom-labor-history.js"></script><script src="/sana-v3-dataroom-forecast-history.js"></script><script src="/sana-v3-dataroom-entry.js"></script>')
          ]
          for old,new in html_replacements:
              if html.count(old)!=1:
                  raise SystemExit(f'HTML anchor count for {old[:80]!r}: {html.count(old)}')
              html=html.replace(old,new,1)

          old_cache="const CACHE='sana-v3-demo-shell-v51';"
          new_cache="if(false){\nconst CACHE='sana-v3-demo-shell-v51';\n}\nconst CACHE='sana-v3-demo-shell-v52';"
          if sw.count(old_cache)!=1:
              raise SystemExit(f'SW active v51 anchor count: {sw.count(old_cache)}')
          sw=sw.replace(old_cache,new_cache,1)

          sw_replacements=[
            ("'/sana-v3-report-snapshot-labor.js','/sana-v3-cycle-closure.js'",
             "'/sana-v3-report-snapshot-labor.js','/sana-v3-report-snapshot-forecast.js','/sana-v3-cycle-closure.js'"),
            ("'/sana-v3-due-diligence-labor-gaps.js','/sana-v3-due-diligence-remediation.js'",
             "'/sana-v3-due-diligence-labor-gaps.js','/sana-v3-due-diligence-forecast-gaps.js','/sana-v3-due-diligence-remediation.js'"),
            ("'/sana-v3-dataroom-labor-history.js','/sana-v3-dataroom-entry.js'",
             "'/sana-v3-dataroom-labor-history.js','/sana-v3-dataroom-forecast-history.js','/sana-v3-dataroom-entry.js'")
          ]
          for old,new in sw_replacements:
              if sw.count(old)!=1:
                  raise SystemExit(f'SW anchor count for {old}: {sw.count(old)}')
              sw=sw.replace(old,new,1)

          html_path.write_text(html)
          sw_path.write_text(sw)
          PY
          grep -q '/sana-v3-report-snapshot-labor.js.*sana-v3-report-snapshot-forecast.js.*sana-v3-cycle-closure.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-due-diligence-labor-gaps.js.*sana-v3-due-diligence-forecast-gaps.js.*sana-v3-due-diligence-remediation.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-dataroom-labor-history.js.*sana-v3-dataroom-forecast-history.js.*sana-v3-dataroom-entry.js' apps/control-web/public/sana-v3.html
          grep -q "^const CACHE='sana-v3-demo-shell-v52';" apps/control-web/public/sana-v3-sw.js
      - name: Commit assembled v52
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3.html apps/control-web/public/sana-v3-sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'build(demo): assemble forecast history shell v52'
          git push origin HEAD:demo/sana-functional-auth-v1
