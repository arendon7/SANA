name: SANA Demo Data Room Executive V177

on:
  push:
    branches: [demo/sana-dataroom-executive-v177]
  pull_request:

permissions:
  contents: read

jobs:
  validate-v177:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax source contract
        run: node --check apps/control-web/public/sana-v3-dataroom-claim-evidence-sufficiency-v177.js
      - name: Syntax executive adapter
        run: node --check apps/control-web/public/sana-v3-dataroom-executive-v177.js
      - name: V170 regression
        run: node scripts/validate-sana-dataroom-executive-v170.mjs
      - name: V171 regression
        run: node scripts/validate-sana-dataroom-executive-v171.mjs
      - name: V172 regression
        run: node scripts/validate-sana-dataroom-executive-v172.mjs
      - name: V173 regression
        run: node scripts/validate-sana-dataroom-executive-v173.mjs
      - name: V174 regression
        run: node scripts/validate-sana-dataroom-executive-v174.mjs
      - name: V175 regression
        run: node scripts/validate-sana-dataroom-executive-v175.mjs
      - name: V176 regression
        run: node scripts/validate-sana-dataroom-executive-v176.mjs
      - name: V177 evidence sufficiency adversarial validation
        run: node scripts/validate-sana-dataroom-executive-v177.mjs
      - name: V177 read-only surface
        shell: bash
        run: |
          set -euo pipefail
          file=apps/control-web/public/sana-v3-dataroom-executive-v177.html
          test -f "$file"
          grep -Fq 'Evidence sufficiency review' "$file"
          grep -Fq 'SUFFICIENCY REVIEW REFERENCE ≠ CLAIM TRUTH' "$file"
          grep -Fq 'SUFFICIENT FOR DECLARED SCOPE ≠ UNIVERSALLY SUFFICIENT EVIDENCE' "$file"
          grep -Fq 'ADDITIONAL EVIDENCE REQUIRED ≠ NEGATIVE PROJECT CONCLUSION' "$file"
          ! grep -Fqi '<form' "$file"
          ! grep -Fq 'fetch(' "$file"
          ! grep -Fq 'XMLHttpRequest' "$file"
          ! grep -Fq 'localStorage.setItem' "$file"
          ! grep -Fq 'sessionStorage.setItem' "$file"
      - name: Preserve V177 source-contract boundary
        shell: bash
        run: |
          set -euo pipefail
          source_file=apps/control-web/public/sana-v3-dataroom-claim-evidence-sufficiency-v177.js
          grep -Fq 'SANA_DATAROOM_CLAIM_EVIDENCE_SUFFICIENCY_REVIEW_V1' "$source_file"
          grep -Fq 'SUFFICIENT_FOR_DECLARED_REVIEW_SCOPE_REFERENCE_ONLY' "$source_file"
          grep -Fq 'ADDITIONAL_EVIDENCE_REQUIRED_REFERENCE_ONLY' "$source_file"
          grep -Fq 'EVIDENCE_SUFFICIENCY_REVIEW_STATE_NOT_ALLOWED' "$source_file"
          grep -Fq 'ZERO_BASELINE_RECORDS' "$source_file"
          grep -Fq 'evidentiarySufficiencyAuthority:false' "$source_file"
          grep -Fq 'financingApprovalAuthority:false' "$source_file"
          ! grep -Eiq "['\"](VERIFIED|APPROVED|ELIGIBLE|INVESTABLE)['\"]" "$source_file"
          ! grep -Fq 'fetch(' "$source_file"
          ! grep -Fq 'XMLHttpRequest' "$source_file"
          ! grep -Fq 'localStorage.setItem' "$source_file"
          ! grep -Fq 'sessionStorage.setItem' "$source_file"
      - name: Preserve V177 authority and exact-link boundaries
        shell: bash
        run: |
          set -euo pipefail
          js=apps/control-web/public/sana-v3-dataroom-executive-v177.js
          grep -Fq 'CLAIM_EVIDENCE_SUFFICIENCY_EXACT_V1' "$js"
          grep -Fq 'EXACT_CLAIM_ID' "$js"
          grep -Fq 'EXACT_ENVELOPE_ID' "$js"
          grep -Fq 'DECLARED_LOCATORS_MUST_BE_SUBSET' "$js"
          grep -Fq 'DECLARED_LOT_MUST_EQUAL_SELECTED_LOT' "$js"
          grep -Fq 'ALL_EXACT_CLAIM_CANDIDATES_MUST_USE_ONE_STATE' "$js"
          grep -Fq 'CONFLICT_FAILS_CLOSED' "$js"
          grep -Fq 'NO_HEURISTIC_LINKING' "$js"
          grep -Fq 'evidenceSufficiencyReviewAuthority:false' "$js"
          grep -Fq 'evidentiarySufficiencyAuthority:false' "$js"
          grep -Fq 'claimTruthAuthority:false' "$js"
          grep -Fq 'reviewerIdentityAuthority:false' "$js"
          grep -Fq 'reviewerQualificationAuthority:false' "$js"
          grep -Fq 'reviewerIndependenceAuthority:false' "$js"
          grep -Fq 'dueDiligenceApprovalAuthority:false' "$js"
          grep -Fq 'eligibilityAuthority:false' "$js"
          grep -Fq 'financingApprovalAuthority:false' "$js"
          grep -Fq 'decisionAuthority:false' "$js"
          ! grep -Eiq 'canonicalMutationAvailable[[:space:]]*:[[:space:]]*true|financialMutationAvailable[[:space:]]*:[[:space:]]*true|evidentiarySufficiencyAuthority[[:space:]]*:[[:space:]]*true|claimTruthAuthority[[:space:]]*:[[:space:]]*true|dueDiligenceApprovalAuthority[[:space:]]*:[[:space:]]*true|eligibilityAuthority[[:space:]]*:[[:space:]]*true|financingApprovalAuthority[[:space:]]*:[[:space:]]*true|decisionAuthority[[:space:]]*:[[:space:]]*true|riskScore[[:space:]]*:|creditScore[[:space:]]*:|investmentScore[[:space:]]*:|projectScore[[:space:]]*:|overallScore[[:space:]]*:' "$js"