name: SANA Demo Health Ledger V2

on:
  push:
    branches: [demo/sana-functional-auth-v1, demo/sana-health-v2-v121, demo/sana-health-v2-v122, demo/sana-health-v2-v123, demo/sana-health-v2-v124, demo/sana-health-v2-v125, demo/sana-health-v2-v126, demo/sana-health-v2-v127]
    paths:
      - 'apps/control-web/public/sana-v3-health-ledger.js'
      - 'apps/control-web/public/sana-v3-report-snapshot-sync.js'
      - 'apps/control-web/public/sana-v3-report-snapshot-health-lifecycle.js'
      - 'apps/control-web/public/sana-v3-dataroom-health-history.js'
      - 'apps/control-web/public/sana-v3-dataroom-health-lifecycle.js'
      - 'apps/control-web/public/sana-v3-cycle-health-provenance.js'
      - 'apps/control-web/public/sana-v3-cycle-health-lifecycle.js'
      - 'apps/control-web/public/sana-v3-due-diligence-health-gaps.js'
      - 'apps/control-web/public/sana-v3-due-diligence-health-lifecycle-gaps.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-health-ledger.mjs'
      - 'scripts/validate-sana-health-ledger-v2.mjs'
      - 'scripts/validate-sana-health-v2-provenance.mjs'
      - 'scripts/validate-sana-health-gaps.mjs'
      - 'scripts/validate-sana-health-references.mjs'
      - 'scripts/validate-sana-health-reference-provenance.mjs'
      - 'scripts/validate-sana-health-case-lifecycle.mjs'
      - 'scripts/validate-sana-health-lifecycle-provenance.mjs'
      - '.github/workflows/sana-demo-health-ledger-v2.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-health-ledger.js'
      - 'apps/control-web/public/sana-v3-report-snapshot-sync.js'
      - 'apps/control-web/public/sana-v3-report-snapshot-health-lifecycle.js'
      - 'apps/control-web/public/sana-v3-dataroom-health-history.js'
      - 'apps/control-web/public/sana-v3-dataroom-health-lifecycle.js'
      - 'apps/control-web/public/sana-v3-cycle-health-provenance.js'
      - 'apps/control-web/public/sana-v3-cycle-health-lifecycle.js'
      - 'apps/control-web/public/sana-v3-due-diligence-health-gaps.js'
      - 'apps/control-web/public/sana-v3-due-diligence-health-lifecycle-gaps.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-health-ledger.mjs'
      - 'scripts/validate-sana-health-ledger-v2.mjs'
      - 'scripts/validate-sana-health-v2-provenance.mjs'
      - 'scripts/validate-sana-health-gaps.mjs'
      - 'scripts/validate-sana-health-references.mjs'
      - 'scripts/validate-sana-health-reference-provenance.mjs'
      - 'scripts/validate-sana-health-case-lifecycle.mjs'
      - 'scripts/validate-sana-health-lifecycle-provenance.mjs'
      - '.github/workflows/sana-demo-health-ledger-v2.yml'

permissions:
  contents: read

jobs:
  phytosanitary-chain-v2-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and V1 compatibility
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-health-ledger.js
          node --check apps/control-web/public/sana-v3-report-snapshot-sync.js
          node --check apps/control-web/public/sana-v3-report-snapshot-health-lifecycle.js
          node --check apps/control-web/public/sana-v3-dataroom-health-history.js
          node --check apps/control-web/public/sana-v3-dataroom-health-lifecycle.js
          node --check apps/control-web/public/sana-v3-cycle-health-provenance.js
          node --check apps/control-web/public/sana-v3-cycle-health-lifecycle.js
          node --check apps/control-web/public/sana-v3-due-diligence-health-gaps.js
          node --check apps/control-web/public/sana-v3-due-diligence-health-lifecycle-gaps.js
          node --check apps/control-web/public/sana-v3-sw.js
          node scripts/validate-sana-health-ledger.mjs
          node scripts/validate-sana-health-snapshot.mjs
          node scripts/validate-sana-cycle-health.mjs
          node scripts/validate-sana-health-gaps.mjs
      - name: Validate V2 semantic chain
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-sana-health-ledger-v2.mjs
          ledger='apps/control-web/public/sana-v3-health-ledger.js'
          grep -q "SANA_PHYTOSANITARY_CHAIN_V2" "$ledger"
          grep -q "ACTIVITY_LINK_EVENT ≠ ACTION" "$ledger"
          grep -q "FOLLOW_UP ≠ RESULT" "$ledger"
          grep -q "RESULT ≠ CAUSAL_ATTRIBUTION" "$ledger"
          grep -q "EMBEDDED_V1_RELATION ≠ V2_STAGE" "$ledger"
          grep -q "chainCoverage" "$ledger"
          ! grep -q 'storage.records.push' "$ledger"
      - name: Validate V2 predecessor references
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-sana-health-references.mjs
          ledger='apps/control-web/public/sana-v3-health-ledger.js'
          grep -q 'PREDECESSOR_KIND' "$ledger"
          grep -q 'CASE_MEMBERSHIP ≠ PREDECESSOR_REFERENCE' "$ledger"
          grep -q 'REFERENCE ≠ CAUSALITY' "$ledger"
          grep -q 'MISSING_REFERENCE' "$ledger"
          grep -q 'KIND_MISMATCH' "$ledger"
          grep -q 'CROSS_CASE_REFERENCE' "$ledger"
          grep -q 'FORWARD_REFERENCE' "$ledger"
          grep -q 'LEGACY_NOT_CAPTURED' "$ledger"
      - name: Validate V2 human case lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-sana-health-case-lifecycle.mjs
          ledger='apps/control-web/public/sana-v3-health-ledger.js'
          grep -q "CASE_CLOSE:'RESULT'" "$ledger"
          grep -q 'RESULT ≠ CASE_CLOSURE' "$ledger"
          grep -q 'CASE_CLOSED_HUMAN ≠ CONDITION_RESOLVED' "$ledger"
          grep -q 'CASE_CLOSURE ≠ TREATMENT_EFFICACY' "$ledger"
          grep -q 'CLOSED_HUMAN' "$ledger"
      - name: Validate V2 snapshot history cycle and DD provenance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-sana-health-v2-provenance.mjs
          node scripts/validate-sana-health-reference-provenance.mjs
          sync='apps/control-web/public/sana-v3-report-snapshot-sync.js'
          history='apps/control-web/public/sana-v3-dataroom-health-history.js'
          cycle='apps/control-web/public/sana-v3-cycle-health-provenance.js'
          gaps='apps/control-web/public/sana-v3-due-diligence-health-gaps.js'
          grep -q 'ADDITIVE_V2 · PHYTOSANITARY_CHAIN' "$sync"
          grep -q 'ADDITIVE_V2 · EXPLICIT_PREDECESSOR_REFERENCES' "$sync"
          grep -q 'NO_RETROACTIVE_REFERENCE_FILL' "$sync"
          grep -q 'referenceCoverage' "$history"
          grep -q 'REFERENCE ≠ CAUSALITY' "$history"
          grep -q 'referenceCoverage' "$cycle"
          grep -q 'REFERENCE ≠ CAUSALITY' "$cycle"
          grep -q 'referenceState' "$gaps"
          grep -q 'predecessor-reference' "$gaps"
          grep -q 'REFERENCE ≠ CAUSALITY' "$gaps"
          grep -q 'V1_EMBEDDED ≠ V2_STAGE' "$history"
          grep -q 'ACTIVITY_LINK ≠ EXECUTION' "$cycle"
          grep -q 'FOLLOW_UP ≠ RESULT' "$cycle"
          grep -q 'chainCoverage' "$gaps"
          grep -q 'V1_EMBEDDED ≠ V2_STAGE' "$gaps"
          grep -q 'PRESENCE_OR_TREATMENT ≠ GAP' "$gaps"
          ! grep -q '__SANA_PHYTOSANITARY_LEDGER__' "$history"
          ! grep -q '__SANA_PHYTOSANITARY_LEDGER__' "$gaps"
          ! grep -q 'storage\.' "$history"
          ! grep -q 'storage\.' "$gaps"
          ! grep -q 'completeness=' "$cycle"
          ! grep -q 'readyForArchive=' "$cycle"
      - name: Validate V2 lifecycle historical provenance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-sana-health-lifecycle-provenance.mjs
          snapshot='apps/control-web/public/sana-v3-report-snapshot-health-lifecycle.js'
          history='apps/control-web/public/sana-v3-dataroom-health-lifecycle.js'
          cycle='apps/control-web/public/sana-v3-cycle-health-lifecycle.js'
          gaps='apps/control-web/public/sana-v3-due-diligence-health-lifecycle-gaps.js'
          grep -q 'ADDITIVE_V2 · HUMAN_CASE_LIFECYCLE' "$snapshot"
          grep -q 'NO_RETROACTIVE_CLOSURE_FILL' "$snapshot"
          grep -q 'CASE_STATE_CHANGE ≠ CONDITION_CHANGE' "$history"
          grep -q 'CASE_CLOSURE ≠ CYCLE_GATE' "$cycle"
          grep -q 'OPEN_CASE ≠ GAP' "$gaps"
          grep -q 'CASE_CLOSED_HUMAN ≠ CONDITION_RESOLVED' "$gaps"
          grep -q 'CASE_CLOSURE ≠ TREATMENT_EFFICACY' "$gaps"
          ! grep -q '__SANA_PHYTOSANITARY_LEDGER__' "$history"
          ! grep -q '__SANA_PHYTOSANITARY_LEDGER__' "$gaps"
          ! grep -q 'storage\.' "$history"
          ! grep -q 'storage\.' "$gaps"
          ! grep -q 'completeness=' "$cycle"
          ! grep -q 'readyForArchive=' "$cycle"
      - name: Validate V127 assembly and offline shell
        shell: bash
        run: |
          set -euo pipefail
          html='apps/control-web/public/sana-v3.html'; sw='apps/control-web/public/sana-v3-sw.js'
          grep -q '/sana-v3-health-ledger.js.*sana-v3-report-snapshot-health-lifecycle.js.*sana-v3-circularity-ledger.js' "$html"
          grep -q '/sana-v3-cycle-health-provenance.js.*sana-v3-cycle-health-lifecycle.js.*sana-v3-cycle-circularity-provenance.js' "$html"
          grep -q '/sana-v3-due-diligence-health-gaps.js.*sana-v3-due-diligence-health-lifecycle-gaps.js.*sana-v3-due-diligence-nutrition-gaps.js' "$html"
          grep -q '/sana-v3-dataroom-health-history.js.*sana-v3-dataroom-health-lifecycle.js.*sana-v3-dataroom-nutrition-history.js' "$html"
          grep -q "const CACHE='sana-v3-demo-shell-v126'" "$sw"
          grep -q "const CACHE='sana-v3-demo-shell-v127'" "$sw"
          grep -q "'/sana-v3-report-snapshot-health-lifecycle.js'" "$sw"
          grep -q "'/sana-v3-dataroom-health-lifecycle.js'" "$sw"
          grep -q "'/sana-v3-cycle-health-lifecycle.js'" "$sw"
          grep -q "'/sana-v3-due-diligence-health-lifecycle-gaps.js'" "$sw"
      - name: Assert no production authority
        shell: bash
        run: |
          set -euo pipefail
          files='apps/control-web/public/sana-v3-health-ledger.js apps/control-web/public/sana-v3-report-snapshot-sync.js apps/control-web/public/sana-v3-report-snapshot-health-lifecycle.js apps/control-web/public/sana-v3-dataroom-health-history.js apps/control-web/public/sana-v3-dataroom-health-lifecycle.js apps/control-web/public/sana-v3-cycle-health-provenance.js apps/control-web/public/sana-v3-cycle-health-lifecycle.js apps/control-web/public/sana-v3-due-diligence-health-gaps.js apps/control-web/public/sana-v3-due-diligence-health-lifecycle-gaps.js'
          ! grep -Eiq 'fetch\(|XMLHttpRequest|WebSocket|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|canonicalMutated[[:space:]]*=[[:space:]]*true' $files
          ! grep -Eiq 'verifiedExternal[[:space:]]*=[[:space:]]*true|certified[[:space:]]*=[[:space:]]*true|icaApproved[[:space:]]*=[[:space:]]*true|creditApproved|investmentApproved' $files
