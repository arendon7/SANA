name: Assemble SANA v97 Review Workspace Stage Multiplicity

on:
  push:
    branches: [demo/sana-v97-review-workspace-stage-multiplicity]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-workspace.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'scripts/validate-sana-dataroom-review-workspace-v97.mjs'
      - '.github/workflows/assemble-sana-v97-review-workspace-stage-multiplicity.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: demo/sana-v97-review-workspace-stage-multiplicity}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply deterministic V97 stage-multiplicity patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-dataroom-review-workspace.js')
          s=p.read_text()
          if "const STAGE_MULTIPLICITY_BASELINE='REVIEW WORKSPACE V97';" not in s:
              old="const SOURCE_SCHEMA_INTEGRITY_BASELINE='REVIEW WORKSPACE V96';"
              assert old in s
              s=s.replace(old,old+"\nconst STAGE_MULTIPLICITY_BASELINE='REVIEW WORKSPACE V97';",1)
              old='SCHEMA_BLOCK ≠ SOURCE_MUTATION · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              new='SCHEMA_BLOCK ≠ SOURCE_MUTATION · MULTIPLE_STAGE_REFERENCES ≠ MULTIPLE_REVIEWS ≠ REVIEW_CONFLICT · AMBIGUOUS_STAGE ≠ MISSING_STAGE · UNIQUE_STAGE_PROJECTION ≠ SOURCE_VERIFICATION · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              assert old in s
              s=s.replace(old,new,1)
              old="const byStage=new Map(g.entries.map(e=>[e.stage,e]));const stages=STAGES.map(([stage,label],order)=>({stage,label,order,entry:byStage.get(stage)||null,present:byStage.has(stage),sourceState:sources[order]?.state||'UNAVAILABLE',sourceSchema:sources[order]?.schema||'',sourceSchemaState:sources[order]?.schemaState||'UNKNOWN',expectedSchema:sources[order]?.expectedSchema||''}));const presentStages=stages.filter(x=>x.present).map(x=>x.stage),indeterminateStages=stages.filter(x=>!x.present&&(x.sourceState!=='AVAILABLE'||x.sourceSchemaState!=='MATCH')).map(x=>x.stage),missingStages=stages.filter(x=>!x.present&&x.sourceState==='AVAILABLE'&&x.sourceSchemaState==='MATCH').map(x=>x.stage),missingInternalReferences=g.entries.flatMap(e=>e.missingInternalReferences),stageCount=presentStages.length;return {...g,stages,presentStages,indeterminateStages,missingStages,missingInternalReferences,stageCount,stageCompletenessLabel:`${stageCount}/${STAGES.length} PRESENT`,integrity:'PRESENCE_ONLY ≠ COMPLETENESS ≠ DUE_DILIGENCE_STATUS'}});"
              new="const stages=STAGES.map(([stage,label],order)=>{const candidates=g.entries.filter(e=>e.stage===stage),ambiguous=candidates.length>1;return {stage,label,order,entry:candidates.length===1?candidates[0]:null,present:candidates.length===1,referenced:candidates.length>0,ambiguous,candidateCount:candidates.length,candidateIds:candidates.map(e=>e.id),sourceState:sources[order]?.state||'UNAVAILABLE',sourceSchema:sources[order]?.schema||'',sourceSchemaState:sources[order]?.schemaState||'UNKNOWN',expectedSchema:sources[order]?.expectedSchema||''}});const presentStages=stages.filter(x=>x.present).map(x=>x.stage),ambiguousStages=stages.filter(x=>x.ambiguous).map(x=>x.stage),indeterminateStages=stages.filter(x=>!x.present&&(x.ambiguous||x.sourceState!=='AVAILABLE'||x.sourceSchemaState!=='MATCH')).map(x=>x.stage),missingStages=stages.filter(x=>!x.referenced&&x.sourceState==='AVAILABLE'&&x.sourceSchemaState==='MATCH').map(x=>x.stage),missingInternalReferences=g.entries.flatMap(e=>e.missingInternalReferences),stageCount=presentStages.length;return {...g,stages,presentStages,ambiguousStages,indeterminateStages,missingStages,missingInternalReferences,stageCount,stageCompletenessLabel:`${stageCount}/${STAGES.length} PRESENT`,integrity:'PRESENCE_ONLY ≠ COMPLETENESS ≠ DUE_DILIGENCE_STATUS · AMBIGUOUS_STAGE ≠ MISSING_STAGE'}});"
              assert old in s
              s=s.replace(old,new,1)
              old="missingSourceSchemas:sources.filter(x=>x.schemaState==='MISSING').length,riskScores:0"
              new="missingSourceSchemas:sources.filter(x=>x.schemaState==='MISSING').length,ambiguousStageReferences:chains.reduce((n,c)=>n+c.ambiguousStages.length,0),duplicateStageReferences:chains.reduce((n,c)=>n+c.stages.reduce((m,x)=>m+Math.max(0,x.candidateCount-1),0),0),riskScores:0"
              assert old in s
              s=s.replace(old,new,1)
              old="function selectedEntry(chains,f){if(!f.stage||f.stage==='ALL')return null;const c=chains.find(x=>(f.capital==='ALL'||x.capitalCaseRef===f.capital)&&(f.lot==='ALL'||x.lot===f.lot)&&x.entries.some(e=>e.stage===f.stage));return c?.entries.find(e=>e.stage===f.stage)||null}"
              new="function selectedEntry(chains,f){if(!f.stage||f.stage==='ALL')return null;const c=chains.find(x=>(f.capital==='ALL'||x.capitalCaseRef===f.capital)&&(f.lot==='ALL'||x.lot===f.lot)&&x.stages.some(s=>s.stage===f.stage&&s.referenced));return c?.stages.find(s=>s.stage===f.stage)?.entry||null}"
              assert old in s
              s=s.replace(old,new,1)
              old="const entry=chain&&f.stage&&f.stage!=='ALL'?chain.entries.find(e=>e.stage===f.stage)||null:null;if(f.stage&&f.stage!=='ALL'&&!entry)issue('rwStage',f.stage,'Etapa del deep-link no resuelve dentro del circuito actual');"
              new="const stageMeta=chain&&f.stage&&f.stage!=='ALL'?chain.stages.find(s=>s.stage===f.stage)||null:null,entry=stageMeta?.entry||null;if(f.stage&&f.stage!=='ALL'&&!entry)issue('rwStage',f.stage,stageMeta?.ambiguous?'Etapa del deep-link tiene múltiples referencias y no resuelve de forma única':'Etapa del deep-link no resuelve dentro del circuito actual');"
              assert old in s
              s=s.replace(old,new,1)
              old="function stageCard(s,i,c,f){if(!s.present){const unavailable=s.sourceState!=='AVAILABLE',schemaUnresolved=s.sourceState==='AVAILABLE'&&s.sourceSchemaState!=='MATCH';return `<div class=\"review-stage is-missing ${unavailable?'is-source-unavailable':schemaUnresolved?'is-schema-unresolved':''}\"><span class=\"review-stage-index\">${i+1}</span><strong>${esc(s.label)}</strong><small>${unavailable?'Fuente no disponible':schemaUnresolved?'Schema no compatible':'No referenciado'}</small><em>${unavailable||schemaUnresolved?'≠ etapa ausente / gap':'≠ gap / failure'}</em></div>`}const e=s.entry,selected=f.stage===e.stage&&f.capital===c.capitalCaseRef&&f.lot===c.lot;"
              new="function stageCard(s,i,c,f){if(s.ambiguous)return `<div class=\"review-stage is-ambiguous\"><span class=\"review-stage-index\">${i+1}</span><strong>${esc(s.label)}</strong><small>${s.candidateCount} referencias de etapa</small><div class=\"review-stage-candidates\">${s.candidateIds.map(id=>`<code>${esc(id||'—')}</code>`).join('')}</div><em>No se selecciona una referencia arbitrariamente</em></div>`;if(!s.present){const unavailable=s.sourceState!=='AVAILABLE',schemaUnresolved=s.sourceState==='AVAILABLE'&&s.sourceSchemaState!=='MATCH';return `<div class=\"review-stage is-missing ${unavailable?'is-source-unavailable':schemaUnresolved?'is-schema-unresolved':''}\"><span class=\"review-stage-index\">${i+1}</span><strong>${esc(s.label)}</strong><small>${unavailable?'Fuente no disponible':schemaUnresolved?'Schema no compatible':'No referenciado'}</small><em>${unavailable||schemaUnresolved?'≠ etapa ausente / gap':'≠ gap / failure'}</em></div>`}const e=s.entry,selected=f.stage===e.stage&&f.capital===c.capitalCaseRef&&f.lot===c.lot;"
              assert old in s
              s=s.replace(old,new,1)
              old="function chainCard(c,f){const all=c.stageCount===STAGES.length,statusText=all?'6/6 REFERENCIADAS':c.indeterminateStages.length?`${c.indeterminateStages.length} INDETERMINADA(S) · ${c.missingStages.length} SIN REF`:`${c.missingStages.length} SIN REF`;"
              new="function chainCard(c,f){const all=c.stageCount===STAGES.length,statusText=all?'6/6 REFERENCIADAS':c.ambiguousStages.length?`${c.ambiguousStages.length} AMBIGUA(S) · ${c.missingStages.length} SIN REF`:c.indeterminateStages.length?`${c.indeterminateStages.length} INDETERMINADA(S) · ${c.missingStages.length} SIN REF`:`${c.missingStages.length} SIN REF`;"
              assert old in s
              s=s.replace(old,new,1)
              assert 'DATA ROOM · REVIEW WORKSPACE V96' in s
              s=s.replace('DATA ROOM · REVIEW WORKSPACE V96','DATA ROOM · REVIEW WORKSPACE V97',1)
              assert 'Circuito de revisión, con integridad de fuente, schema y contexto' in s
              s=s.replace('Circuito de revisión, con integridad de fuente, schema y contexto','Circuito de revisión, sin selección ambigua de etapa',1)
              p.write_text(s)
          css=Path('apps/control-web/public/sana-v3-review-workspace.css')
          c=css.read_text()
          if '.review-stage.is-ambiguous{' not in c:
              c+='\n.review-stage.is-ambiguous{background:#faf6ed;border-style:double;border-color:#d9c9a8;color:var(--ink2)}.review-stage-candidates{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}.review-stage-candidates code{font-size:7px;padding:2px 4px;border-radius:5px;background:#fff;white-space:normal;overflow-wrap:anywhere}\n'
              css.write_text(c)
          sw=Path('apps/control-web/public/sana-v3-sw.js')
          w=sw.read_text()
          if "const CACHE='sana-v3-demo-shell-v97';" not in w:
              old="const CACHE='sana-v3-demo-shell-v96';"
              assert old in w
              w=w.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v96';\n}\nconst CACHE='sana-v3-demo-shell-v97';",1)
              sw.write_text(w)
          PY
      - name: Validate V87–V97
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          node scripts/validate-sana-dataroom-review-workspace-v88.mjs
          node scripts/validate-sana-dataroom-review-workspace-v89.mjs
          node scripts/validate-sana-dataroom-review-workspace-v90.mjs
          node scripts/validate-sana-dataroom-review-workspace-v91.mjs
          node scripts/validate-sana-dataroom-review-workspace-v92.mjs
          node scripts/validate-sana-dataroom-review-workspace-v93.mjs
          node scripts/validate-sana-dataroom-review-workspace-v94.mjs
          node scripts/validate-sana-dataroom-review-workspace-v95.mjs
          node scripts/validate-sana-dataroom-review-workspace-v96.mjs
          node scripts/validate-sana-dataroom-review-workspace-v97.mjs
      - name: Commit assembled V97
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-dataroom-review-workspace.js apps/control-web/public/sana-v3-review-workspace.css apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble Data Room review stage multiplicity v97'
          git push origin HEAD:demo/sana-v97-review-workspace-stage-multiplicity
