name: SANA Demo Data Room Executive V175

on:
  push:
    branches: [demo/sana-dataroom-executive-v175]
  pull_request:

permissions:
  contents: read

jobs:
  validate-v175:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax source contract
        run: node --check apps/control-web/public/sana-v3-dataroom-claim-attestation-v175.js
      - name: Syntax executive adapter
        run: node --check apps/control-web/public/sana-v3-dataroom-executive-v175.js
      - name: V170 regression
        run: node scripts/validate-sana-dataroom-executive-v170.mjs
      - name: V171 regression
        run: node scripts/validate-sana-dataroom-executive-v171.mjs
      - name: V172 regression
        run: node scripts/validate-sana-dataroom-executive-v172.mjs
      - name: V173 regression
        run: node scripts/validate-sana-dataroom-executive-v173.mjs
      - name: V174 regression
        run: node scripts/validate-sana-dataroom-executive-v174.mjs
      - name: V175 exact attestation adversarial validation
        run: node scripts/validate-sana-dataroom-executive-v175.mjs
      - name: V175 read-only surface
        shell: bash
        run: |
          set -euo pipefail
          file=apps/control-web/public/sana-v3-dataroom-executive-v175.html
          test -f "$file"
          grep -Fq 'Exact claim-attestation references' "$file"
          grep -Fq 'ATTESTATION_REFERENCE_ONLY ≠ CLAIM TRUTH' "$file"
          grep -Fq 'CONTRACT AVAILABLE ≠ ATTESTATION EXISTS' "$file"
          ! grep -Fqi '<form' "$file"
          ! grep -Fq 'fetch(' "$file"
          ! grep -Fq 'XMLHttpRequest' "$file"
          ! grep -Fq 'localStorage.setItem' "$file"
          ! grep -Fq 'sessionStorage.setItem' "$file"
      - name: Preserve exact source-contract boundary
        shell: bash
        run: |
          set -euo pipefail
          source_file=apps/control-web/public/sana-v3-dataroom-claim-attestation-v175.js
          grep -Fq "SANA_DATAROOM_CLAIM_ATTESTATION_REFERENCE_V1" "$source_file"
          grep -Fq "ZERO_BASELINE_RECORDS" "$source_file"
          grep -Fq "CLAIM_ENVELOPE_REF_MISMATCH" "$source_file"
          grep -Fq "REFERENCE_ONLY_STATE_REQUIRED" "$source_file"
          grep -Fq "claimTruthAuthority:false" "$source_file"
          grep -Fq "externalVerificationAuthority:false" "$source_file"
          grep -Fq "investmentDecisionAuthority:false" "$source_file"
          ! grep -Fq 'fetch(' "$source_file"
          ! grep -Fq 'XMLHttpRequest' "$source_file"
          ! grep -Fq 'localStorage.setItem' "$source_file"
          ! grep -Fq 'sessionStorage.setItem' "$source_file"
      - name: Preserve V175 authority and linking boundaries
        shell: bash
        run: |
          set -euo pipefail
          js=apps/control-web/public/sana-v3-dataroom-executive-v175.js
          grep -Fq "CLAIM_ATTESTATION_EXACT_V1" "$js"
          grep -Fq "EXACT_CLAIM_ID" "$js"
          grep -Fq "EXACT_ENVELOPE_ID" "$js"
          grep -Fq "DECLARED_LOCATORS_MUST_BE_SUBSET" "$js"
          grep -Fq "DECLARED_LOT_MUST_EQUAL_SELECTED_LOT" "$js"
          grep -Fq "CONFLICT_FAILS_CLOSED" "$js"
          grep -Fq "NO_HEURISTIC_LINKING" "$js"
          grep -Fq "attestationAuthority:false" "$js"
          grep -Fq "claimTruthAuthority:false" "$js"
          grep -Fq "reviewerIdentityAuthority:false" "$js"
          grep -Fq "reviewerQualificationAuthority:false" "$js"
          grep -Fq "externalVerificationAuthority:false" "$js"
          grep -Fq "certificationAuthority:false" "$js"
          grep -Fq "decisionAuthority:false" "$js"
          ! grep -Eiq 'canonicalMutationAvailable[[:space:]]*:[[:space:]]*true|financialMutationAvailable[[:space:]]*:[[:space:]]*true|attestationAuthority[[:space:]]*:[[:space:]]*true|claimTruthAuthority[[:space:]]*:[[:space:]]*true|externalVerificationAuthority[[:space:]]*:[[:space:]]*true|decisionAuthority[[:space:]]*:[[:space:]]*true|riskScore[[:space:]]*:|creditScore[[:space:]]*:|investmentScore[[:space:]]*:|projectScore[[:space:]]*:|overallScore[[:space:]]*:' "$js"