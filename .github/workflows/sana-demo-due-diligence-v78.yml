name: SANA Demo Due Diligence V78

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-review-handoff.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-handoff-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-review-handoff-gaps.js'
      - 'scripts/validate-sana-dataroom-review-handoff-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - '.github/workflows/sana-demo-due-diligence-v78.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-review-handoff.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-handoff-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-review-handoff-gaps.js'
      - 'scripts/validate-sana-dataroom-review-handoff-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'

jobs:
  composed-dd-v78:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate review handoff historical semantics
        run: node scripts/validate-sana-dataroom-review-handoff-history.mjs
      - name: Validate DD order before remediation when assembled
        run: |
          html='apps/control-web/public/sana-v3.html'
          if grep -q '/sana-v3-due-diligence-dataroom-review-handoff-gaps.js' "$html"; then
            grep -q '/sana-v3-due-diligence-dataroom-review-case-gaps.js.*sana-v3-due-diligence-dataroom-review-handoff-gaps.js.*sana-v3-due-diligence-remediation.js' "$html"
          else echo 'v78 staged before assembly; strict DD order deferred.'; fi
      - name: Validate snapshot and history order when assembled
        run: |
          html='apps/control-web/public/sana-v3.html'
          if grep -q '/sana-v3-report-snapshot-dataroom-review-handoff.js' "$html"; then
            grep -q '/sana-v3-report-snapshot-dataroom-review-case.js.*sana-v3-report-snapshot-dataroom-review-handoff.js.*sana-v3-cycle-closure.js' "$html"
            grep -q '/sana-v3-dataroom-review-case-history.js.*sana-v3-dataroom-review-handoff-history.js.*sana-v3-dataroom-entry.js' "$html"
            grep -Eq "^const CACHE='sana-v3-demo-shell-v(7[8-9]|[89][0-9]|[1-9][0-9]{2,})';" apps/control-web/public/sana-v3-sw.js
          else echo 'v78 staged before assembly; strict shell validation deferred.'; fi
      - name: Validate non-decisional boundaries
        run: |
          grep -q 'NO_REVIEW_HANDOFF ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-review-handoff-gaps.js
          grep -q 'REVIEW_LINK ≠ REVIEW_STARTED' apps/control-web/public/sana-v3-due-diligence-dataroom-review-handoff-gaps.js
          grep -q 'REVIEW_HANDOFF_GAP ≠ RISK_SCORE ≠ REVIEW_OUTCOME' apps/control-web/public/sana-v3-due-diligence-dataroom-review-handoff-gaps.js
          grep -q 'LIVE_STATE ≠ SNAPSHOT ≠ HISTORICAL_EVIDENCE' apps/control-web/public/sana-v3-dataroom-review-handoff-history.js
          ! grep -Eq 'fetch\s*\(' apps/control-web/public/sana-v3-report-snapshot-dataroom-review-handoff.js apps/control-web/public/sana-v3-dataroom-review-handoff-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-review-handoff-gaps.js
          ! grep -Eq 'productionExecutionAvailable\s*=\s*true|productionActivationAllowed\s*=\s*true|canonicalMutated\s*=\s*true' apps/control-web/public/sana-v3-report-snapshot-dataroom-review-handoff.js apps/control-web/public/sana-v3-dataroom-review-handoff-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-review-handoff-gaps.js

# v78 freeze certification trigger: shell v78+, snapshot-only Review Handoff provenance, documentary gaps only, no review trigger or authority expansion.
