name: SANA Demo Data Room Review Feedback History

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-review-feedback.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-feedback-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js'
      - 'scripts/validate-sana-dataroom-review-feedback-history.mjs'
      - '.github/workflows/sana-demo-dataroom-review-feedback-history.yml'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-review-feedback.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-feedback-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js'
      - 'scripts/validate-sana-dataroom-review-feedback-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'

jobs:
  review-feedback-history-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and semantic contracts
        run: |
          node --check apps/control-web/public/sana-v3-report-snapshot-dataroom-review-feedback.js
          node --check apps/control-web/public/sana-v3-dataroom-review-feedback-history.js
          node --check apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js
          node scripts/validate-sana-dataroom-review-feedback-history.mjs
      - name: Validate snapshot-only history
        run: |
          grep -q 'SNAPSHOT_DATAROOM_REVIEW_FEEDBACK_ONLY' apps/control-web/public/sana-v3-report-snapshot-dataroom-review-feedback.js
          grep -q 'NO_LIVE_FALLBACK' apps/control-web/public/sana-v3-dataroom-review-feedback-history.js
          grep -q 'LIVE_STATE ≠ SNAPSHOT ≠ HISTORICAL_EVIDENCE' apps/control-web/public/sana-v3-dataroom-review-feedback-history.js
          ! grep -q '__SANA_DATAROOM_REVIEW_FEEDBACK__' apps/control-web/public/sana-v3-dataroom-review-feedback-history.js
          ! grep -Eq '\bstorage\s*(\?\.|\.)' apps/control-web/public/sana-v3-dataroom-review-feedback-history.js
      - name: Validate documentary gaps only
        run: |
          grep -q 'NO_REVIEW_FEEDBACK ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js
          grep -q 'FEEDBACK_OPEN ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js
          grep -q 'FEEDBACK_CLOSED ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js
          grep -q 'MISSING_INTERNAL_REFERENCE = DOCUMENTARY_GAP_ONLY' apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js
          grep -q 'FEEDBACK_GAP ≠ FINDING ≠ REMEDIATION_ITEM ≠ RISK_SCORE ≠ REVIEW_OUTCOME' apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js
      - name: Validate assembly when v80 is present
        run: |
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');const html=fs.readFileSync('apps/control-web/public/sana-v3.html','utf8'),sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');const files=['/sana-v3-report-snapshot-dataroom-review-feedback.js','/sana-v3-due-diligence-dataroom-review-feedback-gaps.js','/sana-v3-dataroom-review-feedback-history.js'];if(!html.includes(files[0])){console.log('v80 staged before assembly; strict shell validation deferred.');process.exit(0)}for(const f of files){assert(html.includes(f),`HTML missing ${f}`);assert(sw.includes(`'${f}'`),`PWA missing ${f}`)}const versions=[...sw.matchAll(/const CACHE='sana-v3-demo-shell-v(\d+)'/g)].map(m=>Number(m[1]));assert(versions.length&&Math.max(...versions)>=80,'shell must be v80 or newer');
          NODE
      - name: Assert review-only history
        run: |
          ! grep -Eq 'fetch\s*\(' apps/control-web/public/sana-v3-report-snapshot-dataroom-review-feedback.js apps/control-web/public/sana-v3-dataroom-review-feedback-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js
          ! grep -Eq 'productionExecutionAvailable\s*=\s*true|productionActivationAllowed\s*=\s*true|canonicalMutated\s*=\s*true' apps/control-web/public/sana-v3-report-snapshot-dataroom-review-feedback.js apps/control-web/public/sana-v3-dataroom-review-feedback-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js

# v80 certification trigger: additive snapshot/history/documentary gaps for Review Feedback; no live fallback or automatic findings/remediation/reopen.
