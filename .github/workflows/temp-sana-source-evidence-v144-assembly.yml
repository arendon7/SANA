name: TEMP SANA Source Evidence V144 Assembly

on:
  push:
    branches: [demo/sana-source-evidence-v144]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-source-evidence-v144
      - name: Assemble v144 shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v144';" not in s:
              old="const CACHE='sana-v3-demo-shell-v143';"
              new="if(false){\nconst CACHE='sana-v3-demo-shell-v143';\n}\nconst CACHE='sana-v3-demo-shell-v144';"
              assert s.count(old)==1, 'expected exactly one active v143 marker'
              s=s.replace(old,new,1)
          anchor="'/sana-v3-source-evidence-references.js',"
          assets="'/sana-v3-source-evidence-references.js','/sana-v3-report-snapshot-source-evidence-references.js','/sana-v3-cycle-source-evidence-references.js','/sana-v3-due-diligence-source-evidence-reference-gaps.js','/sana-v3-dataroom-source-evidence-references.js',"
          if '/sana-v3-report-snapshot-source-evidence-references.js' not in s:
              assert s.count(anchor)==1, 'source evidence reference asset anchor missing/duplicated'
              s=s.replace(anchor,assets,1)
          comment='// v144 propagates Source Evidence reference integrity through content-minimized Snapshot, Data Room, Cycle and Due Diligence without live fallback, weighting, procurement or financial inference.'
          if comment not in s:
              anchor_comment='// v143 validates Source Evidence use/evidence targets without source verification, content authenticity, external fetch, access verification or certification.'
              assert s.count(anchor_comment)==1, 'v143 comment anchor missing/duplicated'
              s=s.replace(anchor_comment,anchor_comment+'\n'+comment,1)
          p.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v144';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v143';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          for a in \
            /sana-v3-report-snapshot-source-evidence-references.js \
            /sana-v3-cycle-source-evidence-references.js \
            /sana-v3-due-diligence-source-evidence-reference-gaps.js \
            /sana-v3-dataroom-source-evidence-references.js; do test "$(grep -o "$a" apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1; done
      - name: Commit assembly if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble source evidence shell v144'
          git push origin HEAD:demo/sana-source-evidence-v144
