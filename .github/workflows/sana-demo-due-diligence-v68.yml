name: SANA Demo Due Diligence V68

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-exchange.js'
      - 'apps/control-web/public/sana-v3-dataroom-exchange-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-exchange-gaps.js'
      - 'scripts/validate-sana-dataroom-exchange-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - '.github/workflows/sana-demo-due-diligence-v68.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-exchange.js'
      - 'apps/control-web/public/sana-v3-dataroom-exchange-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-exchange-gaps.js'
      - 'scripts/validate-sana-dataroom-exchange-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'

jobs:
  composed-dd-v68:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate document exchange historical semantics
        run: node scripts/validate-sana-dataroom-exchange-history.mjs
      - name: Validate DD order before remediation when assembled
        run: |
          html='apps/control-web/public/sana-v3.html'
          if grep -q '/sana-v3-due-diligence-dataroom-exchange-gaps.js' "$html"; then
            grep -q '/sana-v3-due-diligence-dataroom-access-gaps.js.*sana-v3-due-diligence-dataroom-exchange-gaps.js.*sana-v3-due-diligence-remediation.js' "$html"
          else
            echo 'v68 staged before assembly; strict DD order deferred.'
          fi
      - name: Validate snapshot and Data Room order when assembled
        run: |
          html='apps/control-web/public/sana-v3.html'
          if grep -q '/sana-v3-report-snapshot-dataroom-exchange.js' "$html"; then
            grep -q '/sana-v3-report-snapshot-dataroom-access.js.*sana-v3-report-snapshot-dataroom-exchange.js.*sana-v3-cycle-closure.js' "$html"
            grep -q '/sana-v3-dataroom-access-history.js.*sana-v3-dataroom-exchange-history.js.*sana-v3-dataroom-entry.js' "$html"
            grep -q "^const CACHE='sana-v3-demo-shell-v68';" apps/control-web/public/sana-v3-sw.js
          else
            echo 'v68 staged before assembly; strict shell validation deferred.'
          fi
      - name: Validate non-decisional boundaries
        run: |
          grep -q 'NO_DOCUMENT_REQUEST ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-exchange-gaps.js
          grep -q 'REQUEST_OPEN ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-exchange-gaps.js
          grep -q 'DOCUMENT_PROVIDED_REFERENCE ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-exchange-gaps.js
          grep -q 'REQUEST_CLOSED ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-exchange-gaps.js
          grep -q 'DOCUMENT_EXCHANGE_GAP ≠ MISSING_DD_REQUIREMENT ≠ INVESTMENT_RISK ≠ ELIGIBILITY ≠ INVESTMENT_DECISION' apps/control-web/public/sana-v3-due-diligence-dataroom-exchange-gaps.js
          ! grep -Eq 'productionExecutionAvailable\s*=\s*true|productionActivationAllowed\s*=\s*true|canonicalMutated\s*=\s*true' apps/control-web/public/sana-v3-report-snapshot-dataroom-exchange.js apps/control-web/public/sana-v3-dataroom-exchange-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-exchange-gaps.js
