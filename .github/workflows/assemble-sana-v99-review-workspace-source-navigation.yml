name: Assemble SANA v99 Review Workspace Source Navigation

on:
  push:
    branches: [demo/sana-v99-review-workspace-source-navigation]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-workspace.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'apps/control-web/public/sana-v3-dataroom-review-case.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-handoff.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-feedback.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-response.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-disposition.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-round.js'
      - 'scripts/validate-sana-dataroom-review-workspace-v99.mjs'
      - '.github/workflows/assemble-sana-v99-review-workspace-source-navigation.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: demo/sana-v99-review-workspace-source-navigation}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply deterministic V99 source-navigation patch
        run: |
          python - <<'PY'
          from pathlib import Path
          workspace=Path('apps/control-web/public/sana-v3-dataroom-review-workspace.js')
          s=workspace.read_text()
          if "const SOURCE_NAVIGATION_BASELINE='REVIEW WORKSPACE V99';" not in s:
              old="const SOURCE_PAYLOAD_INTEGRITY_BASELINE='REVIEW WORKSPACE V98';"
              assert old in s
              s=s.replace(old,old+"\nconst SOURCE_NAVIGATION_BASELINE='REVIEW WORKSPACE V99';",1)
              marker="const FOCUS_VALUES=new Set(['ALL','MISSING_STAGE_REFERENCE','MISSING_INTERNAL_REFERENCE']);"
              registry="const SOURCE_PANEL_TARGETS=Object.freeze({CASE:'dataroom-review-case-panel',HANDOFF:'dataroom-review-handoff-panel',FEEDBACK:'dataroom-review-feedback-panel',RESPONSE:'dataroom-review-response-panel',DISPOSITION:'dataroom-review-disposition-panel',ROUND:'dataroom-review-round-panel'});\nfunction sourcePanelTarget(stage){return SOURCE_PANEL_TARGETS[stage]||''}\n"
              assert marker in s
              s=s.replace(marker,registry+marker,1)
              old='PAYLOAD_BLOCK ≠ SOURCE_MUTATION · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              new='PAYLOAD_BLOCK ≠ SOURCE_MUTATION · SOURCE_NAVIGATION ≠ SOURCE_VERIFICATION · PANEL_FOUND ≠ SOURCE_MATCH_VERIFIED · SCROLL_TARGET ≠ REVIEW_DECISION · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              assert old in s
              s=s.replace(old,new,1)
              old='<button type="button" class="btn ghost" data-review-workspace-inspector-close>Cerrar</button>'
              new='<div class="review-inspector-actions"><button type="button" class="btn ghost" data-review-workspace-source-jump="${esc(sourcePanelTarget(e.stage))}" aria-controls="${esc(sourcePanelTarget(e.stage))}">Ir al panel fuente</button><button type="button" class="btn ghost" data-review-workspace-inspector-close>Cerrar</button></div>'
              assert old in s
              s=s.replace(old,new,1)
              old="document.addEventListener('click',e=>{"
              new="document.addEventListener('click',e=>{const sourceJump=e.target.closest('[data-review-workspace-source-jump]');if(sourceJump){const target=document.getElementById(sourceJump.dataset.reviewWorkspaceSourceJump||'');if(target?.scrollIntoView)target.scrollIntoView({behavior:'smooth',block:'start'});return}"
              assert old in s
              s=s.replace(old,new,1)
              old='contextIntegrity,integrity:INTEGRITY'
              new='contextIntegrity,sourcePanelTarget,integrity:INTEGRITY'
              assert old in s
              s=s.replace(old,new,1)
              assert 'DATA ROOM · REVIEW WORKSPACE V98' in s
              s=s.replace('DATA ROOM · REVIEW WORKSPACE V98','DATA ROOM · REVIEW WORKSPACE V99',1)
              assert 'Circuito de revisión, con payload fuente aislado de forma segura' in s
              s=s.replace('Circuito de revisión, con payload fuente aislado de forma segura','Circuito de revisión, navegable hasta sus paneles fuente',1)
              workspace.write_text(s)
          panels={
            'apps/control-web/public/sana-v3-dataroom-review-case.js':('CASE','dataroom-review-case-panel'),
            'apps/control-web/public/sana-v3-dataroom-review-handoff.js':('HANDOFF','dataroom-review-handoff-panel'),
            'apps/control-web/public/sana-v3-dataroom-review-feedback.js':('FEEDBACK','dataroom-review-feedback-panel'),
            'apps/control-web/public/sana-v3-dataroom-review-response.js':('RESPONSE','dataroom-review-response-panel'),
            'apps/control-web/public/sana-v3-dataroom-review-disposition.js':('DISPOSITION','dataroom-review-disposition-panel'),
            'apps/control-web/public/sana-v3-dataroom-review-round.js':('ROUND','dataroom-review-round-panel'),
          }
          for file,(stage,target_id) in panels.items():
              p=Path(file); text=p.read_text()
              if f'id="{target_id}"' in text: continue
              head,sep,tail=text.partition('function panel(){')
              assert sep, file
              needle='return `<section class="card" style="margin-top:14px">'
              assert needle in tail, file
              repl=f'return `<section id="{target_id}" data-review-source-panel="{stage}" class="card" style="margin-top:14px">'
              tail=tail.replace(needle,repl,1)
              p.write_text(head+sep+tail)
          css=Path('apps/control-web/public/sana-v3-review-workspace.css')
          c=css.read_text()
          if '.review-inspector-actions{' not in c:
              c+='\n.review-inspector-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}@media(max-width:620px){.review-inspector-actions{justify-content:flex-start}}\n'
              css.write_text(c)
          sw=Path('apps/control-web/public/sana-v3-sw.js')
          w=sw.read_text()
          if "const CACHE='sana-v3-demo-shell-v99';" not in w:
              old="const CACHE='sana-v3-demo-shell-v98';"
              assert old in w
              w=w.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v98';\n}\nconst CACHE='sana-v3-demo-shell-v99';",1)
              sw.write_text(w)
          PY
      - name: Validate V87–V99
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          node scripts/validate-sana-dataroom-review-workspace-v88.mjs
          node scripts/validate-sana-dataroom-review-workspace-v89.mjs
          node scripts/validate-sana-dataroom-review-workspace-v90.mjs
          node scripts/validate-sana-dataroom-review-workspace-v91.mjs
          node scripts/validate-sana-dataroom-review-workspace-v92.mjs
          node scripts/validate-sana-dataroom-review-workspace-v93.mjs
          node scripts/validate-sana-dataroom-review-workspace-v94.mjs
          node scripts/validate-sana-dataroom-review-workspace-v95.mjs
          node scripts/validate-sana-dataroom-review-workspace-v96.mjs
          node scripts/validate-sana-dataroom-review-workspace-v97.mjs
          node scripts/validate-sana-dataroom-review-workspace-v98.mjs
          node scripts/validate-sana-dataroom-review-workspace-v99.mjs
      - name: Commit assembled V99
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-dataroom-review-workspace.js apps/control-web/public/sana-v3-review-workspace.css apps/control-web/public/sana-v3-dataroom-review-case.js apps/control-web/public/sana-v3-dataroom-review-handoff.js apps/control-web/public/sana-v3-dataroom-review-feedback.js apps/control-web/public/sana-v3-dataroom-review-response.js apps/control-web/public/sana-v3-dataroom-review-disposition.js apps/control-web/public/sana-v3-dataroom-review-round.js apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble Data Room review source navigation v99'
          git push origin HEAD:demo/sana-v99-review-workspace-source-navigation
