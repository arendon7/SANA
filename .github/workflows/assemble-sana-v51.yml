name: Assemble SANA v51 Forecast

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-forecast-ledger.js'
      - 'apps/control-web/public/sana-v3-cycle-forecast-provenance.js'
      - 'scripts/validate-sana-forecast-ledger.mjs'
      - '.github/workflows/sana-demo-forecast-ledger.yml'
      - '.github/workflows/assemble-sana-v51.yml'

permissions:
  contents: write

jobs:
  assemble-v51:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-functional-auth-v1
          fetch-depth: 0
      - name: Assemble HTML and service worker deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          html_path=Path('apps/control-web/public/sana-v3.html')
          sw_path=Path('apps/control-web/public/sana-v3-sw.js')
          html=html_path.read_text()
          sw=sw_path.read_text()

          replacements_html=[
            ('<script src="/sana-v3-inventory-activity-bridge.js"></script><script src="/sana-v3-labor-ledger.js"></script>',
             '<script src="/sana-v3-inventory-activity-bridge.js"></script><script src="/sana-v3-forecast-ledger.js"></script><script src="/sana-v3-labor-ledger.js"></script>'),
            ('<script src="/sana-v3-cycle-inventory-provenance.js"></script><script src="/sana-v3-cycle-labor-provenance.js"></script>',
             '<script src="/sana-v3-cycle-inventory-provenance.js"></script><script src="/sana-v3-cycle-forecast-provenance.js"></script><script src="/sana-v3-cycle-labor-provenance.js"></script>')
          ]
          for old,new in replacements_html:
              if html.count(old)!=1:
                  raise SystemExit(f'HTML anchor count for {old[:60]!r}: {html.count(old)}')
              html=html.replace(old,new,1)

          old_cache="const CACHE='sana-v3-demo-shell-v50';"
          new_cache="if(false){\nconst CACHE='sana-v3-demo-shell-v50';\n}\nconst CACHE='sana-v3-demo-shell-v51';"
          if sw.count(old_cache)!=1:
              raise SystemExit(f'SW active v50 anchor count: {sw.count(old_cache)}')
          sw=sw.replace(old_cache,new_cache,1)

          sw_replacements=[
            ("'/sana-v3-inventory-activity-bridge.js','/sana-v3-labor-ledger.js'",
             "'/sana-v3-inventory-activity-bridge.js','/sana-v3-forecast-ledger.js','/sana-v3-labor-ledger.js'"),
            ("'/sana-v3-cycle-inventory-provenance.js','/sana-v3-cycle-labor-provenance.js'",
             "'/sana-v3-cycle-inventory-provenance.js','/sana-v3-cycle-forecast-provenance.js','/sana-v3-cycle-labor-provenance.js'")
          ]
          for old,new in sw_replacements:
              if sw.count(old)!=1:
                  raise SystemExit(f'SW shell anchor count for {old}: {sw.count(old)}')
              sw=sw.replace(old,new,1)

          html_path.write_text(html)
          sw_path.write_text(sw)
          PY
          grep -q '/sana-v3-inventory-activity-bridge.js.*sana-v3-forecast-ledger.js.*sana-v3-labor-ledger.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-cycle-inventory-provenance.js.*sana-v3-cycle-forecast-provenance.js.*sana-v3-cycle-labor-provenance.js' apps/control-web/public/sana-v3.html
          grep -q "^const CACHE='sana-v3-demo-shell-v51';" apps/control-web/public/sana-v3-sw.js
      - name: Commit assembled v51
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3.html apps/control-web/public/sana-v3-sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'build(demo): assemble forecast shell v51'
          git push origin HEAD:demo/sana-functional-auth-v1
