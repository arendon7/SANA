name: SANA Demo Data Room Review Workspace V101

on:
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-workspace.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'apps/control-web/public/sana-v3-dataroom-review-case.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-handoff.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-feedback.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-response.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-disposition.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-round.js'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-dataroom-review-workspace-v101.mjs'
      - '.github/workflows/sana-demo-dataroom-review-workspace-v101.yml'

permissions:
  contents: read

jobs:
  review-workspace-v101-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve V87–V101 workspace contracts
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          node scripts/validate-sana-dataroom-review-workspace-v88.mjs
          node scripts/validate-sana-dataroom-review-workspace-v89.mjs
          node scripts/validate-sana-dataroom-review-workspace-v90.mjs
          node scripts/validate-sana-dataroom-review-workspace-v91.mjs
          node scripts/validate-sana-dataroom-review-workspace-v92.mjs
          node scripts/validate-sana-dataroom-review-workspace-v93.mjs
          node scripts/validate-sana-dataroom-review-workspace-v94.mjs
          node scripts/validate-sana-dataroom-review-workspace-v95.mjs
          node scripts/validate-sana-dataroom-review-workspace-v96.mjs
          node scripts/validate-sana-dataroom-review-workspace-v97.mjs
          node scripts/validate-sana-dataroom-review-workspace-v98.mjs
          node scripts/validate-sana-dataroom-review-workspace-v99.mjs
          node scripts/validate-sana-dataroom-review-workspace-v100.mjs
          node scripts/validate-sana-dataroom-review-workspace-v101.mjs
      - name: Assert V101 shell, bidirectional navigation and read-only boundary
        run: |
          grep -q "const CACHE='sana-v3-demo-shell-v101';" apps/control-web/public/sana-v3-sw.js
          grep -q 'RETURN_NAVIGATION ≠ REVIEW_STATE_CHANGE' apps/control-web/public/sana-v3-dataroom-review-workspace.js
          grep -q 'data-review-source-return' apps/control-web/public/sana-v3-dataroom-review-case.js
          grep -q 'data-review-source-return' apps/control-web/public/sana-v3-dataroom-review-round.js
          ! grep -Eq 'location\.hash\s*=' apps/control-web/public/sana-v3-dataroom-review-workspace.js
          ! grep -Eq 'fetch\s*\(|storage\s*(\?\.|\.)|openModal\s*\(' apps/control-web/public/sana-v3-dataroom-review-workspace.js
