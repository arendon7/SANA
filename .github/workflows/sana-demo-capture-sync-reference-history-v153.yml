name: SANA Demo Capture Sync Reference History V153

on:
  pull_request:
  push:
    branches: [demo/sana-capture-sync-v153]

permissions:
  contents: read

jobs:
  capture-sync-reference-history-v153:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Capture Sync Reference History V153 final
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            apps/control-web/public/sana-v3-report-snapshot-capture-sync-references.js \
            apps/control-web/public/sana-v3-dataroom-capture-sync-references.js \
            apps/control-web/public/sana-v3-cycle-capture-sync-references.js \
            apps/control-web/public/sana-v3-due-diligence-capture-sync-reference-gaps.js \
            apps/control-web/public/sana-v3-cycle-capture-sync-provenance.js \
            apps/control-web/public/sana-v3-capture-sync-references.js \
            apps/control-web/public/sana-v3-sw.js; do node --check "$f"; done
          node scripts/validate-sana-capture-sync-ledger.mjs
          node scripts/validate-sana-capture-sync-references-v152.mjs
          node scripts/validate-sana-capture-sync-reference-provenance-v153.mjs
          node scripts/validate-sana-reference-hardening-v149.mjs
          node scripts/validate-sana-reference-history-migration-v149.mjs
          grep -Fq 'ADDITIVE_V153 · CAPTURE_SYNC_REFERENCE_PROVENANCE' apps/control-web/public/sana-v3-report-snapshot-capture-sync-references.js
          grep -Fq 'NO_DATA_TRUST_PAYLOAD' apps/control-web/public/sana-v3-report-snapshot-capture-sync-references.js
          grep -Fq 'ROW_LEVEL_STRUCTURAL_DIFF' apps/control-web/public/sana-v3-dataroom-capture-sync-references.js
          grep -Fq 'NON_WEIGHTED' apps/control-web/public/sana-v3-cycle-capture-sync-references.js
          grep -Fq 'SOURCE CASE LOT DEFINES CYCLE MEMBERSHIP' apps/control-web/public/sana-v3-cycle-capture-sync-references.js
          grep -Fq 'NOT_CAPTURED_OR_LEGACY ≠ GAP' apps/control-web/public/sana-v3-due-diligence-capture-sync-reference-gaps.js
          grep -Fq 'DECLARED_NON_CANONICAL_REFERENCE ≠ GAP' apps/control-web/public/sana-v3-due-diligence-capture-sync-reference-gaps.js
          ! grep -Eq '__SANA_CAPTURE_SYNC_LEDGER__|__SANA_DATA_TRUST__|storage\?\.records|localStorage' apps/control-web/public/sana-v3-dataroom-capture-sync-references.js apps/control-web/public/sana-v3-cycle-capture-sync-references.js apps/control-web/public/sana-v3-due-diligence-capture-sync-reference-gaps.js
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('apps/control-web/public/sana-v3-cycle-capture-sync-provenance.js','utf8');
          const sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');
          const assets=['/sana-v3-report-snapshot-capture-sync-references.js','/sana-v3-cycle-capture-sync-references.js','/sana-v3-due-diligence-capture-sync-reference-gaps.js','/sana-v3-dataroom-capture-sync-references.js'];
          if(!loader.includes("const VERSION='V153'"))throw new Error('V153 loader version missing');
          if(!loader.includes('__SANA_CAPTURE_SYNC_REFERENCE_HISTORY_LOADER__'))throw new Error('V153 loader state missing');
          if(!loader.includes("window.__SANA_CAPTURE_SYNC_LEDGER__?.referenceVersion==='V152'"))throw new Error('V153 parent version guard missing');
          let last=-1;for(const a of assets){const i=loader.indexOf(a);if(i<0||i<=last)throw new Error(`V153 loader asset/order invalid: ${a}`);last=i;}
          if((sw.match(/^const CACHE='sana-v3-demo-shell-v153';$/gm)||[]).length!==1)throw new Error('v153 active cache marker invalid');
          if(!sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v152';\n}"))throw new Error('v152 historical marker missing');
          for(const a of assets)if((sw.split(a).length-1)!==1)throw new Error(`V153 SW asset count invalid: ${a}`);
          if(!sw.includes('// v153 propagates minimized Capture Sync reference integrity'))throw new Error('v153 provenance marker missing');
          NODE
          ! grep -Eiq 'canonicalMutated[[:space:]]*[:=][[:space:]]*true|productionExecutionAvailable[[:space:]]*[:=][[:space:]]*true|sourceVerified[[:space:]]*[:=][[:space:]]*true|hardwareVerified[[:space:]]*[:=][[:space:]]*true|calibratedMeasurement[[:space:]]*[:=][[:space:]]*true|automaticResolution[[:space:]]*[:=][[:space:]]*true|creditApproved|eligibilityApproved|investmentApproved|managementDecision[[:space:]]*[:=]' apps/control-web/public/sana-v3-*capture-sync-reference*.js apps/control-web/public/sana-v3-cycle-capture-sync-provenance.js
