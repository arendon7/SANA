name: SANA Demo Economic References

on:
  push:
    branches: [demo/sana-economic-v145]
  pull_request:

permissions:
  contents: read

jobs:
  economic-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Economic References V145
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-economic-references.js
          node --check apps/control-web/public/sana-v3-cycle-economic-reconciliation.js
          node --check apps/control-web/public/sana-v3-sw.js
          node scripts/validate-sana-economic-references.mjs
          grep -Fq 'LEGACY_REFERENCE_NOT_CAPTURED' apps/control-web/public/sana-v3-economic-references.js
          grep -Fq 'DECLARED_NON_CANONICAL_REFERENCE' apps/control-web/public/sana-v3-economic-references.js
          grep -Fq 'COST_SUPPORT_REF' apps/control-web/public/sana-v3-economic-references.js
          grep -Fq 'CROSS_DOMAIN_COST_REF' apps/control-web/public/sana-v3-economic-references.js
          grep -Fq 'INVOICE_REFERENCE_DECLARED ≠ INVOICE_VERIFIED' apps/control-web/public/sana-v3-economic-references.js
          grep -Fq 'PAYMENT_STATUS_DECLARED ≠ PAYMENT_EXECUTED' apps/control-web/public/sana-v3-economic-references.js
          grep -Fq 'REFERENCE ≠ CREDIT_RISK ≠ ELIGIBILITY ≠ INVESTMENT_SIGNAL' apps/control-web/public/sana-v3-economic-references.js
          node - <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');
          const loader=fs.readFileSync('apps/control-web/public/sana-v3-cycle-economic-reconciliation.js','utf8');
          const asset='/sana-v3-economic-references.js';
          if((sw.split(asset).length-1)!==1)throw new Error('economic references SW asset count invalid');
          if(!loader.includes("const VERSION='V145',SRC='/sana-v3-economic-references.js'"))throw new Error('V145 loader asset/version missing');
          for(const dep of ['__SANA_ECONOMIC_RECONCILIATION__','__SANA_PLAN_FIELD_WORKFLOW__','__SANA_HARVEST_LEDGER__','__SANA_LABOR_LEDGER__','__SANA_INVENTORY_LEDGER__'])if(!loader.includes(dep))throw new Error(`loader readiness dependency missing: ${dep}`);
          if(!loader.includes('__SANA_ECONOMIC_REFERENCES_LOADER__'))throw new Error('V145 loader state missing');
          if((sw.match(/const CACHE='sana-v3-demo-shell-v145';/g)||[]).length!==1)throw new Error('v145 cache marker must remain exactly once');
          if(!sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v144';\n}"))throw new Error('v144 historical marker missing');
          if(!sw.includes('// v145 validates internal Economic Reconciliation references'))throw new Error('v145 provenance marker missing');
          const lines=sw.split('\n'),active=[];
          for(let i=0;i<lines.length;i++){const m=lines[i].match(/^const CACHE='sana-v3-demo-shell-v(\d+)';$/);if(m&&lines[i-1]!=='if(false){')active.push(Number(m[1]));}
          if(active.length!==1||active[0]<145)throw new Error(`expected one active cache >= v145, got ${active.join(',')}`);
          NODE
          ! grep -Eiq 'canonicalMutated[[:space:]]*=[[:space:]]*true|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|accountingEntr(y|ies)[[:space:]]*=[[:space:]]*[1-9]|invoiceVerified[[:space:]]*=[[:space:]]*true|paymentExecuted[[:space:]]*=[[:space:]]*true|saleVerified[[:space:]]*=[[:space:]]*true|cashReceived[[:space:]]*=[[:space:]]*true|creditApproved|investmentApproved' apps/control-web/public/sana-v3-economic-references.js apps/control-web/public/sana-v3-cycle-economic-reconciliation.js
