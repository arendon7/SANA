name: SANA Demo Data Trust Reference History

on:
  push:
    branches: [demo/sana-data-trust-v161]
  pull_request:

permissions:
  contents: read

jobs:
  data-trust-reference-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Data Trust Reference History V161
        run: |
          set -euo pipefail
          for f in \
            apps/control-web/public/sana-v3-data-trust-references.js \
            apps/control-web/public/sana-v3-capture-sync-references.js \
            apps/control-web/public/sana-v3-report-snapshot-data-trust-references.js \
            apps/control-web/public/sana-v3-cycle-data-trust-references.js \
            apps/control-web/public/sana-v3-due-diligence-data-trust-reference-gaps.js \
            apps/control-web/public/sana-v3-dataroom-data-trust-references.js \
            apps/control-web/public/sana-v3-sw.js; do node --check "$f"; done

          # Preserve the certified V160 live-reference contract while adding V161 history.
          node scripts/validate-sana-data-trust-references.mjs
          node scripts/validate-sana-data-trust-reference-provenance.mjs
          node scripts/validate-sana-demo-auth.mjs

          grep -Fq 'CONTENT_MINIMIZED' apps/control-web/public/sana-v3-report-snapshot-data-trust-references.js
          grep -Fq 'NO_SOURCE/ACK/CANDIDATE_VALUES' apps/control-web/public/sana-v3-report-snapshot-data-trust-references.js
          grep -Fq 'referenceIdentifierCaptured:false' apps/control-web/public/sana-v3-report-snapshot-data-trust-references.js
          grep -Fq 'NO_LIVE_FALLBACK' apps/control-web/public/sana-v3-dataroom-data-trust-references.js
          grep -Fq 'ROW_LEVEL_STRUCTURAL_DIFF' apps/control-web/public/sana-v3-dataroom-data-trust-references.js
          grep -Fq 'NON_WEIGHTED' apps/control-web/public/sana-v3-cycle-data-trust-references.js
          grep -Fq 'NOT_CAPTURED_OR_LEGACY ≠ GAP' apps/control-web/public/sana-v3-due-diligence-data-trust-reference-gaps.js
          grep -Fq 'DECLARED_NON_CANONICAL_REFERENCE ≠ GAP' apps/control-web/public/sana-v3-due-diligence-data-trust-reference-gaps.js
          ! grep -Eq '__SANA_DATA_TRUST__|__SANA_CAPTURE_SYNC_LEDGER__|localStorage|storage\?\.|storage\.records' apps/control-web/public/sana-v3-dataroom-data-trust-references.js apps/control-web/public/sana-v3-cycle-data-trust-references.js apps/control-web/public/sana-v3-due-diligence-data-trust-reference-gaps.js

          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('apps/control-web/public/sana-v3-data-trust-references.js','utf8');
          const sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');
          const assets=['/sana-v3-report-snapshot-data-trust-references.js','/sana-v3-cycle-data-trust-references.js','/sana-v3-due-diligence-data-trust-reference-gaps.js','/sana-v3-dataroom-data-trust-references.js'];
          if(!loader.includes("const VERSION='V161'"))throw new Error('V161 history loader version missing');
          if(!loader.includes('__SANA_DATA_TRUST_REFERENCE_HISTORY_LOADER__'))throw new Error('V161 history loader state missing');
          let last=-1; for(const asset of assets){const i=loader.indexOf(asset);if(i<0||i<=last)throw new Error(`V161 loader asset/order invalid: ${asset}`);last=i;}
          if((sw.match(/const CACHE='sana-v3-demo-shell-v161';/g)||[]).length!==1)throw new Error('v161 active cache marker must appear exactly once');
          if(!sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v160';\n}"))throw new Error('v160 historical cache marker missing');
          for(const asset of assets)if((sw.split(asset).length-1)!==1)throw new Error(`V161 SW asset count invalid: ${asset}`);
          if(!sw.includes('// v161 propagates content-minimized Data Trust reference provenance'))throw new Error('v161 provenance marker missing');
          NODE

          ! grep -Eiq 'canonicalMutated[[:space:]]*=[[:space:]]*true|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|serverVerified[[:space:]]*=[[:space:]]*true|sourceVerified[[:space:]]*=[[:space:]]*true|hardwareVerified[[:space:]]*=[[:space:]]*true|measurementValidated[[:space:]]*=[[:space:]]*true|dataQualityScore|creditApproved|investmentApproved|eligibilityApproved' apps/control-web/public/sana-v3-*data-trust-reference*.js apps/control-web/public/sana-v3-capture-sync-references.js
