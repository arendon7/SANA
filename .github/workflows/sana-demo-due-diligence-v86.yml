name: SANA Demo Due Diligence V86
on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths: ['apps/control-web/public/sana-v3-report-snapshot-dataroom-review-round.js','apps/control-web/public/sana-v3-dataroom-review-round-history.js','apps/control-web/public/sana-v3-due-diligence-dataroom-review-round-gaps.js','scripts/validate-sana-dataroom-review-round-history.mjs','apps/control-web/public/sana-v3.html','apps/control-web/public/sana-v3-sw.js']
  pull_request:
    paths: ['apps/control-web/public/sana-v3-report-snapshot-dataroom-review-round.js','apps/control-web/public/sana-v3-dataroom-review-round-history.js','apps/control-web/public/sana-v3-due-diligence-dataroom-review-round-gaps.js','scripts/validate-sana-dataroom-review-round-history.mjs','apps/control-web/public/sana-v3.html','apps/control-web/public/sana-v3-sw.js']
jobs:
  composed-dd-v86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/validate-sana-dataroom-review-round-history.mjs
      - run: |
          grep -q '/sana-v3-due-diligence-dataroom-review-disposition-gaps.js.*sana-v3-due-diligence-dataroom-review-round-gaps.js.*sana-v3-due-diligence-remediation.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-report-snapshot-dataroom-review-disposition.js.*sana-v3-report-snapshot-dataroom-review-round.js.*sana-v3-cycle-closure.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-dataroom-review-disposition-history.js.*sana-v3-dataroom-review-round-history.js.*sana-v3-dataroom-entry.js' apps/control-web/public/sana-v3.html
          grep -q 'ROUND_GAP ≠ FINDING ≠ RISK_SCORE ≠ REVIEW_OUTCOME' apps/control-web/public/sana-v3-due-diligence-dataroom-review-round-gaps.js
          grep -Eq "^const CACHE='sana-v3-demo-shell-v(8[6-9]|9[0-9]|[1-9][0-9]{2,})';" apps/control-web/public/sana-v3-sw.js
