name: TEMP SANA Commercial V148 Assembly

on:
  push:
    branches: [demo/sana-commercial-v148]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-commercial-v148
      - name: Assemble v148 shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v148';" not in s:
              old="const CACHE='sana-v3-demo-shell-v147';"
              new="if(false){\nconst CACHE='sana-v3-demo-shell-v147';\n}\nconst CACHE='sana-v3-demo-shell-v148';"
              assert s.count(old)==1, 'expected exactly one active v147 marker'
              s=s.replace(old,new,1)
          anchor="'/sana-v3-commercial-references.js',"
          assets="'/sana-v3-commercial-references.js','/sana-v3-report-snapshot-commercial-references.js','/sana-v3-cycle-commercial-references.js','/sana-v3-due-diligence-commercial-reference-gaps.js','/sana-v3-dataroom-commercial-references.js',"
          if '/sana-v3-report-snapshot-commercial-references.js' not in s:
              assert s.count(anchor)==1, 'commercial refs anchor missing/duplicated'
              s=s.replace(anchor,assets,1)
          comment='// v148 propagates Commercial Reference integrity through content-minimized Snapshot, Data Room, Cycle and Due Diligence without live fallback, weighting, identity, contract, order, payment, credit or investment authority.'
          if comment not in s:
              anchor_comment='// v147 validates Commercial/Offtake internal and cross-domain references without buyer identity, contract, order, invoice, payment, custody, credit or investment authority.'
              assert s.count(anchor_comment)==1, 'v147 comment anchor missing/duplicated'
              s=s.replace(anchor_comment,anchor_comment+'\n'+comment,1)
          p.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v148';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v147';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          for a in /sana-v3-report-snapshot-commercial-references.js /sana-v3-cycle-commercial-references.js /sana-v3-due-diligence-commercial-reference-gaps.js /sana-v3-dataroom-commercial-references.js; do test "$(grep -o "$a" apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1; done
      - name: Commit assembly if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble commercial shell v148'
          git push origin HEAD:demo/sana-commercial-v148
