name: SANA Demo V3

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3*.js'
      - 'apps/control-web/public/sana-v3*.css'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3*.webmanifest'
      - 'config/product/sana-demo-auth.json'
      - '.github/workflows/sana-demo-v3.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3*.js'
      - 'apps/control-web/public/sana-v3*.css'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3*.webmanifest'
      - 'config/product/sana-demo-auth.json'
      - '.github/workflows/sana-demo-v3.yml'

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate modular JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            sana-v3-cloud-state.js sana-v3-core.js sana-v3-views-1.js sana-v3-views-2.js sana-v3-views-3.js sana-v3-views-4.js \
            sana-v3-circularity.js sana-v3-iot-source.js sana-v3-input-forecast.js \
            sana-v3-characterization-protocol.js sana-v3-plan-protocols.js sana-v3-advisory-protocols.js sana-v3-advisory-cases.js sana-v3-passport-chain.js \
            sana-v3-results.js sana-v3-economics.js sana-v3-impact-methodology.js sana-v3-capital-dossier.js sana-v3-integration-bridge.js \
            sana-v3-field-mobile.js sana-v3-role-home.js sana-v3-runtime.js sana-v3-access.js sana-v3-account.js sana-v3-firestore-selftest.js sana-v3-offline-runtime.js sana-v3-sw.js; do
            node --check "apps/control-web/public/$file"
          done
          node -e "JSON.parse(require('fs').readFileSync('apps/control-web/public/sana-v3-manifest.webmanifest','utf8'))"
      - name: Validate V3 product assembly
        shell: bash
        run: |
          set -euo pipefail
          html='apps/control-web/public/sana-v3.html'
          test -s "$html"
          for asset in \
            sana-v3.css sana-v3-extensions.css sana-v3-characterization.css sana-v3-capital.css sana-v3-economics.css sana-v3-impact.css sana-v3-mobile.css \
            sana-v3-cloud-state.js sana-v3-core.js sana-v3-circularity.js sana-v3-iot-source.js sana-v3-input-forecast.js sana-v3-advisory-cases.js sana-v3-results.js sana-v3-economics.js sana-v3-impact-methodology.js sana-v3-passport-chain.js \
            sana-v3-role-home.js sana-v3-runtime.js sana-v3-access.js sana-v3-account.js sana-v3-firestore-selftest.js sana-v3-offline-runtime.js sana-v3-sw.js sana-v3-manifest.webmanifest; do
            test -s "apps/control-web/public/$asset"
          done
          grep -q 'data-view="forecast"' "$html"
          grep -q 'data-view="circularity"' "$html"
          grep -q '/sana-v3-input-forecast.js' "$html"
          grep -q '/sana-v3-circularity.js' "$html"
          grep -q '/sana-v3-iot-source.js' "$html"
          grep -q '/sana-v3-advisory-cases.js' "$html"
          grep -q '/sana-v3-firestore-selftest.js' "$html"
          grep -q 'views.forecast=forecasts' apps/control-web/public/sana-v3-input-forecast.js
          grep -q 'Proyección por cultivo / ciclo' apps/control-web/public/sana-v3-input-forecast.js
          grep -q 'input-forecast-adjustment' apps/control-web/public/sana-v3-input-forecast.js
          grep -q 'no autoriza aplicaciones' apps/control-web/public/sana-v3-input-forecast.js
          grep -q 'NO GENERA ORDEN, COMPRA NI DOSIS' apps/control-web/public/sana-v3-input-forecast.js
          grep -q "input-forecast-adjustment" apps/control-web/public/sana-v3-access.js
          grep -q "'/sana-v3-input-forecast.js'" apps/control-web/public/sana-v3-sw.js
          grep -q 'views.circularity=circularity' apps/control-web/public/sana-v3-circularity.js
          grep -q "name:'Fuentes de agua'" apps/control-web/public/sana-v3-iot-source.js
          grep -q 'Casos con Agrónomo' apps/control-web/public/sana-v3-advisory-cases.js
          grep -q 'IA NO FIRMA RESPUESTA AGRONÓMICA' apps/control-web/public/sana-v3-advisory-cases.js
          grep -q "agronomist-case" apps/control-web/public/sana-v3-access.js
          grep -q 'views.results=results' apps/control-web/public/sana-v3-results.js
          grep -q "chainBlock('06','Resultado productivo'" apps/control-web/public/sana-v3-passport-chain.js
          grep -q "investor:new Set(\['home','territory','forecast','circularity','results','economics','reports','passport','impact','capital'\])" apps/control-web/public/sana-v3-access.js
          grep -q 'USUARIO NUEVO · ONBOARDING LIMITADO' apps/control-web/public/sana-v3-role-home.js
          grep -q 'Mi cuenta y sincronización' apps/control-web/public/sana-v3-account.js
          grep -q 'Verificar reglas Firestore' apps/control-web/public/sana-v3-firestore-selftest.js
          grep -q "const COLLECTION='demo_user_state'" apps/control-web/public/sana-v3-cloud-state.js
          grep -q 'REMOTE_REVISION_CONFLICT' apps/control-web/public/sana-v3-cloud-state.js
          grep -q 'NO_SILENT_OVERWRITE' config/product/sana-demo-auth.json
      - name: Assert demo-only execution boundary
        shell: bash
        run: |
          set -euo pipefail
          FILES='apps/control-web/public/sana-v3-core.js apps/control-web/public/sana-v3-views-1.js apps/control-web/public/sana-v3-views-2.js apps/control-web/public/sana-v3-views-3.js apps/control-web/public/sana-v3-views-4.js apps/control-web/public/sana-v3-circularity.js apps/control-web/public/sana-v3-iot-source.js apps/control-web/public/sana-v3-input-forecast.js apps/control-web/public/sana-v3-characterization-protocol.js apps/control-web/public/sana-v3-plan-protocols.js apps/control-web/public/sana-v3-advisory-protocols.js apps/control-web/public/sana-v3-advisory-cases.js apps/control-web/public/sana-v3-passport-chain.js apps/control-web/public/sana-v3-results.js apps/control-web/public/sana-v3-economics.js apps/control-web/public/sana-v3-impact-methodology.js apps/control-web/public/sana-v3-capital-dossier.js apps/control-web/public/sana-v3-integration-bridge.js apps/control-web/public/sana-v3-field-mobile.js apps/control-web/public/sana-v3-role-home.js apps/control-web/public/sana-v3-runtime.js apps/control-web/public/sana-v3-access.js apps/control-web/public/sana-v3-account.js apps/control-web/public/sana-v3-firestore-selftest.js apps/control-web/public/sana-v3-offline-runtime.js apps/control-web/public/sana-v3.html'
          ! grep -Eiq 'fetch\(|XMLHttpRequest|WebSocket|productionReady[[:space:]]*=[[:space:]]*true|MIGRATION_LIVE_ACK|D10_APPROV|activation lease|/api/[^ ]*activat' $FILES
          ! grep -Eiq 'productionReady[[:space:]]*=[[:space:]]*true|MIGRATION_LIVE_ACK|D10_APPROV|activation lease|/api/[^ ]*activat' apps/control-web/public/sana-v3-cloud-state.js
          ! grep -Eiq "request\.method.*(POST|PUT|PATCH|DELETE)" apps/control-web/public/sana-v3-sw.js
          grep -q 'productionExecutionAvailable=false' apps/control-web/public/sana-v3-core.js
          grep -q 'canonicalMutated=false' apps/control-web/public/sana-v3-core.js
          grep -q 'D10=PENDING' apps/control-web/public/sana-v3-core.js
          grep -q 'no prescribe dosis, no compra y no autoriza aplicaciones' apps/control-web/public/sana-v3-input-forecast.js
          grep -q 'NO CERTIFICA TRATAMIENTO NI COMPOSICIÓN' apps/control-web/public/sana-v3-circularity.js
          grep -q 'ninguna lectura aislada autoriza manejo agronómico' apps/control-web/public/sana-v3-iot-source.js
          grep -q 'IA NO FIRMA RESPUESTA AGRONÓMICA' apps/control-web/public/sana-v3-advisory-cases.js
          grep -q 'HUMAN_REVIEW_REQUIRED' apps/control-web/public/sana-v3-advisory-cases.js
          grep -q 'NO CONTABILIDAD OFICIAL' apps/control-web/public/sana-v3-economics.js
          grep -q 'NO_VERIFICADO_EXTERNO' apps/control-web/public/sana-v3-impact-methodology.js
          grep -q 'no capta recursos' apps/control-web/public/sana-v3-capital-dossier.js
          grep -q 'no recomienda invertir' apps/control-web/public/sana-v3-capital-dossier.js
          grep -q 'no modifica roles' apps/control-web/public/sana-v3-firestore-selftest.js
          grep -q "if(url.pathname.startsWith('/api/'))return" apps/control-web/public/sana-v3-sw.js
