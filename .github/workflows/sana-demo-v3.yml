name: SANA Demo V3

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3*.js'
      - 'apps/control-web/public/sana-v3*.css'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3*.webmanifest'
      - 'scripts/validate-sana-demo-auth.mjs'
      - 'config/product/sana-demo-auth.json'
      - '.github/workflows/sana-demo-v3.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3*.js'
      - 'apps/control-web/public/sana-v3*.css'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3*.webmanifest'
      - 'scripts/validate-sana-demo-auth.mjs'
      - 'config/product/sana-demo-auth.json'
      - '.github/workflows/sana-demo-v3.yml'

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every V3 JavaScript module
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(apps/control-web/public/sana-v3*.js)
          test ${#files[@]} -gt 0
          for file in "${files[@]}"; do node --check "$file"; done
          node -e "JSON.parse(require('fs').readFileSync('apps/control-web/public/sana-v3-manifest.webmanifest','utf8'))"
      - name: Validate auth, roles and data contracts
        run: node scripts/validate-sana-demo-auth.mjs
      - name: Validate integrated product assembly
        shell: bash
        run: |
          set -euo pipefail
          html='apps/control-web/public/sana-v3.html'
          test -s "$html"
          for asset in sana-v3-territory-360.css sana-v3-territory-360.js sana-v3-sources.js sana-v3-source-bridge.js sana-v3-inventory-operations.js sana-v3-team-worklogs.js sana-v3-plan-field-workflow.js sana-v3-passport-chain.js sana-v3-activity-relations.js sana-v3-cycle-closure.js sana-v3-operational-journey.js sana-v3-sw.js; do test -s "apps/control-web/public/$asset"; done
          grep -q '/sana-v3-results.js.*sana-v3-field-mobile.js.*sana-v3-plan-field-workflow.js.*sana-v3-passport-chain.js' "$html"
          grep -q '/sana-v3-impact-methodology.js.*sana-v3-activity-relations.js.*sana-v3-cycle-closure.js.*sana-v3-capital-dossier.js' "$html"
          grep -q '/sana-v3-role-home.js.*sana-v3-guided-field.js.*sana-v3-operational-journey.js.*sana-v3-runtime.js' "$html"
          grep -q '__SANA_OPERATIONAL_JOURNEY__' apps/control-web/public/sana-v3-operational-journey.js
          grep -q '__SANA_PLAN_FIELD_WORKFLOW__' apps/control-web/public/sana-v3-operational-journey.js
          grep -q '__SANA_CYCLE_CLOSURE__' apps/control-web/public/sana-v3-operational-journey.js
          grep -q 'HOY EN SANA · SIGUIENTE ACCIÓN' apps/control-web/public/sana-v3-operational-journey.js
          grep -q "if(evidenceGap)return {kind:'evidence'" apps/control-web/public/sana-v3-operational-journey.js
          grep -q "kind:'result'" apps/control-web/public/sana-v3-operational-journey.js
          grep -q "kind:'cycle'" apps/control-web/public/sana-v3-operational-journey.js
          grep -q 'La expectativa no cuenta como prueba' apps/control-web/public/sana-v3-operational-journey.js
          grep -q 'LECTURA DE CIERRE · SOLO EVIDENCIA' apps/control-web/public/sana-v3-operational-journey.js
          grep -q 'READ_ONLY' apps/control-web/public/sana-v3-operational-journey.js
          grep -q 'LOCAL_ONLY ≠ SYNCED ≠ ACK' apps/control-web/public/sana-v3-operational-journey.js
          grep -q "'/sana-v3-operational-journey.js'" apps/control-web/public/sana-v3-sw.js
          grep -q 'data-view="cycle"' "$html"
          grep -q 'views.cycle=cycleClosure' apps/control-web/public/sana-v3-cycle-closure.js
          grep -q '__SANA_CYCLE_CLOSURE__' apps/control-web/public/sana-v3-cycle-closure.js
          grep -q 'Completitud expediente' apps/control-web/public/sana-v3-cycle-closure.js
          grep -q 'documentación y procedencia · NO desempeño' apps/control-web/public/sana-v3-cycle-closure.js
          grep -q 'cycle-close-review' apps/control-web/public/sana-v3-cycle-closure.js
          grep -q 'REVISIÓN DEMO · NO CERTIFICA CULTIVO, CONTABILIDAD, IMPACTO NI INVERSIÓN' apps/control-web/public/sana-v3-cycle-closure.js
          grep -q "technical:new Set(\['home','guide','territory'.*'cycle'" apps/control-web/public/sana-v3-access.js
          grep -q "producer:new Set(\['home','guide','territory'.*'cycle'" apps/control-web/public/sana-v3-access.js
          grep -q "investor:new Set(\['home','territory'.*'cycle'" apps/control-web/public/sana-v3-access.js
          grep -q 'cycle-close-review' apps/control-web/public/sana-v3-access.js
          ! grep -q "investor:.*'cycle-close-review'" apps/control-web/public/sana-v3-access.js
          ! grep -q "visitor:new Set(.*'cycle'" apps/control-web/public/sana-v3-access.js
          grep -q "'/sana-v3-cycle-closure.js'" apps/control-web/public/sana-v3-sw.js
          grep -q '__SANA_PLAN_FIELD_WORKFLOW__' apps/control-web/public/sana-v3-plan-field-workflow.js
          grep -q "records('activity-evidence')" apps/control-web/public/sana-v3-plan-field-workflow.js
          grep -q "records('activity-close')" apps/control-web/public/sana-v3-plan-field-workflow.js
          grep -q 'NO CAMBIA FASE DEL PLAN · NO AUTORIZA MANEJO' apps/control-web/public/sana-v3-plan-field-workflow.js
          grep -q '__SANA_PLAN_FIELD_WORKFLOW__' apps/control-web/public/sana-v3-passport-chain.js
          grep -q 'La expectativa de evidencia nunca se contabiliza como prueba' apps/control-web/public/sana-v3-passport-chain.js
          grep -q '__SANA_PASSPORT_CHAIN__' apps/control-web/public/sana-v3-passport-chain.js
          grep -q 'activityId' apps/control-web/public/sana-v3-inventory-operations.js
          grep -q 'forActivity:id=>movements' apps/control-web/public/sana-v3-inventory-operations.js
          grep -q 'cerrar una actividad nunca descuenta stock por inferencia' apps/control-web/public/sana-v3-inventory-operations.js
          grep -q 'activityId' apps/control-web/public/sana-v3-team-worklogs.js
          grep -q 'forActivity:id=>logs' apps/control-web/public/sana-v3-team-worklogs.js
          grep -q 'SANA no infiere horas desde un cierre' apps/control-web/public/sana-v3-team-worklogs.js
          grep -q '__SANA_ACTIVITY_RELATIONS__' apps/control-web/public/sana-v3-activity-relations.js
          grep -q 'no recalcula automáticamente indicadores ni demuestra causalidad' apps/control-web/public/sana-v3-activity-relations.js
          grep -q '/sana-v3-territory-360.js' "$html"
          grep -q '/sana-v3-sources.js' "$html"
          grep -q '/sana-v3-source-bridge.js' "$html"
          grep -q 'views.territory=territory360' apps/control-web/public/sana-v3-territory-360.js
          grep -q '__SANA_DOCUMENT_SOURCES__' apps/control-web/public/sana-v3-sources.js
          grep -q '__SANA_SOURCE_BRIDGE__' apps/control-web/public/sana-v3-source-bridge.js
          grep -q '__SANA_INPUT_FORECAST__' apps/control-web/public/sana-v3-input-forecast.js
          grep -q '__SANA_INVENTORY__' apps/control-web/public/sana-v3-inventory-operations.js
          grep -q '__SANA_TEAM_WORKLOGS__' apps/control-web/public/sana-v3-team-worklogs.js
          ! grep -q "investor:new Set(.*'team'" apps/control-web/public/sana-v3-access.js
          ! grep -q "investor:new Set(.*'inventory'" apps/control-web/public/sana-v3-access.js
          grep -q 'views.material=materialLifecycle' apps/control-web/public/sana-v3-material-lifecycle.js
          grep -q '__SANA_CIRCULARITY__' apps/control-web/public/sana-v3-circularity.js
          grep -q 'views.reports=reports' apps/control-web/public/sana-v3-reports-provenance.js
      - name: Assert browser and production boundaries
        shell: bash
        run: |
          set -euo pipefail
          SAFE_FILES=$(find apps/control-web/public -maxdepth 1 -type f -name 'sana-v3*.js' ! -name 'sana-v3-sw.js' ! -name 'sana-v3-cloud-state.js' -print)
          ! grep -Eiq 'fetch\(|XMLHttpRequest|WebSocket|productionReady[[:space:]]*=[[:space:]]*true|MIGRATION_LIVE_ACK|D10_APPROV|activation lease|/api/[^ ]*activat' $SAFE_FILES apps/control-web/public/sana-v3.html
          ! grep -Eiq 'graph\.microsoft\.com|access_token|refresh_token|client_secret|Authorization:[[:space:]]*Bearer' apps/control-web/public/sana-v3-sources.js apps/control-web/public/sana-v3-source-bridge.js
          ! grep -Eiq "request\.method.*(POST|PUT|PATCH|DELETE)" apps/control-web/public/sana-v3-sw.js
          grep -q 'productionExecutionAvailable=false' apps/control-web/public/sana-v3-core.js
          grep -q 'canonicalMutated=false' apps/control-web/public/sana-v3-core.js
          grep -q 'D10=PENDING' apps/control-web/public/sana-v3-core.js
          grep -q 'SANA organiza; no decide manejo' apps/control-web/public/sana-v3-operational-journey.js
          grep -q 'La completitud no es score de inversión, rendimiento ni impacto' apps/control-web/public/sana-v3-operational-journey.js
          ! grep -Eiq 'productionExecutionAvailable[[:space:]]*=[[:space:]]*true|canonicalMutated[[:space:]]*=[[:space:]]*true|investmentRecommendation' apps/control-web/public/sana-v3-operational-journey.js
          grep -q 'La completitud mide reconstrucción documental: no rendimiento, rentabilidad, causalidad ni certificación' apps/control-web/public/sana-v3-cycle-closure.js
          grep -q 'No se infiere venta, ingreso ni margen contable' apps/control-web/public/sana-v3-cycle-closure.js
          grep -q 'No demuestra que una actividad haya causado un cambio' apps/control-web/public/sana-v3-cycle-closure.js
          ! grep -Eiq 'certified[[:space:]]*=[[:space:]]*true|investmentApproved[[:space:]]*=[[:space:]]*true|impactVerified[[:space:]]*=[[:space:]]*true' apps/control-web/public/sana-v3-cycle-closure.js
          grep -q 'El cierre de workflow es un evento DEMO, no una autorización agronómica' apps/control-web/public/sana-v3-plan-field-workflow.js
          grep -q 'El resultado productivo es posterior y separado del resultado de una actividad' apps/control-web/public/sana-v3-plan-field-workflow.js
          ! grep -Eiq 'phase[[:space:]]*=.*COMPLETED|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|canonicalMutated[[:space:]]*=[[:space:]]*true' apps/control-web/public/sana-v3-plan-field-workflow.js
          grep -q 'Nunca se descuenta o repone inventario por inferencia' apps/control-web/public/sana-v3-inventory-operations.js
          grep -q 'No se generan horas por inferencia ni por temporizador automático' apps/control-web/public/sana-v3-team-worklogs.js
          grep -q 'no recalcula automáticamente indicadores ni demuestra causalidad' apps/control-web/public/sana-v3-activity-relations.js
          grep -q 'No permitido:</strong> inferir que la actividad causó un cambio' apps/control-web/public/sana-v3-activity-relations.js
          grep -q 'no constituye delimitación predial certificada' apps/control-web/public/sana-v3-territory-360.js
          grep -q 'no modifica SharePoint' apps/control-web/public/sana-v3-sources.js
          grep -q 'No significa que SANA haya leído, validado, firmado o modificado el documento en SharePoint' apps/control-web/public/sana-v3-source-bridge.js
          grep -q 'no prescribe dosis, no compra y no autoriza aplicaciones' apps/control-web/public/sana-v3-input-forecast.js
          grep -q 'NO CERTIFICA TRATAMIENTO NI COMPOSICIÓN' apps/control-web/public/sana-v3-circularity.js
          grep -q 'IA NO FIRMA RESPUESTA AGRONÓMICA' apps/control-web/public/sana-v3-advisory-cases.js
          grep -q 'NO CONTABILIDAD OFICIAL' apps/control-web/public/sana-v3-economics.js
          grep -q 'NO_VERIFICADO_EXTERNO' apps/control-web/public/sana-v3-impact-methodology.js
          grep -q 'no capta recursos' apps/control-web/public/sana-v3-capital-dossier.js
          grep -q 'no recomienda invertir' apps/control-web/public/sana-v3-capital-dossier.js
          grep -q "if(url.pathname.startsWith('/api/'))return" apps/control-web/public/sana-v3-sw.js
