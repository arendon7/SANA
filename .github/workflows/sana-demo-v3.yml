name: SANA Demo V3

on:
  push:
    branches:
      - demo/sana-functional-auth-v1
    paths:
      - 'apps/control-web/public/sana-v3*.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3.css'
      - '.github/workflows/sana-demo-v3.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3*.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3.css'
      - '.github/workflows/sana-demo-v3.yml'

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate modular JavaScript syntax
        run: |
          node --check apps/control-web/public/sana-v3-core.js
          node --check apps/control-web/public/sana-v3-views-1.js
          node --check apps/control-web/public/sana-v3-views-2.js
          node --check apps/control-web/public/sana-v3-views-3.js
          node --check apps/control-web/public/sana-v3-views-4.js
          node --check apps/control-web/public/sana-v3-plan-protocols.js
          node --check apps/control-web/public/sana-v3-runtime.js
      - name: Validate V3 assembly
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            apps/control-web/public/sana-v3.html \
            apps/control-web/public/sana-v3.css \
            apps/control-web/public/sana-v3-core.js \
            apps/control-web/public/sana-v3-views-1.js \
            apps/control-web/public/sana-v3-views-2.js \
            apps/control-web/public/sana-v3-views-3.js \
            apps/control-web/public/sana-v3-views-4.js \
            apps/control-web/public/sana-v3-plan-protocols.js \
            apps/control-web/public/sana-v3-runtime.js; do
            test -s "$file"
          done
          grep -q 'id="app-content"' apps/control-web/public/sana-v3.html
          grep -q 'data-view="plans"' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-core.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-views-1.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-views-2.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-views-3.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-views-4.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-plan-protocols.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-runtime.js' apps/control-web/public/sana-v3.html
          grep -q 'const views=' apps/control-web/public/sana-v3-views-4.js
          grep -q 'views.plans=plansOperational' apps/control-web/public/sana-v3-plan-protocols.js
          grep -q 'HUMAN_REVIEW_REQUIRED' apps/control-web/public/sana-v3-plan-protocols.js
          grep -q 'function render()' apps/control-web/public/sana-v3-runtime.js
          grep -q 'localStorage' apps/control-web/public/sana-v3-core.js
          grep -q 'Capital readiness' apps/control-web/public/sana-v3.html
      - name: Assert demo-only execution boundary
        shell: bash
        run: |
          set -euo pipefail
          FILES='apps/control-web/public/sana-v3-core.js apps/control-web/public/sana-v3-views-1.js apps/control-web/public/sana-v3-views-2.js apps/control-web/public/sana-v3-views-3.js apps/control-web/public/sana-v3-views-4.js apps/control-web/public/sana-v3-plan-protocols.js apps/control-web/public/sana-v3-runtime.js apps/control-web/public/sana-v3.html'
          ! grep -Eiq 'fetch\(|XMLHttpRequest|WebSocket|productionReady[[:space:]]*=[[:space:]]*true|id-token:[[:space:]]*write|MIGRATION_LIVE_ACK|D10_APPROV|activation lease|/api/[^ ]*activat' $FILES
          grep -q 'productionExecutionAvailable=false' apps/control-web/public/sana-v3-core.js
          grep -q 'canonicalMutated=false' apps/control-web/public/sana-v3-core.js
          grep -q 'D10=PENDING' apps/control-web/public/sana-v3-core.js
          grep -q 'no mueve dinero' apps/control-web/public/sana-v3-views-4.js
          grep -q 'sin cambio canónico' apps/control-web/public/sana-v3-plan-protocols.js
