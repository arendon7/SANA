name: SANA Demo Inventory Reference History

on:
  push:
    branches: [demo/sana-inventory-v138]
  pull_request:

permissions:
  contents: read

jobs:
  inventory-reference-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V138 reference provenance
        run: |
          set -euo pipefail
          for f in \
            apps/control-web/public/sana-v3-report-snapshot-inventory-references.js \
            apps/control-web/public/sana-v3-dataroom-inventory-references.js \
            apps/control-web/public/sana-v3-cycle-inventory-references.js \
            apps/control-web/public/sana-v3-due-diligence-inventory-reference-gaps.js; do node --check "$f"; done
          node scripts/validate-sana-inventory-reference-provenance.mjs
          ! grep -Eiq 'canonicalMutated[[:space:]]*=[[:space:]]*true|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|automaticConsumption|automaticProcurement|paymentExecuted|creditApproved|investmentApproved' apps/control-web/public/sana-v3-*inventory-reference*.js
