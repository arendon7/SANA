name: SANA Demo Data Room Access History

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-access.js'
      - 'apps/control-web/public/sana-v3-dataroom-access-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-access-gaps.js'
      - 'scripts/validate-sana-dataroom-access-history.mjs'
      - '.github/workflows/sana-demo-dataroom-access-history.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-access.js'
      - 'apps/control-web/public/sana-v3-dataroom-access-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-access-gaps.js'
      - 'scripts/validate-sana-dataroom-access-history.mjs'

jobs:
  dataroom-access-history-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and semantic contracts
        run: |
          node --check apps/control-web/public/sana-v3-report-snapshot-dataroom-access.js
          node --check apps/control-web/public/sana-v3-dataroom-access-history.js
          node --check apps/control-web/public/sana-v3-due-diligence-dataroom-access-gaps.js
          node scripts/validate-sana-dataroom-access-history.mjs
      - name: Validate snapshot-only and ref-only history
        run: |
          grep -q 'NO_LIVE_FALLBACK' apps/control-web/public/sana-v3-report-snapshot-dataroom-access.js
          grep -q 'COUNTERPARTY_REF_ONLY' apps/control-web/public/sana-v3-report-snapshot-dataroom-access.js
          grep -q 'GRANTOR_REF_ONLY' apps/control-web/public/sana-v3-report-snapshot-dataroom-access.js
          grep -q 'DOCUMENT_REF_ONLY' apps/control-web/public/sana-v3-report-snapshot-dataroom-access.js
          grep -q 'NO_COUNTERPARTY_IDENTITY' apps/control-web/public/sana-v3-report-snapshot-dataroom-access.js
          grep -q 'NO_FREEFORM_COPY' apps/control-web/public/sana-v3-report-snapshot-dataroom-access.js
          grep -q 'CHANGE ≠ IMPROVEMENT' apps/control-web/public/sana-v3-dataroom-access-history.js
          ! grep -q '__SANA_DATAROOM_ACCESS__' apps/control-web/public/sana-v3-dataroom-access-history.js
          ! grep -Eq '\bstorage\b' apps/control-web/public/sana-v3-dataroom-access-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-access-gaps.js
      - name: Validate documentary gaps only
        run: |
          grep -q 'NO_ACCESS ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-access-gaps.js
          grep -q 'ACCESS_REQUEST_ONLY ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-access-gaps.js
          grep -q 'ACCESS_OPEN ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-access-gaps.js
          grep -q 'ACCESS_EXPIRED ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-access-gaps.js
          grep -q 'ACCESS_REVOKED ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-access-gaps.js
          grep -q 'DATAROOM_ACCESS_GAP ≠ INVESTMENT_RISK ≠ ELIGIBILITY ≠ INVESTMENT_DECISION' apps/control-web/public/sana-v3-due-diligence-dataroom-access-gaps.js
      - name: Assert no approval, offer, scoring or financial execution authority
        run: |
          ! grep -Eq 'productionExecutionAvailable\s*=\s*true|productionActivationAllowed\s*=\s*true|canonicalMutated\s*=\s*true' apps/control-web/public/sana-v3-report-snapshot-dataroom-access.js apps/control-web/public/sana-v3-dataroom-access-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-access-gaps.js
          ! grep -Eq 'fetch\s*\(' apps/control-web/public/sana-v3-report-snapshot-dataroom-access.js apps/control-web/public/sana-v3-dataroom-access-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-access-gaps.js
