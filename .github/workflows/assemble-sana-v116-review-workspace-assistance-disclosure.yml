name: Assemble SANA v116 Review Workspace Assistance Disclosure

on:
  push:
    branches:
      - 'demo/sana-v116-review-workspace-assistance-disclosure'
    paths:
      - 'scripts/apply-v116-review-assistance-disclosure.py'
      - 'scripts/validate-sana-dataroom-review-workspace-v116.mjs'
      - '.github/workflows/sana-demo-dataroom-review-workspace-v116.yml'
      - '.github/workflows/assemble-sana-v116-review-workspace-assistance-disclosure.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-v116-review-workspace-assistance-disclosure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply, assemble and validate V116
        run: |
          python scripts/apply-v116-review-assistance-disclosure.py
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          active="const CACHE='sana-v3-demo-shell-v116';"
          if active not in s:
              old="const CACHE='sana-v3-demo-shell-v115';"
              if old not in s: raise SystemExit('active shell v115 not found')
              s=s.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v115';\n}\nconst CACHE='sana-v3-demo-shell-v116';",1)
              p.write_text(s)
          PY
          node scripts/validate-sana-dataroom-review-workspace.mjs
          for v in $(seq 88 116); do node scripts/validate-sana-dataroom-review-workspace-v${v}.mjs; done
      - name: Commit assembled V116
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/control-web/public/sana-v3-dataroom-entry.js apps/control-web/public/sana-v3-review-workspace.css apps/control-web/public/sana-v3-sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'demo: assemble review workspace assistance disclosure v116'
          git push origin HEAD:demo/sana-v116-review-workspace-assistance-disclosure
