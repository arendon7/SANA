name: TEMP SANA Capital V149 Assembly

on:
  push:
    branches: [demo/sana-capital-v149]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-capital-v149
      - name: Assemble v149 shell and script order
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('apps/control-web/public/sana-v3.html')
          s=html.read_text()
          asset='/sana-v3-capital-governance-references.js'
          if asset not in s:
              old='<script src="/sana-v3-capital-governance.js"></script><script src="/sana-v3-capital-review-ledger.js"></script>'
              new='<script src="/sana-v3-capital-governance.js"></script><script src="/sana-v3-capital-governance-references.js"></script><script src="/sana-v3-capital-review-ledger.js"></script>'
              assert s.count(old)==1, 'capital governance/review HTML anchor missing or duplicated'
              s=s.replace(old,new,1)
          html.write_text(s)

          sw=Path('apps/control-web/public/sana-v3-sw.js')
          s=sw.read_text()
          if "const CACHE='sana-v3-demo-shell-v149';" not in s:
              old="const CACHE='sana-v3-demo-shell-v148';"
              new="if(false){\nconst CACHE='sana-v3-demo-shell-v148';\n}\nconst CACHE='sana-v3-demo-shell-v149';"
              assert s.count(old)==1, 'expected exactly one active v148 marker'
              s=s.replace(old,new,1)
          anchor="'/sana-v3-capital-governance.js','/sana-v3-capital-review-ledger.js',"
          assets="'/sana-v3-capital-governance.js','/sana-v3-capital-governance-references.js','/sana-v3-capital-review-ledger.js',"
          if asset not in s:
              assert s.count(anchor)==1, 'capital governance SW anchor missing or duplicated'
              s=s.replace(anchor,assets,1)
          comment='// v149 validates Capital Governance evidence supports without identity, approval, term-sheet, commitment, closing, funding, eligibility, credit-score, custody or investment authority.'
          if comment not in s:
              anchor_comment='// v148 propagates Commercial Reference integrity through content-minimized Snapshot, Data Room, Cycle and Due Diligence without live fallback, weighting, identity, contract, order, payment, credit or investment authority.'
              assert s.count(anchor_comment)==1, 'v148 comment anchor missing or duplicated'
              s=s.replace(anchor_comment,anchor_comment+'\n'+comment,1)
          sw.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v149';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v148';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          test "$(grep -o '/sana-v3-capital-governance-references.js' apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1
          test "$(grep -o '<script src=\"/sana-v3-capital-governance-references.js\"></script>' apps/control-web/public/sana-v3.html | wc -l)" -eq 1
      - name: Commit assembly if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3.html apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble capital shell v149'
          git push origin HEAD:demo/sana-capital-v149
