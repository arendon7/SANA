name: TEMP SANA Circularity V154 Assembly

on:
  push:
    branches: [demo/sana-circularity-v154]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-circularity-v154
      - name: Assemble v154 shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v154';" not in s:
              old="const CACHE='sana-v3-demo-shell-v153';"
              new="if(false){\nconst CACHE='sana-v3-demo-shell-v153';\n}\nconst CACHE='sana-v3-demo-shell-v154';"
              assert s.count(old)==1, 'expected exactly one active v153 marker'
              s=s.replace(old,new,1)
          anchor="'/sana-v3-circularity-ledger.js',"
          assets="'/sana-v3-circularity-ledger.js','/sana-v3-circularity-references.js',"
          if '/sana-v3-circularity-references.js' not in s:
              assert s.count(anchor)==1, 'circularity ledger asset anchor missing/duplicated'
              s=s.replace(anchor,assets,1)
          comment='// v154 validates explicit Circularity EVIDENCE.supports references without evidence, receiver, recovery, disposition, impact, regulatory, credit or investment authority.'
          if comment not in s:
              anchor_comment='// v153 propagates minimized Capture Sync reference integrity through Snapshot, Cycle, DD and Data Room without live fallback, retrofill, weighting, source verification or decision authority.'
              assert s.count(anchor_comment)==1, 'v153 comment anchor missing/duplicated'
              s=s.replace(anchor_comment,anchor_comment+'\n'+comment,1)
          p.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v154';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v153';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          test "$(grep -o '/sana-v3-circularity-references.js' apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1
      - name: Commit assembly if changed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble circularity shell v154'
          git push origin HEAD:demo/sana-circularity-v154
