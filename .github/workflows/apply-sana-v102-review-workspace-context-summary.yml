name: Apply SANA v102 Review Workspace Context Summary

on:
  push:
    branches: [demo/sana-v102-review-workspace-context-summary]
    paths:
      - 'scripts/apply-v102-context-summary.py'
      - '.github/workflows/apply-sana-v102-review-workspace-context-summary.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: demo/sana-v102-review-workspace-context-summary}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply deterministic V102 patch
        run: python scripts/apply-v102-context-summary.py
      - name: Commit V102 source patch only
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-dataroom-review-workspace.js apps/control-web/public/sana-v3-review-workspace.css apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: apply Data Room review context summary v102'
          git push origin HEAD:demo/sana-v102-review-workspace-context-summary
