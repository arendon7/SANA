name: SANA Demo Data Room Review Response History

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-review-response.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-response-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-review-response-gaps.js'
      - 'scripts/validate-sana-dataroom-review-response-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - '.github/workflows/sana-demo-dataroom-review-response-history.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-review-response.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-response-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-review-response-gaps.js'
      - 'scripts/validate-sana-dataroom-review-response-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'

jobs:
  review-response-history-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and semantic contracts
        run: |
          node --check apps/control-web/public/sana-v3-report-snapshot-dataroom-review-response.js
          node --check apps/control-web/public/sana-v3-dataroom-review-response-history.js
          node --check apps/control-web/public/sana-v3-due-diligence-dataroom-review-response-gaps.js
          node scripts/validate-sana-dataroom-review-response-history.mjs
      - name: Validate snapshot-only history
        run: |
          grep -q 'SNAPSHOT_DATAROOM_REVIEW_RESPONSE_ONLY' apps/control-web/public/sana-v3-report-snapshot-dataroom-review-response.js
          grep -q 'NO_LIVE_FALLBACK' apps/control-web/public/sana-v3-dataroom-review-response-history.js
          grep -q 'LIVE_STATE ≠ SNAPSHOT ≠ HISTORICAL_EVIDENCE' apps/control-web/public/sana-v3-dataroom-review-response-history.js
          ! grep -q '__SANA_DATAROOM_REVIEW_RESPONSE__' apps/control-web/public/sana-v3-dataroom-review-response-history.js
          ! grep -Eq '\bstorage\s*(\?\.|\.)' apps/control-web/public/sana-v3-dataroom-review-response-history.js
      - name: Validate documentary gaps only
        run: |
          grep -q 'NO_REVIEW_RESPONSE ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-review-response-gaps.js
          grep -q 'RESPONSE_OPEN ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-review-response-gaps.js
          grep -q 'RESPONSE_CLOSED ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-review-response-gaps.js
          grep -q 'NO_DOCUMENT_RESPONSE ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-review-response-gaps.js
          grep -q 'RESPONSE_GAP ≠ FINDING ≠ REMEDIATION_ITEM ≠ RISK_SCORE ≠ REVIEW_OUTCOME' apps/control-web/public/sana-v3-due-diligence-dataroom-review-response-gaps.js
      - name: Validate assembly
        run: |
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');const html=fs.readFileSync('apps/control-web/public/sana-v3.html','utf8'),sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');const files=['/sana-v3-report-snapshot-dataroom-review-response.js','/sana-v3-due-diligence-dataroom-review-response-gaps.js','/sana-v3-dataroom-review-response-history.js'];for(const f of files){assert(html.includes(f),`HTML missing ${f}`);assert(sw.includes(`'${f}'`),`PWA missing ${f}`)}const versions=[...sw.matchAll(/const CACHE='sana-v3-demo-shell-v(\d+)'/g)].map(m=>Number(m[1]));assert(versions.length&&Math.max(...versions)>=82,'shell must be v82 or newer');
          NODE
      - name: Assert review-only history
        run: |
          ! grep -Eq 'fetch\s*\(' apps/control-web/public/sana-v3-report-snapshot-dataroom-review-response.js apps/control-web/public/sana-v3-dataroom-review-response-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-review-response-gaps.js
          ! grep -Eq 'productionExecutionAvailable\s*=\s*true|productionActivationAllowed\s*=\s*true|canonicalMutated\s*=\s*true' apps/control-web/public/sana-v3-report-snapshot-dataroom-review-response.js apps/control-web/public/sana-v3-dataroom-review-response-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-review-response-gaps.js

# v82: snapshot-only Review Response provenance, documentary gaps only, no issue-resolution or review-restart inference.
