name: SANA Demo Labor Reference History

on:
  push:
    branches: [demo/sana-labor-v142]
  pull_request:

permissions:
  contents: read

jobs:
  labor-reference-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Labor Reference History V142
        run: |
          set -euo pipefail
          for f in \
            apps/control-web/public/sana-v3-report-snapshot-labor-references.js \
            apps/control-web/public/sana-v3-dataroom-labor-references.js \
            apps/control-web/public/sana-v3-cycle-labor-references.js \
            apps/control-web/public/sana-v3-due-diligence-labor-reference-gaps.js \
            apps/control-web/public/sana-v3-cycle-labor-provenance.js \
            apps/control-web/public/sana-v3-sw.js; do node --check "$f"; done
          node scripts/validate-sana-labor-reference-provenance.mjs
          grep -Fq 'PRIVACY_MINIMIZED' apps/control-web/public/sana-v3-report-snapshot-labor-references.js
          grep -Fq 'NO_LIVE_FALLBACK' apps/control-web/public/sana-v3-dataroom-labor-references.js
          grep -Fq 'NON_WEIGHTED' apps/control-web/public/sana-v3-cycle-labor-references.js
          grep -Fq 'NOT_CAPTURED_OR_LEGACY ≠ GAP' apps/control-web/public/sana-v3-due-diligence-labor-reference-gaps.js
          grep -Fq 'DECLARED_NON_CANONICAL_REFERENCE ≠ GAP' apps/control-web/public/sana-v3-due-diligence-labor-reference-gaps.js
          node - <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');
          const loader=fs.readFileSync('apps/control-web/public/sana-v3-cycle-labor-provenance.js','utf8');
          const marker="if(false){\nconst CACHE='sana-v3-demo-shell-v141';\n}\nconst CACHE='sana-v3-demo-shell-v142';";
          if(!sw.includes(marker))throw new Error('v141 historical / v142 active marker missing');
          if((sw.match(/const CACHE='sana-v3-demo-shell-v142';/g)||[]).length!==1)throw new Error('v142 cache marker count invalid');
          const assets=[
            '/sana-v3-report-snapshot-labor-references.js',
            '/sana-v3-cycle-labor-references.js',
            '/sana-v3-due-diligence-labor-reference-gaps.js',
            '/sana-v3-dataroom-labor-references.js'];
          for(const a of assets){
            if((sw.split(a).length-1)!==1)throw new Error(`SW asset count invalid: ${a}`);
            if(!loader.includes(a))throw new Error(`loader missing: ${a}`);
          }
          if(!loader.includes("s.src='/sana-v3-labor-references.js'"))throw new Error('V141 loader missing');
          if(!loader.includes('s.onload=()=>loadHistory()'))throw new Error('V141→V142 loader chain missing');
          if(!loader.includes('data-sana-labor-history-v142')&&!loader.includes('sanaLaborHistoryV142'))throw new Error('V142 loader marker missing');
          if(!sw.includes('// v142 propagates Labor reference integrity'))throw new Error('v142 provenance marker missing');
          NODE
          ! grep -Eiq 'canonicalMutated[[:space:]]*=[[:space:]]*true|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|payrollExecuted|paymentExecuted|performanceScoreCreated|creditApproved|investmentApproved' apps/control-web/public/sana-v3-*labor-reference*.js apps/control-web/public/sana-v3-cycle-labor-provenance.js
