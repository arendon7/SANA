name: SANA Demo Labor Reference History

on:
  push:
    branches: [demo/sana-labor-v142]
  pull_request:

permissions:
  contents: read

jobs:
  labor-reference-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Labor Reference History V142
        run: |
          set -euo pipefail
          for f in \
            apps/control-web/public/sana-v3-report-snapshot-labor-references.js \
            apps/control-web/public/sana-v3-dataroom-labor-references.js \
            apps/control-web/public/sana-v3-cycle-labor-references.js \
            apps/control-web/public/sana-v3-due-diligence-labor-reference-gaps.js; do node --check "$f"; done
          node scripts/validate-sana-labor-reference-provenance.mjs
          grep -Fq 'PRIVACY_MINIMIZED' apps/control-web/public/sana-v3-report-snapshot-labor-references.js
          grep -Fq 'NO_LIVE_FALLBACK' apps/control-web/public/sana-v3-dataroom-labor-references.js
          grep -Fq 'NON_WEIGHTED' apps/control-web/public/sana-v3-cycle-labor-references.js
          grep -Fq 'NOT_CAPTURED_OR_LEGACY ≠ GAP' apps/control-web/public/sana-v3-due-diligence-labor-reference-gaps.js
          grep -Fq 'DECLARED_NON_CANONICAL_REFERENCE ≠ GAP' apps/control-web/public/sana-v3-due-diligence-labor-reference-gaps.js
          ! grep -Eiq 'canonicalMutated[[:space:]]*=[[:space:]]*true|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|payrollExecuted|paymentExecuted|performanceScoreCreated|creditApproved|investmentApproved' apps/control-web/public/sana-v3-*labor-reference*.js
