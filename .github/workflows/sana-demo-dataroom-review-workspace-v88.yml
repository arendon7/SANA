name: SANA Demo Data Room Review Workspace V88
on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths: ['apps/control-web/public/sana-v3-dataroom-review-workspace.js','apps/control-web/public/sana-v3-review-workspace.css','scripts/validate-sana-dataroom-review-workspace-v88.mjs','apps/control-web/public/sana-v3.html','apps/control-web/public/sana-v3-sw.js']
  pull_request:
    paths: ['apps/control-web/public/sana-v3-dataroom-review-workspace.js','apps/control-web/public/sana-v3-review-workspace.css','scripts/validate-sana-dataroom-review-workspace-v88.mjs','apps/control-web/public/sana-v3.html','apps/control-web/public/sana-v3-sw.js']
jobs:
  review-workspace-v88-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/validate-sana-dataroom-review-workspace.mjs
      - run: node scripts/validate-sana-dataroom-review-workspace-v88.mjs
      - run: |
          grep -q '/sana-v3-dataroom-review-round.js.*sana-v3-dataroom-review-workspace.js.*sana-v3-dataroom-impact-history.js' apps/control-web/public/sana-v3.html
          grep -Eq "^const CACHE='sana-v3-demo-shell-v(8[8-9]|9[0-9]|[1-9][0-9]{2,})';" apps/control-web/public/sana-v3-sw.js
          ! grep -Eq 'fetch\s*\(|canonicalMutated\s*=\s*true|dueDiligenceApprovals\s*:\s*[1-9]' apps/control-web/public/sana-v3-dataroom-review-workspace.js
