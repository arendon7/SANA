name: SANA Demo Circularity Reference History V155

on:
  pull_request:
  push:
    branches: [demo/sana-circularity-v155]

permissions:
  contents: read

jobs:
  circularity-reference-history-v155:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Circularity Reference History V155 final
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            apps/control-web/public/sana-v3-circularity-references.js \
            apps/control-web/public/sana-v3-report-snapshot-circularity-references.js \
            apps/control-web/public/sana-v3-dataroom-circularity-references.js \
            apps/control-web/public/sana-v3-cycle-circularity-references.js \
            apps/control-web/public/sana-v3-due-diligence-circularity-reference-gaps.js \
            apps/control-web/public/sana-v3-sw.js; do node --check "$f"; done
          node scripts/validate-sana-circularity-ledger.mjs
          node scripts/validate-sana-cycle-circularity.mjs
          node scripts/validate-sana-circularity-references-v154.mjs
          node scripts/validate-sana-circularity-reference-provenance-v155.mjs
          node scripts/validate-sana-reference-hardening-v149.mjs
          node scripts/validate-sana-reference-history-migration-v149.mjs
          grep -Fq 'ADDITIVE_V155 · CIRCULARITY_REFERENCE_PROVENANCE' apps/control-web/public/sana-v3-report-snapshot-circularity-references.js
          grep -Fq 'COUNT_AND_KIND_ONLY · VALUE_NOT_EXPOSED' apps/control-web/public/sana-v3-report-snapshot-circularity-references.js
          grep -Fq 'NO_RETROFILL' apps/control-web/public/sana-v3-report-snapshot-circularity-references.js
          grep -Fq 'ROW_LEVEL_STRUCTURAL_DIFF' apps/control-web/public/sana-v3-dataroom-circularity-references.js
          grep -Fq 'NON_WEIGHTED' apps/control-web/public/sana-v3-cycle-circularity-references.js
          grep -Fq 'SOURCE_CASE_LOT_DEFINES_CYCLE_MEMBERSHIP' apps/control-web/public/sana-v3-cycle-circularity-references.js
          grep -Fq 'NOT_CAPTURED_OR_LEGACY ≠ GAP' apps/control-web/public/sana-v3-due-diligence-circularity-reference-gaps.js
          grep -Fq 'DECLARED_NON_CANONICAL_REFERENCE ≠ GAP' apps/control-web/public/sana-v3-due-diligence-circularity-reference-gaps.js
          ! grep -Eq '__SANA_CIRCULARITY_LEDGER__|storage\.?|localStorage' apps/control-web/public/sana-v3-dataroom-circularity-references.js apps/control-web/public/sana-v3-cycle-circularity-references.js apps/control-web/public/sana-v3-due-diligence-circularity-reference-gaps.js
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('apps/control-web/public/sana-v3-circularity-references.js','utf8');
          const sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');
          const assets=['/sana-v3-report-snapshot-circularity-references.js','/sana-v3-cycle-circularity-references.js','/sana-v3-due-diligence-circularity-reference-gaps.js','/sana-v3-dataroom-circularity-references.js'];
          if(!loader.includes("const VERSION='V155'"))throw new Error('V155 loader version missing');
          if(!loader.includes('__SANA_CIRCULARITY_REFERENCE_HISTORY_LOADER__'))throw new Error('V155 loader state missing');
          if(!loader.includes("__SANA_CIRCULARITY_LEDGER__?.referenceVersion==='V154'"))throw new Error('V154 dependency guard missing');
          let last=-1;for(const a of assets){const i=loader.indexOf(a);if(i<0||i<=last)throw new Error(`V155 loader asset/order invalid: ${a}`);last=i;}
          if((sw.match(/^const CACHE='sana-v3-demo-shell-v155';$/gm)||[]).length!==1)throw new Error('v155 active cache marker invalid');
          if(!sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v154';\n}"))throw new Error('v154 historical marker missing');
          for(const a of assets)if((sw.split(a).length-1)!==1)throw new Error(`V155 SW asset count invalid: ${a}`);
          if(!sw.includes('// v155 propagates minimized Circularity reference integrity'))throw new Error('v155 provenance marker missing');
          NODE
          ! grep -Eiq 'canonicalMutated[[:space:]]*[:=][[:space:]]*true|productionExecutionAvailable[[:space:]]*[:=][[:space:]]*true|verifiedDisposition[[:space:]]*[:=][[:space:]]*true|certifiedRecovery[[:space:]]*[:=][[:space:]]*true|environmentalImpactVerified[[:space:]]*[:=][[:space:]]*true|regulatoryClassificationVerified[[:space:]]*[:=][[:space:]]*true|creditApproved|eligibilityApproved|investmentApproved' apps/control-web/public/sana-v3-*circularity-reference*.js
