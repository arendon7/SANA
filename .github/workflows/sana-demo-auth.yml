name: SANA DEMO auth sandbox

on:
  pull_request:
    paths:
      - 'apps/control-web/public/demo-*'
      - 'apps/control-web/public/sana-v3*'
      - 'apps/control-web/server.mjs'
      - 'config/product/sana-demo-auth.json'
      - 'infra/firebase-demo/**'
      - 'scripts/validate-sana-demo-auth.mjs'
      - 'vercel.json'
      - '.github/workflows/sana-demo-auth.yml'
  push:
    branches:
      - 'demo/sana-functional-auth-v1'
    paths:
      - 'apps/control-web/public/demo-*'
      - 'apps/control-web/public/sana-v3*'
      - 'apps/control-web/server.mjs'
      - 'config/product/sana-demo-auth.json'
      - 'infra/firebase-demo/**'
      - 'scripts/validate-sana-demo-auth.mjs'
      - 'vercel.json'
      - '.github/workflows/sana-demo-auth.yml'

permissions:
  contents: read

jobs:
  demo-auth-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and contract validation
        run: |
          node --check apps/control-web/server.mjs
          node --check apps/control-web/public/demo-auth.js
          node --check apps/control-web/public/demo-session.js
          node --check apps/control-web/public/sana-v3-cloud-state.js
          node --check apps/control-web/public/sana-v3-access.js
          node scripts/validate-sana-demo-auth.mjs
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (cfg.services?.sana_demo?.root !== 'apps/control-web/') throw new Error('VERCEL_DEMO_ROOT_DRIFT');
          if (cfg.services?.sana_demo?.entrypoint !== 'server.mjs') throw new Error('VERCEL_DEMO_ENTRYPOINT_DRIFT');
          const rewrite = cfg.rewrites?.find((item) => item.source === '/(.*)');
          if (rewrite?.destination?.service !== 'sana_demo') throw new Error('VERCEL_DEMO_ROUTING_DRIFT');
          NODE

      - name: Runtime sandbox smoke
        shell: bash
        run: |
          set -euo pipefail
          node apps/control-web/server.mjs > /tmp/sana-demo.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4273/demo/health > /tmp/health.json; then
              break
            fi
            sleep 0.25
          done

          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));if(h.environment!=='DEMO'||h.firebaseConfigured!==true||h.firebaseProjectId!=='sana-demo-web'||h.productionExecutionAvailable!==false||h.productionActivationAllowed!==false||h.canonicalMutated!==false)process.exit(1)"

          curl --fail --silent http://127.0.0.1:4273/demo-config.js > /tmp/demo-config.js
          grep -q 'sana-demo-web.firebaseapp.com' /tmp/demo-config.js
          grep -q '1:454867293969:web:1b4384820692b58449deb0' /tmp/demo-config.js

          curl --fail --silent http://127.0.0.1:4273/ > /tmp/login.html
          grep -q 'DEMO 100% FUNCIONAL' /tmp/login.html
          grep -q 'Explorar SANA sin registrarme' /tmp/login.html
          grep -q 'Firebase Authentication' /tmp/login.html
          grep -q "'/sana-v3.html'" apps/control-web/public/demo-auth.js

          curl --fail --silent http://127.0.0.1:4273/sana-v3.html > /tmp/sana-v3.html
          grep -q 'id="app-content"' /tmp/sana-v3.html
          grep -q '/sana-v3-cloud-state.js' /tmp/sana-v3.html
          grep -q '/sana-v3-core.js' /tmp/sana-v3.html
          grep -q '/sana-v3-plan-protocols.js' /tmp/sana-v3.html
          grep -q '/sana-v3-advisory-protocols.js' /tmp/sana-v3.html
          grep -q '/sana-v3-runtime.js' /tmp/sana-v3.html
          grep -q '/sana-v3-access.js' /tmp/sana-v3.html

          curl --fail --silent http://127.0.0.1:4273/control > /tmp/control.html
          grep -q '/demo-session.js' /tmp/control.html

          status=$(curl --silent --output /tmp/blocked.json --write-out '%{http_code}' http://127.0.0.1:4273/api/control/production-activation)
          test "$status" = '404'
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/blocked.json','utf8'));if(b.browserActivationAllowed!==false||b.productionExecutionAvailable!==false||b.canonicalMutated!==false)process.exit(1)"

      - name: Confirm Firestore owner boundary and Supabase removal
        shell: bash
        run: |
          test ! -e infra/supabase-demo/001_auth_profiles.sql
          ! grep -R "SANA_DEMO_SUPABASE\|SUPABASE_AUTH" apps/control-web config/product/sana-demo-auth.json
          grep -q 'match /demo_user_state/{userId}' infra/firebase-demo/firestore.rules
          grep -q 'request.auth.uid == userId' infra/firebase-demo/firestore.rules
          grep -q 'request.resource.data.revision == resource.data.revision + 1' infra/firebase-demo/firestore.rules
          grep -q 'NO_SILENT_OVERWRITE' config/product/sana-demo-auth.json
