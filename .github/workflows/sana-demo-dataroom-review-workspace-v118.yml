name: SANA Demo Data Room Review Workspace V118

on:
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-entry.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-dataroom-review-workspace*.mjs'
      - '.github/workflows/sana-demo-dataroom-review-workspace-v118.yml'

permissions:
  contents: read

jobs:
  review-workspace-v118-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve V87–V118 workspace contracts
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          for v in $(seq 88 118); do node scripts/validate-sana-dataroom-review-workspace-v${v}.mjs; done
      - name: Assert V118 shell, overview semantics and read-only boundary
        run: |
          grep -F "const CACHE='sana-v3-demo-shell-v118';" apps/control-web/public/sana-v3-sw.js
          grep -F 'TECHNICAL_COUNT ≠ SEVERITY' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'SOURCE_COUNT ≠ REVIEW_SCORE' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'NONMATCH_COUNT ≠ RISK' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'COUNT_AGGREGATION ≠ PRIORITY' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'data-review-source-overview' apps/control-web/public/sana-v3-dataroom-entry.js
          ! grep -Eq 'rwSourceOverview|rwTechnicalCount|data-review-source-overview-state|localStorage\.(setItem|removeItem|clear)|sessionStorage' apps/control-web/public/sana-v3-dataroom-entry.js
