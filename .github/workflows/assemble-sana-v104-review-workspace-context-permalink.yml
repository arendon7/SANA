name: Assemble SANA v104 Review Workspace Context Permalink

on:
  push:
    branches: [demo/sana-v104-review-workspace-context-permalink]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-entry.js'
      - 'scripts/validate-sana-dataroom-review-workspace-v104.mjs'
      - '.github/workflows/assemble-sana-v104-review-workspace-context-permalink.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: demo/sana-v104-review-workspace-context-permalink}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Bump V104 PWA shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v104';" not in s:
              old="const CACHE='sana-v3-demo-shell-v103';"
              assert old in s
              s=s.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v103';\n}\nconst CACHE='sana-v3-demo-shell-v104';",1)
              p.write_text(s)
          PY
      - name: Validate V87–V104
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          node scripts/validate-sana-dataroom-review-workspace-v88.mjs
          node scripts/validate-sana-dataroom-review-workspace-v89.mjs
          node scripts/validate-sana-dataroom-review-workspace-v90.mjs
          node scripts/validate-sana-dataroom-review-workspace-v91.mjs
          node scripts/validate-sana-dataroom-review-workspace-v92.mjs
          node scripts/validate-sana-dataroom-review-workspace-v93.mjs
          node scripts/validate-sana-dataroom-review-workspace-v94.mjs
          node scripts/validate-sana-dataroom-review-workspace-v95.mjs
          node scripts/validate-sana-dataroom-review-workspace-v96.mjs
          node scripts/validate-sana-dataroom-review-workspace-v97.mjs
          node scripts/validate-sana-dataroom-review-workspace-v98.mjs
          node scripts/validate-sana-dataroom-review-workspace-v99.mjs
          node scripts/validate-sana-dataroom-review-workspace-v100.mjs
          node scripts/validate-sana-dataroom-review-workspace-v101.mjs
          node scripts/validate-sana-dataroom-review-workspace-v102.mjs
          node scripts/validate-sana-dataroom-review-workspace-v103.mjs
          node scripts/validate-sana-dataroom-review-workspace-v104.mjs
      - name: Commit assembled V104 shell
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble Data Room review context permalink v104'
          git push origin HEAD:demo/sana-v104-review-workspace-context-permalink
