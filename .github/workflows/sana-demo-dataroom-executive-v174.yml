name: SANA Demo Data Room Executive V174

on:
  push:
    branches: [demo/sana-dataroom-executive-v174]
  pull_request:

permissions:
  contents: read

jobs:
  validate-v174:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check apps/control-web/public/sana-v3-dataroom-executive-v174.js
      - name: V170 regression
        run: node scripts/validate-sana-dataroom-executive-v170.mjs
      - name: V171 regression
        run: node scripts/validate-sana-dataroom-executive-v171.mjs
      - name: V172 regression
        run: node scripts/validate-sana-dataroom-executive-v172.mjs
      - name: V173 regression
        run: node scripts/validate-sana-dataroom-executive-v173.mjs
      - name: V174 claim envelope adversarial validation
        run: node scripts/validate-sana-dataroom-executive-v174.mjs
      - name: V174 read-only surface
        shell: bash
        run: |
          set -euo pipefail
          file=apps/control-web/public/sana-v3-dataroom-executive-v174.html
          test -f "$file"
          grep -Fq 'Claim envelope · verification boundaries' "$file"
          grep -Fq 'CLAIM ≠ ATTESTATION' "$file"
          grep -Fq 'DOCUMENT ASSURANCE ≠ EXTERNAL VERIFICATION OF CLAIM' "$file"
          ! grep -Fqi '<form' "$file"
          ! grep -Fq 'fetch(' "$file"
          ! grep -Fq 'XMLHttpRequest' "$file"
          ! grep -Fq 'localStorage.setItem' "$file"
          ! grep -Fq 'sessionStorage.setItem' "$file"
      - name: Preserve V174 authority and link boundaries
        shell: bash
        run: |
          set -euo pipefail
          js=apps/control-web/public/sana-v3-dataroom-executive-v174.js
          grep -Fq 'attestationAuthority:false' "$js"
          grep -Fq 'externalVerificationAuthority:false' "$js"
          grep -Fq 'truthVerificationAuthority:false' "$js"
          grep -Fq 'evidentiarySufficiencyAuthority:false' "$js"
          grep -Fq 'reviewerIdentityAuthority:false' "$js"
          grep -Fq 'reviewerQualificationAuthority:false' "$js"
          grep -Fq 'certificationAuthority:false' "$js"
          grep -Fq 'decisionAuthority:false' "$js"
          grep -Fq 'const LINK_RULES=Object.freeze([])' "$js"
          grep -Fq 'CLAIM_SPECIFIC_LINK_NOT_FOUND' "$js"
          grep -Fq 'DO_NOT_RECONSTRUCT_MISSING_HISTORY' "$js"
          ! grep -Eiq 'canonicalMutationAvailable[[:space:]]*:[[:space:]]*true|financialMutationAvailable[[:space:]]*:[[:space:]]*true|attestationAuthority[[:space:]]*:[[:space:]]*true|externalVerificationAuthority[[:space:]]*:[[:space:]]*true|truthVerificationAuthority[[:space:]]*:[[:space:]]*true|decisionAuthority[[:space:]]*:[[:space:]]*true|riskScore[[:space:]]*:|creditScore[[:space:]]*:|investmentScore[[:space:]]*:|projectScore[[:space:]]*:|overallScore[[:space:]]*:' "$js"