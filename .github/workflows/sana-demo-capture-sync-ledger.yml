name: SANA Demo Capture Sync Ledger

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-capture-sync-ledger.js'
      - 'apps/control-web/public/sana-v3-capture-sync-references.js'
      - 'apps/control-web/public/sana-v3-cycle-capture-sync-provenance.js'
      - 'apps/control-web/public/sana-v3-capture-sync-runtime-bridge.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-capture-sync-ledger.mjs'
      - 'scripts/validate-sana-capture-sync-references-v150.mjs'
      - '.github/workflows/sana-demo-capture-sync-ledger.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-capture-sync-ledger.js'
      - 'apps/control-web/public/sana-v3-capture-sync-references.js'
      - 'apps/control-web/public/sana-v3-cycle-capture-sync-provenance.js'
      - 'apps/control-web/public/sana-v3-capture-sync-runtime-bridge.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-capture-sync-ledger.mjs'
      - 'scripts/validate-sana-capture-sync-references-v150.mjs'
      - '.github/workflows/sana-demo-capture-sync-ledger.yml'

permissions:
  contents: read

jobs:
  capture-sync-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and semantic contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-capture-sync-ledger.js
          node --check apps/control-web/public/sana-v3-cycle-capture-sync-provenance.js
          node --check apps/control-web/public/sana-v3-capture-sync-runtime-bridge.js
          node scripts/validate-sana-capture-sync-ledger.mjs
      - name: Validate record-level boundaries
        shell: bash
        run: |
          set -euo pipefail
          f='apps/control-web/public/sana-v3-capture-sync-ledger.js'
          grep -q '__SANA_CAPTURE_SYNC_LEDGER__' "$f"
          grep -q 'SANA_CAPTURE_SYNC_LEDGER_V1' "$f"
          grep -q 'LOCAL_CAPTURE ≠ QUEUED' "$f"
          grep -q 'QUEUED ≠ SYNC_ATTEMPT' "$f"
          grep -q 'SYNC_ATTEMPT ≠ SERVER_ACK' "$f"
          grep -q 'SERVER_ACK ≠ SOURCE_VERIFIED' "$f"
          grep -q 'ONLINE ≠ VERIFIED_SYNC' "$f"
          grep -q 'QUEUE_EMPTY ≠ DATA_COMPLETE' "$f"
          grep -q 'CONFLICT_RESOLVED ≠ SOURCE_VERIFIED' "$f"
          grep -q 'DEVICE_ID ≠ CERTIFIED_INSTRUMENT' "$f"
          grep -q 'NO_AUTOMATIC_CONFLICT_RESOLUTION' "$f"
      - name: Validate new offline records have explicit queue relation
        shell: bash
        run: |
          set -euo pipefail
          bridge='apps/control-web/public/sana-v3-capture-sync-runtime-bridge.js'
          grep -q '__SANA_CAPTURE_SYNC_RUNTIME_BRIDGE__' "$bridge"
          grep -q 'q.recordId=record.id' "$bridge"
          grep -q "q.state=q.state||'PENDING_SERVER'" "$bridge"
          grep -q 'LEGACY_QUEUE_UNCHANGED' "$bridge"
          grep -q 'LEGACY_QUEUE_ENTRY_UNLINKED' apps/control-web/public/sana-v3-capture-sync-ledger.js
      - name: Validate cycle projection is read-only and non-weighted
        shell: bash
        run: |
          set -euo pipefail
          f='apps/control-web/public/sana-v3-cycle-capture-sync-provenance.js'
          grep -q '__SANA_CYCLE_CAPTURE_SYNC__' "$f"
          grep -q 'CAPTURE_SYNC_PROVENANCE ≠ CYCLE_GATE' "$f"
          ! grep -q 'completeness[[:space:]]*=' "$f"
          ! grep -q 'readyForArchive[[:space:]]*=' "$f"
      - name: Validate assembly and v53 compatibility shell
        shell: bash
        run: |
          set -euo pipefail
          html='apps/control-web/public/sana-v3.html'; sw='apps/control-web/public/sana-v3-sw.js'
          grep -q '/sana-v3-data-trust.js.*sana-v3-capture-sync-ledger.js.*sana-v3-harvest-ledger.js' "$html"
          grep -q '/sana-v3-cycle-forecast-provenance.js.*sana-v3-cycle-capture-sync-provenance.js.*sana-v3-cycle-labor-provenance.js' "$html"
          grep -q '/sana-v3-runtime.js.*sana-v3-capture-sync-runtime-bridge.js.*sana-v3-access.js' "$html"
          grep -q "'/sana-v3-capture-sync-ledger.js'" "$sw"
          grep -q "'/sana-v3-cycle-capture-sync-provenance.js'" "$sw"
          grep -q "'/sana-v3-capture-sync-runtime-bridge.js'" "$sw"
          grep -q "^const CACHE='sana-v3-demo-shell-v53';" "$sw"
      - name: Assert no server ACK fabrication, production or canonical authority
        shell: bash
        run: |
          set -euo pipefail
          files='apps/control-web/public/sana-v3-capture-sync-ledger.js apps/control-web/public/sana-v3-cycle-capture-sync-provenance.js apps/control-web/public/sana-v3-capture-sync-runtime-bridge.js'
          ! grep -Eiq 'productionExecutionAvailable[[:space:]]*=[[:space:]]*true|canonicalMutated[[:space:]]*=[[:space:]]*true|automaticResolution[[:space:]]*:[[:space:]]*true|sourceVerified[[:space:]]*:[[:space:]]*true' $files
          ! grep -Eiq 'fetch\(' $files

  capture-sync-references-v150:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V150 reference contracts and V149 compatibility
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-capture-sync-references.js
          node --check apps/control-web/public/sana-v3-cycle-capture-sync-provenance.js
          node --check apps/control-web/public/sana-v3-sw.js
          node scripts/validate-sana-capture-sync-references-v150.mjs
          node scripts/validate-sana-reference-hardening-v149.mjs
          node scripts/validate-sana-reference-history-migration-v149.mjs
      - name: Assert V150 reference semantics
        shell: bash
        run: |
          set -euo pipefail
          f='apps/control-web/public/sana-v3-capture-sync-references.js'
          grep -Fq 'LEGACY_REFERENCE_NOT_CAPTURED' "$f"
          grep -Fq 'DECLARED_NON_CANONICAL_REFERENCE' "$f"
          grep -Fq 'RECORD_REF' "$f"
          grep -Fq 'ACK_COHERENCE_REF' "$f"
          grep -Fq 'CONFLICT_CANDIDATE_REF' "$f"
          grep -Fq 'ACK_REFERENCE_COHERENCE ≠ SERVER_VERIFICATION' "$f"
          grep -Fq 'CANDIDATE_REFERENCE ≠ SOURCE_VERIFICATION' "$f"
          grep -Fq 'CONFLICT_CANDIDATE ≠ TRUTH' "$f"
          grep -Fq 'NO_CANONICAL_WRITE' "$f"
      - name: Assert V150 loader and PWA assembly
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('apps/control-web/public/sana-v3-cycle-capture-sync-provenance.js','utf8');
          const sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');
          if(!loader.includes("const VERSION='V150',SRC='/sana-v3-capture-sync-references.js'"))throw new Error('V150 loader contract missing');
          if(!loader.includes('__SANA_CAPTURE_SYNC_REFERENCES_LOADER__'))throw new Error('V150 loader state missing');
          if(!loader.includes("__SANA_CAPTURE_SYNC_LEDGER__?.schema==='SANA_CAPTURE_SYNC_LEDGER_V1'"))throw new Error('Capture Sync dependency guard missing');
          if(!loader.includes('__SANA_DATA_TRUST__?.rows'))throw new Error('Data Trust dependency guard missing');
          if((sw.match(/const CACHE='sana-v3-demo-shell-v150';/g)||[]).length!==1)throw new Error('v150 active cache marker must remain exactly once');
          if(!sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v149';\n}"))throw new Error('v149 historical cache marker missing');
          if((sw.split('/sana-v3-capture-sync-references.js').length-1)!==1)throw new Error('V150 SW asset count invalid');
          if(!sw.includes('// v150 validates Capture Sync record/ACK/conflict-candidate reference coherence'))throw new Error('v150 provenance marker missing');
          NODE
      - name: Assert no authority expansion and reserve reference history for V151
        shell: bash
        run: |
          set -euo pipefail
          f='apps/control-web/public/sana-v3-capture-sync-references.js'
          ! grep -Eiq 'canonicalMutated[[:space:]]*[:=][[:space:]]*true|productionExecutionAvailable[[:space:]]*[:=][[:space:]]*true|sourceVerified[[:space:]]*[:=][[:space:]]*true|hardwareVerified[[:space:]]*[:=][[:space:]]*true|calibratedMeasurement[[:space:]]*[:=][[:space:]]*true|automaticResolution[[:space:]]*[:=][[:space:]]*true|creditApproved|investmentApproved|managementDecision[[:space:]]*[:=]' "$f"
          ! grep -Eiq 'fetch\(|XMLHttpRequest|WebSocket' "$f"
          test ! -e apps/control-web/public/sana-v3-report-snapshot-capture-sync-references.js
          test ! -e apps/control-web/public/sana-v3-cycle-capture-sync-references.js
          test ! -e apps/control-web/public/sana-v3-due-diligence-capture-sync-reference-gaps.js
          test ! -e apps/control-web/public/sana-v3-dataroom-capture-sync-references.js
