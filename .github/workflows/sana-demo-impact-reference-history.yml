name: SANA Demo Impact Reference History

on:
  push:
    branches: [demo/sana-impact-v159]
  pull_request:

permissions:
  contents: read

jobs:
  impact-reference-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Impact Reference History V159
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            apps/control-web/public/sana-v3-impact-references.js \
            apps/control-web/public/sana-v3-report-snapshot-impact-references.js \
            apps/control-web/public/sana-v3-cycle-impact-references.js \
            apps/control-web/public/sana-v3-due-diligence-impact-reference-gaps.js \
            apps/control-web/public/sana-v3-dataroom-impact-references.js \
            apps/control-web/public/sana-v3-impact-ledger.js \
            apps/control-web/public/sana-v3-sw.js; do node --check "$f"; done
          node scripts/validate-sana-impact-reference-provenance.mjs
          grep -Fq 'CONTENT_MINIMIZED' apps/control-web/public/sana-v3-report-snapshot-impact-references.js
          grep -Fq 'COUNT_AND_KIND_ONLY · VALUE_NOT_EXPOSED' apps/control-web/public/sana-v3-report-snapshot-impact-references.js
          grep -Fq 'NO_LIVE_FALLBACK' apps/control-web/public/sana-v3-dataroom-impact-references.js
          grep -Fq 'NON_WEIGHTED' apps/control-web/public/sana-v3-cycle-impact-references.js
          grep -Fq 'NOT_CAPTURED_OR_LEGACY ≠ GAP' apps/control-web/public/sana-v3-due-diligence-impact-reference-gaps.js
          grep -Fq 'DECLARED_NON_CANONICAL_REFERENCE ≠ GAP' apps/control-web/public/sana-v3-due-diligence-impact-reference-gaps.js
          ! grep -Eq '__SANA_IMPACT_LEDGER__|__SANA_DOCUMENT_SOURCES__|storage\?\.records|localStorage' \
            apps/control-web/public/sana-v3-dataroom-impact-references.js \
            apps/control-web/public/sana-v3-cycle-impact-references.js \
            apps/control-web/public/sana-v3-due-diligence-impact-reference-gaps.js
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('apps/control-web/public/sana-v3-impact-ledger.js','utf8');
          const sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');
          const assets=['/sana-v3-report-snapshot-impact-references.js','/sana-v3-cycle-impact-references.js','/sana-v3-due-diligence-impact-reference-gaps.js','/sana-v3-dataroom-impact-references.js'];
          if(!loader.includes("const VERSION='V159'"))throw new Error('V159 loader version missing');
          if(!loader.includes('__SANA_IMPACT_REFERENCE_HISTORY_LOADER__'))throw new Error('V159 loader state missing');
          let last=-1;for(const a of assets){const i=loader.indexOf(a);if(i<0||i<=last)throw new Error(`V159 loader asset/order invalid: ${a}`);last=i;}
          if((sw.match(/const CACHE='sana-v3-demo-shell-v159';/g)||[]).length!==1)throw new Error('v159 cache marker must remain exactly once');
          if(!sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v158';\n}"))throw new Error('v158 historical marker missing');
          for(const a of assets)if((sw.split(a).length-1)!==1)throw new Error(`V159 SW asset count invalid: ${a}`);
          if(!sw.includes('// v159 propagates Impact Source Registry reference integrity'))throw new Error('v159 provenance marker missing');
          NODE
          ! grep -Eiq 'canonicalMutated[[:space:]]*=[[:space:]]*true|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|impactVerified[[:space:]]*=[[:space:]]*true|certified[[:space:]]*=[[:space:]]*true|creditApproved|eligibilityApproved|investmentApproved|investmentRecommendation' apps/control-web/public/sana-v3-*impact-reference*.js apps/control-web/public/sana-v3-impact-ledger.js
