name: SANA Demo Material Reference History

on:
  push:
    branches: [demo/sana-material-v157]
  pull_request:

permissions:
  contents: read

jobs:
  material-reference-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Material Reference History V157
        run: |
          set -euo pipefail
          for f in \
            apps/control-web/public/sana-v3-material-references.js \
            apps/control-web/public/sana-v3-report-snapshot-material-references.js \
            apps/control-web/public/sana-v3-cycle-material-references.js \
            apps/control-web/public/sana-v3-due-diligence-material-reference-gaps.js \
            apps/control-web/public/sana-v3-dataroom-material-references.js \
            apps/control-web/public/sana-v3-sw.js; do node --check "$f"; done
          node scripts/validate-sana-material-references.mjs
          node scripts/validate-sana-material-reference-history.mjs
          grep -Fq 'CONTENT_MINIMIZED' apps/control-web/public/sana-v3-report-snapshot-material-references.js
          grep -Fq 'NO_NONCANONICAL_VALUES' apps/control-web/public/sana-v3-report-snapshot-material-references.js
          grep -Fq 'NO_RICH_MATERIAL_PAYLOAD' apps/control-web/public/sana-v3-report-snapshot-material-references.js
          grep -Fq 'NON_WEIGHTED' apps/control-web/public/sana-v3-cycle-material-references.js
          grep -Fq 'ORPHAN_SOURCE_NEVER_ASSIGNED_BY_TARGET' apps/control-web/public/sana-v3-cycle-material-references.js
          grep -Fq 'NOT_CAPTURED_OR_LEGACY ≠ GAP' apps/control-web/public/sana-v3-due-diligence-material-reference-gaps.js
          grep -Fq 'DECLARED_NON_CANONICAL_REFERENCE ≠ GAP' apps/control-web/public/sana-v3-due-diligence-material-reference-gaps.js
          grep -Fq 'ROW_LEVEL_STRUCTURAL_DIFF' apps/control-web/public/sana-v3-dataroom-material-references.js
          ! grep -Eiq '__SANA_MATERIAL_CHAIN__|localStorage|storage[?]*[.]?records' \
            apps/control-web/public/sana-v3-cycle-material-references.js \
            apps/control-web/public/sana-v3-due-diligence-material-reference-gaps.js \
            apps/control-web/public/sana-v3-dataroom-material-references.js
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('apps/control-web/public/sana-v3-material-references.js','utf8');
          const sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');
          const assets=['/sana-v3-report-snapshot-material-references.js','/sana-v3-cycle-material-references.js','/sana-v3-due-diligence-material-reference-gaps.js','/sana-v3-dataroom-material-references.js'];
          if(!loader.includes("const VERSION='V157'"))throw new Error('V157 loader version missing');
          if(!loader.includes('__SANA_MATERIAL_REFERENCE_HISTORY_LOADER__'))throw new Error('V157 loader state missing');
          let last=-1;for(const a of assets){const i=loader.indexOf(a);if(i<0||i<=last)throw new Error(`V157 loader asset/order invalid: ${a}`);last=i;}
          if((sw.match(/const CACHE='sana-v3-demo-shell-v157';/g)||[]).length!==1)throw new Error('v157 cache marker must remain exactly once');
          if(!sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v156';\n}"))throw new Error('v156 historical marker missing');
          for(const a of assets)if((sw.split(a).length-1)!==1)throw new Error(`V157 SW asset count invalid: ${a}`);
          if(!sw.includes('// v157 propagates minimized Material reference integrity'))throw new Error('v157 provenance marker missing');
          NODE
          ! grep -Eiq 'canonicalMutated[[:space:]]*=[[:space:]]*true|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|geneticIdentityVerified[[:space:]]*=[[:space:]]*true|phytosanitaryVerified[[:space:]]*=[[:space:]]*true|icaCertified[[:space:]]*=[[:space:]]*true|creditApproved|investmentApproved|inventoryExecuted|accountingEntryCreated' apps/control-web/public/sana-v3-*material-reference*.js apps/control-web/public/sana-v3-material-references.js
