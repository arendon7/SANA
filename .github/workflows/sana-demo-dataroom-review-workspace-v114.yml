name: SANA Demo Data Room Review Workspace V114

on:
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-entry.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-dataroom-review-workspace*.mjs'
      - '.github/workflows/sana-demo-dataroom-review-workspace-v114.yml'

permissions:
  contents: read

jobs:
  review-workspace-v114-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve V87–V114 workspace contracts
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          for v in $(seq 88 114); do node scripts/validate-sana-dataroom-review-workspace-v${v}.mjs; done
      - name: Assert V114 shell, source drilldown semantics and read-only boundary
        run: |
          grep -F "const CACHE='sana-v3-demo-shell-v114';" apps/control-web/public/sana-v3-sw.js
          grep -F 'SOURCE_STAGE_NAVIGATION ≠ SOURCE_VERIFICATION' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'PANEL_TARGET ≠ API_AVAILABLE' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'TECHNICAL_DRILLDOWN ≠ REVIEW_PRIORITY' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'data-review-source-panel-nav' apps/control-web/public/sana-v3-dataroom-entry.js
          ! grep -Eq 'rwSourcePanel|rwTechnicalDrilldown|localStorage\.(setItem|removeItem|clear)|sessionStorage|openModal\(' apps/control-web/public/sana-v3-dataroom-entry.js
