name: TEMP SANA Capital Review V162 Assembly

on:
  push:
    branches: [demo/sana-capital-review-v162]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-capital-review-v162
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble V162
        run: node scripts/assemble-sana-capital-review-v162.mjs
      - name: Validate assembly
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-capital-review-ledger.js
          node --check apps/control-web/public/sana-v3-sw.js
          node scripts/validate-sana-capital-review-references-v162.mjs
          grep -Fq "const VERSION='V162',SRC='/sana-v3-capital-review-references.js'" apps/control-web/public/sana-v3-capital-review-ledger.js
          grep -q "^const CACHE='sana-v3-demo-shell-v162';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v161';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          test "$(grep -o '/sana-v3-capital-review-references.js' apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1
      - name: Commit assembly if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-capital-review-ledger.js apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble capital review shell v162'
          git push origin HEAD:demo/sana-capital-review-v162
