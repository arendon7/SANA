name: Assemble SANA v73 Reviewer Governance

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-governance.js'
      - 'scripts/validate-sana-dataroom-review-governance.mjs'
      - '.github/workflows/sana-demo-dataroom-review-governance.yml'
      - '.github/workflows/assemble-sana-v73.yml'

permissions:
  contents: write

jobs:
  assemble-v73:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-functional-auth-v1
          fetch-depth: 0
      - name: Assemble HTML and service worker deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          hp=Path('apps/control-web/public/sana-v3.html'); sp=Path('apps/control-web/public/sana-v3-sw.js')
          html=hp.read_text(); sw=sp.read_text()
          old='<script src="/sana-v3-dataroom-findings-ledger.js"></script><script src="/sana-v3-dataroom-impact-history.js"></script>'
          new='<script src="/sana-v3-dataroom-findings-ledger.js"></script><script src="/sana-v3-dataroom-review-governance.js"></script><script src="/sana-v3-dataroom-impact-history.js"></script>'
          if html.count(old)!=1: raise SystemExit(f'HTML anchor count {html.count(old)}')
          html=html.replace(old,new,1)
          old_cache="const CACHE='sana-v3-demo-shell-v72';"
          new_cache="if(false){\nconst CACHE='sana-v3-demo-shell-v72';\n}\nconst CACHE='sana-v3-demo-shell-v73';"
          if sw.count(old_cache)!=1: raise SystemExit(f'SW v72 anchor count {sw.count(old_cache)}')
          sw=sw.replace(old_cache,new_cache,1)
          old_shell="'/sana-v3-dataroom-findings-ledger.js','/sana-v3-dataroom-impact-history.js'"
          new_shell="'/sana-v3-dataroom-findings-ledger.js','/sana-v3-dataroom-review-governance.js','/sana-v3-dataroom-impact-history.js'"
          if sw.count(old_shell)!=1: raise SystemExit(f'SW module anchor count {sw.count(old_shell)}')
          sw=sw.replace(old_shell,new_shell,1)
          hp.write_text(html); sp.write_text(sw)
          PY
          grep -q '/sana-v3-dataroom-findings-ledger.js.*sana-v3-dataroom-review-governance.js.*sana-v3-dataroom-impact-history.js' apps/control-web/public/sana-v3.html
          grep -q "^const CACHE='sana-v3-demo-shell-v73';" apps/control-web/public/sana-v3-sw.js
      - name: Commit assembled v73
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3.html apps/control-web/public/sana-v3-sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'build(demo): assemble reviewer governance shell v73'
          git push origin HEAD:demo/sana-functional-auth-v1
