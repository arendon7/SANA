name: TEMP SANA Material V156 Assembly

on:
  push:
    branches: [demo/sana-material-v156]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-material-v156
      - name: Assemble v156 shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v156';" not in s:
              old="const CACHE='sana-v3-demo-shell-v155';"
              new="if(false){\nconst CACHE='sana-v3-demo-shell-v155';\n}\nconst CACHE='sana-v3-demo-shell-v156';"
              assert s.count(old)==1, 'expected exactly one active v155 marker'
              s=s.replace(old,new,1)
          asset="'/sana-v3-material-references.js',"
          if asset not in s:
              anchor="'/sana-v3-material-chain.js',"
              assert s.count(anchor)==1, 'material chain asset anchor missing/duplicated'
              s=s.replace(anchor,anchor+asset,1)
          comment='// v156 validates explicit Material Chain destination/material/event references, including orphan sources, without certification, inventory/accounting execution, credit, eligibility or investment authority.'
          if comment not in s:
              anchor_comment='// v155 propagates minimized Circularity reference integrity through Snapshot, Cycle, DD and Data Room without live fallback, retrofill, weighting, environmental, regulatory, credit or investment authority.'
              assert s.count(anchor_comment)==1, 'v155 comment anchor missing/duplicated'
              s=s.replace(anchor_comment,anchor_comment+'\n'+comment,1)
          p.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v156';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v155';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          test "$(grep -o "/sana-v3-material-references.js" apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1
      - name: Commit assembly if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble material shell v156'
          git push origin HEAD:demo/sana-material-v156
