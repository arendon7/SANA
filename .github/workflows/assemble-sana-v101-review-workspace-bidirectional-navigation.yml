name: Assemble SANA v101 Review Workspace Bidirectional Navigation

on:
  push:
    branches: [demo/sana-v101-review-workspace-bidirectional-navigation]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-workspace.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'apps/control-web/public/sana-v3-dataroom-review-case.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-handoff.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-feedback.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-response.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-disposition.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-round.js'
      - 'scripts/validate-sana-dataroom-review-workspace-v101.mjs'
      - '.github/workflows/assemble-sana-v101-review-workspace-bidirectional-navigation.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: demo/sana-v101-review-workspace-bidirectional-navigation}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply deterministic V101 bidirectional-navigation patch
        run: |
          python - <<'PY'
          from pathlib import Path
          workspace=Path('apps/control-web/public/sana-v3-dataroom-review-workspace.js')
          s=workspace.read_text()
          if "const BIDIRECTIONAL_NAVIGATION_BASELINE='REVIEW WORKSPACE V101';" not in s:
              old="const SOURCE_CASE_FOCUS_BASELINE='REVIEW WORKSPACE V100';"
              assert old in s
              s=s.replace(old,old+"\nconst BIDIRECTIONAL_NAVIGATION_BASELINE='REVIEW WORKSPACE V101';",1)
              old="const SOURCE_PANEL_TARGETS=Object.freeze({CASE:'dataroom-review-case-panel',HANDOFF:'dataroom-review-handoff-panel',FEEDBACK:'dataroom-review-feedback-panel',RESPONSE:'dataroom-review-response-panel',DISPOSITION:'dataroom-review-disposition-panel',ROUND:'dataroom-review-round-panel'});"
              new=old+"\nconst WORKSPACE_PANEL_TARGET='review-workspace';"
              assert old in s
              s=s.replace(old,new,1)
              old="function sourcePanelTarget(stage){return SOURCE_PANEL_TARGETS[stage]||''}"
              new="function sourcePanelTarget(stage){return SOURCE_PANEL_TARGETS[stage]||''}\nfunction workspacePanelTarget(){return WORKSPACE_PANEL_TARGET}"
              assert old in s
              s=s.replace(old,new,1)
              old='MULTIPLE_ROW_MATCHES ≠ ROW_SELECTION · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              new='MULTIPLE_ROW_MATCHES ≠ ROW_SELECTION · RETURN_NAVIGATION ≠ REVIEW_STATE_CHANGE · WORKSPACE_RETURN ≠ CONTEXT_VERIFICATION · RETURN_SCROLL ≠ SOURCE_MUTATION · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              assert old in s
              s=s.replace(old,new,1)
              old="document.addEventListener('click',e=>{const sourceJump="
              new="document.addEventListener('click',e=>{const sourceReturn=e.target.closest('[data-review-source-return]');if(sourceReturn){const workspace=document.getElementById(workspacePanelTarget());workspace?.scrollIntoView?.({behavior:'smooth',block:'start'});return}const sourceJump="
              assert old in s
              s=s.replace(old,new,1)
              old='contextIntegrity,sourcePanelTarget,sourceRowMatches,integrity:INTEGRITY'
              new='contextIntegrity,sourcePanelTarget,workspacePanelTarget,sourceRowMatches,integrity:INTEGRITY'
              assert old in s
              s=s.replace(old,new,1)
              assert 'DATA ROOM · REVIEW WORKSPACE V100' in s
              s=s.replace('DATA ROOM · REVIEW WORKSPACE V100','DATA ROOM · REVIEW WORKSPACE V101',1)
              assert 'Circuito de revisión, navegable hasta el caso fuente exacto' in s
              s=s.replace('Circuito de revisión, navegable hasta el caso fuente exacto','Circuito de revisión, con navegación bidireccional al caso fuente',1)
              workspace.write_text(s)
          files=['apps/control-web/public/sana-v3-dataroom-review-case.js','apps/control-web/public/sana-v3-dataroom-review-handoff.js','apps/control-web/public/sana-v3-dataroom-review-feedback.js','apps/control-web/public/sana-v3-dataroom-review-response.js','apps/control-web/public/sana-v3-dataroom-review-disposition.js','apps/control-web/public/sana-v3-dataroom-review-round.js']
          for file in files:
              p=Path(file); text=p.read_text()
              if 'data-review-source-return' in text: continue
              head,sep,tail=text.partition('function panel(){')
              assert sep, file
              needle='${action}</div><div class="card-body">'
              assert needle in tail, file
              repl='<div class="review-source-actions">${action}<button type="button" class="btn ghost" data-review-source-return aria-controls="review-workspace">Volver al workspace</button></div></div><div class="card-body">'
              tail=tail.replace(needle,repl,1)
              p.write_text(head+sep+tail)
          css=Path('apps/control-web/public/sana-v3-review-workspace.css')
          c=css.read_text()
          if '.review-source-actions{' not in c:
              c+='\n.review-source-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}@media(max-width:620px){.review-source-actions{justify-content:flex-start}}\n'
              css.write_text(c)
          sw=Path('apps/control-web/public/sana-v3-sw.js')
          w=sw.read_text()
          if "const CACHE='sana-v3-demo-shell-v101';" not in w:
              old="const CACHE='sana-v3-demo-shell-v100';"
              assert old in w
              w=w.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v100';\n}\nconst CACHE='sana-v3-demo-shell-v101';",1)
              sw.write_text(w)
          PY
      - name: Validate V87–V101
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          node scripts/validate-sana-dataroom-review-workspace-v88.mjs
          node scripts/validate-sana-dataroom-review-workspace-v89.mjs
          node scripts/validate-sana-dataroom-review-workspace-v90.mjs
          node scripts/validate-sana-dataroom-review-workspace-v91.mjs
          node scripts/validate-sana-dataroom-review-workspace-v92.mjs
          node scripts/validate-sana-dataroom-review-workspace-v93.mjs
          node scripts/validate-sana-dataroom-review-workspace-v94.mjs
          node scripts/validate-sana-dataroom-review-workspace-v95.mjs
          node scripts/validate-sana-dataroom-review-workspace-v96.mjs
          node scripts/validate-sana-dataroom-review-workspace-v97.mjs
          node scripts/validate-sana-dataroom-review-workspace-v98.mjs
          node scripts/validate-sana-dataroom-review-workspace-v99.mjs
          node scripts/validate-sana-dataroom-review-workspace-v100.mjs
          node scripts/validate-sana-dataroom-review-workspace-v101.mjs
      - name: Commit assembled V101
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-dataroom-review-workspace.js apps/control-web/public/sana-v3-review-workspace.css apps/control-web/public/sana-v3-dataroom-review-case.js apps/control-web/public/sana-v3-dataroom-review-handoff.js apps/control-web/public/sana-v3-dataroom-review-feedback.js apps/control-web/public/sana-v3-dataroom-review-response.js apps/control-web/public/sana-v3-dataroom-review-disposition.js apps/control-web/public/sana-v3-dataroom-review-round.js apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble Data Room review bidirectional navigation v101'
          git push origin HEAD:demo/sana-v101-review-workspace-bidirectional-navigation
