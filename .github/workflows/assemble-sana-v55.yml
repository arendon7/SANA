name: Assemble SANA v55 Source Evidence

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-source-evidence-ledger.js'
      - 'apps/control-web/public/sana-v3-cycle-source-provenance.js'
      - 'scripts/validate-sana-source-evidence-ledger.mjs'
      - '.github/workflows/sana-demo-source-evidence-ledger.yml'
      - '.github/workflows/assemble-sana-v55.yml'

permissions:
  contents: write

jobs:
  assemble-v55:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-functional-auth-v1
          fetch-depth: 0
      - name: Assemble HTML and service worker deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          hp=Path('apps/control-web/public/sana-v3.html'); sp=Path('apps/control-web/public/sana-v3-sw.js')
          html=hp.read_text(); sw=sp.read_text()
          repl=[
            ('<script src="/sana-v3-source-bridge.js"></script><script src="/sana-v3-economics.js"></script>',
             '<script src="/sana-v3-source-bridge.js"></script><script src="/sana-v3-source-evidence-ledger.js"></script><script src="/sana-v3-economics.js"></script>'),
            ('<script src="/sana-v3-cycle-capture-sync-provenance.js"></script><script src="/sana-v3-cycle-labor-provenance.js"></script>',
             '<script src="/sana-v3-cycle-capture-sync-provenance.js"></script><script src="/sana-v3-cycle-source-provenance.js"></script><script src="/sana-v3-cycle-labor-provenance.js"></script>')]
          for old,new in repl:
              if html.count(old)!=1: raise SystemExit(f'HTML anchor count {html.count(old)}: {old}')
              html=html.replace(old,new,1)
          old="const CACHE='sana-v3-demo-shell-v54';"
          new="if(false){\nconst CACHE='sana-v3-demo-shell-v54';\n}\nconst CACHE='sana-v3-demo-shell-v55';"
          if sw.count(old)!=1: raise SystemExit(f'SW v54 anchor count {sw.count(old)}')
          sw=sw.replace(old,new,1)
          srep=[
            ("'/sana-v3-source-bridge.js','/sana-v3-economics.js'","'/sana-v3-source-bridge.js','/sana-v3-source-evidence-ledger.js','/sana-v3-economics.js'"),
            ("'/sana-v3-cycle-capture-sync-provenance.js','/sana-v3-cycle-labor-provenance.js'","'/sana-v3-cycle-capture-sync-provenance.js','/sana-v3-cycle-source-provenance.js','/sana-v3-cycle-labor-provenance.js'")]
          for old,new in srep:
              if sw.count(old)!=1: raise SystemExit(f'SW anchor count {sw.count(old)}: {old}')
              sw=sw.replace(old,new,1)
          hp.write_text(html); sp.write_text(sw)
          PY
          grep -q '/sana-v3-source-bridge.js.*sana-v3-source-evidence-ledger.js.*sana-v3-economics.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-cycle-capture-sync-provenance.js.*sana-v3-cycle-source-provenance.js.*sana-v3-cycle-labor-provenance.js' apps/control-web/public/sana-v3.html
          grep -q "^const CACHE='sana-v3-demo-shell-v55';" apps/control-web/public/sana-v3-sw.js
      - name: Commit assembled v55
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3.html apps/control-web/public/sana-v3-sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'build(demo): assemble source evidence shell v55'
          git push origin HEAD:demo/sana-functional-auth-v1
