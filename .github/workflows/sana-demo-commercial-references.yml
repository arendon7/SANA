name: SANA Demo Commercial References

on:
  push:
    branches: [demo/sana-commercial-v147]
  pull_request:

permissions:
  contents: read

jobs:
  commercial-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Commercial References V147
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-commercial-references.js
          node scripts/validate-sana-commercial-references.mjs
          grep -Fq 'LEGACY_REFERENCE_NOT_CAPTURED' apps/control-web/public/sana-v3-commercial-references.js
          grep -Fq 'DECLARED_NON_CANONICAL_REFERENCE' apps/control-web/public/sana-v3-commercial-references.js
          grep -Fq 'COMMERCIAL_SUPPORT_REF' apps/control-web/public/sana-v3-commercial-references.js
          grep -Fq 'HARVEST_DELIVERY_REF' apps/control-web/public/sana-v3-commercial-references.js
          grep -Fq 'CROSS_DOMAIN_REF' apps/control-web/public/sana-v3-commercial-references.js
          grep -Fq 'BUYER_REF ≠ BUYER_IDENTITY_VERIFIED' apps/control-web/public/sana-v3-commercial-references.js
          grep -Fq 'AGREEMENT_REFERENCE_DECLARED ≠ VERIFIED_CONTRACT' apps/control-web/public/sana-v3-commercial-references.js
          grep -Fq 'PAYMENT_STATUS_DECLARED ≠ PAYMENT_EXECUTED' apps/control-web/public/sana-v3-commercial-references.js
          grep -Fq 'REFERENCE ≠ GUARANTEED_REVENUE ≠ CREDIT_RISK ≠ ELIGIBILITY ≠ INVESTMENT_SIGNAL' apps/control-web/public/sana-v3-commercial-references.js
          ! grep -Eiq 'canonicalMutated[[:space:]]*=[[:space:]]*true|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|verifiedContracts[[:space:]]*=[[:space:]]*[1-9]|verifiedInvoices[[:space:]]*=[[:space:]]*[1-9]|paymentsExecuted[[:space:]]*=[[:space:]]*[1-9]|bankSettlementsVerified[[:space:]]*=[[:space:]]*[1-9]|guaranteedRevenue[[:space:]]*=[[:space:]]*[1-9]|creditApproved|investmentApproved|orderExecuted' apps/control-web/public/sana-v3-commercial-references.js
