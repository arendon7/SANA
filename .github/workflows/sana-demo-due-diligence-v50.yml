name: SANA Demo Due Diligence V50

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-labor.js'
      - 'apps/control-web/public/sana-v3-due-diligence-labor-gaps.js'
      - 'apps/control-web/public/sana-v3-dataroom-labor-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-remediation.js'
      - 'apps/control-web/public/sana-v3-dd-next-cut.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-labor-snapshot.mjs'
      - 'scripts/validate-sana-labor-gaps.mjs'
      - '.github/workflows/sana-demo-due-diligence-v50.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-labor.js'
      - 'apps/control-web/public/sana-v3-due-diligence-labor-gaps.js'
      - 'apps/control-web/public/sana-v3-dataroom-labor-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-remediation.js'
      - 'apps/control-web/public/sana-v3-dd-next-cut.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-labor-snapshot.mjs'
      - 'scripts/validate-sana-labor-gaps.mjs'
      - '.github/workflows/sana-demo-due-diligence-v50.yml'

permissions:
  contents: read

jobs:
  composed-dd-v50:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate labor historical semantics
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-sana-labor-snapshot.mjs
          node scripts/validate-sana-labor-gaps.mjs
      - name: Validate Labor is composed before remediation
        shell: bash
        run: |
          set -euo pipefail
          html='apps/control-web/public/sana-v3.html'; sw='apps/control-web/public/sana-v3-sw.js'
          grep -q '/sana-v3-report-snapshot-inventory.js.*sana-v3-report-snapshot-labor.js.*sana-v3-cycle-closure.js' "$html"
          grep -q '/sana-v3-due-diligence-inventory-gaps.js.*sana-v3-due-diligence-labor-gaps.js.*sana-v3-due-diligence-remediation.js.*sana-v3-dd-next-cut.js' "$html"
          grep -q '/sana-v3-dataroom-inventory-history.js.*sana-v3-dataroom-labor-history.js.*sana-v3-dataroom-entry.js' "$html"
          grep -q '__SANA_REPORT_SNAPSHOT_LABOR__' apps/control-web/public/sana-v3-report-snapshot-labor.js
          grep -q '__SANA_DD_LABOR_GAPS__' apps/control-web/public/sana-v3-due-diligence-labor-gaps.js
          grep -q '__SANA_DATAROOM_LABOR_HISTORY__' apps/control-web/public/sana-v3-dataroom-labor-history.js
          grep -q "^const CACHE='sana-v3-demo-shell-v50';" "$sw"
      - name: Validate privacy and no HR/payroll/investment inference
        shell: bash
        run: |
          set -euo pipefail
          snap='apps/control-web/public/sana-v3-report-snapshot-labor.js'; hist='apps/control-web/public/sana-v3-dataroom-labor-history.js'; gaps='apps/control-web/public/sana-v3-due-diligence-labor-gaps.js'
          grep -q 'NO_IDENTITY_FIELDS' "$snap"
          grep -q 'PRIVACY_MINIMIZED' "$hist"
          grep -q 'labor:privacy-leak' "$gaps"
          ! grep -q '__SANA_LABOR_LEDGER__' "$hist"
          ! grep -q '__SANA_LABOR_LEDGER__' "$gaps"
          ! grep -q 'storage\.' "$hist"
          ! grep -q 'storage\.' "$gaps"
          ! grep -Eiq 'creditApproved|investmentApproved|eligibilityApproved|paymentExecuted[[:space:]]*=[[:space:]]*true|performanceScore[[:space:]]*=[[:space:]]*[1-9]' "$snap" "$hist" "$gaps"
