name: Assemble SANA v61 Capital Governance

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-capital-governance.js'
      - 'scripts/validate-sana-capital-governance.mjs'
      - '.github/workflows/sana-demo-capital-governance.yml'
      - '.github/workflows/assemble-sana-v61.yml'

permissions:
  contents: write

jobs:
  assemble-v61:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-functional-auth-v1
          fetch-depth: 0
      - name: Assemble HTML and service worker deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          hp=Path('apps/control-web/public/sana-v3.html'); sp=Path('apps/control-web/public/sana-v3-sw.js')
          html=hp.read_text(); sw=sp.read_text()
          old='<script src="/sana-v3-capital-dossier.js"></script><script src="/sana-v3-integration-bridge.js"></script>'
          new='<script src="/sana-v3-capital-dossier.js"></script><script src="/sana-v3-capital-governance.js"></script><script src="/sana-v3-integration-bridge.js"></script>'
          if html.count(old)!=1: raise SystemExit(f'HTML anchor count {html.count(old)}')
          html=html.replace(old,new,1)
          old="const CACHE='sana-v3-demo-shell-v60';"
          new="if(false){\nconst CACHE='sana-v3-demo-shell-v60';\n}\nconst CACHE='sana-v3-demo-shell-v61';"
          if sw.count(old)!=1: raise SystemExit(f'SW v60 anchor count {sw.count(old)}')
          sw=sw.replace(old,new,1)
          old="'/sana-v3-capital-dossier.js','/sana-v3-integration-bridge.js'"
          new="'/sana-v3-capital-dossier.js','/sana-v3-capital-governance.js','/sana-v3-integration-bridge.js'"
          if sw.count(old)!=1: raise SystemExit(f'SW capital anchor count {sw.count(old)}')
          sw=sw.replace(old,new,1)
          hp.write_text(html); sp.write_text(sw)
          PY
          grep -q '/sana-v3-capital-dossier.js.*sana-v3-capital-governance.js.*sana-v3-integration-bridge.js' apps/control-web/public/sana-v3.html
          grep -q "^const CACHE='sana-v3-demo-shell-v61';" apps/control-web/public/sana-v3-sw.js
      - name: Commit assembled v61
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3.html apps/control-web/public/sana-v3-sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'build(demo): assemble capital governance shell v61'
          git push origin HEAD:demo/sana-functional-auth-v1
