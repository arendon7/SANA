name: TEMP SANA Capture Sync V153 Assembly

on:
  push:
    branches: [demo/sana-capture-sync-v153]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-capture-sync-v153
      - name: Assemble v153 shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v153';" not in s:
              old="const CACHE='sana-v3-demo-shell-v152';"
              new="if(false){\nconst CACHE='sana-v3-demo-shell-v152';\n}\nconst CACHE='sana-v3-demo-shell-v153';"
              assert s.count(old)==1, 'expected exactly one active v152 marker'
              s=s.replace(old,new,1)
          anchor="'/sana-v3-capture-sync-references.js',"
          assets="'/sana-v3-capture-sync-references.js','/sana-v3-report-snapshot-capture-sync-references.js','/sana-v3-cycle-capture-sync-references.js','/sana-v3-due-diligence-capture-sync-reference-gaps.js','/sana-v3-dataroom-capture-sync-references.js',"
          if '/sana-v3-report-snapshot-capture-sync-references.js' not in s:
              assert s.count(anchor)==1, 'capture sync references asset anchor missing/duplicated'
              s=s.replace(anchor,assets,1)
          comment='// v153 propagates minimized Capture Sync reference integrity through Snapshot, Cycle, DD and Data Room without live fallback, retrofill, weighting, source verification or decision authority.'
          if comment not in s:
              anchor_comment='// v152 validates Capture Sync record, ACK and conflict-candidate reference coherence without server/source verification, canonical write, agronomic, credit, eligibility or investment authority.'
              assert s.count(anchor_comment)==1, 'v152 comment anchor missing/duplicated'
              s=s.replace(anchor_comment,anchor_comment+'\n'+comment,1)
          p.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v153';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v152';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          for a in \
            /sana-v3-report-snapshot-capture-sync-references.js \
            /sana-v3-cycle-capture-sync-references.js \
            /sana-v3-due-diligence-capture-sync-reference-gaps.js \
            /sana-v3-dataroom-capture-sync-references.js; do test "$(grep -o "$a" apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1; done
      - name: Commit assembly if changed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble capture sync shell v153'
          git push origin HEAD:demo/sana-capture-sync-v153
