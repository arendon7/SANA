name: SANA Demo Due Diligence V80

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-review-feedback.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-feedback-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js'
      - 'scripts/validate-sana-dataroom-review-feedback-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - '.github/workflows/sana-demo-due-diligence-v80.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-review-feedback.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-feedback-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js'
      - 'scripts/validate-sana-dataroom-review-feedback-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'

jobs:
  composed-dd-v80:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate review feedback historical semantics
        run: node scripts/validate-sana-dataroom-review-feedback-history.mjs
      - name: Validate DD order before remediation when assembled
        run: |
          html='apps/control-web/public/sana-v3.html'
          if grep -q '/sana-v3-due-diligence-dataroom-review-feedback-gaps.js' "$html"; then
            grep -q '/sana-v3-due-diligence-dataroom-review-handoff-gaps.js.*sana-v3-due-diligence-dataroom-review-feedback-gaps.js.*sana-v3-due-diligence-remediation.js' "$html"
          else echo 'v80 staged before assembly; strict DD order deferred.'; fi
      - name: Validate snapshot and history order when assembled
        run: |
          html='apps/control-web/public/sana-v3.html'
          if grep -q '/sana-v3-report-snapshot-dataroom-review-feedback.js' "$html"; then
            grep -q '/sana-v3-report-snapshot-dataroom-review-handoff.js.*sana-v3-report-snapshot-dataroom-review-feedback.js.*sana-v3-cycle-closure.js' "$html"
            grep -q '/sana-v3-dataroom-review-handoff-history.js.*sana-v3-dataroom-review-feedback-history.js.*sana-v3-dataroom-entry.js' "$html"
            grep -Eq "^const CACHE='sana-v3-demo-shell-v(8[0-9]|[1-9][0-9]{2,})';" apps/control-web/public/sana-v3-sw.js
          else echo 'v80 staged before assembly; strict shell validation deferred.'; fi
      - name: Validate non-decisional boundaries
        run: |
          grep -q 'NO_REVIEW_FEEDBACK ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js
          grep -q 'FEEDBACK_OPEN ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js
          grep -q 'FEEDBACK_CLOSED ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js
          grep -q 'FEEDBACK_GAP ≠ FINDING ≠ REMEDIATION_ITEM ≠ RISK_SCORE ≠ REVIEW_OUTCOME' apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js
          grep -q 'LIVE_STATE ≠ SNAPSHOT ≠ HISTORICAL_EVIDENCE' apps/control-web/public/sana-v3-dataroom-review-feedback-history.js
          ! grep -Eq 'fetch\s*\(' apps/control-web/public/sana-v3-report-snapshot-dataroom-review-feedback.js apps/control-web/public/sana-v3-dataroom-review-feedback-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js
          ! grep -Eq 'productionExecutionAvailable\s*=\s*true|productionActivationAllowed\s*=\s*true|canonicalMutated\s*=\s*true' apps/control-web/public/sana-v3-report-snapshot-dataroom-review-feedback.js apps/control-web/public/sana-v3-dataroom-review-feedback-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-review-feedback-gaps.js

# v80 freeze certification trigger: shell v80+, snapshot-only Review Feedback provenance, documentary gaps only, no automatic finding/remediation/reopen or authority expansion.
