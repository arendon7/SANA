name: TEMP SANA Impact V159 Assembly

on:
  push:
    branches: [demo/sana-impact-v159]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-impact-v159
      - name: Assemble v159 shell
        run: python scripts/temp-assemble-sana-impact-v159.py
      - name: Validate assembled shell
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v159';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v158';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          for a in \
            /sana-v3-report-snapshot-impact-references.js \
            /sana-v3-cycle-impact-references.js \
            /sana-v3-due-diligence-impact-reference-gaps.js \
            /sana-v3-dataroom-impact-references.js; do test "$(grep -o "$a" apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1; done
      - name: Commit assembly if changed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble impact shell v159'
          git push origin HEAD:demo/sana-impact-v159
