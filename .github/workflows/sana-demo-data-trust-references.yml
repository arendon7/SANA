name: SANA Demo Data Trust References

on:
  push:
    branches: [demo/sana-data-trust-v160]
  pull_request:

permissions:
  contents: read

jobs:
  data-trust-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Data Trust References V160
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-data-trust-references.js
          node --check apps/control-web/public/sana-v3-capture-sync-references.js
          node --check apps/control-web/public/sana-v3-sw.js
          node scripts/validate-sana-data-trust-references.mjs
          grep -Fq 'LEGACY_REFERENCE_NOT_CAPTURED' apps/control-web/public/sana-v3-data-trust-references.js
          grep -Fq 'ACK_COHERENCE_REF' apps/control-web/public/sana-v3-data-trust-references.js
          grep -Fq 'CONFLICT_CANDIDATE_COHERENCE_REF' apps/control-web/public/sana-v3-data-trust-references.js
          grep -Fq 'SOURCE_REF_DECLARED' apps/control-web/public/sana-v3-data-trust-references.js
          grep -Fq 'ACK_COHERENCE ≠ SERVER_VERIFICATION' apps/control-web/public/sana-v3-data-trust-references.js
          grep -Fq 'CONFLICT_CANDIDATE_COHERENCE ≠ SOURCE_AUTHENTICITY ≠ TRUTH' apps/control-web/public/sana-v3-data-trust-references.js
          grep -Fq 'REFERENCE ≠ DATA_QUALITY_SCORE ≠ AGRONOMIC_DECISION ≠ CREDIT_RISK ≠ ELIGIBILITY ≠ INVESTMENT_SIGNAL' apps/control-web/public/sana-v3-data-trust-references.js
          grep -Fq "const VERSION='V160',SRC='/sana-v3-data-trust-references.js'" apps/control-web/public/sana-v3-capture-sync-references.js
          grep -Fq '__SANA_DATA_TRUST_REFERENCES_LOADER__' apps/control-web/public/sana-v3-capture-sync-references.js
          grep -Fq "__SANA_CAPTURE_SYNC_LEDGER__?.referenceVersion!=='V152'" apps/control-web/public/sana-v3-capture-sync-references.js
          grep -q "^const CACHE='sana-v3-demo-shell-v160';$" apps/control-web/public/sana-v3-sw.js
          node - <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');
          if(!sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v159';\n}"))throw new Error('v159 historical marker missing');
          if((sw.split('/sana-v3-data-trust-references.js').length-1)!==1)throw new Error('V160 SW asset must appear exactly once');
          if(!sw.includes('// v160 validates Data Trust ACK/conflict-candidate coherence against Capture/Sync'))throw new Error('V160 SW provenance marker missing');
          NODE
          node scripts/validate-sana-demo-auth.mjs
          ! grep -Eiq 'canonicalMutated[[:space:]]*=[[:space:]]*true|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|serverVerified[[:space:]]*=[[:space:]]*true|sourceVerified[[:space:]]*=[[:space:]]*true|hardwareVerified[[:space:]]*=[[:space:]]*true|measurementValidated[[:space:]]*=[[:space:]]*true|creditApproved|investmentApproved|eligibilityApproved' apps/control-web/public/sana-v3-data-trust-references.js apps/control-web/public/sana-v3-capture-sync-references.js
