name: Assemble SANA v90 Review Workspace Inspector

on:
  push:
    branches: [demo/sana-v90-review-workspace-inspector]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-workspace.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'scripts/validate-sana-dataroom-review-workspace-v90.mjs'
      - '.github/workflows/assemble-sana-v90-review-workspace-inspector.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: demo/sana-v90-review-workspace-inspector}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate V87–V90
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          node scripts/validate-sana-dataroom-review-workspace-v88.mjs
          node scripts/validate-sana-dataroom-review-workspace-v89.mjs
          node scripts/validate-sana-dataroom-review-workspace-v90.mjs
      - name: Assemble shell v90
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v90';" not in s:
            old="const CACHE='sana-v3-demo-shell-v89';"
            assert old in s
            s=s.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v89';\n}\nconst CACHE='sana-v3-demo-shell-v90';",1)
            p.write_text(s)
          PY
          node scripts/validate-sana-dataroom-review-workspace-v90.mjs
      - name: Commit assembled shell
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble Data Room review workspace inspector v90'
          git push origin HEAD:demo/sana-v90-review-workspace-inspector
