name: AGROWAY CONTROL v0.22 alpha11
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/identity-access/**"
      - "apps/control-web/**"
      - "config/product/control-alpha11-oidc-session.json"
      - "config/product/control-operational-acceptance.json"
      - "config/product/control-review-bundle.json"
      - "config/design/screens/oidc-session-adapter.json"
      - "scripts/control-oidc-session-runtime.mjs"
      - "scripts/control-oidc-session-browser-qa.py"
      - "scripts/validate-control-oidc-session.mjs"
      - "scripts/validate-control-operational-acceptance.mjs"
      - "scripts/validate-control-production-authorization.mjs"
      - "scripts/validate-control-canonical-write.mjs"
      - "scripts/build-control-review-bundle.mjs"
      - ".github/workflows/agroway-v022-control-alpha11.yml"
concurrency:
  group: agroway-control-v022-alpha11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  oidc-production-session-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax-check alpha11
        run: |
          node --check apps/control-web/server.mjs
          node --check apps/control-web/public/identity-adapter.js
          node --check scripts/control-oidc-session-runtime.mjs
          node --check scripts/validate-control-oidc-session.mjs
          node --check scripts/validate-control-operational-acceptance.mjs
          node --check scripts/build-control-review-bundle.mjs
          python -m py_compile scripts/control-oidc-session-browser-qa.py
      - name: Direct-root persistence topology and lock parity
        run: node scripts/validate-direct-root-persistence.mjs
      - name: Offline canonical workspace install
        run: npm ci --ignore-scripts --offline
      - name: Pinned TypeScript strict
        run: npx -y -p typescript@5.8.3 tsc -p tsconfig.json --noEmit
      - name: Alpha3-alpha10 static regressions
        run: |
          node scripts/validate-control-exception-resolution.mjs
          node scripts/validate-control-evidence-ledger.mjs
          node scripts/validate-control-human-approval.mjs
          node scripts/validate-control-submission-handoff.mjs
          node scripts/validate-control-unified-flow.mjs
          node scripts/validate-control-reintegration.mjs
          node scripts/validate-control-production-authorization.mjs
          node scripts/validate-control-canonical-write.mjs
      - name: Alpha11 OIDC session static guardrail
        run: node scripts/validate-control-oidc-session.mjs
      - name: Full CONTROL operational truth gate
        run: node scripts/validate-control-operational-acceptance.mjs
      - name: Compile services for runtime
        run: |
          rm -rf .tmp/control-alpha11
          npx -y -p typescript@5.8.3 tsc -p tsconfig.json --noEmit false --outDir .tmp/control-alpha11
      - name: Production authorization regression runtime
        run: node scripts/control-production-authorization-runtime.mjs .tmp/control-alpha11/services/identity-access/src/index.js
      - name: Canonical write regression runtime
        run: node scripts/control-canonical-write-runtime.mjs .tmp/control-alpha11/services/investment-portfolio/src/index.js
      - name: OIDC real-signature positive and adversarial runtime
        run: node scripts/control-oidc-session-runtime.mjs .tmp/control-alpha11/services/identity-access/src/index.js
      - name: Install pinned Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native Chromium OIDC review over real CONTROL HTTP
        run: python scripts/control-oidc-session-browser-qa.py
      - name: Build deterministic alpha11 CONTROL review bundle
        run: node scripts/build-control-review-bundle.mjs
      - name: Smoke nine-route review bundle
        run: |
          PORT=4282 node dist/control-review-bundle/server.mjs > /tmp/control-alpha11-bundle.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4282/control >/dev/null && break || sleep .25; done
          for route in /control /control/projects/inv-yar-001 /control/identity-adapter /control/authorization /control/write-adapter /control/exceptions /control/evidence /control/approvals /control/handoff; do curl -fsS "http://127.0.0.1:4282$route" >/dev/null; done
          node -e "const m=require('./dist/control-review-bundle/REVIEW_MANIFEST.json');const a=require('./dist/control-review-bundle/config/product/control-operational-acceptance.json');if(!['0.22.0-alpha11','0.22.0-alpha12','0.22.0-alpha13'].includes(m.version)||m.routes.length!==9||m.authority.identitySessionSource!=='VERIFIED_OIDC_ID_TOKEN'||m.authority.realIdentityProviderConfigured!==false||m.authority.authorizationOutputCeiling!=='AUTHORIZED_FOR_ADAPTER'||a.productionReady!==false||a.productionBlockers.length!==4||!a.productionBlockers.includes('PRODUCTION_IDENTITY_PROVIDER_CONFIGURATION_PENDING'))process.exit(1);console.log('PASS_CONTROL_ALPHA11_SUCCESSOR_BUNDLE',m.version,m.fileCount,m.aggregateSha256,a.productionBlockers.length)"
      - name: Trust boundary
        run: |
          echo 'PASS_CONTROL_ALPHA11_OIDC_SESSION_ADAPTER'
          echo 'The adapter verifies signed OIDC ID Tokens into ProductionSession. No real issuer/audience/JWKS provider configuration or browser token endpoint is claimed. Authorization ceiling remains AUTHORIZED_FOR_ADAPTER; production execution remains unavailable.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agroway-control-v022-alpha11-oidc-evidence
          path: docs/product/evidence/oidc-session-adapter
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: agroway-control-v022-alpha11-review-bundle
          path: dist/control-review-bundle
          if-no-files-found: error
          retention-days: 14
