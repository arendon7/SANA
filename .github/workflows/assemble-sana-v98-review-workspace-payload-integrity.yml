name: Assemble SANA v98 Review Workspace Payload Integrity

on:
  push:
    branches: [demo/sana-v98-review-workspace-payload-integrity]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-workspace.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'scripts/validate-sana-dataroom-review-workspace-v98.mjs'
      - '.github/workflows/assemble-sana-v98-review-workspace-payload-integrity.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: demo/sana-v98-review-workspace-payload-integrity}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply deterministic V98 payload-integrity patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-dataroom-review-workspace.js')
          s=p.read_text()
          if "const SOURCE_PAYLOAD_INTEGRITY_BASELINE='REVIEW WORKSPACE V98';" not in s:
              old="const STAGE_MULTIPLICITY_BASELINE='REVIEW WORKSPACE V97';"
              assert old in s
              s=s.replace(old,old+"\nconst SOURCE_PAYLOAD_INTEGRITY_BASELINE='REVIEW WORKSPACE V98';",1)
              old='UNIQUE_STAGE_PROJECTION ≠ SOURCE_VERIFICATION · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              new='UNIQUE_STAGE_PROJECTION ≠ SOURCE_VERIFICATION · SOURCE_PAYLOAD_INVALID ≠ SOURCE_EMPTY ≠ STAGE_NOT_REFERENCED · PARTIAL_PAYLOAD ≠ VERIFIED_COMPLETENESS · PAYLOAD_BLOCK ≠ SOURCE_MUTATION · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              assert old in s
              s=s.replace(old,new,1)
              marker='function sourceProbe(stage,label,api,expectedSchema)'
              assert marker in s
              s=s.replace(marker,"function caseShapeIssues(c){const issues=[];if(!c||typeof c!=='object'||Array.isArray(c))return ['CASE_NOT_OBJECT'];if(typeof c.id!=='string'||!c.id.trim())issues.push('CASE_ID_INVALID');if(!Array.isArray(c.events))issues.push('EVENTS_NOT_ARRAY');if(c.semantics?.missingInternalReferences!==undefined&&!Array.isArray(c.semantics.missingInternalReferences))issues.push('MISSING_INTERNAL_REFERENCES_NOT_ARRAY');if(c.closures!==undefined&&!Array.isArray(c.closures))issues.push('CLOSURES_NOT_ARRAY');return issues}\n"+marker,1)
              old="function sourceProbe(stage,label,api,expectedSchema){const source=window[api];if(!source||typeof source.cases!=='function')return {stage,label,api,state:'UNAVAILABLE',schema:source?.schema||'',expectedSchema:expectedSchema||'',schemaState:'UNKNOWN',caseCount:0,cases:[],integrity:'SOURCE_API_UNAVAILABLE ≠ STAGE_NOT_REFERENCED ≠ REVIEW_GAP'};const schema=source.schema||'',schemaState=!schema?'MISSING':schema===expectedSchema?'MATCH':'MISMATCH';if(schemaState!=='MATCH')return {stage,label,api,state:'AVAILABLE',schema,expectedSchema:expectedSchema||'',schemaState,caseCount:0,cases:[],integrity:schemaState==='MISSING'?'SOURCE_SCHEMA_MISSING ≠ SOURCE_EMPTY ≠ STAGE_NOT_REFERENCED · SCHEMA_BLOCK ≠ SOURCE_MUTATION':'SOURCE_SCHEMA_MISMATCH ≠ REVIEW_FAILURE · SCHEMA_BLOCK ≠ SOURCE_MUTATION'};try{const list=source.cases();if(!Array.isArray(list))throw new TypeError('SOURCE_CASES_NOT_ARRAY');const normalized=list.map(c=>({...c,__workspaceSourceSchema:schema||c?.schema||''}));return {stage,label,api,state:'AVAILABLE',schema,expectedSchema:expectedSchema||'',schemaState:'MATCH',caseCount:normalized.length,cases:normalized,integrity:'SCHEMA_MATCH ≠ DOCUMENT_VERIFICATION ≠ SOURCE_TRUST'}}catch{return {stage,label,api,state:'READ_ERROR',schema,expectedSchema:expectedSchema||'',schemaState:'MATCH',caseCount:0,cases:[],integrity:'SOURCE_READ_ERROR ≠ SOURCE_EMPTY'}}}"
              new="function sourceProbe(stage,label,api,expectedSchema){const source=window[api];if(!source||typeof source.cases!=='function')return {stage,label,api,state:'UNAVAILABLE',schema:source?.schema||'',expectedSchema:expectedSchema||'',schemaState:'UNKNOWN',payloadState:'UNKNOWN',caseCount:0,validCaseCount:0,invalidCaseCount:0,invalidCases:[],cases:[],integrity:'SOURCE_API_UNAVAILABLE ≠ STAGE_NOT_REFERENCED ≠ REVIEW_GAP'};const schema=source.schema||'',schemaState=!schema?'MISSING':schema===expectedSchema?'MATCH':'MISMATCH';if(schemaState!=='MATCH')return {stage,label,api,state:'AVAILABLE',schema,expectedSchema:expectedSchema||'',schemaState,payloadState:'UNKNOWN',caseCount:0,validCaseCount:0,invalidCaseCount:0,invalidCases:[],cases:[],integrity:schemaState==='MISSING'?'SOURCE_SCHEMA_MISSING ≠ SOURCE_EMPTY ≠ STAGE_NOT_REFERENCED · SCHEMA_BLOCK ≠ SOURCE_MUTATION':'SOURCE_SCHEMA_MISMATCH ≠ REVIEW_FAILURE · SCHEMA_BLOCK ≠ SOURCE_MUTATION'};try{const list=source.cases();if(!Array.isArray(list))throw new TypeError('SOURCE_CASES_NOT_ARRAY');const invalidCases=[],valid=[];list.forEach((c,index)=>{const issues=caseShapeIssues(c);issues.length?invalidCases.push({index,id:typeof c?.id==='string'?c.id:'',issues}):valid.push(c)});const normalized=valid.map(c=>({...c,__workspaceSourceSchema:schema||c?.schema||''})),invalidCaseCount=invalidCases.length,validCaseCount=normalized.length,payloadState=invalidCaseCount?(validCaseCount?'PARTIAL_INVALID':'INVALID'):'VALID';return {stage,label,api,state:'AVAILABLE',schema,expectedSchema:expectedSchema||'',schemaState:'MATCH',payloadState,caseCount:list.length,validCaseCount,invalidCaseCount,invalidCases,cases:normalized,integrity:payloadState==='VALID'?'SCHEMA_MATCH ≠ DOCUMENT_VERIFICATION ≠ SOURCE_TRUST':payloadState==='PARTIAL_INVALID'?'PARTIAL_PAYLOAD ≠ VERIFIED_COMPLETENESS · PAYLOAD_BLOCK ≠ SOURCE_MUTATION':'SOURCE_PAYLOAD_INVALID ≠ SOURCE_EMPTY ≠ STAGE_NOT_REFERENCED · PAYLOAD_BLOCK ≠ SOURCE_MUTATION'}}catch{return {stage,label,api,state:'READ_ERROR',schema,expectedSchema:expectedSchema||'',schemaState:'MATCH',payloadState:'UNKNOWN',caseCount:0,validCaseCount:0,invalidCaseCount:0,invalidCases:[],cases:[],integrity:'SOURCE_READ_ERROR ≠ SOURCE_EMPTY'}}}"
              assert old in s
              s=s.replace(old,new,1)
              old="sourceSchemaState:sources[order]?.schemaState||'UNKNOWN',expectedSchema:sources[order]?.expectedSchema||''"
              new="sourceSchemaState:sources[order]?.schemaState||'UNKNOWN',sourcePayloadState:sources[order]?.payloadState||'UNKNOWN',expectedSchema:sources[order]?.expectedSchema||''"
              assert old in s
              s=s.replace(old,new,1)
              old="indeterminateStages=stages.filter(x=>!x.present&&(x.ambiguous||x.sourceState!=='AVAILABLE'||x.sourceSchemaState!=='MATCH')).map(x=>x.stage),missingStages=stages.filter(x=>!x.referenced&&x.sourceState==='AVAILABLE'&&x.sourceSchemaState==='MATCH').map(x=>x.stage)"
              new="indeterminateStages=stages.filter(x=>!x.present&&(x.ambiguous||x.sourceState!=='AVAILABLE'||x.sourceSchemaState!=='MATCH'||x.sourcePayloadState==='INVALID')).map(x=>x.stage),missingStages=stages.filter(x=>!x.referenced&&x.sourceState==='AVAILABLE'&&x.sourceSchemaState==='MATCH'&&x.sourcePayloadState!=='INVALID').map(x=>x.stage)"
              assert old in s
              s=s.replace(old,new,1)
              old="duplicateStageReferences:chains.reduce((n,c)=>n+c.stages.reduce((m,x)=>m+Math.max(0,x.candidateCount-1),0),0),riskScores:0"
              new="duplicateStageReferences:chains.reduce((n,c)=>n+c.stages.reduce((m,x)=>m+Math.max(0,x.candidateCount-1),0),0),invalidSourceCases:sources.reduce((n,x)=>n+(x.invalidCaseCount||0),0),sourcesWithInvalidPayload:sources.filter(x=>x.payloadState==='PARTIAL_INVALID'||x.payloadState==='INVALID').length,riskScores:0"
              assert old in s
              s=s.replace(old,new,1)
              old="function sourceIntegrityBanner(s){const affected=(s.sources||[]).filter(x=>x.state!=='AVAILABLE'||x.schemaState!=='MATCH');if(!affected.length)return '';"
              new="function sourceIntegrityBanner(s){const affected=(s.sources||[]).filter(x=>x.state!=='AVAILABLE'||x.schemaState!=='MATCH'||(x.payloadState&&x.payloadState!=='VALID'&&x.payloadState!=='UNKNOWN'));if(!affected.length)return '';"
              assert old in s
              s=s.replace(old,new,1)
              old="<code>${esc(x.state)} · ${esc(x.schemaState||'UNKNOWN')}</code><small>${x.state!=='AVAILABLE'?(x.state==='UNAVAILABLE'?'API no disponible en runtime':'La API existe pero no pudo leerse'):x.schemaState==='MISSING'?'Schema ausente; proyección bloqueada':'Schema incompatible; proyección bloqueada'}</small><span class=\"review-source-schema\">actual: ${esc(x.schema||'—')} · esperado: ${esc(x.expectedSchema||'—')}</span>"
              new="<code>${esc(x.state)} · ${esc(x.schemaState||'UNKNOWN')} · ${esc(x.payloadState||'UNKNOWN')}</code><small>${x.state!=='AVAILABLE'?(x.state==='UNAVAILABLE'?'API no disponible en runtime':'La API existe pero no pudo leerse'):x.schemaState==='MISSING'?'Schema ausente; proyección bloqueada':x.schemaState==='MISMATCH'?'Schema incompatible; proyección bloqueada':x.payloadState==='INVALID'?'Todos los casos fuente son estructuralmente no proyectables':'Algunos casos fuente fueron aislados por forma inválida'}</small><span class=\"review-source-schema\">actual: ${esc(x.schema||'—')} · esperado: ${esc(x.expectedSchema||'—')}</span><span class=\"review-source-payload\">válidos: ${x.validCaseCount||0} · inválidos: ${x.invalidCaseCount||0}</span>"
              assert old in s
              s=s.replace(old,new,1)
              old="SCHEMA_MATCH ≠ DOCUMENT_VERIFICATION ≠ SOURCE_TRUST · SCHEMA_BLOCK ≠ SOURCE_MUTATION</div></section>`}"
              new="SCHEMA_MATCH ≠ DOCUMENT_VERIFICATION ≠ SOURCE_TRUST · SOURCE_PAYLOAD_INVALID ≠ SOURCE_EMPTY ≠ STAGE_NOT_REFERENCED · PARTIAL_PAYLOAD ≠ VERIFIED_COMPLETENESS · PAYLOAD_BLOCK ≠ SOURCE_MUTATION · SCHEMA_BLOCK ≠ SOURCE_MUTATION</div></section>`}"
              assert old in s
              s=s.replace(old,new,1)
              old="const unavailable=s.sourceState!=='AVAILABLE',schemaUnresolved=s.sourceState==='AVAILABLE'&&s.sourceSchemaState!=='MATCH';return `<div class=\"review-stage is-missing ${unavailable?'is-source-unavailable':schemaUnresolved?'is-schema-unresolved':''}\"><span class=\"review-stage-index\">${i+1}</span><strong>${esc(s.label)}</strong><small>${unavailable?'Fuente no disponible':schemaUnresolved?'Schema no compatible':'No referenciado'}</small><em>${unavailable||schemaUnresolved?'≠ etapa ausente / gap':'≠ gap / failure'}</em></div>`}"
              new="const unavailable=s.sourceState!=='AVAILABLE',schemaUnresolved=s.sourceState==='AVAILABLE'&&s.sourceSchemaState!=='MATCH',payloadInvalid=s.sourceState==='AVAILABLE'&&s.sourceSchemaState==='MATCH'&&s.sourcePayloadState==='INVALID';return `<div class=\"review-stage is-missing ${unavailable?'is-source-unavailable':schemaUnresolved?'is-schema-unresolved':payloadInvalid?'is-payload-invalid':''}\"><span class=\"review-stage-index\">${i+1}</span><strong>${esc(s.label)}</strong><small>${unavailable?'Fuente no disponible':schemaUnresolved?'Schema no compatible':payloadInvalid?'Payload no proyectable':'No referenciado'}</small><em>${unavailable||schemaUnresolved||payloadInvalid?'≠ etapa ausente / gap':'≠ gap / failure'}</em></div>`}"
              assert old in s
              s=s.replace(old,new,1)
              assert 'DATA ROOM · REVIEW WORKSPACE V97' in s
              s=s.replace('DATA ROOM · REVIEW WORKSPACE V97','DATA ROOM · REVIEW WORKSPACE V98',1)
              assert 'Circuito de revisión, sin selección ambigua de etapa' in s
              s=s.replace('Circuito de revisión, sin selección ambigua de etapa','Circuito de revisión, con payload fuente aislado de forma segura',1)
              p.write_text(s)
          css=Path('apps/control-web/public/sana-v3-review-workspace.css')
          c=css.read_text()
          if '.review-stage.is-payload-invalid{' not in c:
              c+='\n.review-stage.is-payload-invalid{background:#faf7f4;color:var(--muted);border-style:dashed}.review-source-payload{display:block;font-size:7px;line-height:1.35;color:var(--muted);overflow-wrap:anywhere}\n'
              css.write_text(c)
          sw=Path('apps/control-web/public/sana-v3-sw.js')
          w=sw.read_text()
          if "const CACHE='sana-v3-demo-shell-v98';" not in w:
              old="const CACHE='sana-v3-demo-shell-v97';"
              assert old in w
              w=w.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v97';\n}\nconst CACHE='sana-v3-demo-shell-v98';",1)
              sw.write_text(w)
          PY
      - name: Validate V87–V98
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          node scripts/validate-sana-dataroom-review-workspace-v88.mjs
          node scripts/validate-sana-dataroom-review-workspace-v89.mjs
          node scripts/validate-sana-dataroom-review-workspace-v90.mjs
          node scripts/validate-sana-dataroom-review-workspace-v91.mjs
          node scripts/validate-sana-dataroom-review-workspace-v92.mjs
          node scripts/validate-sana-dataroom-review-workspace-v93.mjs
          node scripts/validate-sana-dataroom-review-workspace-v94.mjs
          node scripts/validate-sana-dataroom-review-workspace-v95.mjs
          node scripts/validate-sana-dataroom-review-workspace-v96.mjs
          node scripts/validate-sana-dataroom-review-workspace-v97.mjs
          node scripts/validate-sana-dataroom-review-workspace-v98.mjs
      - name: Commit assembled V98
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-dataroom-review-workspace.js apps/control-web/public/sana-v3-review-workspace.css apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble Data Room review payload integrity v98'
          git push origin HEAD:demo/sana-v98-review-workspace-payload-integrity
