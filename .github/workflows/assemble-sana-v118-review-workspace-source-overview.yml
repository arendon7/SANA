name: Assemble SANA v118 Review Workspace Source Overview

on:
  push:
    branches:
      - 'demo/sana-v118-review-workspace-source-overview'
    paths:
      - 'scripts/apply-v118-review-source-overview.py'
      - 'scripts/validate-sana-dataroom-review-workspace-v118.mjs'
      - '.github/workflows/sana-demo-dataroom-review-workspace-v118.yml'
      - '.github/workflows/assemble-sana-v118-review-workspace-source-overview.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-v118-review-workspace-source-overview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply, assemble and validate V118
        run: |
          set +e
          rm -f v118-assembler-status.txt
          {
            python scripts/apply-v118-review-source-overview.py
            python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          active="const CACHE='sana-v3-demo-shell-v118';"
          if active not in s:
              old="const CACHE='sana-v3-demo-shell-v117';"
              if old not in s: raise SystemExit('active shell v117 not found')
              s=s.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v117';\n}\nconst CACHE='sana-v3-demo-shell-v118';",1)
              p.write_text(s)
          PY
            node scripts/validate-sana-dataroom-review-workspace.mjs
            for v in $(seq 88 118); do node scripts/validate-sana-dataroom-review-workspace-v${v}.mjs || exit $?; done
          } > v118-assembler.log 2>&1
          rc=$?
          cat v118-assembler.log
          if [ "$rc" -ne 0 ]; then
            tail -n 80 v118-assembler.log > v118-assembler-status.txt
          fi
          rm -f v118-assembler.log
          exit 0
      - name: Commit assembled V118 or diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/control-web/public/sana-v3-dataroom-entry.js apps/control-web/public/sana-v3-review-workspace.css apps/control-web/public/sana-v3-sw.js
          if [ -f v118-assembler-status.txt ]; then git add v118-assembler-status.txt; fi
          git diff --cached --quiet && exit 0
          if [ -f v118-assembler-status.txt ]; then
            git commit -m 'test: record V118 assembler diagnostic'
          else
            git commit -m 'demo: assemble review workspace source overview v118'
          fi
          git push origin HEAD:demo/sana-v118-review-workspace-source-overview
