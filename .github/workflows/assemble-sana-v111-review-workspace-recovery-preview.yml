name: Assemble SANA v111 Review Workspace Recovery Preview

on:
  push:
    branches:
      - 'demo/sana-v111-review-workspace-recovery-preview'
    paths:
      - 'scripts/apply-v111-review-recovery-preview.py'
      - 'scripts/fix-v111-preview-no-location.py'
      - 'scripts/validate-sana-dataroom-review-workspace-v111.mjs'
      - '.github/workflows/sana-demo-dataroom-review-workspace-v111.yml'
      - '.github/workflows/assemble-sana-v111-review-workspace-recovery-preview.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-v111-review-workspace-recovery-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply, assemble and validate V111
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            if grep -q "const REVIEW_V111_COMPAT=" apps/control-web/public/sana-v3-dataroom-entry.js; then
              echo 'V111 product patch already present; validating current product.'
            else
              python scripts/apply-v111-review-recovery-preview.py
            fi
            python scripts/fix-v111-preview-no-location.py
            python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          active111="const CACHE='sana-v3-demo-shell-v111';"
          active110="const CACHE='sana-v3-demo-shell-v110';"
          if active111 in s:
              print('shell v111 already active')
          elif active110 in s:
              s=s.replace(active110,"if(false){\nconst CACHE='sana-v3-demo-shell-v110';\n}\nconst CACHE='sana-v3-demo-shell-v111';",1)
              p.write_text(s)
          else:
              raise SystemExit('active shell v110/v111 not found')
          PY
            node scripts/validate-sana-dataroom-review-workspace.mjs
            for v in $(seq 88 111); do node scripts/validate-sana-dataroom-review-workspace-v${v}.mjs; done
          } 2>&1 | tee /tmp/v111-gate.log
      - name: Publish V111 failure diagnostics
        if: steps.gate.outcome == 'failure'
        run: |
          cp /tmp/v111-gate.log v111-assembler-status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v111-assembler-status.txt
          git diff --cached --quiet || git commit -m 'ci: record v111 assembler diagnostics'
          git push origin HEAD:demo/sana-v111-review-workspace-recovery-preview
          exit 1
      - name: Commit validated V111
        if: steps.gate.outcome == 'success'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f v111-assembler-status.txt
          git add apps/control-web/public/sana-v3-dataroom-entry.js apps/control-web/public/sana-v3-review-workspace.css apps/control-web/public/sana-v3-sw.js
          git add -A v111-assembler-status.txt
          git diff --cached --quiet && exit 0
          git commit -m 'demo: validate review workspace recovery preview v111'
          git push origin HEAD:demo/sana-v111-review-workspace-recovery-preview
