name: AGROWAY CONTROL v0.22 alpha13
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/investment-portfolio/**"
      - "config/product/control-alpha13-postgres-production-wiring.json"
      - "config/product/control-operational-acceptance.json"
      - "config/product/control-review-bundle.json"
      - "scripts/control-postgres-production-wiring-runtime.mjs"
      - "scripts/validate-control-postgres-production-wiring.mjs"
      - "scripts/validate-control-operational-acceptance.mjs"
      - "scripts/build-control-review-bundle.mjs"
      - ".github/workflows/agroway-v022-control-alpha13.yml"
concurrency:
  group: agroway-control-v022-alpha13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  production-postgres-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check alpha13
        run: |
          node --check scripts/control-postgres-production-wiring-runtime.mjs
          node --check scripts/validate-control-postgres-production-wiring.mjs
          node --check scripts/validate-control-operational-acceptance.mjs
          node --check scripts/build-control-review-bundle.mjs
      - name: Direct-root persistence topology and lock parity
        run: node scripts/validate-direct-root-persistence.mjs
      - name: Offline canonical workspace install
        run: npm ci --ignore-scripts --offline
      - name: Pinned TypeScript strict
        run: npx -y -p typescript@5.8.3 tsc -p tsconfig.json --noEmit
      - name: Alpha3-alpha12 regression gates
        run: |
          node scripts/validate-control-exception-resolution.mjs
          node scripts/validate-control-evidence-ledger.mjs
          node scripts/validate-control-human-approval.mjs
          node scripts/validate-control-submission-handoff.mjs
          node scripts/validate-control-unified-flow.mjs
          node scripts/validate-control-reintegration.mjs
          node scripts/validate-control-production-authorization.mjs
          node scripts/validate-control-canonical-write.mjs
          node scripts/validate-control-oidc-session.mjs
          node scripts/validate-control-postgres-write.mjs
      - name: Alpha13 production PostgreSQL wiring static guardrail
        run: node scripts/validate-control-postgres-production-wiring.mjs
      - name: Full CONTROL operational truth gate
        run: node scripts/validate-control-operational-acceptance.mjs
      - name: Compile services for runtime
        run: |
          rm -rf .tmp/control-alpha13
          npx -y -p typescript@5.8.3 tsc -p tsconfig.json --noEmit false --outDir .tmp/control-alpha13
      - name: Production authorization regression runtime
        run: node scripts/control-production-authorization-runtime.mjs .tmp/control-alpha13/services/identity-access/src/index.js
      - name: Canonical write regression runtime
        run: node scripts/control-canonical-write-runtime.mjs .tmp/control-alpha13/services/investment-portfolio/src/index.js
      - name: OIDC real-signature regression runtime
        run: node scripts/control-oidc-session-runtime.mjs .tmp/control-alpha13/services/identity-access/src/index.js
      - name: PostgreSQL transaction adapter regression runtime
        run: node scripts/control-postgres-write-runtime.mjs .tmp/control-alpha13/services/investment-portfolio/src/index.js
      - name: Production PostgreSQL wiring runtime matrix
        run: node scripts/control-postgres-production-wiring-runtime.mjs .tmp/control-alpha13/services/investment-portfolio/src/index.js
      - name: Build deterministic alpha13 CONTROL review bundle
        run: node scripts/build-control-review-bundle.mjs
      - name: Smoke alpha13 review bundle truth
        run: |
          PORT=4284 node dist/control-review-bundle/server.mjs > /tmp/control-alpha13-bundle.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4284/control >/dev/null && break || sleep .25; done
          for route in /control /control/projects/inv-yar-001 /control/identity-adapter /control/authorization /control/write-adapter /control/exceptions /control/evidence /control/approvals /control/handoff; do curl -fsS "http://127.0.0.1:4284$route" >/dev/null; done
          node -e "const m=require('./dist/control-review-bundle/REVIEW_MANIFEST.json');const a=require('./dist/control-review-bundle/config/product/control-operational-acceptance.json');const n=Number(m.version.split('alpha')[1]);const blocker=n>=14?'PRODUCTION_POSTGRES_REAL_SECRET_BINDING_AND_CONNECTIVITY_PENDING':'PRODUCTION_POSTGRES_POOL_DRIVER_AND_SECRET_BINDING_PENDING';const ackOk=n<15||(n<17?(m.authority.externalAckAdapterImplemented===true&&m.authority.externalAckProviderConfigured===false&&a.productionBlockers.includes('EXTERNAL_ACK_PROVIDER_CONFIGURATION_PENDING')&&!a.productionBlockers.includes('EXTERNAL_ACK_ADAPTER_ABSENT')):(m.authority.externalAckAdapterImplemented===true&&m.authority.productionExternalAckProviderWiringImplemented===true&&m.authority.externalAckProviderConfigured===false&&m.authority.externalAckProviderConnectivityCertified===false&&m.authority.realExternalAckObserved===false&&a.productionBlockers.includes('EXTERNAL_ACK_PROVIDER_REAL_BINDING_AND_CONNECTIVITY_PENDING')&&!a.productionBlockers.includes('EXTERNAL_ACK_PROVIDER_CONFIGURATION_PENDING')));const idpOk=n<16||(m.authority.productionIdentityProviderWiringImplemented===true&&m.authority.realIdentityProviderConfigured===false&&m.authority.realIdentityProviderConnectivityCertified===false&&a.productionBlockers.includes('PRODUCTION_IDENTITY_PROVIDER_REAL_BINDING_AND_CONNECTIVITY_PENDING')&&!a.productionBlockers.includes('PRODUCTION_IDENTITY_PROVIDER_CONFIGURATION_PENDING'));if(!Number.isInteger(n)||n<13||m.routes.length!==9||m.authority.productionDatabaseConfigurationContractImplemented!==true||m.authority.productionDatabaseConfigured!==false||m.authority.productionPoolDriverConnected!==false||m.authority.productionConnectivityCertified!==false||m.authority.productionExecutionAvailable!==false||a.productionReady!==false||a.productionBlockers.length!==4||!a.productionBlockers.includes(blocker)||!ackOk||!idpOk)process.exit(1);console.log('PASS_CONTROL_ALPHA13_SUCCESSOR_BUNDLE',m.version,m.fileCount,m.aggregateSha256,a.productionBlockers.length,blocker)"
      - name: Trust boundary
        run: |
          echo 'PASS_CONTROL_ALPHA13_PRODUCTION_POSTGRES_CONFIGURATION_AND_WIRING'
          echo 'External-secret configuration, mandatory TLS, bounded pool policy and read-only connectivity gate remain review-certified. Successor pinned-driver, ACK and identity wiring do not imply real production secret/provider binding, connectivity, or canonical write.'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: agroway-control-v022-alpha13-review-bundle
          path: dist/control-review-bundle
          if-no-files-found: error
          retention-days: 14
