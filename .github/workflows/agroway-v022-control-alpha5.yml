name: AGROWAY CONTROL v0.22 alpha5
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/control-web/**"
      - "config/design/screens/human-approval-queue.json"
      - "scripts/validate-control-human-approval.mjs"
      - "scripts/control-approvals-http-browser-qa.py"
      - "docs/product/V022_HUMAN_APPROVAL_QUEUE_VALIDATION.md"
      - ".github/workflows/agroway-v022-control-alpha5.yml"
concurrency:
  group: agroway-control-v022-alpha5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  human-approval-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax-check CONTROL alpha5
        run: |
          node --check apps/control-web/server.mjs
          node --check apps/control-web/public/approvals.js
          node --check apps/control-web/public/service-worker.js
          node --check scripts/validate-control-human-approval.mjs
          python -m py_compile scripts/control-approvals-http-browser-qa.py
      - name: Pinned TypeScript strict
        run: npx -y -p typescript@5.8.3 tsc -p tsconfig.json --noEmit
      - name: Alpha3 authority regression
        run: node scripts/validate-control-exception-resolution.mjs
      - name: Alpha4 evidence ledger regression
        run: node scripts/validate-control-evidence-ledger.mjs
      - name: Alpha5 human approval guardrails
        run: node scripts/validate-control-human-approval.mjs
      - name: Base persistence boundary
        run: |
          echo 'CONTROL_ALPHA5_SCOPED_GATE'
          echo 'The FIELD base root-lock/direct-monorepo persistence debt remains separate and is not reclassified as PASS.'
      - name: Install pinned Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native Chromium to real CONTROL approvals HTTP
        run: python scripts/control-approvals-http-browser-qa.py
      - name: Trust boundary
        run: |
          echo 'PASS_CONTROL_HUMAN_APPROVAL_ALPHA5_NATIVE_HTTP'
          echo 'Approval authority remains HUMAN_ONLY; APPROVED_FOR_SUBMISSION never executes; executionState=NOT_EXECUTED; AI remains advisory; D10=PENDING.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agroway-control-v022-alpha5-human-approvals
          path: docs/product/evidence/human-approvals
          if-no-files-found: warn
          retention-days: 14
