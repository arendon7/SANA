name: SANA Demo Data Room Review Workspace V91

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-workspace.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'scripts/validate-sana-dataroom-review-workspace-v91.mjs'
      - 'apps/control-web/public/sana-v3-sw.js'
      - '.github/workflows/sana-demo-dataroom-review-workspace-v91.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-workspace.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'scripts/validate-sana-dataroom-review-workspace-v91.mjs'
      - 'apps/control-web/public/sana-v3-sw.js'

jobs:
  review-workspace-v91-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve V87–V91 workspace contracts
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          node scripts/validate-sana-dataroom-review-workspace-v88.mjs
          node scripts/validate-sana-dataroom-review-workspace-v89.mjs
          node scripts/validate-sana-dataroom-review-workspace-v90.mjs
          node scripts/validate-sana-dataroom-review-workspace-v91.mjs
      - name: Assert V91 shell, minimization and read-only boundary
        run: |
          grep -Eq "^const CACHE='sana-v3-demo-shell-v(9[1-9]|[1-9][0-9]{2,})';" apps/control-web/public/sana-v3-sw.js
          grep -q 'TIMELINE_ORDER ≠ CAUSALITY ≠ REVIEW_PROGRESS' apps/control-web/public/sana-v3-dataroom-review-workspace.js
          grep -q 'EVENT_REFERENCE ≠ VERIFIED_REFERENCE' apps/control-web/public/sana-v3-dataroom-review-workspace.js
          ! grep -Eq 'fetch\s*\(|canonicalMutated\s*=\s*true|dueDiligenceApprovals\s*:\s*[1-9]|investmentDecisions\s*:\s*[1-9]' apps/control-web/public/sana-v3-dataroom-review-workspace.js
