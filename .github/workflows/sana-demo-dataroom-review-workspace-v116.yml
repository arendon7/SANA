name: SANA Demo Data Room Review Workspace V116

on:
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-entry.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-dataroom-review-workspace*.mjs'
      - '.github/workflows/sana-demo-dataroom-review-workspace-v116.yml'

permissions:
  contents: read

jobs:
  review-workspace-v116-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve V87–V116 workspace contracts
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          for v in $(seq 88 116); do node scripts/validate-sana-dataroom-review-workspace-v${v}.mjs; done
      - name: Assert V116 shell, assistance disclosure semantics and read-only boundary
        run: |
          grep -F "const CACHE='sana-v3-demo-shell-v116';" apps/control-web/public/sana-v3-sw.js
          grep -F 'ASSISTANCE_DISCLOSURE ≠ REVIEW_PROGRESS' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'COLLAPSED_GUIDANCE ≠ HIDDEN_EVIDENCE' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'DISCLOSURE_STATE ≠ PERSISTED_STATE' apps/control-web/public/sana-v3-dataroom-entry.js
          grep -F 'data-review-assistance' apps/control-web/public/sana-v3-dataroom-entry.js
          ! grep -Eq 'rwAssistance|rwGuidanceOpen|data-review-assistance-state|localStorage\.(setItem|removeItem|clear)|sessionStorage' apps/control-web/public/sana-v3-dataroom-entry.js
