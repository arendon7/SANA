name: SANA Demo Due Diligence V58

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-due-diligence-economic-reconciliation-gaps.js'
      - 'apps/control-web/public/sana-v3-dataroom-economic-reconciliation-history.js'
      - 'apps/control-web/public/sana-v3-report-snapshot-economic-reconciliation.js'
      - 'apps/control-web/public/sana-v3-due-diligence-remediation.js'
      - 'apps/control-web/public/sana-v3-dd-next-cut.js'
      - 'apps/control-web/public/sana-v3-dataroom-entry.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'scripts/validate-sana-economic-reconciliation-history.mjs'
      - '.github/workflows/sana-demo-due-diligence-v58.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-due-diligence-economic-reconciliation-gaps.js'
      - 'apps/control-web/public/sana-v3-dataroom-economic-reconciliation-history.js'
      - 'apps/control-web/public/sana-v3-report-snapshot-economic-reconciliation.js'
      - 'apps/control-web/public/sana-v3-due-diligence-remediation.js'
      - 'apps/control-web/public/sana-v3-dd-next-cut.js'
      - 'apps/control-web/public/sana-v3-dataroom-entry.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'scripts/validate-sana-economic-reconciliation-history.mjs'
      - '.github/workflows/sana-demo-due-diligence-v58.yml'

permissions:
  contents: read

jobs:
  composed-dd-v58:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate economic historical semantics
        run: node scripts/validate-sana-economic-reconciliation-history.mjs
      - name: Validate economic DD composition before remediation
        shell: bash
        run: |
          set -euo pipefail
          html='apps/control-web/public/sana-v3.html'
          grep -q '/sana-v3-due-diligence-source-evidence-gaps.js.*sana-v3-due-diligence-economic-reconciliation-gaps.js.*sana-v3-due-diligence-remediation.js.*sana-v3-dd-next-cut.js' "$html"
          grep -q '/sana-v3-dataroom-source-evidence-history.js.*sana-v3-dataroom-economic-reconciliation-history.js.*sana-v3-dataroom-entry.js' "$html"
      - name: Validate snapshot-only and documentary boundaries
        shell: bash
        run: |
          set -euo pipefail
          hist='apps/control-web/public/sana-v3-dataroom-economic-reconciliation-history.js'; gaps='apps/control-web/public/sana-v3-due-diligence-economic-reconciliation-gaps.js'
          grep -q 'NO_LIVE_FALLBACK' "$hist"
          grep -q 'BUDGET_VARIANCE ≠ GAP' "$gaps"
          grep -q 'NO_PAYMENT ≠ GAP' "$gaps"
          grep -q 'NO_SALE ≠ GAP' "$gaps"
          grep -q 'DOCUMENTARY_PRIORITY ≠ FINANCIAL_DISTRESS' "$gaps"
