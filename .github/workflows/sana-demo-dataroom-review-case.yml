name: SANA Demo Data Room Review Case

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-case.js'
      - 'scripts/validate-sana-dataroom-review-case.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - '.github/workflows/sana-demo-dataroom-review-case.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-case.js'
      - 'scripts/validate-sana-dataroom-review-case.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'

jobs:
  dataroom-review-case-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and semantic contracts
        run: |
          node --check apps/control-web/public/sana-v3-dataroom-review-case.js
          node scripts/validate-sana-dataroom-review-case.mjs
      - name: Validate review case boundaries
        run: |
          grep -q 'REVIEW_CASE_OPENED ≠ ACCESS_GRANTED' apps/control-web/public/sana-v3-dataroom-review-case.js
          grep -q 'SNAPSHOT_CUT_PINNED ≠ LIVE_STATE' apps/control-web/public/sana-v3-dataroom-review-case.js
          grep -q 'MODULE_REFERENCES_LINKED ≠ MODULES_VERIFIED' apps/control-web/public/sana-v3-dataroom-review-case.js
          grep -q 'INTERNAL_REFERENCE_MATCH ≠ EXTERNAL_VERIFICATION' apps/control-web/public/sana-v3-dataroom-review-case.js
          grep -q 'FINDINGS_LINKED ≠ RISK_SCORE' apps/control-web/public/sana-v3-dataroom-review-case.js
          grep -q 'REVIEW_GOVERNANCE_LINKED ≠ VERIFIED_INDEPENDENCE' apps/control-web/public/sana-v3-dataroom-review-case.js
          grep -q 'REVIEW_CASE_CLOSED ≠ DUE_DILIGENCE_APPROVAL' apps/control-web/public/sana-v3-dataroom-review-case.js
          grep -q 'REVIEW_ONLY' apps/control-web/public/sana-v3-dataroom-review-case.js
          grep -q 'NO_EXTERNAL_ACTION' apps/control-web/public/sana-v3-dataroom-review-case.js
          grep -q 'NO_TRANSACTIONAL_AUTHORITY' apps/control-web/public/sana-v3-dataroom-review-case.js
      - name: Validate assembly when v75 is present
        run: |
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const html=fs.readFileSync('apps/control-web/public/sana-v3.html','utf8');
          const sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');
          const governance='/sana-v3-dataroom-review-governance.js',reviewCase='/sana-v3-dataroom-review-case.js',impact='/sana-v3-dataroom-impact-history.js';
          if(!html.includes(reviewCase)){console.log('v75 staged before assembly; strict shell validation deferred.');process.exit(0)}
          for(const file of [governance,reviewCase,impact]){assert(html.includes(file),`HTML missing ${file}`);assert(sw.includes(`'${file}'`),`PWA missing ${file}`)}
          assert(html.indexOf(governance)<html.indexOf(reviewCase));assert(html.indexOf(reviewCase)<html.indexOf(impact));
          assert(sw.indexOf(`'${governance}'`)<sw.indexOf(`'${reviewCase}'`));assert(sw.indexOf(`'${reviewCase}'`)<sw.indexOf(`'${impact}'`));
          const versions=[...sw.matchAll(/const CACHE='sana-v3-demo-shell-v(\d+)'/g)].map(m=>Number(m[1]));assert(versions.length&&Math.max(...versions)>=75,'shell must be v75 or newer');
          NODE
      - name: Assert review-only runtime
        run: |
          ! grep -Eq 'fetch\s*\(' apps/control-web/public/sana-v3-dataroom-review-case.js
          ! grep -Eq 'productionExecutionAvailable\s*=\s*true|productionActivationAllowed\s*=\s*true|canonicalMutated\s*=\s*true' apps/control-web/public/sana-v3-dataroom-review-case.js
          ! grep -Eq 'dueDiligenceApprovals\s*:\s*[1-9]|riskScores\s*:\s*[1-9]|externalActions\s*:\s*[1-9]' apps/control-web/public/sana-v3-dataroom-review-case.js

# v75 certification trigger: one review case links the Data Room review ledgers without scoring, approval or external action.
