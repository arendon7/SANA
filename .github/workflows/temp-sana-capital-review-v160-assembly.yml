name: TEMP SANA Capital Review V160 Assembly

on:
  push:
    branches: [demo/sana-capital-review-v160]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-capital-review-v160
      - name: Assemble v160 loader and shell
        run: |
          set -euo pipefail
          python scripts/temp-assemble-sana-capital-review-v160.py
          node --check apps/control-web/public/sana-v3-capital-review-ledger.js
          node --check apps/control-web/public/sana-v3-sw.js
          grep -Fq '__SANA_CAPITAL_REVIEW_REFERENCES_LOADER__' apps/control-web/public/sana-v3-capital-review-ledger.js
          grep -q "^const CACHE='sana-v3-demo-shell-v160';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v159';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          test "$(grep -o '/sana-v3-capital-review-references.js' apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1
      - name: Commit assembly if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-capital-review-ledger.js apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble capital review shell v160'
          git push origin HEAD:demo/sana-capital-review-v160
