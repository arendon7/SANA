name: TEMP Assemble Forecast V140 Shell

on:
  push:
    branches: [demo/sana-forecast-v140]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-forecast-v140
          fetch-depth: 1
      - name: Patch shell from certified v139
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          old="""if(false){
          const CACHE='sana-v3-demo-shell-v138';
          }
          const CACHE='sana-v3-demo-shell-v139';"""
          new="""if(false){
          const CACHE='sana-v3-demo-shell-v138';
          }
          if(false){
          const CACHE='sana-v3-demo-shell-v139';
          }
          const CACHE='sana-v3-demo-shell-v140';"""
          assert old in s, 'active v139 marker not found exactly once'
          assert s.count("const CACHE='sana-v3-demo-shell-v139';")==1
          s=s.replace(old,new,1)
          old_assets="'/sana-v3-forecast-ledger.js','/sana-v3-forecast-references.js','/sana-v3-labor-ledger.js'"
          new_assets="'/sana-v3-forecast-ledger.js','/sana-v3-forecast-references.js','/sana-v3-report-snapshot-forecast-references.js','/sana-v3-cycle-forecast-references.js','/sana-v3-due-diligence-forecast-reference-gaps.js','/sana-v3-dataroom-forecast-references.js','/sana-v3-labor-ledger.js'"
          assert old_assets in s, 'forecast asset insertion point not found'
          s=s.replace(old_assets,new_assets,1)
          old_comment='// v139 validates Forecast plan/basis/activity/review-evidence references without turning references into forecast truth, causal basis, approval, execution, procurement or financial authority.'
          new_comment=old_comment+'\n// v140 propagates Forecast reference integrity through Snapshot, Data Room, Cycle and Due Diligence without live fallback, retrofill, weighting, procurement or financial inference.'
          assert old_comment in s
          assert 'v140 propagates Forecast reference integrity' not in s
          s=s.replace(old_comment,new_comment,1)
          for asset in [
            '/sana-v3-report-snapshot-forecast-references.js',
            '/sana-v3-cycle-forecast-references.js',
            '/sana-v3-due-diligence-forecast-reference-gaps.js',
            '/sana-v3-dataroom-forecast-references.js']:
            assert s.count(asset)==1, asset
          assert s.count("const CACHE='sana-v3-demo-shell-v140';")==1
          p.write_text(s)
          PY
          git diff --check
          git diff -- apps/control-web/public/sana-v3-sw.js
      - name: Commit shell bump
        run: |
          if git diff --quiet -- apps/control-web/public/sana-v3-sw.js; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble forecast reference provenance v140 shell'
          git push origin HEAD:demo/sana-forecast-v140
