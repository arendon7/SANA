name: Assemble SANA v96 Review Workspace Schema Integrity

on:
  push:
    branches: [demo/sana-v96-review-workspace-schema-integrity]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-workspace.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'scripts/validate-sana-dataroom-review-workspace-v96.mjs'
      - '.github/workflows/assemble-sana-v96-review-workspace-schema-integrity.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: demo/sana-v96-review-workspace-schema-integrity}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply deterministic V96 schema-integrity patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-dataroom-review-workspace.js')
          s=p.read_text()
          if "const SOURCE_SCHEMA_INTEGRITY_BASELINE='REVIEW WORKSPACE V96';" not in s:
              old="const SOURCE_AVAILABILITY_BASELINE='REVIEW WORKSPACE V95';"
              assert old in s
              s=s.replace(old,old+"\nconst SOURCE_SCHEMA_INTEGRITY_BASELINE='REVIEW WORKSPACE V96';",1)
              old="const STAGES=[['CASE','Expediente','__SANA_DATAROOM_REVIEW_CASE__'],['HANDOFF','Handoff','__SANA_DATAROOM_REVIEW_HANDOFF__'],['FEEDBACK','Feedback','__SANA_DATAROOM_REVIEW_FEEDBACK__'],['RESPONSE','Respuesta','__SANA_DATAROOM_REVIEW_RESPONSE__'],['DISPOSITION','Disposición','__SANA_DATAROOM_REVIEW_DISPOSITION__'],['ROUND','Ronda','__SANA_DATAROOM_REVIEW_ROUND__']];"
              new="const STAGES=[['CASE','Expediente','__SANA_DATAROOM_REVIEW_CASE__','SANA_DATAROOM_REVIEW_CASE_V1'],['HANDOFF','Handoff','__SANA_DATAROOM_REVIEW_HANDOFF__','SANA_DATAROOM_REVIEW_HANDOFF_V1'],['FEEDBACK','Feedback','__SANA_DATAROOM_REVIEW_FEEDBACK__','SANA_DATAROOM_REVIEW_FEEDBACK_V1'],['RESPONSE','Respuesta','__SANA_DATAROOM_REVIEW_RESPONSE__','SANA_DATAROOM_REVIEW_RESPONSE_V1'],['DISPOSITION','Disposición','__SANA_DATAROOM_REVIEW_DISPOSITION__','SANA_DATAROOM_REVIEW_DISPOSITION_V1'],['ROUND','Ronda','__SANA_DATAROOM_REVIEW_ROUND__','SANA_DATAROOM_REVIEW_ROUND_V1']];"
              assert old in s
              s=s.replace(old,new,1)
              old='SOURCE_AVAILABILITY ≠ SOURCE_VERIFICATION · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              new='SOURCE_AVAILABILITY ≠ SOURCE_VERIFICATION · SOURCE_SCHEMA_MISSING ≠ SOURCE_EMPTY ≠ STAGE_NOT_REFERENCED · SOURCE_SCHEMA_MISMATCH ≠ REVIEW_FAILURE · SCHEMA_MATCH ≠ DOCUMENT_VERIFICATION ≠ SOURCE_TRUST · SCHEMA_BLOCK ≠ SOURCE_MUTATION · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              assert old in s
              s=s.replace(old,new,1)
              old="function sourceProbe(stage,label,api){const source=window[api];if(!source||typeof source.cases!=='function')return {stage,label,api,state:'UNAVAILABLE',schema:source?.schema||'',caseCount:0,cases:[],integrity:'SOURCE_API_UNAVAILABLE ≠ STAGE_NOT_REFERENCED ≠ REVIEW_GAP'};try{const schema=source.schema||'',list=source.cases();if(!Array.isArray(list))throw new TypeError('SOURCE_CASES_NOT_ARRAY');const normalized=list.map(c=>({...c,__workspaceSourceSchema:schema||c?.schema||''}));return {stage,label,api,state:'AVAILABLE',schema,caseCount:normalized.length,cases:normalized,integrity:'SOURCE_AVAILABILITY ≠ SOURCE_VERIFICATION'}}catch{return {stage,label,api,state:'READ_ERROR',schema:source?.schema||'',caseCount:0,cases:[],integrity:'SOURCE_READ_ERROR ≠ SOURCE_EMPTY'}}}\nfunction cases(api){const cfg=STAGES.find(x=>x[2]===api)||['','',api];return sourceProbe(cfg[0],cfg[1],api).cases}"
              new="function sourceProbe(stage,label,api,expectedSchema){const source=window[api];if(!source||typeof source.cases!=='function')return {stage,label,api,state:'UNAVAILABLE',schema:source?.schema||'',expectedSchema:expectedSchema||'',schemaState:'UNKNOWN',caseCount:0,cases:[],integrity:'SOURCE_API_UNAVAILABLE ≠ STAGE_NOT_REFERENCED ≠ REVIEW_GAP'};const schema=source.schema||'',schemaState=!schema?'MISSING':schema===expectedSchema?'MATCH':'MISMATCH';if(schemaState!=='MATCH')return {stage,label,api,state:'AVAILABLE',schema,expectedSchema:expectedSchema||'',schemaState,caseCount:0,cases:[],integrity:schemaState==='MISSING'?'SOURCE_SCHEMA_MISSING ≠ SOURCE_EMPTY ≠ STAGE_NOT_REFERENCED · SCHEMA_BLOCK ≠ SOURCE_MUTATION':'SOURCE_SCHEMA_MISMATCH ≠ REVIEW_FAILURE · SCHEMA_BLOCK ≠ SOURCE_MUTATION'};try{const list=source.cases();if(!Array.isArray(list))throw new TypeError('SOURCE_CASES_NOT_ARRAY');const normalized=list.map(c=>({...c,__workspaceSourceSchema:schema||c?.schema||''}));return {stage,label,api,state:'AVAILABLE',schema,expectedSchema:expectedSchema||'',schemaState:'MATCH',caseCount:normalized.length,cases:normalized,integrity:'SCHEMA_MATCH ≠ DOCUMENT_VERIFICATION ≠ SOURCE_TRUST'}}catch{return {stage,label,api,state:'READ_ERROR',schema,expectedSchema:expectedSchema||'',schemaState:'MATCH',caseCount:0,cases:[],integrity:'SOURCE_READ_ERROR ≠ SOURCE_EMPTY'}}}\nfunction cases(api){const cfg=STAGES.find(x=>x[2]===api)||['','',api,''];return sourceProbe(cfg[0],cfg[1],api,cfg[3]).cases}"
              assert old in s
              s=s.replace(old,new,1)
              old="function state(){const entries=[],sources=STAGES.map(([stage,label,api])=>sourceProbe(stage,label,api));sources.forEach((source,order)=>source.cases.forEach(c=>entries.push(entry(source.stage,source.label,c,order))));const groups="
              new="function state(){const entries=[],sources=STAGES.map(([stage,label,api,expectedSchema])=>sourceProbe(stage,label,api,expectedSchema));sources.forEach((source,order)=>source.cases.forEach(c=>entries.push(entry(source.stage,source.label,c,order))));const groups="
              assert old in s
              s=s.replace(old,new,1)
              old="const stages=STAGES.map(([stage,label],order)=>({stage,label,order,entry:byStage.get(stage)||null,present:byStage.has(stage),sourceState:sources[order]?.state||'UNAVAILABLE',sourceSchema:sources[order]?.schema||''}));"
              new="const stages=STAGES.map(([stage,label],order)=>({stage,label,order,entry:byStage.get(stage)||null,present:byStage.has(stage),sourceState:sources[order]?.state||'UNAVAILABLE',sourceSchema:sources[order]?.schema||'',sourceSchemaState:sources[order]?.schemaState||'UNKNOWN',expectedSchema:sources[order]?.expectedSchema||''}));"
              assert old in s
              s=s.replace(old,new,1)
              old="indeterminateStages=stages.filter(x=>!x.present&&x.sourceState!=='AVAILABLE').map(x=>x.stage),missingStages=stages.filter(x=>!x.present&&x.sourceState==='AVAILABLE').map(x=>x.stage)"
              new="indeterminateStages=stages.filter(x=>!x.present&&(x.sourceState!=='AVAILABLE'||x.sourceSchemaState!=='MATCH')).map(x=>x.stage),missingStages=stages.filter(x=>!x.present&&x.sourceState==='AVAILABLE'&&x.sourceSchemaState==='MATCH').map(x=>x.stage)"
              assert old in s
              s=s.replace(old,new,1)
              old="unavailableSources:sources.filter(x=>x.state==='UNAVAILABLE').length,sourceReadErrors:sources.filter(x=>x.state==='READ_ERROR').length,riskScores:0"
              new="unavailableSources:sources.filter(x=>x.state==='UNAVAILABLE').length,sourceReadErrors:sources.filter(x=>x.state==='READ_ERROR').length,schemaMismatches:sources.filter(x=>x.schemaState==='MISMATCH').length,missingSourceSchemas:sources.filter(x=>x.schemaState==='MISSING').length,riskScores:0"
              assert old in s
              s=s.replace(old,new,1)
              old="function sourceIntegrityBanner(s){const affected=(s.sources||[]).filter(x=>x.state!=='AVAILABLE');if(!affected.length)return '';return `<section class=\"review-source-integrity\" aria-label=\"Integridad de disponibilidad de fuentes\"><div class=\"review-source-integrity-head\"><div><p class=\"kicker\">DISPONIBILIDAD DE FUENTES · READ ONLY</p><h4>${affected.length} fuente(s) no determinables en esta proyección</h4><p>Una fuente ausente o con error de lectura vuelve la etapa indeterminada. No equivale a etapa no referenciada, gap, falla ni resultado de revisión.</p></div><span class=\"status\">SOURCE STATE</span></div><div class=\"review-source-list\">${affected.map(x=>`<div class=\"review-source-item\"><strong>${esc(x.label)} · ${esc(x.stage)}</strong><code>${esc(x.state)}</code><small>${x.state==='UNAVAILABLE'?'API no disponible en runtime':'La API existe pero no pudo leerse'}</small></div>`).join('')}</div><div class=\"section-note\">SOURCE_API_UNAVAILABLE ≠ STAGE_NOT_REFERENCED ≠ REVIEW_GAP · SOURCE_READ_ERROR ≠ SOURCE_EMPTY · SOURCE_AVAILABILITY ≠ SOURCE_VERIFICATION</div></section>`}"
              new="function sourceIntegrityBanner(s){const affected=(s.sources||[]).filter(x=>x.state!=='AVAILABLE'||x.schemaState!=='MATCH');if(!affected.length)return '';return `<section class=\"review-source-integrity\" aria-label=\"Integridad de disponibilidad y schema de fuentes\"><div class=\"review-source-integrity-head\"><div><p class=\"kicker\">FUENTE + SCHEMA · READ ONLY</p><h4>${affected.length} fuente(s) no determinables en esta proyección</h4><p>Disponibilidad y compatibilidad de schema son precondiciones técnicas de proyección; no verifican documentos, suficiencia, identidad ni resultado.</p></div><span class=\"status\">SOURCE STATE</span></div><div class=\"review-source-list\">${affected.map(x=>`<div class=\"review-source-item\"><strong>${esc(x.label)} · ${esc(x.stage)}</strong><code>${esc(x.state)} · ${esc(x.schemaState||'UNKNOWN')}</code><small>${x.state!=='AVAILABLE'?(x.state==='UNAVAILABLE'?'API no disponible en runtime':'La API existe pero no pudo leerse'):x.schemaState==='MISSING'?'Schema ausente; proyección bloqueada':'Schema incompatible; proyección bloqueada'}</small><span class=\"review-source-schema\">actual: ${esc(x.schema||'—')} · esperado: ${esc(x.expectedSchema||'—')}</span></div>`).join('')}</div><div class=\"section-note\">SOURCE_API_UNAVAILABLE ≠ STAGE_NOT_REFERENCED ≠ REVIEW_GAP · SOURCE_SCHEMA_MISSING ≠ SOURCE_EMPTY ≠ STAGE_NOT_REFERENCED · SOURCE_SCHEMA_MISMATCH ≠ REVIEW_FAILURE · SCHEMA_MATCH ≠ DOCUMENT_VERIFICATION ≠ SOURCE_TRUST · SCHEMA_BLOCK ≠ SOURCE_MUTATION</div></section>`}"
              assert old in s
              s=s.replace(old,new,1)
              old="function stageCard(s,i,c,f){if(!s.present){const unavailable=s.sourceState!=='AVAILABLE';return `<div class=\"review-stage is-missing ${unavailable?'is-source-unavailable':''}\"><span class=\"review-stage-index\">${i+1}</span><strong>${esc(s.label)}</strong><small>${unavailable?'Fuente no disponible':'No referenciado'}</small><em>${unavailable?'≠ etapa ausente / gap':'≠ gap / failure'}</em></div>`}const e=s.entry,selected=f.stage===e.stage&&f.capital===c.capitalCaseRef&&f.lot===c.lot;"
              new="function stageCard(s,i,c,f){if(!s.present){const unavailable=s.sourceState!=='AVAILABLE',schemaUnresolved=s.sourceState==='AVAILABLE'&&s.sourceSchemaState!=='MATCH';return `<div class=\"review-stage is-missing ${unavailable?'is-source-unavailable':schemaUnresolved?'is-schema-unresolved':''}\"><span class=\"review-stage-index\">${i+1}</span><strong>${esc(s.label)}</strong><small>${unavailable?'Fuente no disponible':schemaUnresolved?'Schema no compatible':'No referenciado'}</small><em>${unavailable||schemaUnresolved?'≠ etapa ausente / gap':'≠ gap / failure'}</em></div>`}const e=s.entry,selected=f.stage===e.stage&&f.capital===c.capitalCaseRef&&f.lot===c.lot;"
              assert old in s
              s=s.replace(old,new,1)
              assert 'DATA ROOM · REVIEW WORKSPACE V95' in s
              s=s.replace('DATA ROOM · REVIEW WORKSPACE V95','DATA ROOM · REVIEW WORKSPACE V96',1)
              assert 'Circuito de revisión, con integridad de fuentes y contexto' in s
              s=s.replace('Circuito de revisión, con integridad de fuentes y contexto','Circuito de revisión, con integridad de fuente, schema y contexto',1)
              p.write_text(s)
          css=Path('apps/control-web/public/sana-v3-review-workspace.css')
          c=css.read_text()
          if '.review-stage.is-schema-unresolved{' not in c:
              c+='\n.review-stage.is-schema-unresolved{background:#faf8f3;color:var(--muted);border-style:dashed}.review-source-schema{display:block;font-size:7px;line-height:1.35;color:var(--muted);overflow-wrap:anywhere}\n'
              css.write_text(c)
          sw=Path('apps/control-web/public/sana-v3-sw.js')
          w=sw.read_text()
          if "const CACHE='sana-v3-demo-shell-v96';" not in w:
              old="const CACHE='sana-v3-demo-shell-v95';"
              assert old in w
              w=w.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v95';\n}\nconst CACHE='sana-v3-demo-shell-v96';",1)
              sw.write_text(w)
          PY
      - name: Validate V87–V96
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          node scripts/validate-sana-dataroom-review-workspace-v88.mjs
          node scripts/validate-sana-dataroom-review-workspace-v89.mjs
          node scripts/validate-sana-dataroom-review-workspace-v90.mjs
          node scripts/validate-sana-dataroom-review-workspace-v91.mjs
          node scripts/validate-sana-dataroom-review-workspace-v92.mjs
          node scripts/validate-sana-dataroom-review-workspace-v93.mjs
          node scripts/validate-sana-dataroom-review-workspace-v94.mjs
          node scripts/validate-sana-dataroom-review-workspace-v95.mjs
          node scripts/validate-sana-dataroom-review-workspace-v96.mjs
      - name: Commit assembled V96
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-dataroom-review-workspace.js apps/control-web/public/sana-v3-review-workspace.css apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble Data Room review schema integrity v96'
          git push origin HEAD:demo/sana-v96-review-workspace-schema-integrity
