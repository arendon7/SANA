name: AGROWAY CONTROL v0.22 alpha17
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/external-data-gateway/**"
      - "config/product/control-alpha17-external-ack-production-wiring.json"
      - "config/product/control-operational-acceptance.json"
      - "config/product/control-review-bundle.json"
      - "apps/control-web/server.mjs"
      - "apps/control-web/public/handoff.html"
      - "apps/control-web/public/service-worker.js"
      - "scripts/validate-control-external-ack-production-wiring.mjs"
      - "scripts/control-external-ack-production-wiring-runtime.mjs"
      - "scripts/validate-control-operational-acceptance.mjs"
      - "scripts/build-control-review-bundle.mjs"
      - ".github/workflows/agroway-v022-control-alpha17.yml"
concurrency:
  group: agroway-control-v022-alpha17-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  production-external-ack-provider-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check alpha17
        run: |
          node --check apps/control-web/server.mjs
          node --check scripts/validate-control-external-ack-production-wiring.mjs
          node --check scripts/control-external-ack-production-wiring-runtime.mjs
          node --check scripts/validate-control-operational-acceptance.mjs
          node --check scripts/build-control-review-bundle.mjs
      - name: Direct-root persistence topology and lock parity
        run: node scripts/validate-direct-root-persistence.mjs
      - name: Offline canonical workspace install
        run: npm ci --ignore-scripts --offline
      - name: Verify persisted Postgres.js vendor
        run: node scripts/materialize-postgres-js-v349.mjs --verify
      - name: Pinned TypeScript strict
        run: npx -y -p typescript@5.8.3 tsc -p tsconfig.json --noEmit
      - name: Alpha3-alpha16 static regression gates
        run: |
          node scripts/validate-control-exception-resolution.mjs
          node scripts/validate-control-evidence-ledger.mjs
          node scripts/validate-control-human-approval.mjs
          node scripts/validate-control-submission-handoff.mjs
          node scripts/validate-control-unified-flow.mjs
          node scripts/validate-control-reintegration.mjs
          node scripts/validate-control-production-authorization.mjs
          node scripts/validate-control-canonical-write.mjs
          node scripts/validate-control-oidc-session.mjs
          node scripts/validate-control-postgres-write.mjs
          node scripts/validate-control-postgres-production-wiring.mjs
          node scripts/validate-control-postgres-js-driver.mjs
          node scripts/validate-control-external-ack.mjs
          node scripts/validate-control-oidc-production-wiring.mjs
      - name: Alpha17 external ACK provider wiring static guardrail
        run: node scripts/validate-control-external-ack-production-wiring.mjs
      - name: Full CONTROL operational truth gate
        run: node scripts/validate-control-operational-acceptance.mjs
      - name: Compile services for runtime
        run: |
          rm -rf .tmp/control-alpha17
          npx -y -p typescript@5.8.3 tsc -p tsconfig.json --noEmit false --outDir .tmp/control-alpha17
          mkdir -p .tmp/control-alpha17/vendor
          cp -R vendor/postgres-js-3.4.9 .tmp/control-alpha17/vendor/
      - name: Existing production-boundary regression runtimes
        run: |
          node scripts/control-production-authorization-runtime.mjs .tmp/control-alpha17/services/identity-access/src/index.js
          node scripts/control-canonical-write-runtime.mjs .tmp/control-alpha17/services/investment-portfolio/src/index.js
          node scripts/control-oidc-session-runtime.mjs .tmp/control-alpha17/services/identity-access/src/index.js
          node scripts/control-postgres-write-runtime.mjs .tmp/control-alpha17/services/investment-portfolio/src/index.js
          node scripts/control-postgres-production-wiring-runtime.mjs .tmp/control-alpha17/services/investment-portfolio/src/index.js
          node scripts/control-postgres-js-driver-runtime.mjs .tmp/control-alpha17/services/investment-portfolio/src/index.js
          node scripts/control-external-ack-runtime.mjs .tmp/control-alpha17/services/external-data-gateway/src/index.js
          node scripts/control-external-ack-postgres-store-runtime.mjs .tmp/control-alpha17/services/external-data-gateway/src/index.js
          node scripts/control-oidc-production-wiring-runtime.mjs .tmp/control-alpha17/services/identity-access/src/index.js
      - name: Production External ACK provider configuration/preflight runtime matrix
        run: node scripts/control-external-ack-production-wiring-runtime.mjs .tmp/control-alpha17/services/external-data-gateway/src/index.js
      - name: Build deterministic successor CONTROL review bundle
        run: node scripts/build-control-review-bundle.mjs
      - name: Smoke alpha17 boundary in successor bundle
        run: |
          PORT=4287 node dist/control-review-bundle/server.mjs > /tmp/control-alpha17-bundle.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4287/control >/dev/null && break || sleep .25; done
          for route in /control /control/projects/inv-yar-001 /control/identity-adapter /control/authorization /control/write-adapter /control/exceptions /control/evidence /control/approvals /control/handoff; do curl -fsS "http://127.0.0.1:4287$route" >/dev/null; done
          curl -fsS http://127.0.0.1:4287/control/handoff | grep -q 'EXTERNAL_ACK_PROVIDER_REAL_BINDING_AND_CONNECTIVITY_PENDING'
          code=$(curl -sS -o /tmp/alpha17-ack-forbidden.json -w '%{http_code}' http://127.0.0.1:4287/api/control/external-ack)
          test "$code" = "404"
          node -e "const x=require('/tmp/alpha17-ack-forbidden.json');if(x.error!=='EXTERNAL_ACK_BROWSER_ENDPOINT_FORBIDDEN'||x.externalAckAdapterImplemented!==true||x.productionExternalAckProviderWiringImplemented!==true||x.externalAckProviderConfigured!==false||x.externalAckProviderConnectivityCertified!==false||x.realExternalAckObserved!==false||x.executionState!=='NOT_EXECUTED'||x.canonicalMutated!==false)process.exit(1);console.log('PASS_CONTROL_ALPHA17_BROWSER_ACK_FORBIDDEN')"
          node -e "const m=require('./dist/control-review-bundle/REVIEW_MANIFEST.json');const a=require('./dist/control-review-bundle/config/product/control-operational-acceptance.json');const n=Number(/^0\\.22\\.0-alpha(\\d+)$/.exec(m.version)?.[1]);const readinessOk=n<18||(m.authority.readinessOrchestratorImplemented===true&&m.authority.d10EvidenceContractImplemented===true&&m.authority.productionActivationImplemented===false&&m.authority.productionExecutionAvailable===false&&a.d10==='PENDING');if(!Number.isInteger(n)||n<17||m.routes.length!==9||m.authority.productionExternalAckProviderWiringImplemented!==true||m.authority.externalAckProviderConfigured!==false||m.authority.externalAckProviderConnectivityCertified!==false||m.authority.realExternalAckObserved!==false||m.authority.executionState!=='NOT_EXECUTED'||m.authority.canonicalMutated!==false||a.productionReady!==false||a.productionBlockers.length!==4||!a.productionBlockers.includes('EXTERNAL_ACK_PROVIDER_REAL_BINDING_AND_CONNECTIVITY_PENDING')||a.productionBlockers.includes('EXTERNAL_ACK_PROVIDER_CONFIGURATION_PENDING')||!readinessOk)process.exit(1);console.log('PASS_CONTROL_ALPHA17_SUCCESSOR_BUNDLE',m.version,m.fileCount,m.aggregateSha256,a.productionBlockers.length)"
      - name: Trust boundary
        run: |
          echo 'PASS_CONTROL_ALPHA17_EXTERNAL_ACK_PROVIDER_WIRING'
          echo 'Provider configuration and read-only metadata preflight remain review-certified. Successor readiness orchestration does not configure a real provider, observe an ACK or enable production execution.'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: agroway-control-v022-alpha17-review-bundle
          path: |
            dist/control-review-bundle
            config/product/control-alpha17-external-ack-production-wiring.json
          if-no-files-found: error
          retention-days: 14