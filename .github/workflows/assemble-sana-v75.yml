name: Assemble SANA v75 Review Case

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-case.js'
      - '.github/workflows/assemble-sana-v75.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-functional-auth-v1
      - name: Assemble HTML and PWA shell
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('apps/control-web/public/sana-v3.html')
          s=html.read_text()
          new='/sana-v3-dataroom-review-case.js'
          if new not in s:
              old='<script src="/sana-v3-dataroom-review-governance.js"></script><script src="/sana-v3-dataroom-impact-history.js"></script>'
              rep='<script src="/sana-v3-dataroom-review-governance.js"></script><script src="/sana-v3-dataroom-review-case.js"></script><script src="/sana-v3-dataroom-impact-history.js"></script>'
              assert old in s, 'HTML insertion anchor missing'
              s=s.replace(old,rep,1)
              html.write_text(s)
          sw=Path('apps/control-web/public/sana-v3-sw.js')
          s=sw.read_text()
          if "const CACHE='sana-v3-demo-shell-v75';" not in s:
              old="const CACHE='sana-v3-demo-shell-v74';"
              rep="if(false){\nconst CACHE='sana-v3-demo-shell-v74';\n}\nconst CACHE='sana-v3-demo-shell-v75';"
              assert old in s, 'v74 active shell marker missing'
              s=s.replace(old,rep,1)
          if "'/sana-v3-dataroom-review-case.js'" not in s:
              old="'/sana-v3-dataroom-review-governance.js','/sana-v3-dataroom-impact-history.js'"
              rep="'/sana-v3-dataroom-review-governance.js','/sana-v3-dataroom-review-case.js','/sana-v3-dataroom-impact-history.js'"
              assert old in s, 'PWA insertion anchor missing'
              s=s.replace(old,rep,1)
          sw.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-dataroom-review-case.js
          grep -q '/sana-v3-dataroom-review-governance.js.*sana-v3-dataroom-review-case.js.*sana-v3-dataroom-impact-history.js' apps/control-web/public/sana-v3.html
          grep -q "const CACHE='sana-v3-demo-shell-v75';" apps/control-web/public/sana-v3-sw.js
      - name: Commit assembled shell
        run: |
          if git diff --quiet; then
            echo 'v75 already assembled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3.html apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble Data Room review case v75'
          git push origin HEAD:demo/sana-functional-auth-v1
