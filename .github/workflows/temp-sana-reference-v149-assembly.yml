name: TEMP SANA Reference V149 Assembly

on:
  push:
    branches: [demo/sana-reference-hardening-v149]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-reference-hardening-v149
      - name: Assemble v149 shell without asset churn
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          active="const CACHE='sana-v3-demo-shell-v149';"
          if active not in s:
              old="const CACHE='sana-v3-demo-shell-v148';"
              new="if(false){\nconst CACHE='sana-v3-demo-shell-v148';\n}\nconst CACHE='sana-v3-demo-shell-v149';\n// v149 hardens declared-vs-derived reference semantics, row-level historical deltas and source-case cycle scoping without authority expansion."
              assert s.count(old)==1, 'expected exactly one active v148 marker'
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "^const CACHE='sana-v3-demo-shell-v149';$" apps/control-web/public/sana-v3-sw.js)" -eq 1
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v148';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          grep -Fq "if(false){" apps/control-web/public/sana-v3-sw.js
          grep -Fq '// v149 hardens declared-vs-derived reference semantics, row-level historical deltas and source-case cycle scoping without authority expansion.' apps/control-web/public/sana-v3-sw.js
          for asset in \
            /sana-v3-commercial-references.js \
            /sana-v3-report-snapshot-commercial-references.js \
            /sana-v3-dataroom-commercial-references.js \
            /sana-v3-cycle-commercial-references.js \
            /sana-v3-cycle-economic-references.js \
            /sana-v3-due-diligence-commercial-reference-gaps.js; do
              test "$(grep -o "$asset" apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1
          done
      - name: Commit assembly if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble reference shell v149'
          git push origin HEAD:demo/sana-reference-hardening-v149
