name: AGROWAY CONTROL v0.22 alpha9
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/identity-access/**"
      - "apps/control-web/**"
      - "config/design/screens/production-authorization-boundary.json"
      - "config/product/control-alpha9-production-authorization.json"
      - "config/product/control-operational-acceptance.json"
      - "config/product/control-review-bundle.json"
      - "scripts/validate-control-production-authorization.mjs"
      - "scripts/control-production-authorization-runtime.mjs"
      - "scripts/control-production-authorization-browser-qa.py"
      - "scripts/validate-control-operational-acceptance.mjs"
      - "scripts/build-control-review-bundle.mjs"
      - ".github/workflows/agroway-v022-control-alpha9.yml"
concurrency:
  group: agroway-control-v022-alpha9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  production-authorization-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax-check alpha9 authorization boundary
        run: |
          node --check apps/control-web/server.mjs
          node --check apps/control-web/public/authorization.js
          node --check apps/control-web/public/home-integration.js
          node --check apps/control-web/public/service-worker.js
          node --check scripts/validate-control-production-authorization.mjs
          node --check scripts/control-production-authorization-runtime.mjs
          node --check scripts/validate-control-operational-acceptance.mjs
          node --check scripts/build-control-review-bundle.mjs
          python -m py_compile scripts/control-production-authorization-browser-qa.py
      - name: Pinned TypeScript strict
        run: npx -y -p typescript@5.8.3 tsc -p tsconfig.json --noEmit
      - name: Alpha3-alpha8 regressions
        run: |
          node scripts/validate-control-exception-resolution.mjs
          node scripts/validate-control-evidence-ledger.mjs
          node scripts/validate-control-human-approval.mjs
          node scripts/validate-control-submission-handoff.mjs
          node scripts/validate-control-unified-flow.mjs
          node scripts/validate-control-reintegration.mjs
      - name: Alpha9 static authorization guardrail
        run: node scripts/validate-control-production-authorization.mjs
      - name: Full CONTROL operational truth gate
        run: node scripts/validate-control-operational-acceptance.mjs
      - name: Compile service for runtime
        run: |
          rm -rf .tmp/control-alpha9
          npx -y -p typescript@5.8.3 tsc -p tsconfig.json --noEmit false --outDir .tmp/control-alpha9
      - name: Production authorization positive and negative runtime
        run: node scripts/control-production-authorization-runtime.mjs .tmp/control-alpha9/services/identity-access/src/index.js
      - name: Install pinned Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native Chromium authorization review over real CONTROL HTTP
        run: python scripts/control-production-authorization-browser-qa.py
      - name: Build deterministic alpha9 CONTROL review bundle
        run: node scripts/build-control-review-bundle.mjs
      - name: Smoke authorization-compatible review bundle
        run: |
          PORT=4278 node dist/control-review-bundle/server.mjs > /tmp/control-alpha9-bundle.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4278/control >/dev/null && break || sleep .25; done
          for route in /control /control/projects/inv-yar-001 /control/authorization /control/exceptions /control/evidence /control/approvals /control/handoff; do curl -fsS "http://127.0.0.1:4278$route" >/dev/null; done
          node -e "const m=require('./dist/control-review-bundle/REVIEW_MANIFEST.json');const a=require('./dist/control-review-bundle/config/product/control-operational-acceptance.json');const root=a.capabilities.find(x=>x.id==='DIRECT_MONOREPO_ROOT_LOCK');const expected=root?.status==='PASS_REPO_HARDENING'?4:5;const compatible=(m.version==='0.22.0-alpha9'&&m.routes.length===7)||(m.version==='0.22.0-alpha10'&&m.routes.length===8);if(!compatible||m.authority.authorizationOutputCeiling!=='AUTHORIZED_FOR_ADAPTER'||a.productionReady!==false||a.productionBlockers.length!==expected)process.exit(1);console.log('PASS_CONTROL_ALPHA9_COMPAT_BUNDLE',m.version,m.fileCount,m.aggregateSha256,a.productionBlockers.length,root?.status)"
      - name: Trust boundary
        run: |
          echo 'PASS_CONTROL_ALPHA9_PRODUCTION_AUTHORIZATION_BOUNDARY'
          echo 'Maximum authorization output remains AUTHORIZED_FOR_ADAPTER. No real IdP session adapter, production PostgreSQL transaction adapter, external ACK, production execution, or unapproved canonical mutation is claimed.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agroway-control-v022-alpha9-authorization-evidence
          path: docs/product/evidence/production-authorization
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: agroway-control-v022-alpha9-review-bundle
          path: dist/control-review-bundle
          if-no-files-found: error
          retention-days: 14
