name: Assemble SANA v53 Capture Sync

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-capture-sync-ledger.js'
      - 'apps/control-web/public/sana-v3-cycle-capture-sync-provenance.js'
      - 'scripts/validate-sana-capture-sync-ledger.mjs'
      - '.github/workflows/sana-demo-capture-sync-ledger.yml'
      - '.github/workflows/assemble-sana-v53.yml'

permissions:
  contents: write

jobs:
  assemble-v53:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-functional-auth-v1
          fetch-depth: 0
      - name: Assemble runtime, HTML and service worker deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime_path=Path('apps/control-web/public/sana-v3-runtime.js')
          html_path=Path('apps/control-web/public/sana-v3.html')
          sw_path=Path('apps/control-web/public/sana-v3-sw.js')
          runtime=runtime_path.read_text()
          html=html_path.read_text()
          sw=sw_path.read_text()

          old_queue="if(values.connectivity?.includes('Offline'))storage.queue.push({id:`Q-${Date.now()}`,type:values.type||'Registro de campo',lot,created:'Ahora'});"
          new_queue="if(values.connectivity?.includes('Offline'))storage.queue.push({id:`Q-${Date.now()}`,recordId:record.id,type:values.type||type||'Registro de campo',lot,created:'Ahora',createdAt:new Date().toISOString(),state:'PENDING_SERVER'});"
          if runtime.count(old_queue)!=1:
              raise SystemExit(f'Runtime queue anchor count: {runtime.count(old_queue)}')
          runtime=runtime.replace(old_queue,new_queue,1)

          html_replacements=[
            ('<script src="/sana-v3-data-trust.js"></script><script src="/sana-v3-harvest-ledger.js"></script>',
             '<script src="/sana-v3-data-trust.js"></script><script src="/sana-v3-capture-sync-ledger.js"></script><script src="/sana-v3-harvest-ledger.js"></script>'),
            ('<script src="/sana-v3-cycle-forecast-provenance.js"></script><script src="/sana-v3-cycle-labor-provenance.js"></script>',
             '<script src="/sana-v3-cycle-forecast-provenance.js"></script><script src="/sana-v3-cycle-capture-sync-provenance.js"></script><script src="/sana-v3-cycle-labor-provenance.js"></script>')
          ]
          for old,new in html_replacements:
              if html.count(old)!=1:
                  raise SystemExit(f'HTML anchor count for {old[:70]!r}: {html.count(old)}')
              html=html.replace(old,new,1)

          old_cache="const CACHE='sana-v3-demo-shell-v52';"
          new_cache="if(false){\nconst CACHE='sana-v3-demo-shell-v52';\n}\nconst CACHE='sana-v3-demo-shell-v53';"
          if sw.count(old_cache)!=1:
              raise SystemExit(f'SW active v52 anchor count: {sw.count(old_cache)}')
          sw=sw.replace(old_cache,new_cache,1)
          sw_replacements=[
            ("'/sana-v3-data-trust.js','/sana-v3-harvest-ledger.js'",
             "'/sana-v3-data-trust.js','/sana-v3-capture-sync-ledger.js','/sana-v3-harvest-ledger.js'"),
            ("'/sana-v3-cycle-forecast-provenance.js','/sana-v3-cycle-labor-provenance.js'",
             "'/sana-v3-cycle-forecast-provenance.js','/sana-v3-cycle-capture-sync-provenance.js','/sana-v3-cycle-labor-provenance.js'")
          ]
          for old,new in sw_replacements:
              if sw.count(old)!=1:
                  raise SystemExit(f'SW anchor count for {old}: {sw.count(old)}')
              sw=sw.replace(old,new,1)

          runtime_path.write_text(runtime)
          html_path.write_text(html)
          sw_path.write_text(sw)
          PY
          grep -q 'recordId:record.id' apps/control-web/public/sana-v3-runtime.js
          grep -q '/sana-v3-data-trust.js.*sana-v3-capture-sync-ledger.js.*sana-v3-harvest-ledger.js' apps/control-web/public/sana-v3.html
          grep -q '/sana-v3-cycle-forecast-provenance.js.*sana-v3-cycle-capture-sync-provenance.js.*sana-v3-cycle-labor-provenance.js' apps/control-web/public/sana-v3.html
          grep -q "^const CACHE='sana-v3-demo-shell-v53';" apps/control-web/public/sana-v3-sw.js
      - name: Commit assembled v53
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-runtime.js apps/control-web/public/sana-v3.html apps/control-web/public/sana-v3-sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'build(demo): assemble capture sync shell v53'
          git push origin HEAD:demo/sana-functional-auth-v1
# Explicit retrigger after v54 source staging; no product behavior change.
