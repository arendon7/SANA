name: SANA Demo Due Diligence V62

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-capital-governance.js'
      - 'apps/control-web/public/sana-v3-dataroom-capital-governance-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-capital-governance-gaps.js'
      - 'scripts/validate-sana-capital-governance-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - '.github/workflows/sana-demo-due-diligence-v62.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-capital-governance.js'
      - 'apps/control-web/public/sana-v3-dataroom-capital-governance-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-capital-governance-gaps.js'
      - 'scripts/validate-sana-capital-governance-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'

jobs:
  composed-dd-v62:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate capital governance historical semantics
        run: node scripts/validate-sana-capital-governance-history.mjs
      - name: Validate DD composition before remediation
        run: |
          html='apps/control-web/public/sana-v3.html'
          if grep -q '/sana-v3-due-diligence-capital-governance-gaps.js' "$html"; then
            grep -q '/sana-v3-due-diligence-commercial-gaps.js.*sana-v3-due-diligence-capital-governance-gaps.js.*sana-v3-due-diligence-remediation.js' "$html"
          else
            echo 'v62 staged before assembly; strict order will run on HTML/SW assembly commit.'
          fi
      - name: Validate snapshot and Data Room order when assembled
        run: |
          html='apps/control-web/public/sana-v3.html'
          if grep -q '/sana-v3-report-snapshot-capital-governance.js' "$html"; then
            grep -q '/sana-v3-report-snapshot-commercial.js.*sana-v3-report-snapshot-capital-governance.js.*sana-v3-cycle-closure.js' "$html"
            grep -q '/sana-v3-dataroom-commercial-history.js.*sana-v3-dataroom-capital-governance-history.js.*sana-v3-dataroom-entry.js' "$html"
            grep -q "^const CACHE='sana-v3-demo-shell-v62';" apps/control-web/public/sana-v3-sw.js
          else
            echo 'v62 staged before assembly; strict shell validation deferred to assembly commit.'
          fi
      - name: Validate non-decisional boundaries
        run: |
          grep -q 'DOCUMENT_COMPLETENESS ≠ ELIGIBILITY' apps/control-web/public/sana-v3-report-snapshot-capital-governance.js
          grep -q 'CHANGE ≠ IMPROVEMENT ≠ ELIGIBILITY' apps/control-web/public/sana-v3-dataroom-capital-governance-history.js
          grep -q 'LOW_DOCUMENT_COMPLETENESS ≠ GAP' apps/control-web/public/sana-v3-due-diligence-capital-governance-gaps.js
          grep -q 'CAPITAL_GAP ≠ ELIGIBILITY' apps/control-web/public/sana-v3-due-diligence-capital-governance-gaps.js
          ! grep -Eq 'productionExecutionAvailable\s*=\s*true|productionActivationAllowed\s*=\s*true|canonicalMutated\s*=\s*true' apps/control-web/public/sana-v3-report-snapshot-capital-governance.js apps/control-web/public/sana-v3-dataroom-capital-governance-history.js apps/control-web/public/sana-v3-due-diligence-capital-governance-gaps.js
