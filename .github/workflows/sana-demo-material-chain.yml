name: SANA Demo Material Chain

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-material-lifecycle.js'
      - 'apps/control-web/public/sana-v3-material-chain.js'
      - 'apps/control-web/public/sana-v3-inventory-operations.js'
      - 'apps/control-web/public/sana-v3-economics.js'
      - 'apps/control-web/public/sana-v3-passport-chain.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-material-chain.mjs'
      - '.github/workflows/sana-demo-material-chain.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-material-lifecycle.js'
      - 'apps/control-web/public/sana-v3-material-chain.js'
      - 'apps/control-web/public/sana-v3-inventory-operations.js'
      - 'apps/control-web/public/sana-v3-economics.js'
      - 'apps/control-web/public/sana-v3-passport-chain.js'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - 'scripts/validate-sana-material-chain.mjs'
      - '.github/workflows/sana-demo-material-chain.yml'

permissions:
  contents: read

jobs:
  material-chain-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and semantic contract
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/control-web/public/sana-v3-material-chain.js
          node scripts/validate-sana-material-chain.mjs
      - name: Validate chain contracts
        shell: bash
        run: |
          set -euo pipefail
          chain='apps/control-web/public/sana-v3-material-chain.js'
          grep -q '__SANA_MATERIAL_CHAIN__' "$chain"
          grep -q "schema:'SANA_MATERIAL_CHAIN_V1'" "$chain"
          grep -q 'LEGACY_SINGLE_QUANTITY' "$chain"
          grep -q 'EXPLICIT_COUNTS' "$chain"
          grep -q 'LEGACY_QUANTITY ≠ LOSS ≠ SURVIVAL' "$chain"
          grep -q 'MATERIAL_EVENT ≠ INVENTORY_MOVEMENT ≠ COST_ENTRY' "$chain"
          grep -q 'materialEventId' "$chain"
          grep -q 'materialId' "$chain"
          grep -q 'PASSPORT MATERIAL ≠ EXTERNAL CERTIFICATION' "$chain"
          grep -q 'NO_CONTABILIDAD_OFICIAL' "$chain"
          ! grep -q 'storage.records.push' "$chain"
          ! grep -Eiq 'auto.*(inventory|cost)|create.*(inventory|cost)|certif(ic|y).*genetic|fitosanitario.*certif' "$chain"
      - name: Validate assembly and offline shell
        shell: bash
        run: |
          set -euo pipefail
          html='apps/control-web/public/sana-v3.html'
          sw='apps/control-web/public/sana-v3-sw.js'
          grep -q '/sana-v3-economics.js.*sana-v3-material-chain.js.*sana-v3-impact-methodology.js' "$html"
          grep -q "'/sana-v3-material-chain.js'" "$sw"
          grep -q 'sana-v3-demo-shell-v30' "$sw"
      - name: Assert no execution or certification authority
        shell: bash
        run: |
          set -euo pipefail
          chain='apps/control-web/public/sana-v3-material-chain.js'
          ! grep -Eiq 'fetch\(|XMLHttpRequest|WebSocket|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|canonicalMutated[[:space:]]*=[[:space:]]*true' "$chain"
          ! grep -Eiq 'approve|authorize|certified[[:space:]]*=[[:space:]]*true|verifiedExternal[[:space:]]*=[[:space:]]*true|icaApproved' "$chain"
          grep -q 'NO CERTIFICA GENÉTICA, SANIDAD NI ICA' "$chain"
