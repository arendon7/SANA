name: SANA Demo Data Room Review Response

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-response.js'
      - 'scripts/validate-sana-dataroom-review-response.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - '.github/workflows/sana-demo-dataroom-review-response.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-response.js'
      - 'scripts/validate-sana-dataroom-review-response.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'

jobs:
  dataroom-review-response-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and semantic contracts
        run: |
          node --check apps/control-web/public/sana-v3-dataroom-review-response.js
          node scripts/validate-sana-dataroom-review-response.mjs
      - name: Validate response boundaries
        run: |
          grep -q 'REVIEW_REQUEST_REFERENCE_LINKED ≠ DOCUMENT_DEFICIENCY ≠ FINDING' apps/control-web/public/sana-v3-dataroom-review-response.js
          grep -q 'EXCHANGE_REQUEST_REFERENCE_LINKED ≠ REQUEST_EQUIVALENCE_VERIFIED' apps/control-web/public/sana-v3-dataroom-review-response.js
          grep -q 'DOCUMENT_RESPONSE_REFERENCE_LINKED ≠ VERIFIED_DOCUMENT ≠ ISSUE_RESOLVED' apps/control-web/public/sana-v3-dataroom-review-response.js
          grep -q 'RESPONSE_RETURNED_REFERENCE ≠ REVIEW_RESTARTED ≠ REVIEW_COMPLETED' apps/control-web/public/sana-v3-dataroom-review-response.js
          grep -q 'REVIEW_FEEDBACK_ACK_REFERENCE ≠ VERIFIED_RECEIPT' apps/control-web/public/sana-v3-dataroom-review-response.js
          grep -q 'NO_AUTOMATIC_REVIEW_TRIGGER' apps/control-web/public/sana-v3-dataroom-review-response.js
      - name: Validate assembly
        run: |
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');const html=fs.readFileSync('apps/control-web/public/sana-v3.html','utf8'),sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');const feedback='/sana-v3-dataroom-review-feedback.js',response='/sana-v3-dataroom-review-response.js',impact='/sana-v3-dataroom-impact-history.js';for(const f of [feedback,response,impact]){assert(html.includes(f),`HTML missing ${f}`);assert(sw.includes(`'${f}'`),`PWA missing ${f}`)}assert(html.indexOf(feedback)<html.indexOf(response));assert(html.indexOf(response)<html.indexOf(impact));const versions=[...sw.matchAll(/const CACHE='sana-v3-demo-shell-v(\d+)'/g)].map(m=>Number(m[1]));assert(versions.length&&Math.max(...versions)>=81,'shell must be v81 or newer');
          NODE
      - name: Assert review-only runtime
        run: |
          ! grep -Eq 'fetch\s*\(' apps/control-web/public/sana-v3-dataroom-review-response.js
          ! grep -Eq 'productionExecutionAvailable\s*=\s*true|productionActivationAllowed\s*=\s*true|canonicalMutated\s*=\s*true' apps/control-web/public/sana-v3-dataroom-review-response.js
          ! grep -Eq 'resolvedIssues\s*:\s*[1-9]|automaticFindings\s*:\s*[1-9]|automaticRemediations\s*:\s*[1-9]|automaticReopens\s*:\s*[1-9]|automaticReviewTriggers\s*:\s*[1-9]|dueDiligenceApprovals\s*:\s*[1-9]|externalActions\s*:\s*[1-9]' apps/control-web/public/sana-v3-dataroom-review-response.js

# v81: review request routing and document response references do not imply deficiency, verification, issue resolution or review restart.
