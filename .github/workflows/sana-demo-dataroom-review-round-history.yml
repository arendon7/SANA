name: SANA Demo Data Room Review Round History
on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths: ['apps/control-web/public/sana-v3-report-snapshot-dataroom-review-round.js','apps/control-web/public/sana-v3-dataroom-review-round-history.js','apps/control-web/public/sana-v3-due-diligence-dataroom-review-round-gaps.js','scripts/validate-sana-dataroom-review-round-history.mjs','apps/control-web/public/sana-v3.html','apps/control-web/public/sana-v3-sw.js']
  pull_request:
    paths: ['apps/control-web/public/sana-v3-report-snapshot-dataroom-review-round.js','apps/control-web/public/sana-v3-dataroom-review-round-history.js','apps/control-web/public/sana-v3-due-diligence-dataroom-review-round-gaps.js','scripts/validate-sana-dataroom-review-round-history.mjs','apps/control-web/public/sana-v3.html','apps/control-web/public/sana-v3-sw.js']
jobs:
  review-round-history-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/validate-sana-dataroom-review-round-history.mjs
      - run: |
          grep -q 'NO_LIVE_FALLBACK' apps/control-web/public/sana-v3-dataroom-review-round-history.js
          grep -q 'ROUND_GAP ≠ FINDING ≠ RISK_SCORE ≠ REVIEW_OUTCOME' apps/control-web/public/sana-v3-due-diligence-dataroom-review-round-gaps.js
          ! grep -q '__SANA_DATAROOM_REVIEW_ROUND__' apps/control-web/public/sana-v3-dataroom-review-round-history.js
          grep -Eq "^const CACHE='sana-v3-demo-shell-v(8[6-9]|9[0-9]|[1-9][0-9]{2,})';" apps/control-web/public/sana-v3-sw.js
