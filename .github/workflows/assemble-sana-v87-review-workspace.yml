name: Assemble SANA v87 Review Workspace
on:
  push:
    branches: [demo/sana-v87-review-workspace]
    paths: ['apps/control-web/public/sana-v3-dataroom-review-workspace.js','.github/workflows/assemble-sana-v87-review-workspace.yml']
permissions: {contents: write}
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: demo/sana-v87-review-workspace}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/validate-sana-dataroom-review-workspace.mjs
      - run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('apps/control-web/public/sana-v3.html');s=h.read_text();n='/sana-v3-dataroom-review-workspace.js';old='<script src="/sana-v3-dataroom-review-round.js"></script><script src="/sana-v3-dataroom-impact-history.js"></script>';new='<script src="/sana-v3-dataroom-review-round.js"></script><script src="/sana-v3-dataroom-review-workspace.js"></script><script src="/sana-v3-dataroom-impact-history.js"></script>'
          if n not in s: assert old in s;s=s.replace(old,new,1);h.write_text(s)
          p=Path('apps/control-web/public/sana-v3-sw.js');s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v87';" not in s:
            old="const CACHE='sana-v3-demo-shell-v86';";assert old in s;s=s.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v86';\n}\nconst CACHE='sana-v3-demo-shell-v87';",1)
          old="'/sana-v3-dataroom-review-round.js','/sana-v3-dataroom-impact-history.js'";new="'/sana-v3-dataroom-review-round.js','/sana-v3-dataroom-review-workspace.js','/sana-v3-dataroom-impact-history.js'"
          if new not in s: assert old in s;s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node scripts/validate-sana-dataroom-review-workspace.mjs
          grep -q "const CACHE='sana-v3-demo-shell-v87';" apps/control-web/public/sana-v3-sw.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3.html apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble Data Room review workspace v87'
          git push origin HEAD:demo/sana-v87-review-workspace
