name: TEMP SANA Capital V150 Assembly

on:
  push:
    branches: [demo/sana-capital-v150]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-capital-v150
      - name: Assemble v150 HTML and shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          html=Path('apps/control-web/public/sana-v3.html')
          s=html.read_text()
          old='<script src="/sana-v3-capital-governance.js"></script><script src="/sana-v3-capital-review-ledger.js"></script>'
          new='<script src="/sana-v3-capital-governance.js"></script><script src="/sana-v3-capital-governance-references.js"></script><script src="/sana-v3-capital-review-ledger.js"></script>'
          if '/sana-v3-capital-governance-references.js' not in s:
              assert s.count(old)==1, 'capital HTML anchor missing/duplicated'
              s=s.replace(old,new,1)
          html.write_text(s)

          sw=Path('apps/control-web/public/sana-v3-sw.js')
          s=sw.read_text()
          if "const CACHE='sana-v3-demo-shell-v150';" not in s:
              old_cache="const CACHE='sana-v3-demo-shell-v149';"
              new_cache="if(false){\nconst CACHE='sana-v3-demo-shell-v149';\n}\nconst CACHE='sana-v3-demo-shell-v150';"
              assert s.count(old_cache)==1, 'expected exactly one active v149 marker'
              s=s.replace(old_cache,new_cache,1)
          anchor="'/sana-v3-capital-governance.js','/sana-v3-capital-review-ledger.js',"
          assets="'/sana-v3-capital-governance.js','/sana-v3-capital-governance-references.js','/sana-v3-capital-review-ledger.js',"
          if '/sana-v3-capital-governance-references.js' not in s:
              assert s.count(anchor)==1, 'capital SW asset anchor missing/duplicated'
              s=s.replace(anchor,assets,1)
          comment='// v150 validates Capital Governance EVIDENCE.supports with same-case/scope semantics while keeping non-canonical capital refs value-hidden and non-authoritative.'
          if comment not in s:
              anchor_comment='// v149 hardens declared-vs-derived reference semantics, row-level historical deltas and source-case cycle scoping without authority expansion.'
              assert s.count(anchor_comment)==1, 'v149 comment anchor missing/duplicated'
              s=s.replace(anchor_comment,anchor_comment+'\n'+comment,1)
          sw.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          node --check apps/control-web/public/sana-v3-capital-governance-references.js
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('apps/control-web/public/sana-v3.html','utf8');
          const sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');
          const g='/sana-v3-capital-governance.js',r='/sana-v3-capital-governance-references.js',h='/sana-v3-capital-review-ledger.js';
          const gi=html.indexOf(g),ri=html.indexOf(r),hi=html.indexOf(h);
          if(gi<0||ri<=gi||hi<=ri)throw new Error('Capital HTML order invalid');
          if((html.split(r).length-1)!==1)throw new Error('Capital V150 HTML asset count invalid');
          if((sw.match(/const CACHE='sana-v3-demo-shell-v150';/g)||[]).length!==1)throw new Error('v150 active cache marker invalid');
          if(!sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v149';\n}"))throw new Error('v149 historical cache marker missing');
          if((sw.split(r).length-1)!==1)throw new Error('Capital V150 SW asset count invalid');
          if(!sw.includes('// v150 validates Capital Governance EVIDENCE.supports'))throw new Error('v150 marker missing');
          NODE
      - name: Commit assembly if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3.html apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble capital shell v150'
          git push origin HEAD:demo/sana-capital-v150
