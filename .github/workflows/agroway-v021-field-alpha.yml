name: AGROWAY FIELD v0.21 alpha runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/field-web/**"
      - "infra/postgres/migrations/**"
      - "infra/postgres/tests/**"
      - "scripts/local-dev-backend-http-runtime.mjs"
      - "scripts/field-http-playwright-runtime.mjs"
      - "config/design/screens/local-dev-backend-runtime.json"
      - "ci/vitest-real/**"
      - "ci/field-http-playwright/**"
      - ".github/workflows/agroway-v021-field-alpha.yml"
concurrency:
  group: agroway-field-v021-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cumulative-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: agroway_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agroway_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agroway_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:agroway_ci@localhost:5432/agroway_ci
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify reconstructed migration inventory
        shell: bash
        run: |
          set -euo pipefail
          count=$(find infra/postgres/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          test "$count" = "30" || { echo "expected 30 physical migration files, found $count"; exit 1; }
          test -f infra/postgres/migrations/0001_extensions.sql
          test -f infra/postgres/migrations/0016_knowledge_ai_copilot_reconstructed.sql
          test -f infra/postgres/migrations/0022_domain_integrity_hardening.sql
          test -f infra/postgres/migrations/0023_access_entitlements_portability.sql
          test -f infra/postgres/migrations/0024_sync_ingress_ack.sql
          echo "PASS_RECONSTRUCTED_MIGRATION_INVENTORY_30"

      - name: Syntax-check local dev backend
        run: |
          node --check apps/field-web/dev-runtime.mjs
          node --check apps/field-web/server.mjs
          node --check scripts/local-dev-backend-http-runtime.mjs

      - name: Local dev HTTP backend runtime
        run: node scripts/local-dev-backend-http-runtime.mjs

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Cumulative PostgreSQL/PostGIS runtime 0001-0024
        shell: bash
        run: bash infra/postgres/tests/run-v0202-db-tests.sh

      - name: Runtime boundary
        run: |
          echo 'PASS_RECONSTRUCTED_POSTGIS_CUMULATIVE_0001_0024'
          echo 'This proves the reconstructed migration chain and adversarial DB suites in CI; it does not prove byte identity with the lost historical v0.15 artifact or real agricultural pilot certification.'

  real-vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct and verify testable source slice
        shell: bash
        run: |
          set -euo pipefail
          cat ci/vitest-real/archive.part00.b64 \
              ci/vitest-real/archive.part01.b64 \
              ci/vitest-real/archive.part02.b64 \
              ci/vitest-real/archive.part03.b64 > /tmp/agroway_vitest_slice.b64
          base64 --decode /tmp/agroway_vitest_slice.b64 > /tmp/agroway_vitest_slice.tar.gz
          echo "ab07db7f86535fc029ad2e9bc80a8007ac10e7b0dfef73c0c45e1087c13b5b60  /tmp/agroway_vitest_slice.tar.gz" | sha256sum -c -
          mkdir -p /tmp/agroway-vitest
          tar -xzf /tmp/agroway_vitest_slice.tar.gz -C /tmp/agroway-vitest
          test -f /tmp/agroway-vitest/agroway_vitest_real_slice/package.json
          test -f /tmp/agroway-vitest/agroway_vitest_real_slice/vitest.config.ts
          canonical_tsconfig_sha=$(python -c "import hashlib,json,pathlib; obj=json.loads(pathlib.Path('ci/vitest-real/root-tsconfig.json').read_text()); print(hashlib.sha256(json.dumps(obj,sort_keys=True,separators=(',',':')).encode()).hexdigest())")
          test "$canonical_tsconfig_sha" = "dce31da9205b8cdd604349bff4945ad23b315735b8db522837a854140d808b90" || { echo "root tsconfig canonical digest mismatch: $canonical_tsconfig_sha"; exit 1; }
          cp ci/vitest-real/root-tsconfig.json /tmp/agroway-vitest/agroway_vitest_real_slice/tsconfig.json
          spec_count=$(find /tmp/agroway-vitest/agroway_vitest_real_slice -type f -name '*.spec.ts' | wc -l | tr -d ' ')
          test "$spec_count" = "12" || { echo "expected 12 specs, found $spec_count"; exit 1; }
          echo 'PASS_REAL_VITEST_SOURCE_SLICE_SHA_TSCONFIG_AND_INVENTORY'

      - name: Install pinned Vitest runtime without npm Arborist
        working-directory: /tmp/agroway-vitest/agroway_vitest_real_slice
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version | tee /tmp/pnpm-version.txt
          grep -Fx '10.15.0' /tmp/pnpm-version.txt
          pnpm install --ignore-scripts --frozen-lockfile=false
          pnpm exec vitest --version | tee /tmp/vitest-version.txt
          grep -Eq 'vitest/4\.1\.7|vitest 4\.1\.7' /tmp/vitest-version.txt

      - name: Real Vitest 12-spec runtime
        working-directory: /tmp/agroway-vitest/agroway_vitest_real_slice
        run: pnpm exec vitest run --config vitest.config.ts --reporter=verbose

      - name: Vitest trust boundary
        run: |
          echo 'PASS_REAL_VITEST_4_1_7_FOR_OBSERVED_12_SPEC_SLICE'
          echo 'This is real Vitest runtime for the exact observed 12-spec reconstructed source closure plus the canonical alpha10 root tsconfig. It is not yet a claim that the full 41-workspace monorepo is directly persisted or tested from its canonical root lockfile.'

  native-field-http-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct and verify alpha10 FIELD public bundle
        shell: bash
        run: |
          set -euo pipefail
          cat ci/field-http-playwright/public.part00.b64 \
              ci/field-http-playwright/public.part01.b64 \
              ci/field-http-playwright/public.part02.b64 \
              ci/field-http-playwright/public.part03.b64 > /tmp/agroway_field_public_alpha10.b64
          base64 --decode /tmp/agroway_field_public_alpha10.b64 > /tmp/agroway_field_public_alpha10.tar.gz
          echo "1ea29026ccf160dfebc15b24f6f27408a8bff459be4c422e0791775520dcf00b  /tmp/agroway_field_public_alpha10.tar.gz" | sha256sum -c -
          rm -rf apps/field-web/public
          mkdir -p apps/field-web/public
          tar -xzf /tmp/agroway_field_public_alpha10.tar.gz -C apps/field-web
          file_count=$(find apps/field-web/public -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$file_count" = "5" || { echo "expected 5 FIELD public assets, found $file_count"; exit 1; }
          test -f apps/field-web/public/index.html
          test -f apps/field-web/public/app.js
          test -f apps/field-web/public/styles.css
          test -f apps/field-web/public/manifest.webmanifest
          test -f apps/field-web/public/service-worker.js
          node --check apps/field-web/public/app.js
          node --check scripts/field-http-playwright-runtime.mjs
          echo 'PASS_ALPHA10_FIELD_PUBLIC_BUNDLE_SHA_AND_INVENTORY'

      - name: Install pinned Playwright Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agroway-playwright-runtime
          cp scripts/field-http-playwright-runtime.mjs /tmp/agroway-playwright-runtime/
          printf '%s\n' '{"private":true,"type":"module"}' > /tmp/agroway-playwright-runtime/package.json
          cd /tmp/agroway-playwright-runtime
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version | tee /tmp/playwright-pnpm-version.txt
          grep -Fx '10.15.0' /tmp/playwright-pnpm-version.txt
          pnpm add --ignore-scripts --save-exact playwright@1.57.0
          pnpm exec playwright --version | tee /tmp/playwright-version.txt
          grep -Fx 'Version 1.57.0' /tmp/playwright-version.txt
          pnpm exec playwright install --with-deps chromium

      - name: Start real AGROWAY FIELD HTTP server
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/agroway-field-runtime /tmp/agroway-playwright-evidence
          mkdir -p /tmp/agroway-field-runtime /tmp/agroway-playwright-evidence
          AGROWAY_RUNTIME_DIR=/tmp/agroway-field-runtime \
          AGROWAY_DEV_ALLOW_RESET=1 \
          PORT=4173 \
          node apps/field-web/server.mjs >/tmp/agroway-field-server.log 2>&1 &
          echo $! >/tmp/agroway-field-server.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/api/dev/status >/tmp/agroway-field-status.json; then
              cat /tmp/agroway-field-status.json
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/agroway-field-server.log || true
          echo 'FIELD_HTTP_SERVER_DID_NOT_START'
          exit 1

      - name: Native Chromium to real FIELD HTTP runtime
        working-directory: /tmp/agroway-playwright-runtime
        env:
          AGROWAY_FIELD_BASE_URL: http://127.0.0.1:4173
          AGROWAY_PLAYWRIGHT_EVIDENCE: /tmp/agroway-playwright-evidence
        run: node field-http-playwright-runtime.mjs

      - name: Native browser trust boundary
        run: |
          echo 'PASS_NATIVE_CHROMIUM_TO_REAL_FIELD_HTTP_ALPHA10'
          echo 'This proves native Chromium, localStorage, Service Worker, browser download and browser fetch against LOCAL_DEV_BACKEND_NOT_PRODUCTION. It is not a production authentication, storage or sync claim.'

      - name: Stop FIELD server
        if: always()
        shell: bash
        run: |
          if test -f /tmp/agroway-field-server.pid; then kill "$(cat /tmp/agroway-field-server.pid)" 2>/dev/null || true; fi
          cat /tmp/agroway-field-server.log 2>/dev/null || true

      - name: Upload native browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agroway-field-alpha10-native-http-evidence
          path: |
            /tmp/agroway-playwright-evidence
            /tmp/agroway-field-server.log
            /tmp/agroway-field-status.json
          if-no-files-found: warn
          retention-days: 14
