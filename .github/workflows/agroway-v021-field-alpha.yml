name: AGROWAY FIELD v0.21 alpha runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/field-web/**"
      - "infra/postgres/migrations/0024_sync_ingress_ack.sql"
      - "infra/postgres/tests/v0210_sync_ingress_ack_runtime.sql"
      - "scripts/local-dev-backend-http-runtime.mjs"
      - "config/design/screens/local-dev-backend-runtime.json"
      - ".github/workflows/agroway-v021-field-alpha.yml"
permissions:
  contents: read
jobs:
  alpha10-incremental-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: agroway_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agroway_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agroway_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:agroway_ci@localhost:5432/agroway_ci
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check local dev backend
        run: |
          node --check apps/field-web/dev-runtime.mjs
          node --check apps/field-web/server.mjs
          node --check scripts/local-dev-backend-http-runtime.mjs
      - name: Local dev HTTP backend runtime
        run: node scripts/local-dev-backend-http-runtime.mjs
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply alpha10 sync ingress/ACK migration in PostGIS
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/migrations/0024_sync_ingress_ack.sql
      - name: Run alpha10 sync ingress/ACK adversarial SQL tests
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/tests/v0210_sync_ingress_ack_runtime.sql
      - name: Explicit cumulative-boundary notice
        run: |
          echo 'PASS_ALPHA10_INCREMENTAL_RUNTIME_ONLY'
          echo 'Cumulative reconstructed PostgreSQL/PostGIS 0001-0024 remains PENDING until the full migration chain is physically persisted in this GitHub branch.'
