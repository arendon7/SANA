name: AGROWAY FIELD v0.21 alpha runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/field-web/**"
      - "infra/postgres/migrations/**"
      - "infra/postgres/tests/**"
      - "scripts/local-dev-backend-http-runtime.mjs"
      - "scripts/field-http-playwright-runtime.mjs"
      - "config/design/screens/local-dev-backend-runtime.json"
      - "ci/vitest-real/**"
      - "ci/field-http-playwright/**"
      - ".github/workflows/agroway-v021-field-alpha.yml"
concurrency:
  group: agroway-field-v021-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cumulative-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: agroway_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agroway_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agroway_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:agroway_ci@localhost:5432/agroway_ci
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify reconstructed migration inventory
        shell: bash
        run: |
          set -euo pipefail
          count=$(find infra/postgres/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          test "$count" = "36" || { echo "expected 36 physical migration files, found $count"; exit 1; }
          test -f infra/postgres/migrations/0001_extensions.sql
          test -f infra/postgres/migrations/0016_knowledge_ai_copilot_reconstructed.sql
          test -f infra/postgres/migrations/0022_domain_integrity_hardening.sql
          test -f infra/postgres/migrations/0023_access_entitlements_portability.sql
          test -f infra/postgres/migrations/0024_sync_ingress_ack.sql
          test -f infra/postgres/migrations/0025_control_write_receipt.sql
          test -f infra/postgres/migrations/0026_control_external_ack_receipt.sql
          test -f infra/postgres/migrations/0027_identity_membership_permissions.sql
          test -f infra/postgres/migrations/0028_capital_readiness_persistence.sql
          test -f infra/postgres/migrations/0028a_capital_readiness_transition_locking.sql
          test -f infra/postgres/migrations/0028b_capital_readiness_tenant_trigger_guard.sql
          test ! -f infra/postgres/migrations/0025_capital_readiness_persistence.sql
          echo "PASS_RECONSTRUCTED_MIGRATION_INVENTORY_36"

      - name: Syntax-check local dev backend
        run: |
          node --check apps/field-web/dev-runtime.mjs
          node --check apps/field-web/server.mjs
          node --check scripts/local-dev-backend-http-runtime.mjs

      - name: Local dev HTTP backend runtime
        run: node scripts/local-dev-backend-http-runtime.mjs

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Cumulative PostgreSQL/PostGIS runtime 0001-0028b
        shell: bash
        run: bash infra/postgres/tests/run-v0202-db-tests.sh

      - name: Runtime boundary
        run: |
          echo 'PASS_FIELD_CUMULATIVE_RUNTIME_0001_0028B'
          echo 'The cumulative gate includes CONTROL alpha15 persistence plus UX2B-0 membership/readiness persistence. This does not enable production Capital browser mutation or imply D10/Production Ready.'

  real-vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run real Vitest suite
        run: bash ci/vitest-real/run.sh

  native-field-http-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Playwright Chromium
        run: |
          npm --prefix ci/field-http-playwright ci --ignore-scripts
          npx --prefix ci/field-http-playwright playwright install --with-deps chromium
      - name: Native FIELD HTTP + Chromium
        run: node scripts/field-http-playwright-runtime.mjs
