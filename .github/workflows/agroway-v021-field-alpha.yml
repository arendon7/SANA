name: AGROWAY FIELD v0.21 alpha runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/field-web/**"
      - "infra/postgres/migrations/**"
      - "infra/postgres/tests/**"
      - "scripts/local-dev-backend-http-runtime.mjs"
      - "config/design/screens/local-dev-backend-runtime.json"
      - "ci/vitest-real/**"
      - ".github/workflows/agroway-v021-field-alpha.yml"
concurrency:
  group: agroway-field-v021-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cumulative-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: agroway_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agroway_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agroway_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:agroway_ci@localhost:5432/agroway_ci
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify reconstructed migration inventory
        shell: bash
        run: |
          set -euo pipefail
          count=$(find infra/postgres/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          test "$count" = "30" || { echo "expected 30 physical migration files, found $count"; exit 1; }
          test -f infra/postgres/migrations/0001_extensions.sql
          test -f infra/postgres/migrations/0016_knowledge_ai_copilot_reconstructed.sql
          test -f infra/postgres/migrations/0022_domain_integrity_hardening.sql
          test -f infra/postgres/migrations/0023_access_entitlements_portability.sql
          test -f infra/postgres/migrations/0024_sync_ingress_ack.sql
          echo "PASS_RECONSTRUCTED_MIGRATION_INVENTORY_30"

      - name: Syntax-check local dev backend
        run: |
          node --check apps/field-web/dev-runtime.mjs
          node --check apps/field-web/server.mjs
          node --check scripts/local-dev-backend-http-runtime.mjs

      - name: Local dev HTTP backend runtime
        run: node scripts/local-dev-backend-http-runtime.mjs

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Cumulative PostgreSQL/PostGIS runtime 0001-0024
        shell: bash
        run: bash infra/postgres/tests/run-v0202-db-tests.sh

      - name: Runtime boundary
        run: |
          echo 'PASS_RECONSTRUCTED_POSTGIS_CUMULATIVE_0001_0024'
          echo 'This proves the reconstructed migration chain and adversarial DB suites in CI; it does not prove byte identity with the lost historical v0.15 artifact or real agricultural pilot certification.'

  real-vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct and verify testable source slice
        shell: bash
        run: |
          set -euo pipefail
          cat ci/vitest-real/archive.part00.b64 \
              ci/vitest-real/archive.part01.b64 \
              ci/vitest-real/archive.part02.b64 \
              ci/vitest-real/archive.part03.b64 > /tmp/agroway_vitest_slice.b64
          base64 --decode /tmp/agroway_vitest_slice.b64 > /tmp/agroway_vitest_slice.tar.gz
          echo "ab07db7f86535fc029ad2e9bc80a8007ac10e7b0dfef73c0c45e1087c13b5b60  /tmp/agroway_vitest_slice.tar.gz" | sha256sum -c -
          mkdir -p /tmp/agroway-vitest
          tar -xzf /tmp/agroway_vitest_slice.tar.gz -C /tmp/agroway-vitest
          test -f /tmp/agroway-vitest/agroway_vitest_real_slice/package.json
          test -f /tmp/agroway-vitest/agroway_vitest_real_slice/vitest.config.ts
          canonical_tsconfig_sha=$(python - <<'PY'
import hashlib, json
from pathlib import Path
obj=json.loads(Path('ci/vitest-real/root-tsconfig.json').read_text())
raw=json.dumps(obj,sort_keys=True,separators=(',',':')).encode()
print(hashlib.sha256(raw).hexdigest())
PY
          )
          test "$canonical_tsconfig_sha" = "dce31da9205b8cdd604349bff4945ad23b315735b8db522837a854140d808b90" || { echo "root tsconfig canonical digest mismatch: $canonical_tsconfig_sha"; exit 1; }
          cp ci/vitest-real/root-tsconfig.json /tmp/agroway-vitest/agroway_vitest_real_slice/tsconfig.json
          spec_count=$(find /tmp/agroway-vitest/agroway_vitest_real_slice -type f -name '*.spec.ts' | wc -l | tr -d ' ')
          test "$spec_count" = "12" || { echo "expected 12 specs, found $spec_count"; exit 1; }
          echo 'PASS_REAL_VITEST_SOURCE_SLICE_SHA_TSCONFIG_AND_INVENTORY'

      - name: Install pinned Vitest runtime without npm Arborist
        working-directory: /tmp/agroway-vitest/agroway_vitest_real_slice
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version | tee /tmp/pnpm-version.txt
          grep -Fx '10.15.0' /tmp/pnpm-version.txt
          pnpm install --ignore-scripts --frozen-lockfile=false
          pnpm exec vitest --version | tee /tmp/vitest-version.txt
          grep -Eq 'vitest/4\.1\.7|vitest 4\.1\.7' /tmp/vitest-version.txt

      - name: Real Vitest 12-spec runtime
        working-directory: /tmp/agroway-vitest/agroway_vitest_real_slice
        run: pnpm exec vitest run --config vitest.config.ts --reporter=verbose

      - name: Vitest trust boundary
        run: |
          echo 'PASS_REAL_VITEST_4_1_7_FOR_OBSERVED_12_SPEC_SLICE'
          echo 'This is real Vitest runtime for the exact observed 12-spec reconstructed source closure plus the canonical alpha10 root tsconfig. It is not yet a claim that the full 41-workspace monorepo is directly persisted or tested from its canonical root lockfile.'
