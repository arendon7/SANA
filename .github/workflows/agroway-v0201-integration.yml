name: AGROWAY v0.20.1 legacy integration

# Historical/provenance-only workflow.
# The original workflow assumed an exact v0.16 ZIP that was never generated.
# Reconstructed v0.21 FIELD pull requests must not be blocked by that obsolete premise.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Historical boundary
        run: |
          echo 'LEGACY_V0201_MANUAL_ONLY'
          echo 'This workflow is retained for provenance/reference and is not a v0.21 FIELD release gate.'
          echo 'Use AGROWAY FIELD v0.21 alpha runtime for the current incremental runtime gate.'
