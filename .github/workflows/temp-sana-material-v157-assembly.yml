name: TEMP SANA Material V157 Assembly

on:
  push:
    branches: [demo/sana-material-v157]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-material-v157
      - name: Assemble v157 shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          if "const CACHE='sana-v3-demo-shell-v157';" not in s:
              old="const CACHE='sana-v3-demo-shell-v156';"
              new="if(false){\nconst CACHE='sana-v3-demo-shell-v156';\n}\nconst CACHE='sana-v3-demo-shell-v157';"
              assert s.count(old)==1, 'expected exactly one active v156 marker'
              s=s.replace(old,new,1)
          anchor="'/sana-v3-material-references.js',"
          assets="'/sana-v3-material-references.js','/sana-v3-report-snapshot-material-references.js','/sana-v3-cycle-material-references.js','/sana-v3-due-diligence-material-reference-gaps.js','/sana-v3-dataroom-material-references.js',"
          if '/sana-v3-report-snapshot-material-references.js' not in s:
              assert s.count(anchor)==1, 'material references asset anchor missing/duplicated'
              s=s.replace(anchor,assets,1)
          comment='// v157 propagates minimized Material reference integrity through Snapshot, Cycle, DD and Data Room without live fallback, retrofill, weighting, certification, credit or investment authority.'
          if comment not in s:
              anchor_comment='// v156 validates explicit Material Chain destination/material/event references, including orphan sources, without certification, inventory/accounting execution, credit, eligibility or investment authority.'
              assert s.count(anchor_comment)==1, 'v156 comment anchor missing/duplicated'
              s=s.replace(anchor_comment,anchor_comment+'\n'+comment,1)
          p.write_text(s)
          PY
          node --check apps/control-web/public/sana-v3-sw.js
          grep -q "^const CACHE='sana-v3-demo-shell-v157';$" apps/control-web/public/sana-v3-sw.js
          test "$(grep -c "const CACHE='sana-v3-demo-shell-v156';" apps/control-web/public/sana-v3-sw.js)" -eq 1
          for a in \
            /sana-v3-report-snapshot-material-references.js \
            /sana-v3-cycle-material-references.js \
            /sana-v3-due-diligence-material-reference-gaps.js \
            /sana-v3-dataroom-material-references.js; do test "$(grep -o "$a" apps/control-web/public/sana-v3-sw.js | wc -l)" -eq 1; done
      - name: Commit assembly if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'chore(sana): assemble material shell v157'
          git push origin HEAD:demo/sana-material-v157
