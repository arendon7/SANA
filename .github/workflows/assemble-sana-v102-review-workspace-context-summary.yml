name: Assemble SANA v102 Review Workspace Context Summary

on:
  push:
    branches: [demo/sana-v102-review-workspace-context-summary]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-workspace.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'scripts/validate-sana-dataroom-review-workspace-v102.mjs'
      - '.github/workflows/assemble-sana-v102-review-workspace-context-summary.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: demo/sana-v102-review-workspace-context-summary}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply deterministic V102 context-summary patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-dataroom-review-workspace.js')
          s=p.read_text()
          if "const CONTEXT_SUMMARY_BASELINE='REVIEW WORKSPACE V102';" not in s:
              old="const BIDIRECTIONAL_NAVIGATION_BASELINE='REVIEW WORKSPACE V101';"
              assert old in s
              s=s.replace(old,old+"\nconst CONTEXT_SUMMARY_BASELINE='REVIEW WORKSPACE V102';",1)
              old='RETURN_SCROLL ≠ SOURCE_MUTATION · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              new='RETURN_SCROLL ≠ SOURCE_MUTATION · CONTEXT_SUMMARY ≠ SOURCE_VERIFICATION · ACTIVE_SELECTOR ≠ REVIEW_PRIORITY · CONTEXT_ISSUE_COUNT ≠ RISK_SCORE · SUMMARY_VIEW ≠ PERSISTED_STATE · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              assert old in s
              s=s.replace(old,new,1)
              marker='function roleText(){'
              assert marker in s
              fn="""function contextSummary(s,f,context){const stageMeta=STAGES.find(x=>x[0]===f.stage),issueCount=context?.issues?.length||0;return {capital:f.capital||'ALL',lot:f.lot||'ALL',focus:f.focus||'ALL',stage:f.stage||'ALL',stageLabel:stageMeta?.[1]||(f.stage==='ALL'?'Todas':'—'),event:f.event||'',ref:f.ref||'',resolved:context?.resolved!==false,issueCount,visibleChains:visibleChains(s.chains,f).length,integrity:'CONTEXT_SUMMARY ≠ SOURCE_VERIFICATION · ACTIVE_SELECTOR ≠ REVIEW_PRIORITY · CONTEXT_ISSUE_COUNT ≠ RISK_SCORE · SUMMARY_VIEW ≠ PERSISTED_STATE'}}
function contextSummaryHtml(x){const chip=(label,value,active=true)=>`<div class=\"review-context-chip ${active?'is-active':''}\"><span>${esc(label)}</span><strong>${esc(value||'—')}</strong></div>`;return `<section class=\"review-context-summary ${x.resolved?'':'is-unresolved'}\" aria-label=\"Resumen de contexto de revisión\"><div class=\"review-context-summary-head\"><div><p class=\"kicker\">CONTEXTO ACTIVO · URL ONLY</p><strong>${x.resolved?'Contexto resuelto':'Contexto con selectores no resueltos'}</strong><small>${x.visibleChains} circuito(s) visible(s) · ${x.issueCount} incidencia(s) de contexto</small></div><span class=\"status ${x.resolved?'teal':'warn'}\">${x.resolved?'RESOLVED':'UNRESOLVED'}</span></div><div class=\"review-context-chip-list\">${chip('Capital case',x.capital,x.capital!=='ALL')}${chip('Lote',x.lot,x.lot!=='ALL')}${chip('Foco',x.focus,x.focus!=='ALL')}${chip('Etapa',x.stage==='ALL'?'Todas':`${x.stageLabel} · ${x.stage}`,x.stage!=='ALL')}${chip('Evento',x.event||'Sin foco',!!x.event)}${chip('Referencia',x.ref||'Sin foco',!!x.ref)}</div><div class=\"section-note\">CONTEXT_SUMMARY ≠ SOURCE_VERIFICATION · ACTIVE_SELECTOR ≠ REVIEW_PRIORITY · CONTEXT_ISSUE_COUNT ≠ RISK_SCORE · SUMMARY_VIEW ≠ PERSISTED_STATE</div></section>`}
"""
              s=s.replace(marker,fn+marker,1)
              old="function panel(){const s=state(),f=readFocus(),chains=visibleChains(s.chains,f),selected=selectedEntry(s.chains,f),focusedEvent=selectedTimelineEvent(selected,f),occurrences=referenceOccurrences(s.chains,f,f.ref),context=contextIntegrity(s.chains,f),sum=s.summary;return"
              new="function panel(){const s=state(),f=readFocus(),chains=visibleChains(s.chains,f),selected=selectedEntry(s.chains,f),focusedEvent=selectedTimelineEvent(selected,f),occurrences=referenceOccurrences(s.chains,f,f.ref),context=contextIntegrity(s.chains,f),contextView=contextSummary(s,f,context),sum=s.summary;return"
              assert old in s
              s=s.replace(old,new,1)
              old='${controls(s,f)}${sourceIntegrityBanner(s)}${contextBanner(context)}<div class="grid metrics review-workspace-metrics">'
              new='${controls(s,f)}${contextSummaryHtml(contextView)}${sourceIntegrityBanner(s)}${contextBanner(context)}<div class="grid metrics review-workspace-metrics">'
              assert old in s
              s=s.replace(old,new,1)
              old='contextIntegrity,sourcePanelTarget,workspacePanelTarget,sourceRowMatches,integrity:INTEGRITY'
              new='contextIntegrity,contextSummary,sourcePanelTarget,workspacePanelTarget,sourceRowMatches,integrity:INTEGRITY'
              assert old in s
              s=s.replace(old,new,1)
              assert 'DATA ROOM · REVIEW WORKSPACE V101' in s
              s=s.replace('DATA ROOM · REVIEW WORKSPACE V101','DATA ROOM · REVIEW WORKSPACE V102',1)
              assert 'Circuito de revisión, con navegación bidireccional al caso fuente' in s
              s=s.replace('Circuito de revisión, con navegación bidireccional al caso fuente','Circuito de revisión, con contexto operativo visible',1)
              p.write_text(s)
          css=Path('apps/control-web/public/sana-v3-review-workspace.css')
          c=css.read_text()
          if '.review-context-summary{' not in c:
              c+='\n.review-context-summary{margin:0 0 12px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.review-context-summary.is-unresolved{background:#fbfaf5}.review-context-summary-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}.review-context-summary-head>div{display:grid;gap:2px}.review-context-summary-head .kicker{margin:0;font-size:7px;letter-spacing:.1em;color:var(--muted);font-weight:850}.review-context-summary-head>div>strong{font-size:10px}.review-context-summary-head small{font-size:7px;color:var(--muted)}.review-context-chip-list{display:flex;flex-wrap:wrap;gap:6px}.review-context-chip{display:grid;gap:2px;min-width:92px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:#fafbf9}.review-context-chip span{font-size:6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.review-context-chip strong{font-size:8px;overflow-wrap:anywhere}.review-context-chip.is-active{border-color:#cfe0dd;background:#f4faf8}.review-context-summary.is-unresolved .review-context-chip.is-active{border-color:#dfd2b7;background:#fffdf8}@media(max-width:620px){.review-context-summary-head{display:grid}.review-context-chip{min-width:calc(50% - 3px);flex:1}}\n'
              css.write_text(c)
          sw=Path('apps/control-web/public/sana-v3-sw.js')
          w=sw.read_text()
          if "const CACHE='sana-v3-demo-shell-v102';" not in w:
              old="const CACHE='sana-v3-demo-shell-v101';"
              assert old in w
              w=w.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v101';\n}\nconst CACHE='sana-v3-demo-shell-v102';",1)
              sw.write_text(w)
          PY
      - name: Validate V87–V102
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          node scripts/validate-sana-dataroom-review-workspace-v88.mjs
          node scripts/validate-sana-dataroom-review-workspace-v89.mjs
          node scripts/validate-sana-dataroom-review-workspace-v90.mjs
          node scripts/validate-sana-dataroom-review-workspace-v91.mjs
          node scripts/validate-sana-dataroom-review-workspace-v92.mjs
          node scripts/validate-sana-dataroom-review-workspace-v93.mjs
          node scripts/validate-sana-dataroom-review-workspace-v94.mjs
          node scripts/validate-sana-dataroom-review-workspace-v95.mjs
          node scripts/validate-sana-dataroom-review-workspace-v96.mjs
          node scripts/validate-sana-dataroom-review-workspace-v97.mjs
          node scripts/validate-sana-dataroom-review-workspace-v98.mjs
          node scripts/validate-sana-dataroom-review-workspace-v99.mjs
          node scripts/validate-sana-dataroom-review-workspace-v100.mjs
          node scripts/validate-sana-dataroom-review-workspace-v101.mjs
          node scripts/validate-sana-dataroom-review-workspace-v102.mjs
      - name: Commit assembled V102
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-dataroom-review-workspace.js apps/control-web/public/sana-v3-review-workspace.css apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble Data Room review context summary v102'
          git push origin HEAD:demo/sana-v102-review-workspace-context-summary
