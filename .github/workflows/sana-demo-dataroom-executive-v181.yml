name: SANA Demo Data Room Executive V181

on:
  push:
    branches: [demo/sana-dataroom-executive-v181]
  pull_request:

permissions:
  contents: read

jobs:
  validate-v181:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax source contract
        run: node --check apps/control-web/public/sana-v3-dataroom-claim-current-pointer-history-v181.js
      - name: Syntax executive adapter
        run: node --check apps/control-web/public/sana-v3-dataroom-executive-v181.js
      - name: V170 regression
        run: node scripts/validate-sana-dataroom-executive-v170.mjs
      - name: V171 regression
        run: node scripts/validate-sana-dataroom-executive-v171.mjs
      - name: V172 regression
        run: node scripts/validate-sana-dataroom-executive-v172.mjs
      - name: V173 regression
        run: node scripts/validate-sana-dataroom-executive-v173.mjs
      - name: V174 regression
        run: node scripts/validate-sana-dataroom-executive-v174.mjs
      - name: V175 regression
        run: node scripts/validate-sana-dataroom-executive-v175.mjs
      - name: V176 regression
        run: node scripts/validate-sana-dataroom-executive-v176.mjs
      - name: V177 regression
        run: node scripts/validate-sana-dataroom-executive-v177.mjs
      - name: V178 regression
        run: node scripts/validate-sana-dataroom-executive-v178.mjs
      - name: V179 regression
        run: node scripts/validate-sana-dataroom-executive-v179.mjs
      - name: V180 regression
        run: node scripts/validate-sana-dataroom-executive-v180.mjs
      - name: V181 current pointer lineage adversarial validation
        run: node scripts/validate-sana-dataroom-executive-v181.mjs
      - name: V181 read-only surface
        shell: bash
        run: |
          set -euo pipefail
          file=apps/control-web/public/sana-v3-dataroom-executive-v181.html
          test -f "$file"
          grep -Fq 'Current pointer predecessor lineage' "$file"
          grep -Fq 'no</strong> de timestamps' "$file"
          grep -Fq 'POINTER PREDECESSOR REFERENCE ≠ CHRONOLOGICAL TRUTH ≠ AUTHORITATIVE SUPERSESSION' "$file"
          grep -Fq 'supersessionAuthority=false' "$file"
          grep -Fq 'chronologyInference=false' "$file"
          grep -Fq 'latestPointerInference=false' "$file"
          ! grep -Fqi '<form' "$file"
          ! grep -Fq 'fetch(' "$file"
          ! grep -Fq 'XMLHttpRequest' "$file"
          ! grep -Fq 'localStorage.setItem' "$file"
          ! grep -Fq 'sessionStorage.setItem' "$file"
      - name: Preserve V181 source-contract boundary
        shell: bash
        run: |
          set -euo pipefail
          source_file=apps/control-web/public/sana-v3-dataroom-claim-current-pointer-history-v181.js
          grep -Fq 'SANA_DATAROOM_CLAIM_CURRENT_POINTER_HISTORY_V1' "$source_file"
          grep -Fq 'CURRENT_POINTER_HISTORY_REFERENCE_ONLY' "$source_file"
          grep -Fq 'SELF_PREDECESSOR_NOT_ALLOWED' "$source_file"
          grep -Fq 'DUPLICATE_POINTER_EVENT_REF' "$source_file"
          grep -Fq 'DUPLICATE_POINTER_REF' "$source_file"
          grep -Fq 'NO_TIMESTAMP_OR_SOURCE_ORDER_INFERENCE' "$source_file"
          grep -Fq 'supersessionAuthority:false' "$source_file"
          grep -Fq 'chronologyAuthority:false' "$source_file"
          grep -Fq 'latestPointerAuthority:false' "$source_file"
          ! grep -Fq 'fetch(' "$source_file"
          ! grep -Fq 'XMLHttpRequest' "$source_file"
          ! grep -Fq 'localStorage.setItem' "$source_file"
          ! grep -Fq 'sessionStorage.setItem' "$source_file"
      - name: Preserve V181 exact-lineage and authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          js=apps/control-web/public/sana-v3-dataroom-executive-v181.js
          grep -Fq 'CLAIM_CURRENT_POINTER_LINEAGE_EXACT_V1' "$js"
          grep -Fq 'EXACT_POINTER_REF_SINGLE_LINEAR_CHAIN' "$js"
          grep -Fq 'EXACT_V180_POINTER_REF_AND_ROUND_REF' "$js"
          grep -Fq 'EXACTLY_ONE_ROOT' "$js"
          grep -Fq 'NO_CYCLES' "$js"
          grep -Fq 'NO_MULTIPLE_SUCCESSORS' "$js"
          grep -Fq 'ALL_HISTORY_RECORDS_REACHABLE_FROM_V180_CURRENT_POINTER' "$js"
          grep -Fq 'NO_TIMESTAMP_SOURCE_ORDER_OR_REF_ORDER_INFERENCE' "$js"
          grep -Fq 'POINTER_PREDECESSOR_REFERENCE ≠ CHRONOLOGICAL_TRUTH ≠ AUTHORITATIVE_SUPERSESSION' "$js"
          grep -Fq 'supersessionAuthority:false' "$js"
          grep -Fq 'chronologyAuthority:false' "$js"
          grep -Fq 'latestPointerAuthority:false' "$js"
          grep -Fq 'claimTruthAuthority:false' "$js"
          grep -Fq 'evidenceAcceptanceAuthority:false' "$js"
          grep -Fq 'evidentiarySufficiencyAuthority:false' "$js"
          grep -Fq 'findingResolutionAuthority:false' "$js"
          grep -Fq 'dueDiligenceApprovalAuthority:false' "$js"
          grep -Fq 'eligibilityAuthority:false' "$js"
          grep -Fq 'financingApprovalAuthority:false' "$js"
          grep -Fq 'decisionAuthority:false' "$js"
          ! grep -Eiq 'canonicalMutationAvailable[[:space:]]*:[[:space:]]*true|financialMutationAvailable[[:space:]]*:[[:space:]]*true|supersessionAuthority[[:space:]]*:[[:space:]]*true|chronologyAuthority[[:space:]]*:[[:space:]]*true|latestPointerAuthority[[:space:]]*:[[:space:]]*true|claimTruthAuthority[[:space:]]*:[[:space:]]*true|evidenceAcceptanceAuthority[[:space:]]*:[[:space:]]*true|evidentiarySufficiencyAuthority[[:space:]]*:[[:space:]]*true|findingResolutionAuthority[[:space:]]*:[[:space:]]*true|dueDiligenceApprovalAuthority[[:space:]]*:[[:space:]]*true|eligibilityAuthority[[:space:]]*:[[:space:]]*true|financingApprovalAuthority[[:space:]]*:[[:space:]]*true|decisionAuthority[[:space:]]*:[[:space:]]*true|riskScore[[:space:]]*:|creditScore[[:space:]]*:|investmentScore[[:space:]]*:|projectScore[[:space:]]*:|overallScore[[:space:]]*:' "$js"