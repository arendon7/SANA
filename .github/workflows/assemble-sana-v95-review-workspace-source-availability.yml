name: Assemble SANA v95 Review Workspace Source Availability

on:
  push:
    branches: [demo/sana-v95-review-workspace-source-availability]
    paths:
      - 'apps/control-web/public/sana-v3-dataroom-review-workspace.js'
      - 'apps/control-web/public/sana-v3-review-workspace.css'
      - 'scripts/validate-sana-dataroom-review-workspace-v95.mjs'
      - '.github/workflows/assemble-sana-v95-review-workspace-source-availability.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: demo/sana-v95-review-workspace-source-availability}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply deterministic V95 source-availability patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-dataroom-review-workspace.js')
          s=p.read_text()
          if "const SOURCE_AVAILABILITY_BASELINE='REVIEW WORKSPACE V95';" not in s:
              old="const CONTEXT_INTEGRITY_BASELINE='REVIEW WORKSPACE V94';"
              assert old in s
              s=s.replace(old,old+"\nconst SOURCE_AVAILABILITY_BASELINE='REVIEW WORKSPACE V95';",1)
              old='CONTEXT_CLEAR ≠ SOURCE_MUTATION · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              new='CONTEXT_CLEAR ≠ SOURCE_MUTATION · SOURCE_API_UNAVAILABLE ≠ STAGE_NOT_REFERENCED ≠ REVIEW_GAP · SOURCE_READ_ERROR ≠ SOURCE_EMPTY · SOURCE_AVAILABILITY ≠ SOURCE_VERIFICATION · REFERENCE_NAVIGATION ≠ ISSUE_RESOLUTION'
              assert old in s
              s=s.replace(old,new,1)
              old="function cases(api){try{const source=window[api],schema=source?.schema||'';return (source?.cases?.()||[]).map(c=>({...c,__workspaceSourceSchema:schema||c?.schema||''}))}catch{return []}}"
              new="function sourceProbe(stage,label,api){const source=window[api];if(!source||typeof source.cases!=='function')return {stage,label,api,state:'UNAVAILABLE',schema:source?.schema||'',caseCount:0,cases:[],integrity:'SOURCE_API_UNAVAILABLE ≠ STAGE_NOT_REFERENCED ≠ REVIEW_GAP'};try{const schema=source.schema||'',list=source.cases();if(!Array.isArray(list))throw new TypeError('SOURCE_CASES_NOT_ARRAY');const normalized=list.map(c=>({...c,__workspaceSourceSchema:schema||c?.schema||''}));return {stage,label,api,state:'AVAILABLE',schema,caseCount:normalized.length,cases:normalized,integrity:'SOURCE_AVAILABILITY ≠ SOURCE_VERIFICATION'}}catch{return {stage,label,api,state:'READ_ERROR',schema:source?.schema||'',caseCount:0,cases:[],integrity:'SOURCE_READ_ERROR ≠ SOURCE_EMPTY'}}}\nfunction cases(api){const cfg=STAGES.find(x=>x[2]===api)||['','',api];return sourceProbe(cfg[0],cfg[1],api).cases}"
              assert old in s
              s=s.replace(old,new,1)
              old="function state(){const entries=[];STAGES.forEach(([stage,label,api],order)=>cases(api).forEach(c=>entries.push(entry(stage,label,c,order))));const groups="
              new="function state(){const entries=[],sources=STAGES.map(([stage,label,api])=>sourceProbe(stage,label,api));sources.forEach((source,order)=>source.cases.forEach(c=>entries.push(entry(source.stage,source.label,c,order))));const groups="
              assert old in s
              s=s.replace(old,new,1)
              old="const stages=STAGES.map(([stage,label],order)=>({stage,label,order,entry:byStage.get(stage)||null,present:byStage.has(stage)}));"
              new="const stages=STAGES.map(([stage,label],order)=>({stage,label,order,entry:byStage.get(stage)||null,present:byStage.has(stage),sourceState:sources[order]?.state||'UNAVAILABLE',sourceSchema:sources[order]?.schema||''}));"
              assert old in s
              s=s.replace(old,new,1)
              old="const presentStages=stages.filter(x=>x.present).map(x=>x.stage),missingStages=stages.filter(x=>!x.present).map(x=>x.stage),missingInternalReferences=g.entries.flatMap(e=>e.missingInternalReferences),stageCount=presentStages.length;"
              new="const presentStages=stages.filter(x=>x.present).map(x=>x.stage),indeterminateStages=stages.filter(x=>!x.present&&x.sourceState!=='AVAILABLE').map(x=>x.stage),missingStages=stages.filter(x=>!x.present&&x.sourceState==='AVAILABLE').map(x=>x.stage),missingInternalReferences=g.entries.flatMap(e=>e.missingInternalReferences),stageCount=presentStages.length;"
              assert old in s
              s=s.replace(old,new,1)
              old="return {...g,stages,presentStages,missingStages,missingInternalReferences,stageCount,stageCompletenessLabel:"
              new="return {...g,stages,presentStages,indeterminateStages,missingStages,missingInternalReferences,stageCount,stageCompletenessLabel:"
              assert old in s
              s=s.replace(old,new,1)
              old="return {schema:SCHEMA,chains,entries,summary:{"
              new="return {schema:SCHEMA,sources:sources.map(({cases,...source})=>source),chains,entries,summary:{"
              assert old in s
              s=s.replace(old,new,1)
              old="chainsWithAllStages:chains.filter(c=>c.missingStages.length===0).length"
              new="chainsWithAllStages:chains.filter(c=>c.stageCount===STAGES.length).length"
              assert old in s
              s=s.replace(old,new,1)
              old="missingInternalReferences:chains.reduce((n,c)=>n+c.missingInternalReferences.length,0),riskScores:0"
              new="missingInternalReferences:chains.reduce((n,c)=>n+c.missingInternalReferences.length,0),indeterminateStageSources:chains.reduce((n,c)=>n+c.indeterminateStages.length,0),unavailableSources:sources.filter(x=>x.state==='UNAVAILABLE').length,sourceReadErrors:sources.filter(x=>x.state==='READ_ERROR').length,riskScores:0"
              assert old in s
              s=s.replace(old,new,1)
              old="function stageCard(s,i,c,f){if(!s.present)return `<div class=\"review-stage is-missing\"><span class=\"review-stage-index\">${i+1}</span><strong>${esc(s.label)}</strong><small>No referenciado</small><em>≠ gap / failure</em></div>`;const e=s.entry,selected=f.stage===e.stage&&f.capital===c.capitalCaseRef&&f.lot===c.lot;"
              new="function stageCard(s,i,c,f){if(!s.present){const unavailable=s.sourceState!=='AVAILABLE';return `<div class=\"review-stage is-missing ${unavailable?'is-source-unavailable':''}\"><span class=\"review-stage-index\">${i+1}</span><strong>${esc(s.label)}</strong><small>${unavailable?'Fuente no disponible':'No referenciado'}</small><em>${unavailable?'≠ etapa ausente / gap':'≠ gap / failure'}</em></div>`}const e=s.entry,selected=f.stage===e.stage&&f.capital===c.capitalCaseRef&&f.lot===c.lot;"
              assert old in s
              s=s.replace(old,new,1)
              old="function chainCard(c,f){const all=c.missingStages.length===0;return `<article class=\"review-chain\"><div class=\"review-chain-head\"><div><strong>${esc(c.capitalCaseRef||'Sin capital case')} · ${esc(c.lot||'Sin lote')}</strong><span>${c.stageCount}/6 etapas referenciadas · presencia ≠ completitud</span></div><span class=\"status ${all?'teal':'warn'}\">${all?'6/6 REFERENCIADAS':`${c.missingStages.length} SIN REF`}</span></div>"
              new="function chainCard(c,f){const all=c.stageCount===STAGES.length,statusText=all?'6/6 REFERENCIADAS':c.indeterminateStages.length?`${c.indeterminateStages.length} INDETERMINADA(S) · ${c.missingStages.length} SIN REF`:`${c.missingStages.length} SIN REF`;return `<article class=\"review-chain\"><div class=\"review-chain-head\"><div><strong>${esc(c.capitalCaseRef||'Sin capital case')} · ${esc(c.lot||'Sin lote')}</strong><span>${c.stageCount}/6 etapas referenciadas · presencia ≠ completitud</span></div><span class=\"status ${all?'teal':c.indeterminateStages.length?'':'warn'}\">${statusText}</span></div>"
              assert old in s
              s=s.replace(old,new,1)
              marker='function contextBanner(ctx){'
              assert marker in s
              fn="""function sourceIntegrityBanner(s){const affected=(s.sources||[]).filter(x=>x.state!=='AVAILABLE');if(!affected.length)return '';return `<section class=\"review-source-integrity\" aria-label=\"Integridad de disponibilidad de fuentes\"><div class=\"review-source-integrity-head\"><div><p class=\"kicker\">DISPONIBILIDAD DE FUENTES · READ ONLY</p><h4>${affected.length} fuente(s) no determinables en esta proyección</h4><p>Una fuente ausente o con error de lectura vuelve la etapa indeterminada. No equivale a etapa no referenciada, gap, falla ni resultado de revisión.</p></div><span class=\"status\">SOURCE STATE</span></div><div class=\"review-source-list\">${affected.map(x=>`<div class=\"review-source-item\"><strong>${esc(x.label)} · ${esc(x.stage)}</strong><code>${esc(x.state)}</code><small>${x.state==='UNAVAILABLE'?'API no disponible en runtime':'La API existe pero no pudo leerse'}</small></div>`).join('')}</div><div class=\"section-note\">SOURCE_API_UNAVAILABLE ≠ STAGE_NOT_REFERENCED ≠ REVIEW_GAP · SOURCE_READ_ERROR ≠ SOURCE_EMPTY · SOURCE_AVAILABILITY ≠ SOURCE_VERIFICATION</div></section>`}\n"""
              s=s.replace(marker,fn+marker,1)
              assert 'DATA ROOM · REVIEW WORKSPACE V94' in s
              s=s.replace('DATA ROOM · REVIEW WORKSPACE V94','DATA ROOM · REVIEW WORKSPACE V95',1)
              assert 'Circuito de revisión, con integridad de contexto deep-link' in s
              s=s.replace('Circuito de revisión, con integridad de contexto deep-link','Circuito de revisión, con integridad de fuentes y contexto',1)
              old='${controls(s,f)}${contextBanner(context)}<div class="grid metrics review-workspace-metrics">'
              new='${controls(s,f)}${sourceIntegrityBanner(s)}${contextBanner(context)}<div class="grid metrics review-workspace-metrics">'
              assert old in s
              s=s.replace(old,new,1)
              p.write_text(s)
          css=Path('apps/control-web/public/sana-v3-review-workspace.css')
          c=css.read_text()
          if '.review-source-integrity{' not in c:
              c+='\n.review-source-integrity{margin:0 0 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#f8faf8}.review-source-integrity-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.review-source-integrity-head .kicker{margin:0 0 4px;font-size:7px;letter-spacing:.1em;color:var(--muted);font-weight:850}.review-source-integrity-head h4{margin:0;font-size:11px}.review-source-integrity-head p{margin:4px 0 0;max-width:760px;font-size:8px;line-height:1.45;color:var(--muted)}.review-source-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:9px 0}.review-source-item{display:grid;gap:4px;padding:9px;border:1px dashed var(--line);border-radius:9px;background:#fff}.review-source-item strong{font-size:8px}.review-source-item code,.review-source-item small{font-size:7px;white-space:normal;overflow-wrap:anywhere;color:var(--muted)}.review-stage.is-source-unavailable{background:#f7f8f5;color:var(--muted);border-style:dotted}@media(max-width:980px){.review-source-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.review-source-integrity-head{display:grid}.review-source-list{grid-template-columns:1fr}}\n'
              css.write_text(c)
          sw=Path('apps/control-web/public/sana-v3-sw.js')
          w=sw.read_text()
          if "const CACHE='sana-v3-demo-shell-v95';" not in w:
              old="const CACHE='sana-v3-demo-shell-v94';"
              assert old in w
              w=w.replace(old,"if(false){\nconst CACHE='sana-v3-demo-shell-v94';\n}\nconst CACHE='sana-v3-demo-shell-v95';",1)
              sw.write_text(w)
          PY
      - name: Validate V87–V95
        run: |
          node scripts/validate-sana-dataroom-review-workspace.mjs
          node scripts/validate-sana-dataroom-review-workspace-v88.mjs
          node scripts/validate-sana-dataroom-review-workspace-v89.mjs
          node scripts/validate-sana-dataroom-review-workspace-v90.mjs
          node scripts/validate-sana-dataroom-review-workspace-v91.mjs
          node scripts/validate-sana-dataroom-review-workspace-v92.mjs
          node scripts/validate-sana-dataroom-review-workspace-v93.mjs
          node scripts/validate-sana-dataroom-review-workspace-v94.mjs
          node scripts/validate-sana-dataroom-review-workspace-v95.mjs
      - name: Commit assembled V95
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/control-web/public/sana-v3-dataroom-review-workspace.js apps/control-web/public/sana-v3-review-workspace.css apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble Data Room review source availability v95'
          git push origin HEAD:demo/sana-v95-review-workspace-source-availability
