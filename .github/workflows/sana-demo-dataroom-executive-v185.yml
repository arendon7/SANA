name: SANA Demo Data Room Executive V185

on:
  push:
    branches: [demo/sana-dataroom-executive-v185]
  pull_request:

permissions:
  contents: read

jobs:
  validate-v185:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax executive capsule
        run: node --check apps/control-web/public/sana-v3-dataroom-executive-v185.js
      - name: V170 regression
        run: node scripts/validate-sana-dataroom-executive-v170.mjs
      - name: V171 regression
        run: node scripts/validate-sana-dataroom-executive-v171.mjs
      - name: V172 regression
        run: node scripts/validate-sana-dataroom-executive-v172.mjs
      - name: V173 regression
        run: node scripts/validate-sana-dataroom-executive-v173.mjs
      - name: V174 regression
        run: node scripts/validate-sana-dataroom-executive-v174.mjs
      - name: V175 regression
        run: node scripts/validate-sana-dataroom-executive-v175.mjs
      - name: V176 regression
        run: node scripts/validate-sana-dataroom-executive-v176.mjs
      - name: V177 regression
        run: node scripts/validate-sana-dataroom-executive-v177.mjs
      - name: V178 regression
        run: node scripts/validate-sana-dataroom-executive-v178.mjs
      - name: V179 regression
        run: node scripts/validate-sana-dataroom-executive-v179.mjs
      - name: V180 regression
        run: node scripts/validate-sana-dataroom-executive-v180.mjs
      - name: V181 regression
        run: node scripts/validate-sana-dataroom-executive-v181.mjs
      - name: V182 regression
        run: node scripts/validate-sana-dataroom-executive-v182.mjs
      - name: V183 regression
        run: node scripts/validate-sana-dataroom-executive-v183.mjs
      - name: V184 regression
        run: node scripts/validate-sana-dataroom-executive-v184.mjs
      - name: V185 executive capsule adversarial validation
        run: node scripts/validate-sana-dataroom-executive-v185.mjs
      - name: V185 read-only executive surface
        shell: bash
        run: |
          set -euo pipefail
          file=apps/control-web/public/sana-v3-dataroom-executive-v185.html
          test -f "$file"
          grep -Fq 'Claim Governance Executive Capsule' "$file"
          grep -Fq 'AGGREGATE SCORE' "$file"
          grep -Fq 'REFERENCE GAP ≠ NEGATIVE PROJECT CONCLUSION' "$file"
          grep -Fq 'STRUCTURAL CONFLICT ≠ INVESTMENT RISK' "$file"
          grep -Fq 'COMPLETE GOVERNANCE REFERENCE COVERAGE ≠ AUTHORIZATION / COMPLIANCE' "$file"
          ! grep -Fqi '<form' "$file"
          ! grep -Fq 'fetch(' "$file"
          ! grep -Fq 'XMLHttpRequest' "$file"
          ! grep -Fq 'localStorage.setItem' "$file"
          ! grep -Fq 'sessionStorage.setItem' "$file"
      - name: Preserve V185 projection-only and authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          js=apps/control-web/public/sana-v3-dataroom-executive-v185.js
          grep -Fq 'SANA_DATAROOM_EXECUTIVE_CLAIM_GOVERNANCE_CAPSULE_V1' "$js"
          grep -Fq "PARENT_SHA='896250aa3d39dd9226ca940ceb9c029c9c4f9d76'" "$js"
          grep -Fq 'parentStateReevaluation:false' "$js"
          grep -Fq 'newSourceContract:false' "$js"
          grep -Fq 'aggregateDecisionState:false' "$js"
          grep -Fq 'weighting:false' "$js"
          grep -Fq 'percentage:false' "$js"
          grep -Fq 'ratio:false' "$js"
          grep -Fq 'scoring:false' "$js"
          grep -Fq 'recommendation:false' "$js"
          grep -Fq 'EXCEPTION_FLAGS_MAY_COEXIST' "$js"
          grep -Fq 'aggregateDecisionAuthority:false' "$js"
          grep -Fq 'claimTruthAuthority:false' "$js"
          grep -Fq 'evidenceAcceptanceAuthority:false' "$js"
          grep -Fq 'evidentiarySufficiencyAuthority:false' "$js"
          grep -Fq 'governanceAuthority:false' "$js"
          grep -Fq 'transitionAuthorizationAuthority:false' "$js"
          grep -Fq 'transitionApprovalAuthority:false' "$js"
          grep -Fq 'complianceAuthority:false' "$js"
          grep -Fq 'legalEffectAuthority:false' "$js"
          grep -Fq 'dueDiligenceApprovalAuthority:false' "$js"
          grep -Fq 'eligibilityAuthority:false' "$js"
          grep -Fq 'financingApprovalAuthority:false' "$js"
          grep -Fq 'decisionAuthority:false' "$js"
          ! grep -Eiq 'canonicalMutationAvailable[[:space:]]*:[[:space:]]*true|financialMutationAvailable[[:space:]]*:[[:space:]]*true|aggregateDecisionAuthority[[:space:]]*:[[:space:]]*true|claimTruthAuthority[[:space:]]*:[[:space:]]*true|evidenceAcceptanceAuthority[[:space:]]*:[[:space:]]*true|evidentiarySufficiencyAuthority[[:space:]]*:[[:space:]]*true|governanceAuthority[[:space:]]*:[[:space:]]*true|transitionAuthorizationAuthority[[:space:]]*:[[:space:]]*true|transitionApprovalAuthority[[:space:]]*:[[:space:]]*true|complianceAuthority[[:space:]]*:[[:space:]]*true|legalEffectAuthority[[:space:]]*:[[:space:]]*true|dueDiligenceApprovalAuthority[[:space:]]*:[[:space:]]*true|eligibilityAuthority[[:space:]]*:[[:space:]]*true|financingApprovalAuthority[[:space:]]*:[[:space:]]*true|decisionAuthority[[:space:]]*:[[:space:]]*true|overallScore[[:space:]]*:|riskScore[[:space:]]*:|creditScore[[:space:]]*:|investmentScore[[:space:]]*:|projectScore[[:space:]]*:|coverageRatio[[:space:]]*:|coveragePercentage[[:space:]]*:|recommendedAction[[:space:]]*:' "$js"