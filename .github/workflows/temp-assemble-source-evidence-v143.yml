name: TEMP Assemble Source Evidence V143 Shell

on:
  push:
    branches: [demo/sana-source-evidence-v143]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo/sana-source-evidence-v143
          fetch-depth: 1
      - name: Patch shell from certified v142
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/control-web/public/sana-v3-sw.js')
          s=p.read_text()
          old="""if(false){
          const CACHE='sana-v3-demo-shell-v141';
          }
          const CACHE='sana-v3-demo-shell-v142';"""
          new="""if(false){
          const CACHE='sana-v3-demo-shell-v141';
          }
          if(false){
          const CACHE='sana-v3-demo-shell-v142';
          }
          const CACHE='sana-v3-demo-shell-v143';"""
          assert old in s, 'active v142 marker not found'
          assert s.count("const CACHE='sana-v3-demo-shell-v142';")==1
          s=s.replace(old,new,1)
          old_assets="'/sana-v3-sources.js','/sana-v3-source-bridge.js','/sana-v3-source-evidence-ledger.js','/sana-v3-economics.js'"
          new_assets="'/sana-v3-sources.js','/sana-v3-source-bridge.js','/sana-v3-source-evidence-ledger.js','/sana-v3-source-evidence-references.js','/sana-v3-economics.js'"
          assert old_assets in s, 'source evidence asset insertion point not found'
          s=s.replace(old_assets,new_assets,1)
          old_comment='// v142 propagates Labor reference integrity through privacy-minimized Snapshot, Data Room, Cycle and Due Diligence without live fallback, weighting, HR scoring or payroll inference.'
          new_comment=old_comment+'\n// v143 validates Source Evidence use/evidence targets without source verification, content authenticity, external fetch, access verification or certification.'
          assert old_comment in s
          assert 'v143 validates Source Evidence use/evidence targets' not in s
          s=s.replace(old_comment,new_comment,1)
          assert s.count("const CACHE='sana-v3-demo-shell-v143';")==1
          assert s.count('/sana-v3-source-evidence-references.js')==1
          p.write_text(s)
          PY
          git diff --check
          git diff -- apps/control-web/public/sana-v3-sw.js
      - name: Commit shell bump
        run: |
          if git diff --quiet -- apps/control-web/public/sana-v3-sw.js; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/control-web/public/sana-v3-sw.js
          git commit -m 'demo: assemble source evidence references v143 shell'
          git push origin HEAD:demo/sana-source-evidence-v143
