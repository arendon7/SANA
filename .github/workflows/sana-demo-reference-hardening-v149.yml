name: SANA Demo Reference Hardening V149

on:
  push:
    branches: [demo/sana-reference-hardening-v149]
  pull_request:

permissions:
  contents: read

jobs:
  reference-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Reference Scope and Historical Delta V149
        run: |
          set -euo pipefail
          for f in \
            apps/control-web/public/sana-v3-commercial-references.js \
            apps/control-web/public/sana-v3-report-snapshot-commercial-references.js \
            apps/control-web/public/sana-v3-dataroom-commercial-references.js \
            apps/control-web/public/sana-v3-cycle-commercial-references.js \
            apps/control-web/public/sana-v3-cycle-economic-references.js \
            apps/control-web/public/sana-v3-due-diligence-commercial-reference-gaps.js \
            apps/control-web/public/sana-v3-sw.js; do node --check "$f"; done
          node scripts/validate-sana-commercial-references.mjs
          node scripts/validate-sana-commercial-reference-provenance.mjs
          node scripts/validate-sana-reference-hardening-v149.mjs
          node scripts/validate-sana-reference-history-migration-v149.mjs
      - name: Assert hardened semantic boundaries
        run: |
          set -euo pipefail
          grep -Fq "referenceSemanticsVersion:SEMANTICS_VERSION" apps/control-web/public/sana-v3-commercial-references.js
          grep -Fq 'DECLARED_COMMERCIAL_REFERENCE ≠ DERIVED_CROSS_DOMAIN_PROJECTION' apps/control-web/public/sana-v3-commercial-references.js
          grep -Fq 'MISSING_EXPECTED_KIND' apps/control-web/public/sana-v3-commercial-references.js
          grep -Fq 'ADDITIVE_V149 · COMMERCIAL_REFERENCE_PROVENANCE_HARDENED' apps/control-web/public/sana-v3-report-snapshot-commercial-references.js
          grep -Fq 'ROW_LEVEL_STRUCTURAL_DIFF' apps/control-web/public/sana-v3-dataroom-commercial-references.js
          grep -Fq 'SEMANTIC_GRANULARITY_CHANGE ≠ REFERENCE_CHANGE' apps/control-web/public/sana-v3-dataroom-commercial-references.js
          grep -Fq 'SOURCE CASE LOT DEFINES CYCLE MEMBERSHIP' apps/control-web/public/sana-v3-cycle-commercial-references.js
          grep -Fq 'SOURCE CASE LOT DEFINES CYCLE MEMBERSHIP' apps/control-web/public/sana-v3-cycle-economic-references.js
          grep -Fq 'PROYECCIÓN CROSS-DOMAIN DERIVADA' apps/control-web/public/sana-v3-due-diligence-commercial-reference-gaps.js
          ! grep -Eq 'targetLot===plan\.lot|refId===plan\.id' apps/control-web/public/sana-v3-cycle-commercial-references.js apps/control-web/public/sana-v3-cycle-economic-references.js
      - name: Assert v149 PWA provenance forward-compatible
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('apps/control-web/public/sana-v3-sw.js','utf8');
          const assets=[
            '/sana-v3-commercial-references.js',
            '/sana-v3-report-snapshot-commercial-references.js',
            '/sana-v3-dataroom-commercial-references.js',
            '/sana-v3-cycle-commercial-references.js',
            '/sana-v3-cycle-economic-references.js',
            '/sana-v3-due-diligence-commercial-reference-gaps.js'
          ];
          const count=(v)=>(sw.match(new RegExp(`const CACHE='sana-v3-demo-shell-v${v}';`,'g'))||[]).length;
          if(count(149)!==1)throw new Error('v149 cache marker must remain exactly once');
          if(count(148)!==1)throw new Error('v148 cache marker must remain exactly once');
          if(!sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v148';\n}"))throw new Error('v148 historical marker missing');
          const v149Historical=sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v149';\n}");
          const v149Active=(sw.match(/^const CACHE='sana-v3-demo-shell-v149';$/gm)||[]).length===1&&!v149Historical;
          if(!v149Historical&&!v149Active)throw new Error('v149 must remain active or preserved as a historical marker');
          if(!sw.includes("if(false){\nconst CACHE='sana-v3-demo-shell-v147';\n}"))throw new Error('v147 historical marker missing');
          for(const asset of assets){const n=sw.split(asset).length-1;if(n!==1)throw new Error(`${asset} expected once in SW, got ${n}`);}
          if(!sw.includes('// v149 hardens declared-vs-derived reference semantics, row-level historical deltas and source-case cycle scoping without authority expansion.'))throw new Error('v149 provenance comment missing');
          NODE
      - name: Assert snapshot-only and no authority expansion
        run: |
          set -euo pipefail
          ! grep -Eq '__SANA_COMMERCIAL_LEDGER__|storage\?\.records|localStorage' apps/control-web/public/sana-v3-dataroom-commercial-references.js apps/control-web/public/sana-v3-cycle-commercial-references.js apps/control-web/public/sana-v3-due-diligence-commercial-reference-gaps.js
          ! grep -Eq '__SANA_ECONOMIC_RECONCILIATION__|storage\?\.records|localStorage' apps/control-web/public/sana-v3-cycle-economic-references.js
          ! grep -Eiq 'canonicalMutated[[:space:]]*=[[:space:]]*true|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|buyerIdentityVerified[[:space:]]*=[[:space:]]*true|verifiedContracts[[:space:]]*=[[:space:]]*[1-9]|verifiedInvoices[[:space:]]*=[[:space:]]*[1-9]|paymentsExecuted[[:space:]]*=[[:space:]]*[1-9]|bankSettlementsVerified[[:space:]]*=[[:space:]]*[1-9]|guaranteedRevenue[[:space:]]*=[[:space:]]*[1-9]|creditApproved|investmentApproved|orderExecuted|accountingVerified[[:space:]]*=[[:space:]]*true' apps/control-web/public/sana-v3-commercial-references.js apps/control-web/public/sana-v3-report-snapshot-commercial-references.js apps/control-web/public/sana-v3-dataroom-commercial-references.js apps/control-web/public/sana-v3-cycle-commercial-references.js apps/control-web/public/sana-v3-cycle-economic-references.js apps/control-web/public/sana-v3-due-diligence-commercial-reference-gaps.js
