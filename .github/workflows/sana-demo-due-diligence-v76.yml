name: SANA Demo Due Diligence V76

on:
  push:
    branches: [demo/sana-functional-auth-v1]
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-review-case.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-case-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-review-case-gaps.js'
      - 'scripts/validate-sana-dataroom-review-case-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'
      - '.github/workflows/sana-demo-due-diligence-v76.yml'
  pull_request:
    paths:
      - 'apps/control-web/public/sana-v3-report-snapshot-dataroom-review-case.js'
      - 'apps/control-web/public/sana-v3-dataroom-review-case-history.js'
      - 'apps/control-web/public/sana-v3-due-diligence-dataroom-review-case-gaps.js'
      - 'scripts/validate-sana-dataroom-review-case-history.mjs'
      - 'apps/control-web/public/sana-v3.html'
      - 'apps/control-web/public/sana-v3-sw.js'

jobs:
  composed-dd-v76:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate review case historical semantics
        run: node scripts/validate-sana-dataroom-review-case-history.mjs
      - name: Validate DD order before remediation when assembled
        run: |
          html='apps/control-web/public/sana-v3.html'
          if grep -q '/sana-v3-due-diligence-dataroom-review-case-gaps.js' "$html"; then
            grep -q '/sana-v3-due-diligence-dataroom-review-governance-gaps.js.*sana-v3-due-diligence-dataroom-review-case-gaps.js.*sana-v3-due-diligence-remediation.js' "$html"
          else
            echo 'v76 staged before assembly; strict DD order deferred.'
          fi
      - name: Validate snapshot and Data Room order when assembled
        run: |
          html='apps/control-web/public/sana-v3.html'
          if grep -q '/sana-v3-report-snapshot-dataroom-review-case.js' "$html"; then
            grep -q '/sana-v3-report-snapshot-dataroom-review-governance.js.*sana-v3-report-snapshot-dataroom-review-case.js.*sana-v3-cycle-closure.js' "$html"
            grep -q '/sana-v3-dataroom-review-governance-history.js.*sana-v3-dataroom-review-case-history.js.*sana-v3-dataroom-entry.js' "$html"
            grep -Eq "^const CACHE='sana-v3-demo-shell-v(7[6-9]|[89][0-9]|[1-9][0-9]{2,})';" apps/control-web/public/sana-v3-sw.js
          else
            echo 'v76 staged before assembly; strict shell validation deferred.'
          fi
      - name: Validate documentary non-decisional boundaries
        run: |
          grep -q 'NO_REVIEW_CASE ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-review-case-gaps.js
          grep -q 'REVIEW_CASE_OPEN ≠ GAP' apps/control-web/public/sana-v3-due-diligence-dataroom-review-case-gaps.js
          grep -q 'REVIEW_CASE_CLOSED ≠ GAP ≠ DUE_DILIGENCE_APPROVAL' apps/control-web/public/sana-v3-due-diligence-dataroom-review-case-gaps.js
          grep -q 'MISSING_INTERNAL_REFERENCE = DOCUMENTARY_GAP_ONLY' apps/control-web/public/sana-v3-due-diligence-dataroom-review-case-gaps.js
          grep -q 'REVIEW_CASE_GAP ≠ RISK_SCORE ≠ REVIEW_OUTCOME' apps/control-web/public/sana-v3-due-diligence-dataroom-review-case-gaps.js
          grep -q 'LIVE_STATE ≠ SNAPSHOT ≠ HISTORICAL_EVIDENCE' apps/control-web/public/sana-v3-dataroom-review-case-history.js
          ! grep -Eq 'productionExecutionAvailable\s*=\s*true|productionActivationAllowed\s*=\s*true|canonicalMutated\s*=\s*true' apps/control-web/public/sana-v3-report-snapshot-dataroom-review-case.js apps/control-web/public/sana-v3-dataroom-review-case-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-review-case-gaps.js
          ! grep -Eq 'fetch\s*\(' apps/control-web/public/sana-v3-report-snapshot-dataroom-review-case.js apps/control-web/public/sana-v3-dataroom-review-case-history.js apps/control-web/public/sana-v3-due-diligence-dataroom-review-case-gaps.js

# v76 freeze certification trigger: assembled shell v76+, snapshot-only Review Case provenance, documentary gaps only, no scoring or authority expansion.
