permissions:
  contents: read

jobs:
  due-diligence-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/control-web/public/sana-v3-reports-provenance.js apps/control-web/public/sana-v3-report-snapshot-sync.js apps/control-web/public/sana-v3-report-snapshot-circularity.js
            apps/control-web/public/sana-v3-snapshot-compare.js apps/control-web/public/sana-v3-snapshot-freshness.js
            apps/control-web/public/sana-v3-due-diligence-gaps.js apps/control-web/public/sana-v3-due-diligence-material-gaps.js apps/control-web/public/sana-v3-due-diligence-health-gaps.js apps/control-web/public/sana-v3-due-diligence-nutrition-gaps.js apps/control-web/public/sana-v3-due-diligence-phenology-gaps.js apps/control-web/public/sana-v3-due-diligence-circularity-gaps.js apps/control-web/public/sana-v3-due-diligence-remediation.js apps/control-web/public/sana-v3-dd-next-cut.js
            apps/control-web/public/sana-v3-dataroom-360.js apps/control-web/public/sana-v3-dataroom-impact-history.js apps/control-web/public/sana-v3-dataroom-material-history.js apps/control-web/public/sana-v3-dataroom-health-history.js apps/control-web/public/sana-v3-dataroom-nutrition-history.js apps/control-web/public/sana-v3-dataroom-phenology-history.js apps/control-web/public/sana-v3-dataroom-circularity-history.js apps/control-web/public/sana-v3-dataroom-entry.js
            apps/control-web/public/sana-v3-impact-methodology.js apps/control-web/public/sana-v3-impact-ledger.js apps/control-web/public/sana-v3-capital-dossier.js apps/control-web/public/sana-v3-access.js
          )
          for f in "${files[@]}"; do node --check "$f"; done
      - name: Run composed semantic contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-sana-snapshot-compare.mjs
          node scripts/validate-sana-snapshot-freshness.mjs
          node scripts/validate-sana-due-diligence-gaps.mjs
          node scripts/validate-sana-dd-remediation.mjs
          node scripts/validate-sana-dd-next-cut.mjs
          node scripts/validate-sana-dataroom-360.mjs
          node scripts/validate-sana-dataroom-impact-history.mjs
          node scripts/validate-sana-dataroom-entry.mjs
          node scripts/validate-sana-impact-ledger.mjs
          node scripts/validate-sana-health-snapshot.mjs
          node scripts/validate-sana-health-gaps.mjs
          node scripts/validate-sana-nutrition-snapshot.mjs
          node scripts/validate-sana-nutrition-gaps.mjs
          node scripts/validate-sana-phenology-snapshot.mjs
          node scripts/validate-sana-phenology-gaps.mjs
          node scripts/validate-sana-circularity-snapshot.mjs
          node scripts/validate-sana-circularity-gaps.mjs
      - name: Validate composed snapshot and gap boundaries
        shell: bash
        run: |
          set -euo pipefail
          reports='apps/control-web/public/sana-v3-reports-provenance.js'; sync='apps/control-web/public/sana-v3-report-snapshot-sync.js'; circularitySync='apps/control-web/public/sana-v3-report-snapshot-circularity.js'; phenologyGaps='apps/control-web/public/sana-v3-due-diligence-phenology-gaps.js'; circularityGaps='apps/control-web/public/sana-v3-due-diligence-circularity-gaps.js'; phenologyHistory='apps/control-web/public/sana-v3-dataroom-phenology-history.js'; circularityHistory='apps/control-web/public/sana-v3-dataroom-circularity-history.js'; remediation='apps/control-web/public/sana-v3-due-diligence-remediation.js'; nextcut='apps/control-web/public/sana-v3-dd-next-cut.js'; access='apps/control-web/public/sana-v3-access.js'
          grep -q "SNAPSHOT_SCHEMA='SANA_DUE_DILIGENCE_SNAPSHOT_V1'" "$reports"
          grep -q '__SANA_DUE_DILIGENCE_SNAPSHOT__' "$reports"
          grep -q '__SANA_REPORT_SNAPSHOT_SYNC__' "$sync"
          grep -q 'function enrichPhenology' "$sync"
          grep -q 'PHENOLOGY_SERIES · SNAPSHOT_DEMO · NO_EXTERNAL_WRITE' "$sync"
          grep -q '__SANA_REPORT_SNAPSHOT_CIRCULARITY__' "$circularitySync"
          grep -q 'ADDITIVE_V1 · CIRCULARITY_LEDGER' "$circularitySync"
          grep -q 'NO_PLAN_TO_EXECUTION_INFERENCE' "$circularitySync"
          grep -q 'NO_EXECUTION_TO_RECOVERY_INFERENCE' "$circularitySync"
          grep -q '__SANA_DD_PHENOLOGY_GAPS__' "$phenologyGaps"
          grep -q 'STAGE_OR_TREND ≠ GAP' "$phenologyGaps"
          ! grep -q '__SANA_PHENOLOGY_SERIES__' "$phenologyGaps"
          grep -q '__SANA_DD_CIRCULARITY_GAPS__' "$circularityGaps"
          grep -q 'GENERATED_OR_PENDING_DESTINATION ≠ GAP' "$circularityGaps"
          ! grep -q '__SANA_CIRCULARITY_LEDGER__' "$circularityGaps"
          grep -q '__SANA_DATAROOM_PHENOLOGY_HISTORY__' "$phenologyHistory"
          grep -q 'NO_LIVE_FALLBACK' "$phenologyHistory"
          ! grep -q '__SANA_PHENOLOGY_SERIES__' "$phenologyHistory"
          grep -q '__SANA_DATAROOM_CIRCULARITY_HISTORY__' "$circularityHistory"
          grep -q 'NO_LIVE_FALLBACK' "$circularityHistory"
          ! grep -q '__SANA_CIRCULARITY_LEDGER__' "$circularityHistory"
          grep -q '__SANA_DUE_DILIGENCE_REMEDIATION__' "$remediation"
          grep -q 'REMEDIATION_ITEM ≠ SNAPSHOT_GAP ≠ GAP_RESOLVED' "$remediation"
          grep -q '__SANA_DD_NEXT_CUT__' "$nextcut"
          grep -q 'READY_FOR_HUMAN_REVIEW ≠ SNAPSHOT_CREATED ≠ GAP_RESOLVED ≠ INVESTMENT_READY' "$nextcut"
          grep -q "technical:new Set(\[[^]]*'dataroom'" "$access"
          grep -q "producer:new Set(\[[^]]*'dataroom'" "$access"
          grep -q "investor:new Set(\[[^]]*'dataroom'" "$access"
          ! grep -q "investor:.*'dd-remediation'" "$access"
          ! grep -q "investor:.*'report-snapshot'" "$access"
      - name: Validate integrated assembly and active v42 shell
        shell: bash
        run: |
          set -euo pipefail
          html='apps/control-web/public/sana-v3.html'; sw='apps/control-web/public/sana-v3-sw.js'
          grep -q '/sana-v3-health-ledger.js.*sana-v3-circularity-ledger.js.*sana-v3-report-snapshot-circularity.js.*sana-v3-cycle-closure.js' "$html"
          grep -q '/sana-v3-cycle-health-provenance.js.*sana-v3-cycle-circularity-provenance.js.*sana-v3-capital-dossier.js' "$html"
          grep -q '/sana-v3-due-diligence-nutrition-gaps.js.*sana-v3-due-diligence-phenology-gaps.js.*sana-v3-due-diligence-circularity-gaps.js.*sana-v3-due-diligence-remediation.js' "$html"
          grep -q '/sana-v3-dataroom-nutrition-history.js.*sana-v3-dataroom-phenology-history.js.*sana-v3-dataroom-circularity-history.js.*sana-v3-dataroom-entry.js' "$html"
          grep -q "'/sana-v3-report-snapshot-circularity.js'" "$sw"
          grep -q "'/sana-v3-due-diligence-phenology-gaps.js'" "$sw"
          grep -q "'/sana-v3-due-diligence-circularity-gaps.js'" "$sw"
          grep -q "'/sana-v3-dataroom-phenology-history.js'" "$sw"
          grep -q "'/sana-v3-dataroom-circularity-history.js'" "$sw"
          grep -q "^const CACHE='sana-v3-demo-shell-v42';" "$sw"
      - name: Assert no external execution or financial authority
        shell: bash
        run: |
          set -euo pipefail
          files='apps/control-web/public/sana-v3-reports-provenance.js apps/control-web/public/sana-v3-report-snapshot-sync.js apps/control-web/public/sana-v3-report-snapshot-circularity.js apps/control-web/public/sana-v3-snapshot-compare.js apps/control-web/public/sana-v3-snapshot-freshness.js apps/control-web/public/sana-v3-due-diligence-gaps.js apps/control-web/public/sana-v3-due-diligence-material-gaps.js apps/control-web/public/sana-v3-due-diligence-health-gaps.js apps/control-web/public/sana-v3-due-diligence-nutrition-gaps.js apps/control-web/public/sana-v3-due-diligence-phenology-gaps.js apps/control-web/public/sana-v3-due-diligence-circularity-gaps.js apps/control-web/public/sana-v3-due-diligence-remediation.js apps/control-web/public/sana-v3-dd-next-cut.js apps/control-web/public/sana-v3-dataroom-360.js apps/control-web/public/sana-v3-dataroom-impact-history.js apps/control-web/public/sana-v3-dataroom-material-history.js apps/control-web/public/sana-v3-dataroom-health-history.js apps/control-web/public/sana-v3-dataroom-nutrition-history.js apps/control-web/public/sana-v3-dataroom-phenology-history.js apps/control-web/public/sana-v3-dataroom-circularity-history.js apps/control-web/public/sana-v3-dataroom-entry.js apps/control-web/public/sana-v3-impact-methodology.js apps/control-web/public/sana-v3-impact-ledger.js apps/control-web/public/sana-v3-capital-dossier.js'
          ! grep -Eiq 'fetch\(|XMLHttpRequest|WebSocket|productionExecutionAvailable[[:space:]]*=[[:space:]]*true|canonicalMutated[[:space:]]*=[[:space:]]*true' $files
          ! grep -Eiq 'creditApproved|investmentApproved|eligibilityApproved|verifiedDisposition[[:space:]]*=[[:space:]]*true|certifiedRecovery[[:space:]]*=[[:space:]]*true|environmentalImpactVerified[[:space:]]*=[[:space:]]*true' $files
