<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANA V182 · Pointer Transition Governance References</title><style>body{font:14px system-ui;margin:0;background:#f6f7f8;color:#17202a}main{max-width:1180px;margin:auto;padding:24px}h1{margin:0 0 8px}.note{padding:12px;background:white;border:1px solid #d9dee3;border-radius:10px;margin:12px 0}.grid{display:grid;gap:12px}.card{background:white;border:1px solid #d9dee3;border-radius:10px;padding:14px}.muted{color:#65717d}code{font-size:12px}select,input{padding:8px;margin-right:8px}.edge{border-top:1px solid #e6e9ec;padding-top:8px;margin-top:8px}</style></head><body><main><h1>V182 · Pointer transition governance references</h1><div class="note"><b>Read-only.</b> Complete reference coverage is not authorization, approval, compliance, legal effect, DD approval, eligibility or financing approval.</div><div><input id="lot" value="LOT-A" aria-label="lot"><button id="run">Inspect</button></div><div id="summary" class="note muted">Load the SANA runtime to inspect exact V182 coverage.</div><div id="cards" class="grid"></div></main><script src="sana-v3-dataroom-executive-v182.js"></script><script>(()=>{const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function render(){const f=window.__SANA_DATAROOM_EXECUTIVE_V182_FACTORY__;if(!f){summary.textContent='V182 factory not materialized.';return}try{const r=f.create(window).build({lot:lot.value.trim()});summary.textContent=`source=${r.sourceContract.state} · partial=${r.summary.partialReferenceCoverage} · complete=${r.summary.completeReferenceCoverage} · conflicts=${r.summary.conflicts} · authorization=0`;cards.innerHTML=r.envelopes.filter(e=>e.pointerTransitionGovernance).map(e=>`<section class="card"><b>${esc(e.claimId)}</b><div>${esc(e.pointerTransitionGovernance.state)}</div><div class="muted">transition refs ${e.pointerTransitionGovernance.referencedTransitionCount}/${e.pointerTransitionGovernance.transitionCount} · counts only, no ratio/score</div>${(e.pointerTransitionGovernance.transitions||[]).map(t=>`<div class="edge"><code>${esc(t.predecessorPointerRef)} → ${esc(t.successorPointerRef)}</code><div>${t.governanceReference?`governanceRef=${esc(t.governanceReference.governanceRef)} · caseRef=${esc(t.governanceReference.governanceCaseRef)}`:'no explicit governance reference'}</div></div>`).join('')}</section>`).join('')}catch(e){summary.textContent=e.message}}run.onclick=render;})();</script></body></html>
